# Config for EgoLifeQA — 500 MCQs over per-person life-stream banks.
# video_id = person (e.g. A1_JAKE); the bank is that person's whole DAY1-DAY7
# egocentric stream. Retrieval is time-gated by each question's query_time
# (future memory is off-limits) — see _egolife_query_cutoff in reveal_27b.py.
# Only A1_JAKE footage+QA is fully public, so filter_people pins it until the
# other persons' banks are built. Ego-R1-Bench (same banks, different question
# set) lives in configs/egor1.yaml.
benchmark:
  name: egolifeqa
  bench_root: ../../Datas/EgoLife_bench
  video_dir: ../../Datas/EgoLife
  filter_people: [A1_JAKE]

paths:
  outputs_root: ./outputs

reveal_loop:
  max_iter: 3
  query_history_dedup_threshold: 0.9
  evidence_dedup_threshold: 0.9
  query_evidence_dedup_threshold: 0.7
  kf_dedup_threshold: 0.92

eval:
  output_dir: ./outputs/results/egolife

models:
  vlm:
    model_path: ../../Models/Qwen/Qwen3.5-27B
  llm:
    model_path: ../../Models/Qwen/Qwen3.5-27B
    dtype: bfloat16
    attn_impl: sdpa
  embedder:
    model_path: ../../Models/BAAI/bge-m3
    use_fp16: true
