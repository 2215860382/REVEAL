# Config for LVBench (THUDM) — 1549 Qs / 103 extreme-long videos (30–140 min).
benchmark:
  name: lvbench
  meta_path: /home2/ycj/Datas/LVBench/video_info.meta.jsonl
  video_dir: /home2/ycj/Datas/LVBench/videos   # {key}.mp4 — download from YouTube separately
  duration_groups: null

paths:
  outputs_root: /home2/ycj/Project/VEIL/outputs

veil_loop:
  max_iter: 3
  query_history_dedup_threshold: 0.9
  evidence_dedup_threshold: 0.9
  query_evidence_dedup_threshold: 0.7
  kf_dedup_threshold: 0.92

eval:
  output_dir: /home2/ycj/Project/VEIL/outputs/results/lvbench

models:
  vlm:
    model_path: /home2/ycj/Models/Qwen/Qwen3.5-27B
  llm:
    model_path: /home2/ycj/Models/Qwen/Qwen3.5-27B
    dtype: bfloat16
    attn_impl: sdpa
  embedder:
    model_path: /home2/ycj/Models/BAAI/bge-m3
    use_fp16: true
