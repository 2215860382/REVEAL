general:
  rubric_criteria:
  - name: evidence_coverage
    description: Whether evidence covers the key event, time window, state change,
      comparison target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 1.0
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Whether evidence explicitly grounds the relevant person, object,
      action, scene, speaker, on-screen text, or spatial relation rather than a generic
      scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 1.0
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Whether evidence is internally consistent and contains enough contrary
      evidence to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 1.0
    failure_repair_action: broadcast
  scoring_rule: average
  sufficient_threshold: 0.8
type_aliases:
  Object Reasoning: Object Reasoning
  Action Recognition: Action Recognition
  Action Reasoning: Action Reasoning
  Information Synopsis: Information Synopsis
  Object Recognition: Object Recognition
  Temporal Reasoning: Temporal Reasoning
  OCR Problems: OCR Problems
  Counting Problem: Counting Problem
  Temporal Perception: Temporal Perception
  Attribute Perception: Attribute Perception
templates:
  Object Reasoning:
    rubric_criteria:
    - name: attribution_linkage
      description: Whether the evidence explicitly links a specific proposition, belief,
        or claim to the specific agent, institution, or entity asserted in the option,
        rather than merely mentioning the agent or the proposition in isolation.
      score_1: The evidence explicitly states that the specific agent holds the specific
        belief or made the specific claim.
      score_half: The agent and the proposition are both present, but the explicit
        link between them is implied or ambiguous.
      score_0: The agent is mentioned without the specific claim, the claim is mentioned
        without the agent, or the link is entirely absent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: provision_explicitness
      description: Whether the evidence explicitly states the specific content, provisions,
        or terms of a rule, law, code, policy, or agreement asserted in the option,
        rather than merely mentioning the existence of such a rule or the entity that
        created it.
      score_1: The specific terms, rights, restrictions, or outcomes defined by the
        rule/policy are explicitly stated in the evidence.
      score_half: The existence of the rule/policy is mentioned, but its specific
        content or provisions are only implied, summarized vaguely, or partially described.
      score_0: The rule/policy is not mentioned, or only the entity associated with
        it is mentioned without any description of its content.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_comparison_explicitness
      description: Whether the evidence explicitly states the specific quantitative
        comparison, ratio, superlative, or scale analogy asserted in the option, rather
        than merely providing raw numbers or implying the scale.
      score_1: The specific comparison, ratio, or scale analogy (e.g., 'X is as tall
        as Y', 'twice as large', 'the tallest') is explicitly stated in the evidence.
      score_half: Raw numbers or related data are present, but the specific comparative
        relationship or analogy required by the option is only implied or missing.
      score_0: No quantitative data or comparative context relevant to the option
        is present in the evidence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_prediction_explicitness
      description: Whether the evidence explicitly states the specific time window,
        deadline, or duration asserted in the option, rather than merely mentioning
        a general era, vague timeframe, or related temporal context.
      score_1: The specific time window, deadline, or duration (e.g., 'within 20 years',
        'by 2030', 'in the next decade') required to verify or exclude the option
        is explicitly stated.
      score_half: A general era or vague timeframe (e.g., 'this century', 'soon',
        'in the future') is mentioned, but the specific duration or deadline required
        by the option is not explicitly stated.
      score_0: No temporal information relevant to the specific prediction in the
        option is present, or the time mentioned is entirely unrelated to the prediction.
      weight: 3.0
      failure_repair_action: refine_query
    - name: enumeration_and_action_explicitness
      description: Whether the evidence explicitly states the specific count of entities
        or the specific distinct actions performed by entities asserted in the option,
        rather than merely implying a quantity or describing a generic event.
      score_1: The specific number of entities (e.g., 'two children') and the specific
        distinct actions (e.g., 'running down the street') required to verify or exclude
        the option are explicitly stated in the evidence.
      score_half: The general event or the presence of entities is mentioned, but
        the specific count or the precise nature of the distinct actions is only implied,
        vague, or missing.
      score_0: No specific count or distinct action details relevant to the option
        are present; only a generic description of the event or the entities is provided.
      weight: 3.0
      failure_repair_action: refine_query
    - name: authoritative_resolution
      description: Whether the evidence contains an explicit authoritative resolution,
        final verdict, or definitive determination of the specific fact in question,
        rather than merely presenting competing claims, beliefs, or unverified assertions
        by the parties involved.
      score_1: The evidence explicitly states the final, authoritative determination
        or verdict that resolves the specific factual question.
      score_half: The evidence presents strong claims or partial findings but lacks
        the explicit final resolution or authoritative verdict required to settle
        the matter.
      score_0: The evidence only contains competing claims, beliefs, or assertions
        from the parties without any authoritative resolution or definitive determination.
      weight: 4.0
      failure_repair_action: refine_query
    - name: instance_ordering_explicitness
      description: Whether the evidence explicitly establishes the specific ordinal
        position (e.g., 'first', 'second', 'last', 'third') of the event, case, or
        instance asserted in the option within a sequence, rather than merely describing
        the event without its place in the sequence.
      score_1: The evidence explicitly states the ordinal position (e.g., 'the first
        time', 'the second case') required to identify the specific instance the option
        refers to.
      score_half: The evidence describes the event or implies a sequence, but the
        specific ordinal position required to distinguish it from other instances
        is not explicitly stated.
      score_0: The evidence describes an event but provides no information about its
        position in a sequence, making it impossible to verify if it is the specific
        instance (e.g., 'first') mentioned in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: scenario_count_explicitness
      description: Whether the evidence explicitly states the specific number of distinct
        scenarios, cases, or sub-steps associated with each procedural phase or option,
        rather than merely describing the phase or implying a quantity.
      score_1: The specific count of scenarios/cases for each relevant option (e.g.,
        '8 scenarios for Step X', '3 cases for Step Y') is explicitly stated, allowing
        for a direct comparison.
      score_half: The count is explicitly stated for some options but missing or only
        implied for others, preventing a complete comparison across all options.
      score_0: No explicit counts of scenarios or cases are provided for any option;
        only the existence of the steps or generic descriptions are present.
      weight: 3.0
      failure_repair_action: refine_query
    - name: interaction_type_explicitness
      description: Whether the evidence explicitly identifies the specific type of
        procedural event, interaction, or phase (e.g., 'settlement discussion', 'negotiation',
        'jury deliberation', 'verdict announcement') asserted in the option, rather
        than merely describing the participants, the legal concepts discussed, or
        the general setting.
      score_1: The specific type of interaction or procedural phase (e.g., 'negotiation',
        'settlement') required to verify or exclude the option is explicitly stated
        or clearly identified in the evidence.
      score_half: The participants and general context are present, but the specific
        label or nature of the interaction (e.g., distinguishing a 'negotiation' from
        a 'trial' or 'deliberation') is only implied or ambiguous.
      score_0: The evidence describes the participants or legal concepts but provides
        no explicit identification of the specific interaction type or procedural
        phase asserted in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_limit_explicitness
      description: Whether the evidence explicitly states the specific quantitative
        limit, capacity, threshold, or maximum value asserted in the option, rather
        than merely mentioning a different value, a generic category, or a past constraint.
      score_1: The specific numerical limit, capacity, or threshold (e.g., '128,000
        tokens', 'max 50mph') required to verify or exclude the option is explicitly
        stated.
      score_half: A numerical value is mentioned, but it is a different limit (e.g.,
        a past constraint or a different model's spec) or the specific limit is only
        implied.
      score_0: No specific numerical limit or capacity relevant to the option is stated;
        only generic descriptions of capability or unrelated numbers are present.
      weight: 1.0
      failure_repair_action: refine_query
    - name: visual_superlative_grounding
      description: Whether the evidence provides a simultaneous visual or explicit
        comparative assessment of all candidate entities required to verify or exclude
        a superlative claim (e.g., 'most distinct', 'largest', 'fastest'), rather
        than merely describing the attributes of individual entities in isolation.
      score_1: The evidence presents all candidate entities in a way that allows a
        direct comparison to verify the superlative (e.g., showing all items together
        or explicitly stating the comparative relationship between them).
      score_half: The evidence describes the attributes of some candidates but lacks
        the simultaneous view or explicit comparison needed to definitively rank them
        against each other.
      score_0: The evidence describes only one or a subset of candidates in isolation,
        making it impossible to determine if the superlative claim holds true relative
        to the others.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: evaluative_judgment_explicitness
      description: Whether the evidence explicitly states the specific evaluative
        judgment, opinion, or qualitative assessment (e.g., 'cheap', 'dumb', 'practical',
        'futuristic') asserted in the option, rather than merely mentioning the concept,
        category, or attribute in a neutral or descriptive context.
      score_1: The specific evaluative judgment or opinion (e.g., 'X is Y' where Y
        is a subjective assessment) is explicitly stated by the relevant agent.
      score_half: The concept or attribute is mentioned, but the specific evaluative
        judgment or opinion is only implied, ambiguous, or attributed to a different
        context.
      score_0: The concept is mentioned only as a category, search term, or neutral
        descriptor without any explicit evaluative judgment or opinion attached to
        it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: behavioral_superlative_grounding
      description: Whether the evidence provides a comprehensive set of distinct behavioral
        demonstrations or actions for the target entity that collectively justify
        a superlative or 'most important' quality claim, rather than merely mentioning
        the quality in isolation, attributing it to another entity, or providing a
        single generic example.
      score_1: The evidence presents multiple distinct actions or scenarios involving
        the target entity that collectively and strongly support the specific superlative
        or defining quality asserted in the option, allowing it to be distinguished
        from other potential qualities.
      score_half: The evidence mentions the quality or shows a single action related
        to it, but lacks the breadth of distinct demonstrations needed to confirm
        it as the 'most important' or defining trait relative to other options.
      score_0: The evidence mentions the quality only in relation to a different entity,
        provides no behavioral evidence for the target entity, or the actions shown
        are too generic to support a specific superlative claim.
      weight: 4.0
      failure_repair_action: dense_sample
    - name: worldview_dichotomy_explicitness
      description: Whether the evidence explicitly states the specific binary worldview,
        dualistic framework, or cognitive dichotomy (e.g., 'black and white', 'two
        sides', 'good vs evil') attributed to the agent in the option, rather than
        merely describing the agent's actions, general beliefs, or emotional states
        that might imply such a framework.
      score_1: The specific binary framework or dichotomy (e.g., 'views everything
        as black and white') is explicitly stated as the agent's perspective.
      score_half: The agent's actions or general beliefs are described in a way that
        implies a binary framework, but the specific dichotomy or worldview structure
        is not explicitly named or stated.
      score_0: The evidence describes the agent's actions, emotions, or general beliefs
        without any mention or implication of a specific binary worldview or cognitive
        dichotomy.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_source_explicitness
      description: Whether the evidence explicitly identifies the specific cause,
        source, mechanism, or channel asserted in the option as the driver of a phenomenon,
        trend, or event, rather than merely describing the phenomenon itself or mentioning
        the cause in a generic or unrelated context.
      score_1: The specific cause, source, or mechanism (e.g., 'social media', 'a
        specific policy', 'a natural disaster') required to verify or exclude the
        option is explicitly stated as the reason for the phenomenon.
      score_half: The phenomenon is described, and a potential cause is mentioned,
        but the explicit link identifying it as the specific driver is ambiguous,
        implied, or the cause mentioned is too generic to match the option's specificity.
      score_0: The evidence describes the phenomenon or trend but provides no explicit
        identification of the specific cause, source, or mechanism asserted in the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relational_outcome_explicitness
      description: Whether the evidence explicitly states the specific outcome, state
        change, or resulting dynamic of a relationship (e.g., 'strengthened', 'rift',
        'reconciled', 'ended') asserted in the option, rather than merely describing
        the triggering event, the participants' emotions, or the context without the
        final relational status.
      score_1: The specific relational outcome or state change (e.g., 'relationship
        improved', 'they drifted apart') required to verify or exclude the option
        is explicitly stated.
      score_half: The triggering event and participants' emotions are described, but
        the specific resulting relational dynamic is only implied, ambiguous, or not
        explicitly stated.
      score_0: The evidence describes the event or context but provides no information
        about the specific outcome or change in the relationship between the parties.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_symbol_meaning_explicitness
      description: Whether the evidence explicitly states the specific meaning, category,
        or definition associated with a visual marker, symbol, color, or highlight
        asserted in the option, rather than merely describing the visual presence
        of the marker or mentioning the concept in isolation.
      score_1: The evidence explicitly defines what the specific visual marker (e.g.,
        'red color', 'blue dot', 'highlighted area') represents (e.g., 'indicates
        declining population', 'shows war zones').
      score_half: The visual marker is described, and the concept is mentioned in
        the narration, but the explicit link defining the marker's meaning is implied,
        ambiguous, or missing.
      score_0: The visual marker is described or the concept is mentioned, but no
        evidence links the specific marker to its meaning, making it impossible to
        verify what the marker represents.
      weight: 3.0
      failure_repair_action: refine_query
    - name: stance_direction_explicitness
      description: Whether the evidence explicitly states the specific directional
        stance, preference, or alignment (e.g., 'in favor of X', 'against Y', 'supports
        A over B') of the target agent regarding a specific issue or dichotomy, rather
        than merely discussing the issue, the opposing side's feelings, or the general
        context of the debate.
      score_1: The evidence explicitly states the agent's specific position or alignment
        (e.g., 'supports X', 'is against Y', 'favors A') required to verify or exclude
        the option.
      score_half: The evidence discusses the issue or the agent's feelings about the
        context, but the specific directional stance or alignment is only implied,
        ambiguous, or attributed to a general group rather than the specific agent.
      score_0: The evidence describes the topic, the opposing views, or the agent's
        general thoughts without explicitly stating which side or specific position
        the agent holds.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_content_grounding
      description: Whether the evidence explicitly presents the specific content,
        arguments, or views of all candidate entities required to verify or exclude
        a superlative claim (e.g., 'most radical', 'most extreme', 'least likely'),
        rather than merely discussing the general topic or describing the attributes
        of only a subset of candidates.
      score_1: The evidence explicitly states or demonstrates the specific views/attributes
        of the target candidate and the other candidates, allowing for a direct comparison
        to verify the superlative ranking.
      score_half: The evidence presents the specific views of the target candidate
        but lacks the specific views of the other candidates, or discusses the general
        topic without explicitly linking specific extreme views to the specific candidates.
      score_0: The evidence discusses the general topic or mentions the candidates
        without providing the specific content of their views/attributes needed to
        compare them and determine the superlative.
      weight: 4.0
      failure_repair_action: dense_sample
    - name: entity_specific_causal_attribution
      description: Whether the evidence explicitly links a specific causal event,
        reason, or mechanism to the specific entity's situation or outcome asserted
        in the option, rather than merely describing general trends, background conditions,
        or the entity's state without the specific cause.
      score_1: The evidence explicitly states the specific cause or event (e.g., 'evicted
        due to renovation', 'lost job') that directly led to the specific entity's
        situation or outcome.
      score_half: The evidence describes the entity's situation and mentions general
        causes or background conditions (e.g., 'high prices', 'low vacancy') but does
        not explicitly link a specific cause to the entity's specific outcome.
      score_0: The evidence describes the entity's situation or general trends but
        provides no explicit causal link between a specific event/reason and the entity's
        outcome.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_vs_expressed_constraint_explicitness
      description: Whether the evidence explicitly states both the specific constraint,
        wish, or counter-indication expressed by a relevant party and the specific
        action taken by the target agent that proceeds despite or disregards that
        constraint, rather than merely mentioning the constraint or the action in
        isolation.
      score_1: The evidence explicitly states the specific constraint/wish (e.g.,
        'wants to stop', 'refused consent') and the specific action taken by the agent
        that contradicts or ignores it.
      score_half: The evidence mentions the constraint or the action, but the explicit
        link showing the action was taken *despite* the specific constraint is implied,
        ambiguous, or missing.
      score_0: The evidence mentions only the constraint without the agent's contradictory
        action, or only the action without the specific constraint that was disregarded.
      weight: 3.0
      failure_repair_action: refine_query
    - name: necessity_condition_explicitness
      description: Whether the evidence explicitly states that a specific attribute,
        state, or action is a necessary condition or requirement for a specific outcome,
        rather than merely mentioning the attribute in a context where it is present
        but insufficient, or where the outcome occurs without it.
      score_1: The evidence explicitly asserts that the specific attribute is required
        for the outcome (e.g., 'must have X to get Y', 'without X, Y cannot happen',
        'X is a condition for Y').
      score_half: The evidence mentions the attribute and the outcome, but the necessity
        relationship is only implied, ambiguous, or the attribute is shown to be present
        without guaranteeing the outcome.
      score_0: The evidence mentions the attribute or the outcome in isolation, or
        shows the attribute present while the outcome fails, without explicitly establishing
        the attribute as a required condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_specific_quantitative_grounding
      description: Whether the evidence explicitly grounds the specific quantitative
        value, ratio, or comparison to the specific target entities asserted in the
        option, rather than merely stating a general market average, rule of thumb,
        or statistic for a broader class of entities.
      score_1: The specific quantitative relationship (value, ratio, or comparison)
        is explicitly stated for the specific target entities named in the option.
      score_half: A quantitative relationship is stated for a general class or category
        that includes the target entities, but the specific application to the target
        entities is only implied or not explicitly confirmed.
      score_0: No quantitative relationship is stated for the target entities, or
        only a general statistic for a broader group is provided without linking it
        to the specific targets.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_verdict_explicitness
      description: Whether the evidence explicitly states the specific superlative
        judgment, ranking, or extreme label (e.g., 'worst', 'least flattering', 'most
        important', 'best') asserted in the option, rather than merely providing the
        raw data, individual scores, or attributes that would allow such a conclusion
        to be inferred.
      score_1: The specific superlative label or ranking (e.g., 'X is the worst')
        required to verify or exclude the option is explicitly stated in the evidence.
      score_half: The evidence provides the individual attributes, scores, or data
        for the candidates, but the explicit superlative conclusion or ranking is
        only implied or missing.
      score_0: The evidence provides no data or attributes for the candidates, or
        the data is insufficient to even infer a ranking, and no superlative label
        is stated.
      weight: 4.0
      failure_repair_action: refine_query
    - name: functional_content_visibility
      description: Whether the evidence explicitly displays or states the specific
        content, markings, or data on an object or surface that defines its asserted
        function, rather than merely showing the object's presence or the general
        activity occurring near it.
      score_1: The specific content (e.g., text, numbers, diagrams, scores) that defines
        the object's function is clearly visible or explicitly described in the evidence.
      score_half: The object is visible and the general activity is described, but
        the specific content defining its function is obscured, not shown, or only
        vaguely implied.
      score_0: The object is mentioned or shown, but no content is visible or described,
        making it impossible to determine its specific function from the evidence.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: functional_mechanism_explicitness
      description: Whether the evidence explicitly states the specific mechanism,
        method, or operational process by which an object or tool achieves the function
        asserted in the option, rather than merely mentioning the object's presence,
        a generic alternative use, or the outcome without the 'how'.
      score_1: The specific mechanism or method (e.g., 'reflects the ground to hide
        the person', 'uses a spring to bend') required to verify or exclude the option
        is explicitly described.
      score_half: The object and the outcome are mentioned, or a generic use is noted,
        but the specific operational mechanism or method is only implied, vague, or
        described as a possibility rather than the actual method used.
      score_0: The object is mentioned or shown, but no mechanism or method explaining
        how it achieves the asserted function is provided.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instrument_usage_explicitness
      description: Whether the evidence explicitly identifies the specific tool, instrument,
        or implement used by the agent to perform the action asserted in the option,
        rather than merely describing the action, the agent, or the outcome without
        specifying the means.
      score_1: The specific tool or instrument (e.g., 'knife', 'spoon', 'scissors')
        used by the agent to perform the action is explicitly stated or clearly visible
        in the evidence.
      score_half: The action and agent are present, but the specific tool is only
        implied, generic (e.g., 'implements'), or the evidence mentions a tool that
        was *not* used (e.g., 'forgot the tool').
      score_0: The evidence describes the action or agent but provides no information
        about the specific tool or instrument used, or explicitly states no tool was
        used.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_type_explicitness
      description: Whether the evidence explicitly states the specific type of social
        event, ceremony, or gathering (e.g., 'wedding', 'funeral', 'graduation', 'anniversary')
        that defines the relationship or status of the entities asserted in the option,
        rather than merely describing the participants, their interactions, or the
        general setting.
      score_1: The specific event type (e.g., 'wedding') required to verify or exclude
        the relationship status is explicitly stated in the evidence.
      score_half: The participants and general setting are described, or interactions
        are mentioned, but the specific label or type of the event defining the relationship
        is only implied or ambiguous.
      score_0: The evidence describes the participants or interactions but provides
        no explicit identification of the specific event type or social context asserted
        in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: multi_instance_commonality_grounding
      description: Whether the evidence explicitly presents all distinct instances,
        cases, or items required to verify or exclude a claim about a shared attribute,
        commonality, or pattern across them, rather than merely describing a single
        instance or a generic category.
      score_1: The evidence explicitly describes or shows the specific attribute for
        every distinct instance required by the option (e.g., both the first and second
        performance), allowing the commonality to be verified or excluded.
      score_half: The evidence describes the attribute for some but not all required
        instances, or describes the instances without explicitly confirming the specific
        attribute for each one.
      score_0: The evidence describes only a single instance or a generic category,
        making it impossible to determine if the attribute is shared across all required
        instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_attribute_granularity
      description: Whether the evidence explicitly describes the specific attribute,
        action, or manner of usage for each distinct instance required to verify or
        exclude a claim of similarity or commonality, rather than merely mentioning
        the presence of the object or a generic action for each instance.
      score_1: The evidence explicitly details the specific attribute or action (e.g.,
        'lifts the stack', 'leaps through') for every instance involved in the comparison,
        allowing a direct verification of the claimed similarity.
      score_half: The evidence mentions the object or a generic action for some or
        all instances, but lacks the specific granular details of the action/attribute
        for at least one instance, making the similarity claim only implied or unverifiable.
      score_0: The evidence mentions the instances or the object in isolation without
        describing the specific action or attribute for any instance, or describes
        only one instance in detail while ignoring the others.
      weight: 3.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Recognition:
    rubric_criteria:
    - name: functional_mechanism_demonstration
      description: Whether the evidence explicitly demonstrates or describes the functional
        mechanism, causal role, or operational capacity asserted by the option, rather
        than merely describing the static physical properties or composition of the
        entity.
      score_1: The evidence shows the mechanism in action, demonstrates the capacity
        (e.g., via interaction or structural proof), or explicitly states the functional
        role.
      score_half: The evidence describes the physical structure that implies the function
        but does not demonstrate the mechanism or explicitly state the role.
      score_0: The evidence only describes static properties, composition, or unrelated
        processes without addressing the functional mechanism.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_superlative_grounding
      description: Whether the evidence explicitly provides the count, frequency,
        or comparative data required to verify or exclude options that assert a superlative
        (e.g., 'most', 'least', 'only') or specific quantity, rather than merely citing
        a single instance or general trend.
      score_1: The evidence explicitly states the count, frequency, or comparative
        ranking that directly verifies or excludes the superlative/quantitative claim.
      score_half: The evidence provides partial data (e.g., mentions a high number
        or a few instances) but lacks the explicit total or comparison needed to definitively
        verify the superlative.
      score_0: The evidence only mentions a single instance, a vague trend, or unrelated
        data, making it impossible to verify or exclude the superlative/quantitative
        claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_alignment_with_query
      description: Whether the evidence is temporally located at the specific moment,
        interval, or phase asserted by the question (e.g., 'at the start', 'during
        the fight', 'after the event'), rather than occurring at a different time
        where the state may have changed.
      score_1: The evidence explicitly covers the exact time window or phase queried,
        allowing the state at that moment to be verified or excluded.
      score_half: The evidence covers a time window adjacent to or overlapping the
        queried moment but does not definitively capture the specific state at the
        exact queried instant.
      score_0: The evidence occurs at a significantly different time (e.g., later
        in the video) where the state is irrelevant to the queried moment, making
        verification impossible.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: explicit_rule_articulation
      description: Whether the evidence explicitly states the procedural rules, mechanics,
        or winning conditions of the activity or game asserted by the option, rather
        than merely showing the activity being performed or describing its physical
        components.
      score_1: The evidence contains an explicit verbal or textual statement defining
        the rules, mechanics, or conditions required to verify the option's claim
        about the game's nature.
      score_half: The evidence shows the activity being performed or implies the rules
        through context, but lacks an explicit statement of the specific mechanics
        or conditions.
      score_0: The evidence only shows the activity in progress or describes unrelated
        aspects, with no mention of the rules or mechanics needed to verify the claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: specific_ritual_identification
      description: Whether the evidence explicitly identifies the specific ritual,
        ceremony, or procedural event asserted by the option (e.g., 'national anthem',
        'coin toss', 'handshake'), rather than merely showing generic celebration,
        alternative rituals, or unrelated activities.
      score_1: The evidence explicitly names, shows, or audibly confirms the specific
        ritual or procedure claimed by the option, distinguishing it from other possible
        events.
      score_half: The evidence shows a ritual or ceremony occurring but does not explicitly
        identify it as the specific one claimed, or it shows a similar but different
        ritual that could be confused.
      score_0: The evidence shows only generic activities, alternative rituals, or
        no ritual at all, making it impossible to verify or exclude the specific procedural
        claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: activity_category_identification
      description: Whether the evidence explicitly identifies the specific category,
        genre, or type of activity asserted by the option (e.g., 'quick change', 'street
        magic', 'card trick'), rather than merely showing the activity in progress
        or using a generic superordinate term (e.g., 'magic', 'performance', 'game').
      score_1: The evidence explicitly names, labels, or describes the specific sub-category
        or genre of the activity that distinguishes the correct option from other
        plausible categories.
      score_half: The evidence shows the activity being performed or uses a generic
        term that encompasses multiple options, but lacks the specific label or distinguishing
        feature needed to select one category over others.
      score_0: The evidence only shows generic activity, unrelated context, or fails
        to provide any information distinguishing the specific type of activity from
        other options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: absence_verification_scope
      description: Whether the evidence covers the necessary temporal or spatial scope
        to definitively confirm the absence of the entity or action asserted by the
        option, rather than merely listing other present entities without ruling out
        the target.
      score_1: The evidence explicitly covers the full relevant scope (e.g., entire
        video duration, all visible areas) or provides a definitive statement confirming
        the target entity/action is not present.
      score_half: The evidence covers a significant portion of the scope or lists
        other present entities, but leaves gaps where the target entity could theoretically
        appear, making the absence claim unverified.
      score_0: The evidence only lists other present entities or covers a narrow segment,
        providing no basis to confirm the target entity is absent from the whole context.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Reasoning:
    rubric_criteria:
    - name: specific_visual_instantiation
      description: Whether the evidence explicitly resolves the specific visual state,
        action, or attribute of the target entity in the media, distinguishing it
        from generic definitions, traditional archetypes, or alternative representations
        of the same concept.
      score_1: The evidence explicitly shows or states the specific visual/actional
        state of the entity in the target media, allowing verification of deviations
        from norms or archetypes.
      score_half: The evidence mentions the entity or its generic role but does not
        explicitly resolve the specific visual state or action in the target media.
      score_0: The evidence relies solely on general knowledge, archetypes, or alternative
        representations without grounding the specific visual state in the target
        media.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: intent_explicitness
      description: Whether the evidence explicitly captures the speaker's stated reason,
        purpose, or intent for making a specific claim or comparison, rather than
        only capturing the content of the claim itself.
      score_1: The evidence explicitly states the speaker's reason or intent (e.g.,
        'to illustrate', 'because', 'in order to') for the specific action or comparison
        in question.
      score_half: The evidence contains the content of the claim or comparison but
        the speaker's explicit reason or intent is implied or missing.
      score_0: The evidence only describes the content of the claim or comparison
        without any indication of the speaker's reason or intent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: misconception_explicitness
      description: Whether the evidence explicitly states the specific misconception,
        gap in knowledge, or incorrect belief held by a subject, and the corresponding
        factual correction, rather than merely describing the subject's actions or
        the event outcome.
      score_1: The evidence explicitly articulates the subject's specific misunderstanding
        and the factual reality that contradicts it (e.g., 'X thought Y, but actually
        Z').
      score_half: The evidence describes the subject's actions or the event outcome
        that implies a misunderstanding, but does not explicitly state the specific
        belief or the correction.
      score_0: The evidence only describes the event or the subject's actions without
        any indication of a specific misconception or knowledge gap.
      weight: 3.0
      failure_repair_action: refine_query
    - name: embedded_media_provenance
      description: Whether the evidence explicitly identifies the specific device,
        tool, or method used to capture an embedded clip, sub-segment, or visual insert
        within the main video, rather than merely discussing the device as a topic
        or showing the device in use.
      score_1: The evidence explicitly states or visually demonstrates the specific
        capture mechanism (device/tool) for the embedded media segment in question.
      score_half: The evidence discusses the device or shows it in a general context
        but does not explicitly link it as the capture source for the specific embedded
        segment.
      score_0: The evidence only discusses the device as a topic or shows unrelated
        footage without identifying the capture source of the embedded segment.
      weight: 3.0
      failure_repair_action: refine_query
    - name: behavioral_pattern_consistency
      description: Whether the evidence captures a sequence of interactions or a sustained
        duration of behavior that establishes a consistent pattern, rather than relying
        on a single isolated moment or a potentially staged exception.
      score_1: The evidence presents multiple instances or a continuous sequence of
        interactions that consistently demonstrate the relationship dynamic asserted
        by the option.
      score_half: The evidence shows some repeated interactions or a short sequence,
        but the pattern is not fully established or contains ambiguous moments that
        could be exceptions.
      score_0: The evidence relies on a single isolated moment, a brief snapshot,
        or a potentially staged interaction that does not demonstrate a sustained
        behavioral pattern.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: temporal_causal_bracketing
      description: Whether the evidence explicitly captures the specific moment or
        time window where the causal trigger or preceding event occurs, ensuring it
        temporally precedes or brackets the action in question rather than only showing
        subsequent outcomes or unrelated later events.
      score_1: The evidence explicitly shows or states the event occurring at the
        specific time required to cause the action (e.g., the trigger happens before
        the action).
      score_half: The evidence shows events related to the topic but the temporal
        relationship to the specific action is ambiguous or the timing is not explicitly
        resolved.
      score_0: The evidence only shows events occurring after the action in question
        or fails to locate the causal trigger in the correct time window.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: exception_explicitness
      description: Whether the evidence explicitly captures a stated exception, adaptation,
        or deviation from a general rule, archetype, or norm asserted by a subject,
        rather than only capturing the general rule or the typical behavior.
      score_1: The evidence explicitly states or demonstrates a specific exception,
        adaptation, or deviation from the general rule or archetype (e.g., 'usually
        X, but in this case Y' or 'we do X, but also Y for specific reasons').
      score_half: The evidence implies an exception or shows ambiguous behavior that
        could be an exception, but does not explicitly state the deviation from the
        norm.
      score_0: The evidence only describes the general rule, archetype, or typical
        behavior without any indication of exceptions, adaptations, or deviations.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_trigger_specificity
      description: Whether the evidence explicitly identifies the specific nature,
        identity, or precise type of the causal trigger or event asserted by the option,
        rather than a generic category, a different specific event, or a potential
        future outcome.
      score_1: The evidence explicitly states the specific identity or nature of the
        causal factor (e.g., the exact medical diagnosis, the specific event name)
        that matches the option's claim.
      score_half: The evidence mentions a related cause or a generic category (e.g.,
        'health issues', 'bad habits') but does not explicitly resolve the specific
        identity or nature required to verify the option.
      score_0: The evidence describes a different specific cause, a potential future
        outcome, or only generic factors without identifying the specific trigger
        asserted by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: alternative_state_explicitness
      description: Whether the evidence explicitly states the specific nature, direction,
        or qualitative difference of a proposed change, alternative state, or modified
        behavior, rather than merely indicating that a change or alternative exists
        or discussing the general topic.
      score_1: The evidence explicitly articulates the specific nature or direction
        of the change/alternative (e.g., 'evaluate differently', 'increase speed',
        'shift focus to X').
      score_half: The evidence indicates that a change or alternative exists or discusses
        the general topic, but the specific nature or direction of the change is implied
        or vague.
      score_0: The evidence only mentions the general topic or the existence of a
        change without specifying the nature, direction, or qualitative difference
        of the alternative state.
      weight: 3.0
      failure_repair_action: refine_query
    - name: group_vs_individual_motivation_resolution
      description: Whether the evidence explicitly distinguishes whether a behavior
        is driven by the internal preferences of all group members versus being a
        reactive accommodation to a single member's demands or a specific external
        constraint.
      score_1: The evidence explicitly states the internal motivation for each member
        (e.g., 'all enjoy X' vs 'only Y demands X, others comply'), allowing verification
        of group-wide preference vs. individual-driven compliance.
      score_half: The evidence describes the group's behavior or the single member's
        demand but leaves the internal motivation of the other members ambiguous or
        implied.
      score_0: The evidence only describes the group's collective action or the single
        member's demand without resolving whether the other members share the preference
        or are merely accommodating.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_consequence_explicitness
      description: Whether the evidence explicitly states the specific outcome, consequence,
        or mandate resulting from the event or ruling in question, rather than only
        describing the event itself, the participants, or the general principle established.
      score_1: The evidence explicitly articulates the specific consequence or mandate
        (e.g., 'forces X to do Y', 'results in Z') that follows from the event.
      score_half: The evidence describes the event or the general principle but the
        specific consequence or mandate is implied, vague, or not explicitly stated.
      score_0: The evidence only describes the event, participants, or general context
        without stating any specific outcome or consequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: final_outcome_explicitness
      description: Whether the evidence explicitly captures the definitive terminal
        state, final result, or conclusive outcome of the entire event or competition,
        rather than only intermediate states, partial progress, or ongoing actions.
      score_1: The evidence explicitly shows or states the final result (e.g., victory
        screen, final score, game over, completed task) that resolves the query about
        the ultimate outcome.
      score_half: The evidence shows significant progress or a decisive moment but
        does not explicitly confirm the final terminal state or the official conclusion
        of the event.
      score_0: The evidence only describes intermediate actions, partial scores, or
        ongoing events without any indication of the final result or conclusion.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: task_completion_status_explicitness
      description: Whether the evidence explicitly captures the definitive status
        update (e.g., a checkmark, a verbal confirmation of completion, a 'done' indicator)
        for the specific task or milestone asserted by the option, rather than merely
        showing the action in progress or the milestone being reached without a formal
        completion marker.
      score_1: The evidence explicitly shows or states the specific task being marked
        as complete (e.g., checked off a list, verbally confirmed as 'done') at the
        relevant time.
      score_half: The evidence shows the action being performed or the milestone being
        reached, but the explicit status update confirming completion is implied or
        missing.
      score_0: The evidence only shows the action in progress, the setup, or the context
        without any indication that the specific task was formally completed or marked
        as done.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_sustained_sequence
      description: Whether the evidence provides a quantified count, duration, or
        explicit sequence of repeated actions that grounds a qualitative attribute
        (e.g., 'patience', 'consistency', 'high volume') rather than relying on a
        single isolated instance or a generic description of the action.
      score_1: The evidence explicitly shows or states a count, duration, or continuous
        sequence of the action (e.g., '27 passes', 'sustained for 30 seconds') that
        directly supports or refutes the qualitative claim.
      score_half: The evidence shows multiple instances or a sequence but lacks explicit
        quantification or the sequence is too brief to definitively establish the
        qualitative attribute.
      score_0: The evidence relies on a single isolated instance, a generic description
        of the action, or lacks any indication of the frequency or duration required
        to verify the qualitative claim.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: spatial_deviation_explicitness
      description: Whether the evidence explicitly captures the specific spatial deviation,
        trajectory, or position of the target entity relative to a defined boundary,
        line, or norm, rather than merely describing the general direction or action
        without reference to the constraint.
      score_1: The evidence explicitly states or shows the entity's specific position
        or path relative to the boundary (e.g., 'stepped on the line', 'veered left
        of the tape', 'crossed the boundary'), allowing verification of a spatial
        violation or deviation.
      score_half: The evidence describes the general direction or movement (e.g.,
        'went left', 'moved sideways') but does not explicitly resolve the relationship
        to the specific boundary or constraint required to verify the deviation.
      score_0: The evidence only describes the action or general location without
        any indication of a specific spatial relationship to a boundary, line, or
        norm.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_metric_explicitness
      description: Whether the evidence explicitly states the specific quantitative
        metric, score differential, or status (e.g., 'game point', 'deuce', 'margin
        of X') for each item in a comparison required to verify a superlative or 'closest'
        claim, rather than only describing the general progression or final outcome.
      score_1: The evidence explicitly provides the specific metric or status for
        the relevant items (e.g., exact scores, game point counts) allowing a direct
        comparison to determine the superlative.
      score_half: The evidence provides metrics for some items or implies the comparison
        through narrative description, but lacks the explicit specific values needed
        to definitively rank the items.
      score_0: The evidence only describes the general flow, the final result, or
        the existence of a competition without providing the specific comparative
        metrics for the items in question.
      weight: 4.0
      failure_repair_action: refine_query
    - name: sequence_completeness
      description: Whether the evidence captures the full temporal sequence of a multi-stage
        interaction or event (e.g., initial agreement followed by a subsequent reversal,
        or a promise followed by an outcome), rather than only showing the initial
        state, the intermediate state, or the final state in isolation.
      score_1: The evidence explicitly shows or states the entire sequence of events
        required to verify the option's claim about the progression (e.g., the initial
        promise AND the subsequent abandonment).
      score_half: The evidence shows part of the sequence (e.g., only the initial
        agreement or only the final abandonment) but misses the critical transition
        or the other half of the interaction.
      score_0: The evidence only shows a single static moment or a disconnected fragment
        of the interaction, making it impossible to determine the progression or change
        in behavior over time.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: target_outcome_explicitness
      description: Whether the evidence explicitly states the specific goal state,
        target outcome, or desired condition that the subjects aim to achieve through
        their actions, rather than only describing the general topic, the means used,
        or the current problem.
      score_1: The evidence explicitly articulates the specific target state or outcome
        the subjects intend to achieve (e.g., 'achieve work-life balance', 'become
        X', 'reach Y condition').
      score_half: The evidence describes the problem or the actions taken to help,
        but the specific target outcome is implied, vague, or not explicitly stated
        as the goal.
      score_0: The evidence only describes the current situation, the general topic,
        or the means of intervention without stating the specific desired end state.
      weight: 3.0
      failure_repair_action: refine_query
    - name: internal_state_explicitness
      description: Whether the evidence explicitly articulates the specific internal
        emotional state, feeling, or subjective motivation of the subject driving
        an action, rather than merely describing the external action, the context,
        or implying the emotion through generic descriptors.
      score_1: The evidence explicitly states or demonstrates the specific internal
        feeling or motivation (e.g., 'I don't want to leave', 'I feel sad', 'reluctant')
        that explains the subject's action.
      score_half: The evidence describes the action or context and implies an emotion
        (e.g., 'emotional', 'tears', 'sad face') but does not explicitly state the
        specific internal state or motivation.
      score_0: The evidence only describes the external action, the setting, or generic
        reactions without any indication of the specific internal emotional state
        or motivation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: rule_violation_explicitness
      description: Whether the evidence explicitly identifies the specific nature
        of a rule violation, constraint breach, or forbidden action asserted by the
        option, rather than merely showing the action itself or a generic deviation
        from a norm.
      score_1: The evidence explicitly states or demonstrates the specific rule/constraint
        that was violated and the precise action constituting the violation (e.g.,
        'removed the plug which was forbidden').
      score_half: The evidence shows the action or implies a deviation but does not
        explicitly link it to a specific rule or constraint, or the nature of the
        violation is ambiguous.
      score_0: The evidence only describes the action or the general context without
        any indication of a specific rule violation or constraint breach.
      weight: 3.0
      failure_repair_action: refine_query
    - name: specific_action_explicitness
      description: Whether the evidence explicitly identifies the specific action,
        gesture, or interaction that is the subject of a refusal, agreement, or specific
        claim, rather than merely describing the general context, the relationship,
        or a different action.
      score_1: The evidence explicitly states or shows the specific action being refused,
        agreed to, or claimed (e.g., 'shaking hands', 'signing the paper', 'sitting
        down'), allowing verification of the specific interaction.
      score_half: The evidence describes the context or the relationship and implies
        an interaction, but the specific action being refused or performed is not
        explicitly named or shown.
      score_0: The evidence only describes the general setting, the participants,
        or unrelated actions without identifying the specific interaction in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: baseline_norm_explicitness
      description: Whether the evidence explicitly states the specific rule, norm,
        baseline condition, or expected state that defines the context for an action,
        rather than only showing the action or the reaction to it.
      score_1: The evidence explicitly articulates the specific rule, norm, or baseline
        condition (e.g., 'no cover charge', 'free event', 'forbidden action') that
        establishes the context for the action in question.
      score_half: The evidence implies a norm or baseline through context or reaction,
        but the specific rule or condition is not explicitly stated.
      score_0: The evidence only shows the action, the conflict, or the reaction without
        any indication of the specific rule, norm, or baseline condition that defines
        the situation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: task_criteria_explicitness
      description: Whether the evidence explicitly states the specific criteria, constraints,
        or target conditions that define the goal of a task or challenge, rather than
        merely describing the general action, the participants, or the outcome.
      score_1: The evidence explicitly articulates the specific conditions or constraints
        required to complete the task (e.g., 'find the broken ones', 'only X items',
        'avoid Y').
      score_half: The evidence describes the general action or the task's existence
        but the specific criteria or constraints defining the goal are implied, vague,
        or missing.
      score_0: The evidence only describes the action being performed or the general
        context without stating the specific criteria or target conditions that define
        the task's objective.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ranking_order_explicitness
      description: Whether the evidence explicitly presents the specific ordered sequence,
        list, or rank positions of the items in question, rather than only discussing
        individual items, their relative merits, or a single winner without the full
        ordering.
      score_1: The evidence explicitly shows or states the complete ordered list or
        the specific rank position (e.g., '1st', '2nd') for the items required to
        verify the option's claim about the ranking.
      score_half: The evidence discusses the items and implies an order or mentions
        a winner, but the specific rank positions or the full sequence required to
        verify the option are not explicitly stated or shown.
      score_0: The evidence only describes individual items, their qualities, or a
        single outcome without providing the specific ordered sequence or rank positions
        needed to determine the relative standing of the options.
      weight: 4.0
      failure_repair_action: refine_query
    - name: categorical_attribute_explicitness
      description: Whether the evidence explicitly states or visually resolves the
        specific categorical attribute (e.g., gender, age group, role, species) of
        the target entity asserted by the option, rather than merely describing the
        entity's actions, appearance, or generic presence.
      score_1: The evidence explicitly identifies the specific category or attribute
        (e.g., 'male', 'children', 'teacher') required to verify or exclude the option's
        claim about the entity's identity.
      score_half: The evidence describes the entity's actions or appearance in a way
        that implies a category, but the specific attribute is not explicitly stated
        or visually unambiguous.
      score_0: The evidence describes the entity's actions, setting, or generic presence
        without any indication of the specific categorical attribute asserted by the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_claim_explicitness
      description: Whether the evidence explicitly captures the specific superlative
        claim (e.g., 'favorite', 'best', 'worst', 'most delicious') asserted by a
        subject regarding the specific item or combination in question, rather than
        merely describing the item's consumption, general enjoyment, or a superlative
        claim about a different item.
      score_1: The evidence explicitly states the subject's superlative claim (e.g.,
        'this is my favorite') specifically about the item asserted by the option.
      score_half: The evidence shows the subject enjoying the item or making a superlative
        claim about a different item, but the specific superlative claim for the option's
        item is implied or missing.
      score_0: The evidence only describes the item's preparation, consumption, or
        general reaction without any explicit superlative claim regarding that specific
        item.
      weight: 4.0
      failure_repair_action: refine_query
    - name: media_content_category_explicitness
      description: Whether the evidence explicitly identifies the specific content
        category, genre, or theme of a media artifact (e.g., video, clip, segment)
        produced or consumed by the subject, rather than merely describing the act
        of creation, the general topic, or the platform used.
      score_1: The evidence explicitly states or visually demonstrates the specific
        category or theme of the media artifact (e.g., 'gaming video', 'cooking tutorial',
        'vlog') required to verify the option.
      score_half: The evidence describes the act of creating or consuming media or
        mentions the platform, but the specific content category or theme is implied,
        vague, or not explicitly stated.
      score_0: The evidence only describes the general activity, the setting, or the
        platform without any indication of the specific content category or theme
        of the media artifact.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_reason_explicitness
      description: Whether the evidence explicitly states the specific reason, cause,
        or motivation for a subject's action or decision, rather than merely describing
        the action itself, the outcome, or the context in which it occurred.
      score_1: The evidence explicitly articulates the reason for the action (e.g.,
        'did X because Y', 'for no reason', 'in order to Z'), allowing verification
        of the causal claim.
      score_half: The evidence describes the action and its outcome or context, but
        the specific reason or motivation is implied, vague, or not explicitly stated.
      score_0: The evidence only describes the action, the participants, or the result
        without any indication of the specific reason or motivation driving the action.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_mechanism_explicitness
      description: Whether the evidence explicitly describes the specific physiological,
        mechanical, or physical process by which a cause produces an effect, rather
        than merely identifying the cause or the final outcome.
      score_1: The evidence explicitly articulates the specific mechanism or mode
        of action (e.g., 'electric shock causing cardiac arrest', 'poison entering
        bloodstream', 'impact causing fracture') that links the cause to the effect.
      score_half: The evidence identifies the cause and the outcome but the specific
        process or mechanism connecting them is implied, vague, or described only
        in generic terms.
      score_0: The evidence only states the cause or the outcome without any description
        of the specific mechanism or process by which the cause leads to the effect.
      weight: 3.0
      failure_repair_action: refine_query
    - name: individual_result_quantification
      description: Whether the evidence explicitly states the specific quantitative
        result (e.g., exact distance, time, score, or specific race category completed)
        for each individual entity asserted by the option, rather than only describing
        the event generally, mentioning participation, or providing generic/aggregate
        outcomes.
      score_1: The evidence explicitly provides the specific quantitative result or
        category (e.g., 'ran 38km', 'finished full marathon', 'scored 10 points')
        for each relevant individual required to verify the option.
      score_half: The evidence mentions the individuals' participation or provides
        a generic outcome (e.g., 'they ran', 'she didn't finish') but lacks the specific
        quantitative value or category needed to distinguish between options.
      score_0: The evidence only describes the event context or general participation
        without any specific quantitative results or categories for the individuals
        in question.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Information Synopsis:
    rubric_criteria:
    - name: thesis_scope_alignment
      description: Whether the evidence explicitly establishes the primary thesis,
        overarching scope, or main argument of the content, rather than only providing
        supporting details, examples, or sub-topics.
      score_1: The evidence explicitly states or clearly frames the main argument/thesis
        that encompasses the options' scope.
      score_half: The evidence contains the main argument implicitly or mixes it with
        supporting details without clear framing.
      score_0: The evidence only contains specific details, examples, or sub-topics
        without establishing the primary focus or thesis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: claim_polarity_explicitness
      description: Whether the evidence explicitly asserts the specific nature, direction,
        or logical relationship of the primary event (e.g., a challenge, a confirmation,
        a discovery, a refutation) rather than merely describing the topic or related
        activities.
      score_1: The evidence explicitly states the specific nature of the event (e.g.,
        'challenges the theory', 'confirms the hypothesis') that distinguishes the
        options.
      score_half: The evidence describes the topic and related activities but the
        specific nature or direction of the primary event is only implied or ambiguous.
      score_0: The evidence only describes the topic or generic activities without
        establishing the specific nature or direction of the primary event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: source_attribution_explicitness
      description: Whether the evidence explicitly links the specific claim, finding,
        or perspective to the named source, researcher, or entity required by the
        question, rather than presenting the claim as a general fact or attributing
        it to an unspecified party.
      score_1: The evidence explicitly states that the specific claim or finding belongs
        to or was made by the named source/researcher.
      score_half: The evidence mentions the source and the claim separately, or implies
        a connection without explicitly stating the source made that specific claim.
      score_0: The evidence presents the claim as a general fact or attributes it
        to an unspecified party, failing to link it to the required named source.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_precision_explicitness
      description: Whether the evidence explicitly states the specific attributes
        (e.g., count, gender, age, role, location) of the entities involved that are
        required to distinguish between the options, rather than providing generic
        or incorrect descriptors.
      score_1: The evidence explicitly states the precise attributes (e.g., 'three
        sons', 'ten victims') that allow verification or exclusion of each option.
      score_half: The evidence mentions the entities but the specific distinguishing
        attributes are ambiguous, implied, or partially incorrect.
      score_0: The evidence provides generic descriptions or incorrect attributes
        for the entities, making it impossible to distinguish between options based
        on those details.
      weight: 3.0
      failure_repair_action: refine_query
    - name: structural_position_localization
      description: Whether the evidence is temporally or structurally located at the
        specific segment, section, or moment queried (e.g., the opening, the first
        part, the conclusion) rather than from a different part of the video that
        discusses the topic in passing or as a future event.
      score_1: The evidence is explicitly from the queried structural position (e.g.,
        the video's opening or the specific section mentioned) and establishes the
        topic there.
      score_half: The evidence is from the correct general timeframe but the specific
        structural boundary (e.g., exact start of the section) is ambiguous, or the
        evidence discusses the topic from a different section.
      score_0: The evidence is from a different part of the video (e.g., a 'coming
        up' teaser, a later recap, or a different section entirely) and does not establish
        the topic at the queried position.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: narrative_span_completeness
      description: Whether the evidence covers the full temporal or narrative span
        (e.g., the journey, the buildup, the entire process) required by the option,
        rather than only a specific segment, climax, or isolated event within that
        span.
      score_1: The evidence explicitly covers the entire narrative arc or temporal
        range (e.g., from the beginning/context through to the event) required to
        verify the option's scope.
      score_half: The evidence covers a significant portion of the narrative span
        but misses key segments (e.g., only the climax or only the buildup) needed
        to fully confirm the scope.
      score_0: The evidence is limited to a single event, moment, or isolated segment,
        failing to establish the broader narrative span or journey implied by the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: activity_variant_explicitness
      description: Whether the evidence explicitly names or identifies the specific
        variant, sub-category, or type of the activity described, rather than only
        describing generic features consistent with multiple variants.
      score_1: The evidence explicitly states the specific variant or sub-category
        (e.g., 'street hockey' vs 'ice hockey') that distinguishes the options.
      score_half: The evidence describes features of the activity that strongly suggest
        a variant but does not explicitly name it, leaving ambiguity between similar
        options.
      score_0: The evidence only describes generic features of the activity that are
        consistent with multiple variants, making it impossible to distinguish the
        specific type.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_set_completeness
      description: Whether the evidence captures the complete set of distinct entities
        (e.g., all performers, all items in a list) required to verify a quantitative
        claim or a 'collection' scope, rather than only a subset or representative
        sample.
      score_1: The evidence explicitly identifies every distinct entity in the set,
        allowing the total count or 'all' scope to be verified or excluded.
      score_half: The evidence identifies some entities in the set but misses others,
        making the total count or 'all' scope ambiguous or unverifiable.
      score_0: The evidence identifies only a single entity or a small subset, failing
        to establish the size or completeness of the collection.
      weight: 3.0
      failure_repair_action: refine_query
    - name: invariance_verification
      description: Whether the evidence explicitly establishes a baseline state for
        an attribute and confirms its persistence (or lack of change) across the relevant
        timeframe, rather than only describing changes to other attributes or the
        process of transformation.
      score_1: The evidence explicitly states the initial state of the attribute and
        confirms it remains unchanged, or explicitly notes the absence of change for
        that specific attribute while changes occur elsewhere.
      score_half: The evidence describes the initial state or the context of change
        but does not explicitly confirm the persistence of the specific attribute,
        leaving the 'unchanged' status implied or ambiguous.
      score_0: The evidence only describes changes to other attributes or the transformation
        process, with no mention of the specific attribute's state or its persistence,
        making it impossible to verify it remained unchanged.
      weight: 3.0
      failure_repair_action: refine_query
    - name: internal_state_explicitness
      description: Whether the evidence explicitly asserts the specific internal psychological
        or emotional state (e.g., stress, anxiety, joy, confidence, fear) of the target
        entity, rather than only describing external behaviors, physical appearances,
        or situational contexts that might imply such states.
      score_1: The evidence explicitly names or describes the specific internal emotional/psychological
        state required to verify or exclude the option.
      score_half: The evidence describes behaviors, physical changes, or contexts
        that strongly imply an internal state, but the state itself is not explicitly
        stated.
      score_0: The evidence only describes external actions, appearances, or situations
        without any explicit reference to the target's internal emotional or psychological
        state.
      weight: 3.0
      failure_repair_action: refine_query
    - name: named_entity_scope_explicitness
      description: Whether the evidence explicitly names the specific organization,
        venue, or named entity that defines the primary scope of the content, rather
        than only describing generic activities or settings consistent with multiple
        options.
      score_1: The evidence explicitly states the specific name of the organization,
        venue, or entity (e.g., 'Circus Vargas', 'Harvard University') that distinguishes
        the correct option from others.
      score_half: The evidence describes the setting or activities in a way that strongly
        implies a specific entity but does not explicitly name it, or mentions the
        name only in passing without establishing it as the primary scope.
      score_0: The evidence only describes generic activities, settings, or roles
        without naming the specific entity required to distinguish between the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_label_grounding
      description: Whether the evidence contains explicit on-screen text, titles,
        or spoken declarations that directly state the video's primary subject, title,
        or theme, rather than requiring inference solely from visual actions or generic
        scene descriptions.
      score_1: The evidence includes explicit text or speech that directly states
        the video's main subject or title, allowing options to be verified or excluded
        based on this label.
      score_half: The evidence contains text or speech that hints at the subject but
        is ambiguous, partial, or does not fully capture the specific scope required
        to distinguish between options.
      score_0: The evidence relies entirely on visual descriptions of actions or objects
        without any explicit textual or spoken label defining the video's primary
        subject or title.
      weight: 3.0
      failure_repair_action: asr_match
    - name: temporal_focus_orientation
      description: Whether the evidence describes the primary event or activity as
        the current focus of the content, rather than framing it as a future plan,
        a past recap, a teaser, or a secondary topic mentioned in passing.
      score_1: The evidence explicitly frames the described activity as the main event
        happening in the current video segment.
      score_half: The evidence mentions the activity but mixes it with future plans,
        past recaps, or ambiguous timing, making the primary focus unclear.
      score_0: The evidence only describes the activity as a future plan, a past event,
        a teaser for a later video, or a minor detail, failing to establish it as
        the current main topic.
      weight: 3.0
      failure_repair_action: refine_query
    - name: primary_activity_dominance
      description: Whether the evidence explicitly identifies the activity that dominates
        the interaction or occupies the majority of the scene's focus, rather than
        describing a scene where multiple activities occur but the primary one is
        ambiguous or secondary.
      score_1: The evidence clearly establishes one specific activity as the dominant
        focus of the interaction, allowing other concurrent activities to be identified
        as secondary or incidental.
      score_half: The evidence describes multiple activities occurring simultaneously
        but does not clearly distinguish which one is the primary focus, leaving the
        main activity ambiguous.
      score_0: The evidence describes a scene with multiple activities but fails to
        establish any single activity as the dominant focus, or focuses entirely on
        a secondary activity while the primary one is only implied or background.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_span_representativeness
      description: Whether the evidence is drawn from a temporally representative
        portion of the video that reflects the dominant theme or scope, rather than
        being limited to a non-representative segment (e.g., a closing montage, teaser,
        or brief interlude) that contains conflicting or generic content.
      score_1: The evidence covers the primary, dominant portion of the video, establishing
        the main theme without being skewed by non-representative segments.
      score_half: The evidence covers a significant portion but includes or relies
        on segments that are less representative (e.g., mixing main content with a
        montage), creating some ambiguity about the dominant theme.
      score_0: The evidence is limited to a non-representative segment (e.g., only
        the end montage, a teaser, or a brief unrelated clip) that fails to reflect
        the video's primary scope or contains conflicting information.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: subset_action_differentiation
      description: Whether the evidence explicitly distinguishes which specific subset
        of a group performed a particular action, rather than implying the entire
        group participated or failing to identify the specific actor(s) within the
        group.
      score_1: The evidence explicitly identifies the specific individual(s) or subset
        who performed the action, allowing options claiming 'only one', 'some', or
        'all' to be verified or excluded.
      score_half: The evidence shows the group context and the action but does not
        clearly distinguish whether the action was performed by the whole group or
        a specific subset, leaving the scope of participation ambiguous.
      score_0: The evidence implies the entire group performed the action or fails
        to identify any specific actor, making it impossible to verify claims about
        partial participation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: intent_framing_explicitness
      description: Whether the evidence explicitly states or frames the primary communicative
        intent or genre of the video (e.g., a shopping haul, a tutorial, a review,
        a showcase) rather than only describing the objects or actions present without
        defining the video's purpose.
      score_1: The evidence explicitly declares the video's intent or genre (e.g.,
        'showing my purchases', 'how to make', 'reviewing this product') that distinguishes
        between options describing the same content with different purposes.
      score_half: The evidence implies the intent through context or partial statements
        but does not explicitly define the video's primary genre or purpose, leaving
        ambiguity between similar options.
      score_0: The evidence only describes the objects, actions, or setting without
        any explicit statement or framing of the video's overall intent or genre,
        making it impossible to distinguish between options that differ only in purpose.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_ontology_explicitness
      description: Whether the evidence explicitly establishes the fundamental ontological
        nature or genre of the narrative (e.g., supernatural, dream, hallucination,
        historical fact, fictional allegory) required to distinguish between options,
        rather than only describing the events in a way that is consistent with multiple
        ontological interpretations.
      score_1: The evidence explicitly states or clearly demonstrates the specific
        ontological nature (e.g., 'ghost', 'dream', 'reality') that distinguishes
        the correct option from others.
      score_half: The evidence describes events that strongly imply a specific ontological
        nature but does not explicitly confirm it, leaving ambiguity between realistic
        and supernatural (or other) interpretations.
      score_0: The evidence only describes the events or actions without establishing
        the fundamental nature of the narrative reality, making it impossible to distinguish
        between options that differ only in their ontological framing.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Recognition:
    rubric_criteria:
    - name: communication_directionality
      description: Whether the evidence explicitly grounds the specific direction
        of the communication act (e.g., sending/transmitting vs. receiving/detecting)
        asserted by the option, rather than merely discussing the general topic of
        communication.
      score_1: The evidence explicitly describes the specific direction (sending or
        receiving) required to verify or exclude the option.
      score_half: The evidence discusses communication generally or the opposite direction,
        making the specific direction implicit or ambiguous.
      score_0: The evidence discusses communication without specifying direction,
        or discusses a completely unrelated topic.
      weight: 3.0
      failure_repair_action: refine_query
    - name: category_label_explicitness
      description: Whether the evidence explicitly states the specific category, class,
        occupation, or label of the target entity asserted by the option, rather than
        merely describing its actions, appearance, or context.
      score_1: The specific category/label (e.g., occupation, class, type) required
        to verify or exclude the option is explicitly stated in the evidence.
      score_half: The evidence describes the entity's actions or context that strongly
        imply the category, but the specific label is not explicitly stated.
      score_0: The evidence describes the entity or context without providing the
        specific category/label needed to verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: identity_resolution
      description: Whether the evidence explicitly resolves the unique identifier
        (e.g., name, number, specific label) of the target entity asserted by the
        option, rather than merely describing the entity's actions, appearance, or
        context.
      score_1: The specific unique identifier (name, number, or label) required to
        verify or exclude the option is explicitly stated or visually resolved in
        the evidence.
      score_half: The evidence describes the entity's actions, appearance, or context
        that strongly imply the identity, but the specific unique identifier is not
        explicitly stated or resolved.
      score_0: The evidence describes the entity or context without providing the
        specific unique identifier needed to verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_instance_matching
      description: Whether the evidence explicitly targets the specific event instance
        (e.g., specific race, round, match, or episode) queried in the question, rather
        than a related but distinct event (e.g., a different heat, a preliminary round,
        or a different competition).
      score_1: The evidence explicitly identifies and covers the exact event instance
        (e.g., 'A final', 'Round 3') required to verify or exclude the options.
      score_half: The evidence covers a related event (e.g., a different round or
        heat) that shares participants or context but is not the specific instance
        queried.
      score_0: The evidence covers an unrelated event or fails to identify the specific
        event instance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_exhaustiveness
      description: Whether the evidence spans the full temporal extent of the video
        (or the relevant complete sequence) to confirm the absence of an object/action
        or to verify a negative claim, rather than covering only a partial segment.
      score_1: The evidence covers the entire video duration or the complete sequence
        of events, allowing for the confirmation of absence or the verification of
        negative options.
      score_half: The evidence covers a significant portion of the video but leaves
        gaps where the target object or action could plausibly appear, making negative
        claims unverifiable.
      score_0: The evidence covers only a short segment or isolated event, providing
        no basis to rule out the presence of objects/actions in the unobserved parts
        of the video.
      weight: 4.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Reasoning:
    rubric_criteria:
    - name: temporal_location_of_segments
      description: Whether the evidence provides explicit timestamps or temporal markers
        that locate each narrative segment or event required to determine the correct
        sequence.
      score_1: Evidence includes timestamps or clear temporal markers for all segments
        needed to establish their relative order.
      score_half: Evidence locates some segments temporally, but others are present
        without clear temporal placement, preventing a full sequence determination.
      score_0: Evidence describes the content of segments but lacks the temporal markers
        needed to order them relative to one another.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: earliest_occurrence_grounding
      description: Whether the evidence explicitly identifies and grounds the earliest
        instance of the target event or state change, distinguishing it from later
        iterations, improvements, or subsequent milestones.
      score_1: Evidence explicitly locates the first occurrence of the event and distinguishes
        it from any later developments.
      score_half: Evidence mentions the event and later developments but fails to
        clearly distinguish which instance is the earliest, or the earliest instance
        is implied but not explicitly grounded.
      score_0: Evidence only covers later instances, improvements, or milestones,
        with no mention or grounding of the initial occurrence.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: segment_content_mapping
      description: Whether the evidence explicitly links the target event, state,
        or topic to the specific narrative segment, section title, or chapter identifier
        asserted in the options.
      score_1: Evidence explicitly confirms that the target event/topic occurs within
        the specific segment or section named in the option.
      score_half: Evidence mentions the segment title and the target event separately,
        but does not explicitly confirm they occur together in the same segment.
      score_0: Evidence describes the segment content or the target event in isolation,
        failing to establish which specific segment contains the target.
      weight: 4.0
      failure_repair_action: refine_query
    - name: agent_based_sequencing
      description: Whether the evidence explicitly identifies the distinct agents,
        performers, or subjects associated with each event and establishes the narrative
        continuity or transition between them to determine their relative order.
      score_1: Evidence explicitly names or identifies the specific agent/performer
        for each event and describes the narrative transition (e.g., 'next', 'following',
        'after') that orders these distinct acts.
      score_half: Evidence identifies agents for some events or implies a sequence,
        but lacks explicit transitions or clear agent identification for all events
        needed to establish the full order.
      score_0: Evidence describes events in isolation without identifying the specific
        agents or establishing the narrative continuity required to order them relative
        to one another.
      weight: 4.0
      failure_repair_action: refine_query
    - name: complete_set_coverage
      description: Whether the evidence contains at least one instance of every distinct
        item, event, or topic listed in the options that must be ordered.
      score_1: Evidence includes at least one clear instance of every item required
        to construct the full sequence.
      score_half: Evidence includes instances of most items, but at least one required
        item is missing or only implied without clear grounding.
      score_0: Evidence is missing one or more required items entirely, making it
        impossible to determine the full sequence or exclude options placing missing
        items in different positions.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_frequency_explicitness
      description: Whether the evidence explicitly states the frequency, rate, or
        temporal unit (e.g., 'per day', 'every week', 'once per episode') associated
        with the target event or state change, rather than merely describing the event
        or a total duration.
      score_1: Evidence explicitly defines the frequency or temporal unit (e.g., 'one
        X per Y time') required to map observed instances to a count or duration.
      score_half: Evidence implies a frequency or mentions a total duration but lacks
        the explicit rate/unit needed to definitively calculate the count from the
        observed instances.
      score_0: Evidence describes the event or total duration without any mention
        of the frequency or temporal unit, making it impossible to derive the count
        or duration from the instances.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_sequential_relation
      description: Whether the evidence explicitly states the relative order or transition
        between adjacent events (e.g., 'A happens before B', 'after A, B occurs')
        rather than merely listing the events or providing absolute timestamps without
        relational context.
      score_1: Evidence explicitly describes the transition or relative order between
        all adjacent events required to construct the sequence.
      score_half: Evidence describes the events and provides some temporal markers,
        but the explicit relational link between at least one pair of adjacent events
        is missing or only implied.
      score_0: Evidence lists the events or provides absolute timestamps but lacks
        any explicit statement of the relative order or transition between them, making
        the sequence impossible to determine.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_time_unit_grounding
      description: Whether the evidence explicitly identifies the specific ordinal
        time unit (e.g., 'Day 3', 'Week 2', 'First Hour') asserted in the option and
        directly links the target event to that unit, rather than merely describing
        the event or its relative position in a sequence.
      score_1: Evidence explicitly states the ordinal time unit (e.g., 'Day X') and
        confirms the target event occurs within that specific unit.
      score_half: Evidence mentions the ordinal time unit or the event separately,
        but the explicit link between the specific unit and the event is missing or
        only implied by sequence.
      score_0: Evidence describes the event or a sequence of events but lacks any
        explicit mention of the specific ordinal time unit required to verify the
        option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_sequence_ranking
      description: Whether the evidence explicitly identifies the ordinal rank (e.g.,
        'first', 'second', 'third', 'last') of the target event within a sequence
        of events, rather than merely describing the event or its absolute time.
      score_1: Evidence explicitly states the ordinal position (e.g., 'the third stop',
        'the first time') of the target event within the relevant sequence.
      score_half: Evidence implies the order through context or lists events sequentially
        but lacks an explicit ordinal label for the target event.
      score_0: Evidence describes the event without any indication of its ordinal
        position or rank within the sequence.
      weight: 4.0
      failure_repair_action: refine_query
    - name: named_time_unit_grounding
      description: Whether the evidence explicitly identifies the specific named time
        unit (e.g., 'Monday', 'January 5th', 'Week 2') asserted in the option and
        directly links the target event to that unit, rather than merely describing
        the event's relative position or using ordinal ranks.
      score_1: Evidence explicitly states the specific named time unit (e.g., 'Thursday')
        and confirms the target event occurs within that unit.
      score_half: Evidence mentions the named time unit or the event separately, but
        the explicit link between the specific named unit and the event is missing
        or only implied by context.
      score_0: Evidence describes the event or a sequence of events but lacks any
        explicit mention of the specific named time unit required to verify the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_scope_alignment
      description: Whether the evidence explicitly grounds the entire sequence of
        events or items asserted in the option within the specific named time unit
        (e.g., 'Tuesday', 'Week 2') or temporal interval required by the option, rather
        than describing events from a different time period or merely mentioning the
        time unit in isolation.
      score_1: Evidence explicitly confirms that the full sequence of events/items
        listed in the option occurs within the specific named time unit or interval
        asserted.
      score_half: Evidence mentions the specific time unit and describes some events,
        but fails to confirm that the entire sequence belongs to that unit, or the
        events described belong to a different time period.
      score_0: Evidence describes the events but lacks any link to the specific time
        unit, or the events are clearly associated with a different time period than
        the one asserted in the option.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  OCR Problems:
    rubric_criteria:
    - name: event_completion_vs_intent
      description: Whether the evidence captures the actual completion of the queried
        event or state change, rather than merely an intent, proposal, discussion,
        or precursor action.
      score_1: Evidence explicitly shows the event occurring or the state change being
        finalized (e.g., the pronouncement of marriage, the signing of a document,
        the crossing of a finish line).
      score_half: Evidence shows a strong precursor or intent (e.g., a proposal, a
        plan to marry, a rehearsal) but not the finalization of the event.
      score_0: Evidence is unrelated to the event or only shows generic context without
        any indication of the event's occurrence or intent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_interval_grounding
      description: Whether the evidence explicitly grounds the queried temporal interval,
        period, or specific moment (e.g., halftime, final seconds, start of match)
        rather than merely showing the state at an unverified time.
      score_1: Evidence explicitly confirms the specific time, period, or interval
        required by the query (e.g., via clock reading, period indicator, or explicit
        narration).
      score_half: Evidence suggests the time or period implicitly (e.g., context clues)
        but lacks explicit confirmation of the specific interval.
      score_0: Evidence shows the state (e.g., score, action) but provides no information
        to verify the specific time or period queried.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Counting Problem:
    rubric_criteria:
    - name: instance_enumeration
      description: Whether the evidence explicitly identifies and distinguishes the
        specific instances required to determine the count, rather than merely stating
        a number or showing a generic scene.
      score_1: The evidence explicitly identifies and distinguishes each instance
        needed to verify or exclude the count options.
      score_half: The evidence identifies some instances or implies a count, but fails
        to clearly distinguish all required instances to confirm the exact number.
      score_0: The evidence mentions a number without identifying instances, or shows
        only generic scenes without distinguishing specific instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: marker_resolution
      description: Whether the evidence explicitly resolves the specific visual, auditory,
        or textual markers that define and delimit the countable instances, rather
        than describing only the generic content or narrative context.
      score_1: The evidence explicitly identifies the distinct markers (e.g., title
        cards, specific sounds, on-screen text) that define each instance required
        for the count.
      score_half: The evidence describes the content or context of the instances but
        fails to explicitly identify the specific markers that delimit or define them.
      score_0: The evidence provides only generic narrative summaries or unrelated
        content without resolving the specific markers needed to distinguish instances.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: composition_resolution
      description: Whether the evidence explicitly resolves the composition (e.g.,
        solo, duo, group) or cardinality of the specific instance required to verify
        or exclude the option, rather than merely describing the content or context.
      score_1: The evidence explicitly states or visually confirms the exact number
        of participants/composition for the specific instance in question.
      score_half: The evidence implies the composition through context or partial
        visual cues but does not explicitly confirm the exact number of participants.
      score_0: The evidence describes the content or context of the instance without
        resolving whether it is a solo, duo, or group performance.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: temporal_completeness
      description: Whether the evidence spans the entire relevant time interval of
        the video to ensure no countable instances are missed, rather than covering
        only a subset of the duration.
      score_1: The evidence explicitly covers the full duration or all distinct segments
        required to account for every instance in the count.
      score_half: The evidence covers a significant portion of the duration but leaves
        gaps where instances could exist, or the boundaries of the coverage are unclear.
      score_0: The evidence covers only a fragment of the video, making it impossible
        to verify if additional instances exist outside the provided segments.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: aggregate_resolution
      description: Whether the evidence explicitly resolves the final aggregate count
        or distribution across the compared categories, rather than merely describing
        the sorting process or individual placements without a final tally.
      score_1: The evidence explicitly states the final count for each category or
        displays the completed distribution allowing the highest count to be determined.
      score_half: The evidence shows the sorting process or individual placements
        but lacks a clear final tally or complete view of the distribution to determine
        the maximum.
      score_0: The evidence describes the process or individual items without any
        indication of the final counts or distribution across categories.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: threshold_metric_resolution
      description: Whether the evidence explicitly provides the specific quantitative
        values (e.g., start/end dates, duration, dimensions, counts) required to evaluate
        the threshold or constraint defining the countable set, rather than merely
        listing instances without the necessary metrics.
      score_1: The evidence explicitly states the specific values (e.g., construction
        dates, duration) for the instances, allowing direct verification of whether
        they meet or fail the quantitative threshold.
      score_half: The evidence provides partial quantitative data (e.g., only start
        dates or only general eras) that makes calculating the exact metric against
        the threshold ambiguous or impossible.
      score_0: The evidence lists the instances but lacks the specific quantitative
        values needed to evaluate the threshold, making it impossible to determine
        which instances satisfy the condition.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Perception:
    rubric_criteria:
    - name: superlative_grounding
      description: Whether the evidence provides the comparative data (e.g., relative
        duration, frequency, explicit ranking, or exhaustive enumeration) required
        to verify or exclude a superlative or comparative claim (e.g., 'most', 'least',
        'first', 'better than').
      score_1: Evidence explicitly states the superlative/comparative relation or
        provides sufficient quantitative/qualitative data (e.g., duration, count,
        sequence) to definitively rank the options.
      score_half: Evidence suggests a ranking or provides partial comparative data,
        but lacks the full scope or explicit confirmation needed to rule out close
        competitors.
      score_0: Evidence lists options or describes them individually without any comparative
        metric or explicit ranking, making it impossible to determine which option
        satisfies the superlative/comparative condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_change_bracketing
      description: Whether the evidence explicitly captures the moment of a state
        change (e.g., score overtake, status flip, event onset) or provides two temporally
        adjacent observations that bracket the transition (one showing the pre-change
        state and one showing the post-change state) to verify or exclude the specific
        time interval of the change.
      score_1: Evidence explicitly shows the transition moment or provides a pre-change
        observation and a post-change observation that tightly bracket the queried
        interval, allowing the exact period of change to be identified.
      score_half: Evidence shows the state before or after the change, or shows the
        change occurring but without clear temporal markers to pinpoint the specific
        interval among options.
      score_0: Evidence only shows the state at isolated points without capturing
        the transition or providing adjacent observations that bracket the change,
        making it impossible to determine when the change occurred.
      weight: 4.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.8
  Attribute Perception:
    rubric_criteria:
    - name: attribute_resolution
      description: Whether the evidence explicitly resolves the specific attribute
        value (e.g., color, size, shape, state) of the target entity required to verify
        or exclude the options, rather than merely identifying the entity or implying
        the attribute.
      score_1: The specific attribute value asserted or denied by the options is explicitly
        stated or visually resolved in the evidence.
      score_half: The entity is identified, but the specific attribute value is ambiguous,
        implied, or described generically without resolving the option's specific
        claim.
      score_0: The evidence fails to mention or resolve the specific attribute value,
        making it impossible to verify or exclude options based on that attribute.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: action_status_explicitness
      description: Whether the evidence explicitly asserts or denies the specific
        action, event, or status (e.g., being taught, being sold, occurring, being
        banned) attributed to the target entity in the options, rather than merely
        describing the entity or a related but distinct event.
      score_1: The evidence explicitly states that the specific action or status occurred
        or will occur for the target entity, or explicitly denies it.
      score_half: The evidence describes the entity or a related event but leaves
        the specific action or status ambiguous, implied, or unstated.
      score_0: The evidence fails to mention the specific action or status, making
        it impossible to verify or exclude options based on that claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: rule_logic_explicitness
      description: Whether the evidence explicitly states the rule, criterion, scoring
        logic, or condition required to verify or exclude the option's claim about
        the outcome or 'key to winning', rather than merely describing the physical
        actions or attributes involved.
      score_1: The specific rule, scoring logic, or winning condition asserted or
        denied by the options is explicitly stated or clearly implied by the evidence
        (e.g., a judge explaining points, a host stating the goal).
      score_half: The physical actions or attributes are described, but the specific
        rule or logic determining the outcome is ambiguous, implied, or missing.
      score_0: The evidence describes the scene or actions but provides no information
        about the rules, criteria, or logic needed to determine the outcome or winning
        condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_explicitness
      description: Whether the evidence explicitly resolves the superlative, comparative,
        or quantitative ranking (e.g., 'most', 'least', 'primary', 'dominant') asserted
        by the options, rather than merely confirming the presence of the attribute
        without establishing its relative degree.
      score_1: The evidence explicitly states or clearly implies the ranking or degree
        required to verify the superlative claim (e.g., explicitly identifying one
        attribute as the 'most' prominent or dominant over others).
      score_half: The evidence confirms the presence of the attribute but leaves the
        relative degree or ranking ambiguous, implied, or unstated.
      score_0: The evidence fails to address the relative degree or ranking, making
        it impossible to verify or exclude options based on a superlative or comparative
        claim.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
