general:
  rubric_criteria:
  - name: evidence_coverage
    description: Whether evidence covers the key event, time window, state change,
      comparison target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 2
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Whether evidence explicitly grounds the relevant person, object,
      action, scene, speaker, on-screen text, or spatial relation rather than a generic
      scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 3
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Whether evidence is internally consistent and contains enough contrary
      evidence to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 4
    failure_repair_action: broadcast
  scoring_rule: average
  sufficient_threshold: 0.6
type_aliases:
  Object Reasoning: Object Reasoning
  Information Synopsis: Information Synopsis
  Action Recognition: Action Recognition
  Temporal Reasoning: Temporal Reasoning
  Action Reasoning: Action Reasoning
  Object Recognition: Object Recognition
  Counting Problem: Counting Problem
  OCR Problems: OCR Problems
  Spatial Perception: Spatial Perception
  Temporal Perception: Temporal Perception
  Attribute Perception: Attribute Perception
templates:
  Object Reasoning:
    rubric_criteria:
    - name: claim_attribution_explicitness
      description: Whether the evidence explicitly attributes the specific belief,
        claim, or stance in the option to the specific person or institution named
        in that option, rather than merely mentioning the entity or the claim in isolation.
      score_1: The evidence explicitly links the specific entity to the specific belief/claim
        (e.g., 'X believes Y' or 'X states Y').
      score_half: The entity and the claim are both present but the link between them
        is implicit, ambiguous, or requires inference.
      score_0: The entity is mentioned without the specific claim, the claim is mentioned
        without the specific entity, or the link is to a different entity.
      weight: 4
      failure_repair_action: refine_query
    - name: proposition_content_explicitness
      description: Whether the evidence explicitly states the specific content, rule,
        outcome, historical origin, cultural synthesis, or detail asserted in the
        option, rather than merely mentioning the existence of the source or the entity
        associated with it.
      score_1: The evidence explicitly details the specific rule, outcome, fact, historical
        origin, or cultural synthesis asserted in the option (e.g., 'the dish originated
        from X', 'the law states Y', 'the outcome was Z').
      score_half: The evidence mentions the source or general topic but the specific
        detail (including historical context or cultural essence) required to verify
        the option is vague, implied, or missing.
      score_0: The evidence mentions the entity or the existence of a source but provides
        no specific content, rule, outcome, historical origin, or cultural detail
        to verify the option's specific claim.
      weight: 3
      failure_repair_action: refine_query
    - name: quantitative_grounding
      description: Whether the evidence provides explicit numerical values, counts,
        measurements, durations, or specific quantitative proportions (e.g., 'most',
        'half', 'three days') required to verify or exclude options containing specific
        quantities, rather than relying on qualitative descriptors (e.g., 'long',
        'many', 'tall').
      score_1: The evidence explicitly states the specific numbers, measurements,
        counts, durations, or proportions needed to verify or exclude the quantitative
        claim in the option (e.g., 'most of the three days', '14,000 feet', '50%').
      score_half: The evidence provides some quantitative context (e.g., mentions
        a duration but not the proportion, or a number but not the unit) but lacks
        the specific precision or proportion required to definitively verify or exclude
        the option's specific claim.
      score_0: The evidence relies solely on qualitative descriptors (e.g., 'long',
        'tall', 'many') or mentions the topic without providing the specific numerical
        data, duration, or proportion needed to resolve the quantitative claim.
      weight: 2
      failure_repair_action: refine_query
    - name: solution_attribution_explicitness
      description: Whether the evidence explicitly attributes the specific proposed
        solution, approach, or stance in the option to the specific agent or entity
        named in that option, rather than merely mentioning the agent or the solution
        in isolation or in a different context.
      score_1: The evidence explicitly links the specific agent to the specific solution/stance
        as the answer (e.g., 'X should do Y' or 'the answer is for X to Y').
      score_half: The agent and the solution are both present but the link is implicit,
        ambiguous, or the solution is attributed to a different agent.
      score_0: The agent is mentioned without the specific solution, the solution
        is mentioned without the specific agent, or the link is to a different agent/context.
      weight: 3.0
      failure_repair_action: refine_query
    - name: purpose_goal_explicitness
      description: Whether the evidence explicitly states the specific purpose, goal,
        intent, or objective of an event, action, or gathering asserted in the option,
        rather than merely establishing the event's occurrence, participants, location,
        or time.
      score_1: The evidence explicitly details the specific purpose or goal (e.g.,
        'to reduce risk', 'to merge', 'to discuss X') that the option claims.
      score_half: The evidence implies a purpose or mentions related activities but
        does not explicitly state the specific goal asserted in the option.
      score_0: The evidence establishes the event, participants, or context but provides
        no information about the specific purpose, goal, or intent of the gathering/action.
      weight: 3.0
      failure_repair_action: refine_query
    - name: stance_assertion_explicitness
      description: Whether the evidence explicitly contains the specific belief, opinion,
        or stance asserted in the option as a direct assertion by the relevant entity,
        rather than merely discussing the topic, posing questions, or describing hypothetical
        scenarios involving the entity.
      score_1: The evidence contains a direct assertion of the specific stance/belief
        (e.g., 'X believes Y', 'X states that Y is true') by the relevant entity.
      score_half: The evidence implies the stance or discusses the topic in a way
        that strongly suggests the stance, but lacks a direct, explicit assertion
        of the belief itself.
      score_0: The evidence only discusses the topic, poses questions about it, or
        describes hypothetical scenarios (e.g., 'if Y happens...') without the entity
        explicitly asserting the specific stance/belief required to verify the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_position_explicitness
      description: Whether the evidence explicitly states the specific ordinal position
        (e.g., 'first', 'second', 'last', 'next') or sequence rank of the event, item,
        or claim asserted in the option, rather than merely listing the item or describing
        it without its specific place in a sequence.
      score_1: The evidence explicitly states the specific ordinal rank (e.g., 'the
        second line of evidence', 'the first step') required to verify the option's
        claim about sequence or order.
      score_half: The evidence implies a sequence or lists multiple items but does
        not explicitly assign the specific ordinal rank (e.g., 'first', 'second')
        to the target item.
      score_0: The evidence mentions the item or describes the sequence generally
        but provides no explicit ordinal marker to verify the specific position claimed
        in the option.
      weight: 3
      failure_repair_action: refine_query
    - name: causal_mechanism_explicitness
      description: Whether the evidence explicitly states the specific cause, reason,
        mechanism, or motivation asserted in the option to explain an event or state,
        rather than merely describing the event, its context, or its outcome without
        the underlying reason.
      score_1: The evidence explicitly articulates the specific cause or reason (e.g.,
        'due to X', 'because of Y', 'the reason is Z') that the option claims.
      score_half: The evidence implies a cause or discusses related factors but does
        not explicitly state the specific mechanism or reason asserted in the option.
      score_0: The evidence describes the event, state, or outcome but provides no
        explicit information about the specific cause, reason, or mechanism required
        to verify the option's claim.
      weight: 2
      failure_repair_action: refine_query
    - name: direct_speech_presence
      description: Whether the evidence contains the direct, verbatim utterance of
        the specific speaker whose message, claim, or statement is the subject of
        the query, rather than a third-party summary, report, or description of what
        that speaker said.
      score_1: The evidence includes the actual audio or transcript of the target
        speaker directly stating the content in question.
      score_half: The evidence contains a partial quote or a mix of direct speech
        and summary, but the full specific message is not fully captured in the speaker's
        own words.
      score_0: The evidence only contains a third-party report, summary, or description
        of the speaker's message (e.g., 'The caller said X' or 'Witnesses reported
        Y') without the speaker's direct utterance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_actualization_explicitness
      description: Whether the evidence explicitly confirms the specific event, action,
        or state change asserted in the option is actually occurring or has occurred
        in the queried context, rather than merely describing a plan, intention, prediction,
        or hypothetical scenario for that event.
      score_1: The evidence explicitly states or shows the event/action is happening
        or has happened (e.g., 'X is doing Y now', 'Y occurred', 'the result is Z'),
        directly verifying the option's claim about the actual state.
      score_half: The evidence implies the event is likely to happen or describes
        the preparation for it, but does not explicitly confirm the event is currently
        occurring or has been completed.
      score_0: The evidence only describes a plan, intention, prediction, or hypothetical
        scenario (e.g., 'X will do Y', 'we plan to Z', 'if Y happens') without confirming
        the event is actually taking place or has occurred.
      weight: 3
      failure_repair_action: refine_query
    - name: factual_contradiction_explicitness
      description: Whether the evidence explicitly presents a specific fact, admission,
        or revelation that directly contradicts a key premise, piece of evidence,
        or claim asserted in the option, rather than merely discussing the topic,
        procedure, or possibility of such a contradiction.
      score_1: The evidence explicitly states a specific fact or admission (e.g.,
        'the witness admitted X', 'the record shows Y') that directly invalidates
        or contradicts the core claim or evidence in the option.
      score_half: The evidence implies a contradiction or discusses the possibility
        of conflicting facts but does not explicitly state the specific contradictory
        fact required to verify or exclude the option.
      score_0: The evidence discusses the topic, legal procedures, or hypothetical
        scenarios without presenting any specific factual contradiction that resolves
        the option's claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: discussion_topic_explicitness
      description: Whether the evidence explicitly states the specific subject matter,
        content, or issue being discussed in a conversation, meeting, or interaction
        asserted in the option, rather than merely establishing the occurrence of
        the interaction, the participants, or the general context.
      score_1: The evidence explicitly identifies the specific topic or content of
        the discussion (e.g., 'they discussed the settlement amount', 'the meeting
        was about X').
      score_half: The evidence implies the topic or mentions related concepts generally
        but does not explicitly state the specific subject matter of the interaction.
      score_0: The evidence establishes the interaction, participants, or general
        context but provides no information about the specific topic or content being
        discussed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: referenced_content_explicitness
      description: Whether the evidence explicitly reveals the specific content, reason,
        or detail of a referenced communication, document, or internal state (e.g.,
        the content of a note, the reason in a plea, the terms of a deal) rather than
        merely establishing the existence of that communication or document.
      score_1: The evidence explicitly states the specific content, reason, or detail
        of the referenced item (e.g., 'the note said X', 'the plea was for Y reason').
      score_half: The evidence implies the content or mentions the existence of the
        communication but the specific detail required to verify the option is vague
        or inferred.
      score_0: The evidence only establishes the existence of the communication, document,
        or state (e.g., 'a note was sent', 'a plea was made') without revealing the
        specific content or reason inside it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_grounding
      description: Whether the evidence explicitly articulates the specific difference,
        similarity, or relationship between the compared items asserted in the option,
        rather than merely describing the items in isolation or mentioning them without
        a direct comparison.
      score_1: The evidence explicitly states the specific relationship or difference
        between the compared items (e.g., 'A differs from B because...', 'A is X while
        B is Y').
      score_half: The evidence describes the items separately or implies a relationship
        but does not explicitly state the specific difference or similarity required
        to verify the option.
      score_0: The evidence mentions the items or describes them in isolation without
        any explicit comparative statement linking them to establish the difference
        or similarity claimed in the option.
      weight: 4
      failure_repair_action: refine_query
    - name: comparative_count_explicitness
      description: Whether the evidence explicitly states the specific counts or quantities
        for all items being compared in a superlative query (e.g., 'most', 'fewest',
        'largest'), rather than merely describing the items or providing counts for
        only a subset.
      score_1: The evidence explicitly states the total count or quantity for every
        item involved in the comparison, allowing the superlative claim to be verified
        or excluded directly.
      score_half: The evidence provides counts for some but not all compared items,
        or implies the counts without explicit enumeration.
      score_0: The evidence describes the items or provides partial counts (e.g.,
        'Scenario 1 of 6' without stating the total for other steps) but lacks the
        explicit counts for all compared items required to determine the superlative.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relationship_status_explicitness
      description: Whether the evidence explicitly states the specific relationship
        status, history, or connection (e.g., 'ex-couple', 'siblings', 'married',
        'estranged') between the entities in the option, rather than merely showing
        them interacting, being in the same scene, or discussing unrelated topics.
      score_1: The evidence explicitly states the specific relationship status or
        history (e.g., 'they broke up', 'they are siblings', 'they are exes') required
        to verify or exclude the option.
      score_half: The evidence implies a relationship through context or interaction
        (e.g., they are arguing, they are together) but does not explicitly state
        the specific status or history claimed in the option.
      score_0: The evidence shows the entities interacting or in the same scene but
        provides no explicit information about their specific relationship status
        or history.
      weight: 3
      failure_repair_action: refine_query
    - name: role_affiliation_explicitness
      description: Whether the evidence explicitly states the specific role, title,
        or institutional affiliation of the speaker that defines or validates the
        stance asserted in the option, rather than merely mentioning the speaker or
        the topic of discussion.
      score_1: The evidence explicitly links the speaker to a specific role, title,
        or organization (e.g., 'President of X', 'Director of Y') that directly supports
        or defines the stance in the option.
      score_half: The evidence mentions the speaker's general context or implies a
        role but does not explicitly state the specific title or affiliation required
        to verify the stance.
      score_0: The evidence mentions the speaker or discusses the topic but provides
        no explicit information about the speaker's specific role, title, or institutional
        affiliation that would define the stance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relationship_impact_explicitness
      description: Whether the evidence explicitly states the specific change, impact,
        or resulting state of the relationship between the entities asserted in the
        option (e.g., 'strengthened', 'caused a rift', 'reconciled') as a direct consequence
        of the event, rather than merely describing the event, the entities' prior
        status, or their general interaction.
      score_1: The evidence explicitly details the specific impact or change in the
        relationship (e.g., 'it led to a rift', 'they reconciled', 'it strengthened
        their bond') resulting from the event.
      score_half: The evidence implies a change in the relationship or describes the
        event and the entities' reactions but does not explicitly state the specific
        impact or resulting state claimed in the option.
      score_0: The evidence describes the event, the entities, or their prior relationship
        status but provides no explicit information about the specific impact or change
        in the relationship caused by the event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: success_condition_explicitness
      description: Whether the evidence explicitly states the specific condition,
        requirement, or action necessary to achieve the successful outcome asserted
        in the option, rather than merely describing a failure scenario, the absence
        of the outcome, or attributes that are insufficient on their own.
      score_1: The evidence explicitly identifies the specific requirement or action
        needed to achieve the success (e.g., 'X is required to succeed', 'without
        Y, they cannot succeed').
      score_half: The evidence implies a requirement or describes a situation where
        success is difficult but does not explicitly state the specific condition
        needed to achieve it.
      score_0: The evidence only describes a failure scenario, the lack of success,
        or attributes that are present but insufficient (e.g., 'they have X but still
        fail') without stating what is actually required to succeed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: success_factor_enumeration_explicitness
      description: Whether the evidence explicitly enumerates the specific set of
        factors, attributes, or actions identified as the causes of the successful
        outcome asserted in the option, rather than merely describing the entity,
        its isolated traits, its failures, or the general context of the event.
      score_1: The evidence explicitly lists the specific combination of factors (e.g.,
        'X, Y, and Z led to success') that the option claims are the critical contributors
        to the success.
      score_half: The evidence mentions some of the factors or implies a cause for
        success but does not explicitly enumerate the specific set of factors required
        to verify the option's claim.
      score_0: The evidence describes the entity, its isolated traits, its struggles,
        or the general context but fails to explicitly state the specific combination
        of factors that caused the success.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_classification_explicitness
      description: Whether the evidence explicitly states the specific name, category,
        or formal classification of the event, sport, or activity asserted in the
        option, rather than merely describing the visual actions, participants, or
        general context which could apply to multiple event types.
      score_1: The evidence explicitly names the specific event type, sport discipline,
        or formal category (e.g., 'race walk', 'marathon', 'debate') required to verify
        or exclude the option's claim about the event nature.
      score_half: The evidence describes the actions or context strongly suggesting
        the event type but does not explicitly state the formal name or classification.
      score_0: The evidence only describes the visual actions, participants, or general
        setting without explicitly naming the specific event type or sport discipline,
        leaving the classification ambiguous or inferred.
      weight: 3.0
      failure_repair_action: refine_query
    - name: governing_rule_explicitness
      description: Whether the evidence explicitly states the specific rule, constraint,
        or condition (e.g., scoring limit, win-by-margin, tie-breaker procedure) that
        governs the outcome or state change asserted in the option, rather than merely
        describing the event, the current score, or the participants' actions without
        the underlying rule.
      score_1: The evidence explicitly states the specific rule or constraint (e.g.,
        'play to 15', 'must win by two', 'first to X wins') required to verify or
        exclude the option's claim about the outcome.
      score_half: The evidence implies the rule through context or describes a similar
        scenario but does not explicitly state the specific constraint required to
        resolve the option.
      score_0: The evidence describes the event, current state, or actions but provides
        no explicit information about the specific governing rule or constraint needed
        to determine the outcome.
      weight: 3.0
      failure_repair_action: refine_query
    - name: mechanism_of_action_explicitness
      description: Whether the evidence explicitly details the specific physical or
        logical process by which an object, tool, or action achieves the effect or
        purpose asserted in the option, rather than merely mentioning the object's
        existence, a generic association, or the outcome without the 'how'.
      score_1: The evidence explicitly describes the operational mechanism (e.g.,
        'the mirror reflects X to hide Y', 'the spring releases Z') that explains
        how the object/action produces the specific effect claimed in the option.
      score_half: The evidence implies a mechanism or describes the outcome but lacks
        the specific step-by-step process or physical principle required to verify
        exactly how the effect is achieved.
      score_0: The evidence mentions the object or the outcome but provides no information
        about the specific mechanism or process by which the object/action produces
        the effect (e.g., only stating 'a mirror is used' without explaining how it
        works).
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequence_item_attribute_grounding
      description: Whether the evidence explicitly grounds the specific attribute,
        state, or action asserted in the option for each of the identified items in
        the sequence (e.g., the first, second, or last item), rather than merely showing
        the attribute in isolation, for a generic item, or for an unverified set of
        items.
      score_1: The evidence explicitly links the specific attribute to each of the
        identified sequence items (e.g., 'the first item has X' and 'the second item
        has X'), allowing the commonality or difference to be verified.
      score_half: The evidence identifies the sequence items but only explicitly grounds
        the attribute for some of them, or the attribute is shown but not clearly
        linked to the specific ordinal items.
      score_0: The evidence shows the attribute in isolation, for generic items, or
        for items whose position in the sequence is not established, making it impossible
        to verify the attribute for the specific 'first two' (or other ordinal) items
        required by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_attribution_explicitness
      description: Whether the evidence explicitly attributes the specific physical
        action, event, or behavior asserted in the option to the specific agent named
        in that option, rather than merely showing the action performed by an unidentified
        person, showing the agent performing a different action, or mentioning the
        agent and action in separate, unlinked contexts.
      score_1: The evidence explicitly links the specific agent to the specific action
        (e.g., 'X cuts the watermelon', 'Y uses the tool'), allowing the option to
        be verified or excluded directly.
      score_half: The evidence shows the action and the agent but the link is ambiguous,
        implied, or the action is performed by an unidentified person while the agent
        is mentioned elsewhere.
      score_0: The evidence shows the action without identifying the agent, shows
        the agent performing a different action, or mentions the agent and action
        in isolation without establishing that the agent performed that specific action.
      weight: 3
      failure_repair_action: refine_query
    - name: commonality_grounding
      description: Whether the evidence explicitly asserts that the specific shared
        attribute, state, or relationship claimed in the option applies to ALL items
        in the set (e.g., 'Both A and B are X'), rather than merely describing the
        attribute for one item, describing the items separately without linking them,
        or discussing a different set of items.
      score_1: The evidence explicitly states that the specific attribute or relationship
        applies to every item in the set required by the option (e.g., 'Both A and
        B are X' or 'A and B share Y').
      score_half: The evidence describes the attribute for some but not all items
        in the set, or implies a shared nature without explicitly linking all items
        to the specific attribute.
      score_0: The evidence describes the attribute for only one item, discusses the
        items in isolation without a shared link, or discusses a different set of
        items entirely, failing to verify the 'both/all' claim.
      weight: 5
      failure_repair_action: refine_query
    - name: visual_attribute_grounding
      description: Whether the evidence explicitly grounds the specific visual attributes
        (e.g., clothing color, accessories, physical features) asserted in the option
        to the specific entity required for identification, rather than describing
        the entity with generic attributes or omitting the distinguishing features
        entirely.
      score_1: The evidence explicitly describes the target entity possessing the
        exact visual attributes (e.g., 'wearing glasses', 'in a blue suit') claimed
        in the option, allowing the entity to be identified or excluded.
      score_half: The evidence describes the target entity but the specific visual
        attributes are vague, implied, or described differently (e.g., 'wearing a
        uniform' without specifying color or accessories), making identification ambiguous.
      score_0: The evidence describes the target entity with generic attributes (e.g.,
        'wearing a coat') or omits the specific distinguishing features required to
        verify the option's claim about the entity's appearance.
      weight: 1
      failure_repair_action: dense_sample
    - name: operational_mode_explicitness
      description: Whether the evidence explicitly states the specific mode of operation
        (e.g., traveling, fixed, seasonal, mobile, stationary) asserted in the option,
        rather than merely showing the entity performing its function, describing
        its history, or showing a generic instance of the activity.
      score_1: The evidence explicitly identifies the specific operational mode (e.g.,
        'traveling circus', 'sets up in parking lots', 'moves from town to town')
        required to verify or exclude the option's claim about how the entity operates.
      score_half: The evidence implies a mode of operation through context (e.g.,
        showing a tent in a lot) but does not explicitly state the mode as a defining
        characteristic or link the temporary nature to the entity's identity.
      score_0: The evidence shows the entity performing its function, describes its
        history, or shows a generic scene without explicitly stating the specific
        operational mode (traveling vs. fixed vs. seasonal) required to resolve the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_prop_presence
      description: Whether the evidence explicitly grounds the presence or absence
        of specific physical objects, tools, or props used by the target entities,
        rather than merely describing the entities, their actions, or the setting
        without reference to such objects.
      score_1: The evidence explicitly shows or states the specific prop/object being
        used (or explicitly confirms its absence) by the target entities, allowing
        the option's claim about props to be verified or excluded.
      score_half: The evidence implies the use of an object or shows a generic setting
        where props might exist, but does not explicitly ground a specific prop to
        the target entities' actions.
      score_0: The evidence describes the entities, their actions, or the setting
        but provides no explicit information about the presence or absence of specific
        props/objects used by the entities, making it impossible to verify or exclude
        claims about prop usage.
      weight: 3.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.7
  Information Synopsis:
    rubric_criteria:
    - name: narrative_scope_completeness
      description: Whether evidence spans the full temporal or logical arc of the
        video's narrative (including introduction/setup, main events, and resolution/conclusion)
        required to synthesize a holistic title or summary.
      score_1: Evidence includes the beginning (context/setup), middle (main events),
        and end (resolution/outcome) of the narrative, allowing for a comprehensive
        synopsis.
      score_half: Evidence covers the main events but lacks either the introductory
        context or the concluding resolution.
      score_0: Evidence is restricted to a single segment or phase (e.g., only the
        conflict) and lacks the broader narrative arc needed to distinguish the best
        title.
      weight: 2
      failure_repair_action: refine_query
    - name: contrast_axis_explicitness
      description: Whether evidence explicitly identifies the distinct parties or
        viewpoints involved in a contrast and the specific axis (e.g., stability vs.
        returns, innovation vs. regulation) on which they disagree, rather than merely
        presenting isolated facts from each side.
      score_1: Evidence clearly names or describes the opposing sides and explicitly
        states the specific point of contention or difference between them.
      score_half: Evidence presents arguments from different sides but fails to explicitly
        link them as a direct contrast or define the specific axis of disagreement.
      score_0: Evidence presents isolated facts or quotes without identifying the
        opposing parties or the nature of their disagreement, making it impossible
        to synthesize a 'core difference'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribution_explicitness
      description: Whether evidence explicitly links the specific agent, researcher,
        or source named in the query to the specific claim, finding, or viewpoint
        being evaluated, rather than merely discussing the topic in general.
      score_1: The evidence explicitly states that the named agent/researcher made
        the specific claim or holds the specific view (e.g., 'X says Y' or 'X notices
        Y').
      score_half: The evidence mentions the agent and the topic separately but does
        not explicitly connect them, or the connection is implied but not stated.
      score_0: The evidence discusses the topic or claim but fails to mention the
        specific agent/researcher, or mentions the agent without linking them to the
        specific claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: scenario_completeness
      description: Whether evidence captures the full logical or narrative arc of
        the specific scenario (including the setup/context, the specific action taken,
        and the resulting outcome or conclusion) required to verify or exclude a detailed
        option, rather than presenting only a fragment of the event.
      score_1: Evidence includes the complete sequence of the specific scenario (context,
        action, and outcome) allowing the detailed claim to be fully verified or excluded.
      score_half: Evidence covers the action or context but misses the outcome or
        a critical detail needed to confirm the specific claim.
      score_0: Evidence is a fragment of the scenario (e.g., only the setup, only
        a mention of an entity, or only a generic statement) lacking the necessary
        components to verify the specific details of the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_thematic_declaration
      description: Whether evidence contains an explicit on-screen text label, title
        card, or spoken statement that directly declares the video's overarching theme,
        topic, or synopsis, rather than requiring the model to infer the theme solely
        from visual actions or fragmented dialogue.
      score_1: Evidence includes a clear textual or verbal statement explicitly defining
        the video's topic or title (e.g., 'Top 7 Fighters', 'How to...'), allowing
        direct verification of the synopsis option.
      score_half: Evidence contains strong thematic hints or repeated keywords but
        lacks a definitive explicit statement of the video's overall topic or title.
      score_0: Evidence consists only of visual descriptions of events or fragmented
        dialogue without any explicit text or speech stating the video's theme, title,
        or synopsis.
      weight: 5
      failure_repair_action: refine_query
    - name: causal_mechanism_explicitness
      description: Whether evidence explicitly states the specific cause, reason,
        or mechanism driving the phenomenon or outcome mentioned in the options, rather
        than merely describing the phenomenon, listing associated entities, or implying
        a connection.
      score_1: Evidence explicitly links a specific driver (e.g., climate change,
        policy, economic factor) to the outcome or state change, allowing the 'reason'
        options to be verified or excluded.
      score_half: Evidence mentions the outcome and potential drivers separately or
        implies a connection, but does not explicitly state the causal link.
      score_0: Evidence describes the outcome or lists associated entities without
        stating any specific cause or reason for the phenomenon.
      weight: 2
      failure_repair_action: refine_query
    - name: multi_topic_enumeration
      description: Whether evidence spans all distinct news items, segments, or narrative
        units presented in the video, rather than covering only a subset of the topics
        discussed.
      score_1: Evidence includes distinct segments or explicit mentions for every
        separate topic or event covered in the video, allowing the model to verify
        the presence of reported items and exclude unreported ones by elimination.
      score_half: Evidence covers the majority of distinct topics but misses at least
        one minor segment or fails to clearly distinguish between two closely related
        items.
      score_0: Evidence is restricted to only one or a few of the distinct topics
        presented in the video, leaving other reported events unverified and making
        it impossible to determine which option was not reported.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thematic_argument_coverage
      description: Whether evidence captures the video's central argument, thesis,
        or thematic tension (e.g., a debate between two values, a cause-effect relationship
        defining the era, or a specific evaluation of success/failure) required to
        synthesize the main focus, rather than merely listing isolated events or facts.
      score_1: Evidence explicitly presents or allows the synthesis of the video's
        core argument or thematic tension (e.g., 'business vs. sport', 'success vs.
        failure'), enabling verification of the main focus option.
      score_half: Evidence contains elements of the theme (e.g., mentions of business
        or sport separately) but fails to explicitly link them into the central argument
        or tension.
      score_0: Evidence consists only of isolated events, facts, or match descriptions
        without any indication of the video's overarching argument, thesis, or thematic
        evaluation.
      weight: 4
      failure_repair_action: refine_query
    - name: thematic_tension_explicitness
      description: Whether evidence explicitly articulates the central conflict, trade-off,
        or dual-axis evaluation (e.g., 'X vs. Y', 'success vs. failure', 'business
        vs. sport') that defines the video's main argument, rather than merely listing
        isolated events, facts, or single-sided descriptions.
      score_1: Evidence explicitly states or clearly implies the opposing forces or
        the specific tension (e.g., 'ambitions exceeded goals', 'balance between...')
        that constitutes the video's core thesis.
      score_half: Evidence mentions elements of the tension (e.g., mentions both business
        and sport) but fails to explicitly link them as a conflict or trade-off defining
        the narrative.
      score_0: Evidence consists only of isolated events, facts, or single-sided descriptions
        without any indication of a central conflict, trade-off, or dual-axis evaluation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_scope_explicitness
      description: Whether evidence explicitly states the quantitative boundaries,
        counts, or set definitions (e.g., 'all', 'first N', 'total', 'subset') required
        to verify or exclude options that differ by scope or quantity, rather than
        merely showing instances without defining the total set.
      score_1: Evidence explicitly defines the scope or quantity (e.g., mentions a
        specific count, a 'first N' milestone, or an 'all' claim) allowing the model
        to verify the correct scope and exclude options with different quantitative
        claims.
      score_half: Evidence implies a large quantity or multiple instances but lacks
        explicit numerical boundaries or set definitions (e.g., 'many goals' without
        a count or specific milestone).
      score_0: Evidence shows only isolated instances or a single event without any
        explicit statement of the total count, range, or set definition, making it
        impossible to distinguish between options differing by quantity or scope.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_arc_synthesis
      description: Whether evidence explicitly links the narrative's starting context
        or origin to its final resolution or outcome, synthesizing a coherent trajectory
        (e.g., a journey, evolution, or life story) rather than merely presenting
        isolated segments from different time periods.
      score_1: Evidence explicitly connects the initial state/origin to the final
        outcome, allowing the model to verify a 'journey' or 'evolution' synopsis
        by seeing the causal or temporal link between start and finish.
      score_half: Evidence contains elements of both the beginning and the end but
        fails to explicitly link them as a continuous narrative arc, presenting them
        as disjointed facts.
      score_0: Evidence consists of isolated fragments or single-phase descriptions
        without any explicit connection between the origin/setup and the resolution/outcome,
        making it impossible to synthesize a holistic 'journey' or 'life story' theme.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_activity_definition
      description: Whether evidence contains an explicit verbal or textual statement
        that directly names or defines the specific activity, sport, or event type
        being depicted, rather than relying solely on visual cues that could apply
        to multiple similar options.
      score_1: Evidence includes a clear statement (spoken or text) explicitly naming
        the specific activity or event type (e.g., 'street hockey game', 'football
        match'), allowing direct verification of the correct option and exclusion
        of visually similar distractors.
      score_half: Evidence contains strong visual cues or partial mentions of the
        activity but lacks a definitive explicit statement naming the specific type,
        leaving ambiguity between similar options.
      score_0: Evidence consists only of visual descriptions of actions or generic
        context without any explicit statement defining the specific activity or event
        type, making it impossible to distinguish between visually similar options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: internal_state_explicitness
      description: Whether evidence explicitly articulates the specific internal emotional,
        psychological, or mental states (e.g., anxiety, stress, confidence, joy, fear)
        of the target entity at different points in the narrative, rather than relying
        solely on external visual cues, actions, or generic descriptions of change.
      score_1: Evidence explicitly states or quotes the specific internal states (e.g.,
        'feeling burdened,' 'afraid of the present,' 'no longer stressing') that define
        the transformation, allowing the specific emotional arc to be verified.
      score_half: Evidence implies an internal change through context or generic statements
        (e.g., 'feeling whole,' 'happy') but lacks the specific terminology or explicit
        articulation of the distinct emotional states required to distinguish between
        similar options.
      score_0: Evidence describes only external changes (appearance, location, actions)
        or generic positive/negative outcomes without explicitly naming the specific
        internal emotional or psychological states involved in the transformation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: change_status_explicitness
      description: Whether evidence explicitly confirms the specific status (changed
        vs. unchanged) for each option, rather than merely mentioning the topic or
        implying a change without verification.
      score_1: Evidence explicitly states or demonstrates that the specific aspects
        in the distractor options were changed and explicitly confirms that the aspect
        in the correct option remained unchanged (or vice versa for exclusion).
      score_half: Evidence implies changes for some options or mentions the topics
        but lacks explicit confirmation of the final status (changed/unchanged) for
        at least one critical option.
      score_0: Evidence mentions the topics or shows related activities but fails
        to explicitly confirm whether the specific aspects were changed or remained
        the same, making it impossible to distinguish the 'unchanged' option from
        the 'changed' ones.
      weight: 3.0
      failure_repair_action: refine_query
    - name: specific_action_grounding
      description: Whether evidence explicitly depicts or states the specific action,
        event, or activity asserted in the option, rather than showing only related
        but different activities or generic context.
      score_1: Evidence explicitly shows or states the exact action/event described
        in the option (e.g., browsing a specific category of items, performing a specific
        gesture), allowing direct verification.
      score_half: Evidence shows a related activity or the setting for the action
        but lacks the specific action itself (e.g., shows the store but not the browsing,
        or shows browsing a different category).
      score_0: Evidence shows only unrelated activities, generic context, or different
        events, with no mention or depiction of the specific action claimed in the
        option.
      weight: 3
      failure_repair_action: refine_query
    - name: explicit_topic_articulation
      description: Whether evidence contains an explicit verbal or textual statement
        that directly names or defines the specific abstract topic, advice, or concept
        being discussed, rather than relying on visual actions, related but different
        topics, or implicit context.
      score_1: Evidence includes a clear statement (spoken or text) explicitly naming
        the specific topic or advice (e.g., 'procrastination,' 'time blocking,' 'daunting
        tasks'), allowing direct verification of the discussion's content.
      score_half: Evidence contains strong contextual hints or mentions related concepts
        (e.g., 'cleaning,' 'tidying') but lacks a definitive explicit statement naming
        the specific abstract topic or advice being discussed.
      score_0: Evidence consists only of visual descriptions of actions, generic context,
        or discussions of different but related topics without any explicit statement
        defining the specific abstract topic or advice claimed in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thematic_dominance
      description: Whether evidence presents a consistent, recurring pattern of the
        specific activity or theme across multiple distinct segments, sufficient to
        establish it as the video's main focus, rather than isolated mentions, single
        instances, or mixed topics.
      score_1: Evidence shows the specific activity or theme repeatedly across multiple
        distinct segments or scenes, establishing it as the dominant and consistent
        subject of the video.
      score_half: Evidence shows the activity in one or two segments but is mixed
        with unrelated topics or lacks sufficient repetition to confirm it as the
        main focus.
      score_0: Evidence contains only isolated mentions, a single instance, or is
        dominated by unrelated topics, making it impossible to verify the option as
        the video's main focus.
      weight: 1
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  Action Recognition:
    rubric_criteria:
    - name: evidence_state_interaction
      description: Whether evidence explicitly confirms or denies the specific physical
        state, interaction outcome, or transformation described in the options (e.g.,
        contact vs. no contact, specific body part transformation, final state).
      score_1: Evidence explicitly states the specific physical state, interaction,
        or transformation outcome required to verify or exclude the option.
      score_half: Evidence implies the state or interaction but does not explicitly
        confirm or deny the specific outcome.
      score_0: Evidence describes the entities or scene but lacks any information
        about the specific physical state, interaction, or transformation outcome
        in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_functional_role
      description: Whether evidence explicitly confirms or denies the specific functional
        role, mechanism, or purpose attributed to an entity or structure in the options
        (e.g., acting as a conduit, serving as a barrier, functioning as a catalyst).
      score_1: Evidence explicitly states or demonstrates the specific functional
        role or mechanism required to verify or exclude the option.
      score_half: Evidence implies a function or describes related properties but
        does not explicitly confirm or deny the specific role claimed.
      score_0: Evidence describes the entity's physical state or formation but lacks
        any information about the specific functional role or mechanism in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_system_status
      description: Whether evidence explicitly confirms or denies the specific operational
        status, control state, or functional integrity of the system/device described
        in the options (e.g., being controlled by an external agent, having broken
        software/hardware, being infected).
      score_1: Evidence explicitly demonstrates the specific system status or control
        state (e.g., denial of user commands, unauthorized process control, fatal
        system errors) required to verify or exclude the option.
      score_half: Evidence implies a system issue or shows related symptoms (e.g.,
        generic error messages, strange animations) but does not explicitly confirm
        the specific status or control mechanism claimed.
      score_0: Evidence shows the device or screen activity but lacks any information
        confirming or denying the specific operational status, control state, or functional
        integrity in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_temporal_grounding
      description: Whether evidence explicitly locates the target entity's specific
        action or state within the queried time window (e.g., 'at the beginning',
        'after the explosion', 'during the fight') rather than showing the entity
        or action at an unrelated time.
      score_1: Evidence explicitly shows the target entity performing the specific
        action or being in the specific state within the exact time window requested
        by the question.
      score_half: Evidence shows the target entity or the action, but the temporal
        location is ambiguous or only partially overlaps with the queried window.
      score_0: Evidence shows the target entity or the action, but at a time clearly
        outside the queried window, or the temporal location is entirely absent.
      weight: 5
      failure_repair_action: time_sorted
    - name: evidence_action_classification
      description: Whether evidence explicitly depicts the specific high-level activity,
        event type, or behavioral category described in the options (e.g., hosting
        an event, fighting, destroying, performing a ritual) rather than showing generic
        motion, unrelated scenes, or ambiguous interactions.
      score_1: Evidence explicitly shows the target entity performing the specific
        high-level activity or event type required to verify or exclude the option.
      score_half: Evidence shows the entity in motion or interacting, but the specific
        high-level activity or event type is ambiguous or only partially implied.
      score_0: Evidence shows the entity or scene but lacks any visual confirmation
        of the specific high-level activity or event type described in the options
        (e.g., shows fighting when the option is 'hosting an event', or shows generic
        chaos when a specific action is required).
      weight: 1
      failure_repair_action: refine_query
    - name: evidence_quantitative_grounding
      description: Whether evidence explicitly provides the specific count, frequency,
        or magnitude required to verify or exclude options involving superlatives
        (e.g., 'mostly', 'most', 'least') or comparative quantities, rather than merely
        describing the existence or general prevalence of the entity.
      score_1: Evidence explicitly states the specific number, count, or frequency
        (e.g., 'five bans', 'three times') that directly verifies the superlative
        or comparative claim in the option.
      score_half: Evidence implies a high frequency or dominance (e.g., 'many', 'often',
        'hard to find') but lacks the explicit count needed to definitively verify
        the superlative.
      score_0: Evidence describes the entity or its general presence but provides
        no quantitative information (count, frequency, or magnitude) to support or
        refute the superlative/comparative claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_game_mechanics
      description: Whether evidence explicitly confirms or denies the specific game
        rules, mechanics, or variant (e.g., blindfolded, timed, specific scoring condition)
        described in the options, rather than showing a generic version of the activity.
      score_1: Evidence explicitly states or demonstrates the specific game rules,
        mechanics, or variant (e.g., 'blindfolded', '10 shots', '3-point line') required
        to verify or exclude the option.
      score_half: Evidence shows the general activity (e.g., shooting) but the specific
        rules or variant are ambiguous, implied, or only partially described.
      score_0: Evidence shows the general activity or a different variant of the game,
        lacking any explicit confirmation of the specific rules or mechanics claimed
        in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_variant_conjunction
      description: Whether evidence explicitly confirms the specific combination of
        rules, constraints, or quantitative parameters that uniquely defines the game
        variant described in the option (e.g., 'blindfolded' AND '3-point' AND '10
        shots'), rather than showing only individual mechanics or a generic version
        of the activity.
      score_1: Evidence explicitly states or demonstrates the full set of specific
        rules, constraints, or parameters (e.g., the exact variant name and specific
        count) required to uniquely identify the game variant in the option.
      score_half: Evidence shows some of the specific mechanics or parameters (e.g.,
        'blindfolded' but not the shot count, or '3-point' but not the blindfold)
        but lacks the complete combination needed to uniquely identify the variant.
      score_0: Evidence shows generic activity or only partial/incorrect mechanics
        that do not form the specific combination required to verify or exclude the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_target_variant_grounding
      description: Whether evidence explicitly identifies the specific game variant
        (name, unique rule set, or combination of constraints) for the target entity
        or segment required to perform the comparison, rather than showing variants
        for other entities or generic activity.
      score_1: Evidence explicitly states or demonstrates the specific variant name
        or unique rule set for the target entity/segment (e.g., 'Consecutive 3 Point
        Challenge' for the specific matchup) required to verify or exclude the option.
      score_half: Evidence shows the target entity playing a game but the specific
        variant or unique rules are ambiguous, implied, or only partially described.
      score_0: Evidence shows generic activity, or shows specific variants for *other*
        entities/segments, but lacks the specific variant identification for the *target*
        entity/segment required to answer the question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_mechanism_specificity
      description: Whether evidence explicitly depicts the specific physical mechanism,
        tool, or mode of interaction (e.g., thrown by hand, hit with a bat, slid on
        a rope) required to verify or exclude options that differ by method rather
        than just outcome.
      score_1: Evidence explicitly shows the target entity undergoing the specific
        physical mechanism or tool interaction described in the option (e.g., clearly
        showing a hand releasing the object vs. a bat striking it).
      score_half: Evidence shows the object moving or the general activity but the
        specific mechanism or tool used is ambiguous, obscured, or only implied.
      score_0: Evidence describes the general task or outcome but lacks any visual
        confirmation of the specific physical mechanism or tool interaction required
        to distinguish between the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_absence_verification
      description: Whether evidence explicitly confirms the absence of the specific
        entity, action, or state described in the option (e.g., by showing the full
        scope of the event and noting the target is missing, or explicitly stating
        it does not occur), rather than merely failing to mention it or showing other
        unrelated items.
      score_1: Evidence explicitly confirms the target entity/action/state is absent
        (e.g., by covering the full relevant scope and showing it is not present,
        or by a direct denial), allowing the 'absent' option to be verified.
      score_half: Evidence shows other items but does not explicitly confirm the absence
        of the target; the absence is only implied by omission or partial coverage.
      score_0: Evidence lists other present items or describes the scene but provides
        no confirmation that the target entity/action/state is absent, making it impossible
        to verify the 'absent' claim.
      weight: 1
      failure_repair_action: refine_query
    - name: evidence_temporal_sequencing
      description: Whether evidence explicitly establishes the chronological order
        or sequence between the trigger event (e.g., 'finishing the meeting') and
        the target action described in the options, rather than showing the events
        in isolation or out of order.
      score_1: Evidence explicitly shows or states that the target action occurs immediately
        after (or in a specific sequence relative to) the trigger event, allowing
        the temporal relationship to be verified.
      score_half: Evidence shows both the trigger event and the target action, but
        the temporal relationship between them is ambiguous, implied, or not explicitly
        linked.
      score_0: Evidence shows the trigger event and/or the target action in isolation,
        or shows them in a disjointed manner that fails to establish the required
        sequence (e.g., showing the meeting and a later unrelated event without linking
        them).
      weight: 3.0
      failure_repair_action: time_sorted
    - name: evidence_pairwise_interaction
      description: Whether evidence explicitly depicts the specific interaction or
        joint event between the two (or more) entities described in the option (e.g.,
        Entity A attacking Entity B, Entity A and Entity B interacting), rather than
        showing the entities separately or interacting with different targets.
      score_1: Evidence explicitly shows the specific entities mentioned in the option
        interacting with each other (e.g., the predator catching the specific prey
        type, or the two specific actors engaging in the described activity).
      score_half: Evidence shows the entities mentioned in the option, but they are
        shown in separate scenes, interacting with different targets, or the interaction
        between them is ambiguous or implied but not visually confirmed.
      score_0: Evidence shows the entities mentioned in the option only in isolation,
        or shows one entity interacting with a different target, failing to establish
        the specific pairwise interaction claimed.
      weight: 5
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  Temporal Reasoning:
    rubric_criteria:
    - name: temporal_ordering
      description: Whether evidence explicitly grounds the relative temporal positions
        of the target items, allowing the specific sequence to be verified or excluded.
      score_1: The evidence provides explicit temporal markers (timestamps, narrative
        flow, or sequential cues) that establish the exact order of the target items.
      score_half: The evidence mentions the items and some temporal cues, but the
        relative order of at least two items remains ambiguous or ungrounded.
      score_0: The evidence mentions the target items but fails to establish their
        relative temporal order, or the items are presented in a non-sequential manner
        that prevents verifying the sequence.
      weight: 5
      failure_repair_action: refine_query
    - name: interval_completeness
      description: Whether evidence covers the entire temporal interval between the
        specified start and end anchors, allowing verification of all items introduced
        within that window.
      score_1: The evidence provides a continuous or sufficiently dense sequence of
        events that spans from the start anchor to the end anchor, explicitly listing
        or describing all intermediate items.
      score_half: The evidence covers parts of the interval but has significant gaps,
        leaving the presence or absence of some intermediate items ambiguous.
      score_0: The evidence only contains the start and/or end anchors or isolated
        segments outside the interval, failing to cover the content between them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: intermediate_item_enumeration
      description: Whether evidence explicitly lists or describes the specific discrete
        items, steps, or propositions introduced within the temporal interval between
        the specified start and end anchors.
      score_1: The evidence explicitly identifies and describes every intermediate
        item or proposition that occurs between the start and end anchors, allowing
        for the verification or exclusion of options based on their presence or absence
        in that sequence.
      score_half: The evidence covers the interval but only partially lists the intermediate
        items, leaving the status of some options ambiguous.
      score_0: The evidence identifies the start and/or end anchors but fails to list
        or describe the specific intermediate items, making it impossible to determine
        which options were introduced in the gap.
      weight: 5
      failure_repair_action: refine_query
    - name: temporal_anchor_explicitness
      description: Whether evidence explicitly states the specific calendar date,
        clock time, or time-of-day label (e.g., 'morning', 'noon', 'night', '7:32')
        required to verify or exclude the options, rather than only providing relative
        sequences or general timeframes.
      score_1: The evidence explicitly asserts a specific clock time, date, or unambiguous
        time-of-day label that directly matches or contradicts the options, allowing
        direct verification or exclusion.
      score_half: The evidence provides a specific time or date, but it is ambiguous,
        refers to a different event, or does not clearly map to the specific time-of-day
        options.
      score_0: The evidence mentions time-related concepts (e.g., 'later', 'after
        work', 'throughout the night') or lists times for other events, but fails
        to explicitly state the specific clock time or time-of-day label required
        to resolve the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_exclusivity_via_prior_evidence
      description: Whether evidence explicitly grounds the absence of prior instances
        or the existence of earlier events to verify or exclude superlative temporal
        claims (e.g., 'first', 'earliest', 'initial').
      score_1: The evidence explicitly describes earlier events, attempts, or the
        lack of prior success, allowing the 'first' status of the target event to
        be verified or the option to be excluded.
      score_half: The evidence mentions the target event's time but provides only
        vague or incomplete information about the prior period, leaving the 'first'
        status ambiguous.
      score_0: The evidence states the time of the target event but provides no information
        about earlier events or the prior timeline, making it impossible to verify
        if it was the 'first' or to exclude earlier options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequential_continuity
      description: Whether evidence forms a continuous, unbroken narrative or visual
        sequence that explicitly connects the target items in their relative order,
        rather than presenting them as isolated, non-sequential, or out-of-order snapshots.
      score_1: The evidence provides a continuous flow of events where the transition
        from one target item to the next is explicitly shown or described, establishing
        a definitive relative order.
      score_half: The evidence shows the target items in sequence but contains significant
        gaps, cuts, or interruptions that make the exact transition or relative order
        between some items ambiguous.
      score_0: The evidence presents the target items in isolated segments, out of
        order, or as static states without a continuous narrative linking their installation
        or occurrence, preventing the verification of the specific sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: metric_interval_attribution
      description: Whether evidence explicitly attributes a specific metric, superlative,
        or state change to a discrete temporal interval (e.g., a specific lap, segment,
        or time window) required to verify or exclude the options.
      score_1: The evidence explicitly links the target metric or superlative (e.g.,
        'fastest', 'slowest', 'record') to a specific, named interval (e.g., 'lap
        2', 'segment B') that matches one of the options.
      score_half: The evidence mentions the metric or superlative and mentions intervals,
        but the link between the specific metric and the specific interval is ambiguous
        or indirect.
      score_0: The evidence mentions the metric or superlative but fails to identify
        which specific interval it belongs to, or only provides metrics for intervals
        that are explicitly excluded (e.g., stating a time is 'slower' than the record
        without naming the record's interval).
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_sequence_completeness
      description: Whether evidence provides a unified, ordered narrative that explicitly
        enumerates all target items or events in their relative sequence, rather than
        presenting them as isolated, non-sequential, or partial instances.
      score_1: The evidence presents a continuous or logically connected account that
        lists every target item in the correct relative order, allowing the full sequence
        to be verified or excluded.
      score_half: The evidence lists some target items in order but omits others,
        or presents the items in a fragmented manner where the relative order of some
        items is ambiguous.
      score_0: The evidence presents target items only as isolated segments or mentions
        them without establishing a unified sequence that includes all required items,
        making it impossible to verify the full order.
      weight: 5
      failure_repair_action: refine_query
    - name: procedural_continuity
      description: Whether evidence captures the active construction, execution, or
        step-by-step process of the target items, rather than only presenting them
        as static, completed results or isolated title cards.
      score_1: The evidence explicitly describes or shows the active steps (e.g.,
        painting, gluing, assembling) involved in creating the target items, establishing
        a definitive temporal sequence through the process itself.
      score_half: The evidence shows some steps for some items but presents others
        only as completed results or title cards, leaving the relative order of the
        static items ambiguous.
      score_0: The evidence presents the target items only as finished products, static
        displays, or title cards without showing the active creation process, making
        it impossible to verify the order of introduction.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_day_explicitness
      description: Whether evidence explicitly labels the target event with a specific
        ordinal day marker (e.g., 'Day 1', 'Day 3', 'the third day') required to verify
        or exclude options based on the day of occurrence.
      score_1: The evidence explicitly states or displays an ordinal day label (e.g.,
        'Day 3') that directly matches the queried day for the target event, allowing
        direct verification or exclusion.
      score_half: The evidence provides relative temporal cues (e.g., 'the next day',
        'after the first day') that imply the ordinal day but do not explicitly state
        the specific number required to resolve the options.
      score_0: The evidence describes the event but lacks any explicit ordinal day
        label or clear relative sequence that definitively maps the event to the specific
        day queried, making it impossible to verify if the event occurred on that
        specific day.
      weight: 3.0
      failure_repair_action: refine_query
    - name: initial_instance_grounding
      description: Whether evidence explicitly captures the first occurrence of the
        target event or state change required to establish the start of a recurring
        pattern, verify a 'first' claim, or determine the initial interval of a frequency.
      score_1: The evidence explicitly shows or states the very first instance of
        the target event, allowing the start of the pattern or the 'first' status
        to be verified.
      score_half: The evidence shows multiple instances of the event but the first
        one is missing or ambiguous, leaving the start of the pattern or the initial
        interval uncertain.
      score_0: The evidence only shows later instances of the event or generic occurrences
        without establishing the first instance, making it impossible to determine
        the pattern's start or verify 'first' claims.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  Action Reasoning:
    rubric_criteria:
    - name: comprehensive_attribute_resolution
      description: Whether evidence explicitly resolves the specific visual attributes
        (e.g., held objects, actions, positions) for all entities involved in the
        comparison or set described in the options.
      score_1: Evidence explicitly states the specific attribute for every entity
        in the set, allowing verification or exclusion of options regarding any of
        them.
      score_half: Evidence resolves attributes for some but not all entities in the
        set, or attributes are ambiguous for some.
      score_0: Evidence fails to resolve specific attributes for one or more key entities
        in the set, or misidentifies them, preventing verification/exclusion of related
        options.
      weight: 2
      failure_repair_action: dense_sample
    - name: speaker_attribution_explicitness
      description: Whether evidence explicitly captures the target speaker's own words
        asserting the proposition, rather than merely mentioning the speaker or relying
        on third-party narration.
      score_1: The evidence contains a direct quote or explicit statement from the
        target speaker that asserts the specific proposition in the option.
      score_half: The evidence mentions the target speaker or their general stance
        but lacks their direct words asserting the specific proposition.
      score_0: The evidence does not contain the target speaker's direct words; the
        proposition is inferred from narration, context, or other sources.
      weight: 5
      failure_repair_action: refine_query
    - name: explicit_comparative_grounding
      description: Whether evidence explicitly captures the speaker's direct assertion
        of the specific comparison, contrast, or analogy between the entities or phenomena
        described in the options, rather than merely describing the entities separately
        or implying a link.
      score_1: The evidence contains a direct statement from the speaker that explicitly
        compares or contrasts the specific entities/phenomena in the way the option
        claims (e.g., 'A is more understood than B', 'A is similar to B in X way').
      score_half: The evidence describes the entities separately or mentions a general
        connection, but lacks the speaker's explicit comparative statement linking
        them as the reason for the mention.
      score_0: The evidence describes the entities in isolation or provides unrelated
        context, with no explicit comparative or analogical statement linking them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_attribute_explicitness
      description: Whether evidence explicitly identifies the specific attribute or
        dimension (e.g., degree of understanding, physical similarity, magnitude,
        complexity) along which the entities are being compared, rather than merely
        stating that a comparison or connection exists.
      score_1: The evidence explicitly states the specific attribute being compared
        (e.g., 'know more about X than Y', 'X is more complex than Y'), allowing the
        reason for the comparison to be verified.
      score_half: The evidence mentions a comparison or connection between entities
        but the specific attribute or dimension of the comparison is vague, implied,
        or not explicitly stated.
      score_0: The evidence describes the entities or mentions a general link/connection
        without identifying the specific attribute or dimension along which they are
        compared, preventing verification of the reason for the mention.
      weight: 3.0
      failure_repair_action: refine_query
    - name: misconception_attribution_explicitness
      description: Whether evidence explicitly states the specific proposition that
        the target character misunderstands, believes incorrectly, or lacks knowledge
        of, rather than merely stating the correct fact or describing the event generally.
      score_1: The evidence contains a direct statement (e.g., 'X doesn't know that...',
        'X misunderstood that...') explicitly linking the specific proposition to
        the target character's error or ignorance.
      score_half: The evidence states the correct fact and mentions the character,
        but does not explicitly state that the character holds the opposing view or
        lacks this specific knowledge.
      score_0: The evidence states the correct fact or describes the event but contains
        no reference to the target character's specific misunderstanding, belief,
        or lack of knowledge.
      weight: 3.0
      failure_repair_action: refine_query
    - name: capture_method_explicitness
      description: Whether evidence explicitly states the specific device, tool, or
        technique used to generate or record the visual content, rather than merely
        discussing the content's subject matter or features.
      score_1: The evidence explicitly identifies the specific recording apparatus
        (e.g., 'recorded with X', 'captured via Y') or the specific method of generation
        used for the clips in question.
      score_half: The evidence mentions the devices involved in the content or implies
        a recording method but does not explicitly state which device was used to
        capture the specific footage.
      score_0: The evidence discusses the subject matter, features, or comparison
        of devices without ever identifying the specific tool or method used to record
        the visual content.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_motive_grounding
      description: Whether evidence explicitly states the specific reason, motive,
        or intent behind the target character's action, rather than merely describing
        the action, the setting, or the outcome.
      score_1: The evidence contains a direct statement (dialogue, narration, or explicit
        visual cue) that asserts the specific reason or motive for the action in question.
      score_half: The evidence describes the action and context but the specific reason
        or motive is only implied or requires inference from general behavior.
      score_0: The evidence describes the action, setting, or outcome but contains
        no explicit statement of the character's reason, motive, or intent for performing
        that action.
      weight: 4
      failure_repair_action: refine_query
    - name: visual_action_verification
      description: Whether evidence explicitly captures the specific physical action,
        gesture, or visual event that constitutes the core claim of the option, rather
        than relying solely on dialogue, narration, or context that implies the action.
      score_1: The evidence explicitly shows the specific action or visual event (e.g.,
        a kiss, a handshake, a specific movement) that directly verifies or excludes
        the option's claim.
      score_half: The evidence shows related actions or context but the specific action
        claimed in the option is not explicitly visible or is ambiguous.
      score_0: The evidence relies entirely on dialogue, narration, or general context
        to imply the action, without explicitly showing the specific physical event.
      weight: 2
      failure_repair_action: dense_sample
    - name: explicit_rule_definition_by_target
      description: Whether evidence contains a direct statement from a target entity
        (or authoritative source) that explicitly defines the specific rule, scope,
        or exception regarding the behavior or attribute in question, rather than
        merely showing instances or describing general tendencies.
      score_1: The evidence includes a direct quote or explicit statement from the
        target entity that defines the specific rule or scope (e.g., 'X is our primary
        mode, but we use Y for Z'), allowing verification of nuanced options like
        'only' vs. 'mixed' or 'primary' vs. 'exceptional'.
      score_half: The evidence mentions the target entity's general stance or shows
        instances of the behavior, but lacks an explicit definition of the rule, scope,
        or specific exceptions.
      score_0: The evidence relies solely on visual instances, third-party narration,
        or general descriptions without a direct statement from the target entity
        defining the specific rule or scope of the behavior.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_diagnosis_or_event_grounding
      description: Whether evidence explicitly states a specific medical diagnosis,
        confirmed event, or authoritative finding that serves as the direct cause
        for the action, rather than merely describing general risks, statistics, or
        implied consequences.
      score_1: The evidence explicitly identifies a specific diagnosis (e.g., 'diagnosed
        with X'), a confirmed event (e.g., 'the test showed Y'), or an authoritative
        finding that directly triggers the character's decision.
      score_half: The evidence mentions health risks, statistics, or general warnings
        but lacks a specific confirmed diagnosis or event that definitively triggers
        the action.
      score_0: The evidence only describes general risks, hypothetical outcomes, or
        statistics without any specific diagnosis, confirmed event, or authoritative
        finding serving as the direct cause.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_spatial_alignment
      description: Whether evidence explicitly grounds the specific time window and
        spatial location (e.g., lane, room, scene) queried in the question, rather
        than providing general, meta-level, or temporally unbound context.
      score_1: Evidence explicitly identifies the specific moment (e.g., via clock,
        timestamp, or event sequence) and location requested, allowing the state at
        that exact time/place to be verified or excluded.
      score_half: Evidence mentions the general topic or location but lacks specific
        temporal grounding, or provides temporal grounding for a different location.
      score_0: Evidence is temporally unbound (e.g., general series commentary, future
        predictions) or spatially mismatched, failing to address the specific state
        at the queried time and place.
      weight: 3
      failure_repair_action: refine_query
    - name: outcome_based_comparative_grounding
      description: Whether evidence explicitly captures the specific results, scores,
        success/failure states, or performance metrics for each entity in the set,
        enabling a comparison of their relative impact or effectiveness.
      score_1: Evidence explicitly states the outcome (e.g., score, pass/fail, difficulty
        rating, number of successes) for every entity involved in the comparison,
        allowing the relative impact to be verified or excluded.
      score_half: Evidence states outcomes for some but not all entities, or describes
        the outcome vaguely (e.g., 'it was hard' without a metric), preventing a definitive
        comparison.
      score_0: Evidence describes the features, intent, or setup of the entities but
        fails to capture the actual results or performance metrics of the challenge,
        making it impossible to determine relative impact.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_continuity_verification
      description: Whether evidence explicitly captures the target action or state
        occurring in the specific subsequent time window required to verify a claim
        of continuation, repetition, or sequence, rather than merely showing the initial
        occurrence or the intent to repeat.
      score_1: Evidence explicitly shows the action/state happening in the later time
        window (e.g., Day 2, the second attempt), confirming the continuity or repetition
        claimed in the option.
      score_half: Evidence shows the action in the initial window and mentions the
        intent or plan for the later window, but does not show the actual occurrence
        in the later window.
      score_0: Evidence only shows the action in the initial window or discusses the
        plan without any visual or explicit confirmation of the action occurring in
        the subsequent required time window.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_spatial_deviation_grounding
      description: Whether evidence explicitly states the specific direction, side,
        or spatial offset of the target action relative to the expected path, boundary,
        or center, rather than merely showing the action or describing general technique.
      score_1: The evidence explicitly identifies the specific spatial deviation (e.g.,
        'veers left', 'steps on the sideline', 'runs on the edge') that verifies or
        excludes the option's claim about the action's trajectory or position.
      score_half: The evidence shows the action occurring near a boundary or implies
        a deviation but lacks an explicit statement of the specific direction or offset.
      score_0: The evidence shows the action or describes general technique/scores
        but contains no explicit statement regarding the specific direction, side,
        or spatial offset of the action relative to the path or boundary.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_technical_flaw_attribution
      description: Whether evidence explicitly states a specific technical flaw, error,
        or deviation in the action that causes the observed outcome, rather than merely
        describing the action and outcome separately or implying a problem.
      score_1: The evidence contains a direct statement (commentary, narration, or
        text) explicitly linking a specific technical flaw (e.g., 'short of vertical',
        'missed turn') to the resulting outcome (e.g., 'hence the splash', 'low score'),
        allowing the specific problem to be verified.
      score_half: The evidence describes the action and the outcome (e.g., a splash
        or low score) but the specific technical cause is only implied or not explicitly
        stated.
      score_0: The evidence describes the action and/or outcome but contains no explicit
        statement identifying a specific technical flaw or error as the cause, making
        it impossible to verify the specific 'problem' claimed in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_outcome_termination_grounding
      description: Whether evidence explicitly captures the specific event, action,
        or state change that constitutes the final resolution, termination, or definitive
        outcome of the scenario described in the option, rather than merely showing
        the process, intermediate states, or context leading up to it.
      score_1: Evidence explicitly shows or states the specific moment of resolution
        or termination (e.g., a player forfeiting, a match ending, a specific final
        result being declared) that verifies or excludes the option's claim about
        the outcome.
      score_half: Evidence shows the process or context leading to the outcome (e.g.,
        a player struggling, a score update) but lacks the explicit moment of resolution
        or the definitive statement/action confirming the final state.
      score_0: Evidence only depicts intermediate actions, gameplay, or general context
        without capturing the specific event or state change that determines the final
        outcome or termination of the scenario.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_final_state_and_transition_grounding
      description: Whether evidence explicitly identifies the specific outcome state
        (e.g., final score, tie, win) at the queried temporal boundary and the immediate
        subsequent action or rule application that follows, rather than providing
        intermediate states or general context.
      score_1: Evidence explicitly states the final state (e.g., 'tied 11-11 after
        3rd period') and the immediate subsequent event or rule application (e.g.,
        'shootout begins', 'sudden death') that directly answers the causal question.
      score_half: Evidence states the final state but lacks the subsequent event,
        or shows the subsequent event without explicitly confirming the specific final
        state that triggered it.
      score_0: Evidence only provides intermediate states, scores from earlier periods,
        or general context without confirming the specific final state at the boundary
        or the immediate transition that follows.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_stance_evolution_grounding
      description: Whether evidence explicitly captures the specific sequence of a
        target entity's changing stance, decision, or behavior over time (e.g., initial
        agreement followed by later refusal, or promise followed by abandonment),
        rather than merely showing isolated interactions or a static state.
      score_1: Evidence explicitly shows or states the specific progression of the
        entity's stance (e.g., 'X agreed initially but later refused'), allowing verification
        of options describing a change in behavior or a sequence of events.
      score_half: Evidence shows the entity in different states or interactions but
        lacks the explicit link or temporal marker connecting the initial stance to
        the final outcome, making the sequence ambiguous.
      score_0: Evidence only shows isolated interactions or a single static state
        of the entity, failing to capture the evolution of their stance or the specific
        sequence of events required to verify the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_violation_and_concealment_grounding
      description: Whether evidence explicitly identifies a specific rule violation
        or transgression committed by the target entity and the subsequent actions
        taken to conceal or disguise that violation, rather than merely describing
        the physical actions or the general rules.
      score_1: Evidence explicitly states or shows the specific rule broken (e.g.,
        'removed the plug') and the specific actions taken to hide it (e.g., 'disguising
        actions', 'claiming he was just walking'), allowing the purpose of the actions
        to be verified as concealment.
      score_half: Evidence shows the physical actions or mentions a rule violation
        but lacks explicit confirmation of the specific concealment attempt or the
        link between the violation and the subsequent behavior.
      score_0: Evidence describes the physical actions, the general rules, or the
        outcome but contains no explicit statement or visual confirmation of a specific
        rule violation or an attempt to conceal it, preventing verification of a 'concealment'
        purpose.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_causal_attribution
      description: Whether evidence explicitly captures the target speaker's direct
        assertion of the specific reason, cause, or justification for the action,
        ranking, preference, or outcome described in the option, rather than merely
        describing the event, attribute, or context in isolation.
      score_1: The evidence contains a direct statement from the speaker that explicitly
        links the specific attribute or event to the reason for the judgment or action
        (e.g., 'The reason X is best is Y', 'I like X because of Y').
      score_half: The evidence describes the attribute or event and the judgment separately,
        or implies a connection, but lacks the speaker's explicit verbal assertion
        of the causal link.
      score_0: The evidence describes the attribute, event, or context but contains
        no explicit statement from the speaker identifying it as the specific reason
        or cause for the judgment, ranking, or action.
      weight: 4
      failure_repair_action: refine_query
    - name: explicit_final_ranking_list
      description: Whether evidence explicitly presents the definitive final ordered
        list or ranking of the entities involved, rather than merely showing the deliberation
        process, partial comparisons, or intermediate states.
      score_1: Evidence explicitly displays or states the complete final ranking order
        (e.g., a numbered list, a final arrangement) that allows verification of the
        specific rank of any entity in the set.
      score_half: Evidence shows a partial ranking, a draft order, or a discussion
        about the order, but lacks the explicit confirmation of the final, definitive
        list.
      score_0: Evidence only depicts the process of ranking, isolated comparisons,
        or opinions without ever presenting the final, complete ordered list required
        to determine the specific rank of the entities.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_instruction_grounding
      description: Whether evidence explicitly captures the specific command, instruction,
        or task given by an external agent (e.g., friends, narrator, authority) that
        initiates the target character's action, rather than merely showing the action
        or the character's own stated reason.
      score_1: The evidence contains a direct statement or clear visual cue of an
        external agent explicitly instructing the target character to perform the
        specific action (e.g., 'Jump on the table', 'Find the broken ones').
      score_half: The evidence implies an instruction or shows the character preparing
        to act based on a plan, but lacks the explicit command from the external agent.
      score_0: The evidence shows the action or the character's own explanation for
        it, but contains no explicit instruction or command from an external agent
        initiating the action.
      weight: 3.0
      failure_repair_action: refine_query
    - name: direct_prompt_reaction_grounding
      description: Whether evidence explicitly captures the target character directly
        soliciting a judgment, reaction, or confirmation from the audience/crowd,
        and the immediate subsequent reaction that verifies the reason for that reaction.
      score_1: Evidence explicitly shows or states the target character asking a specific
        question or making a direct appeal to the audience (e.g., 'Are we square?',
        'Do you agree?') and immediately captures the audience's specific reaction
        (e.g., booing, cheering) in response to that prompt.
      score_half: Evidence shows the target character interacting with the audience
        or the audience reacting, but lacks the explicit direct prompt/question that
        triggers the specific reaction, or the reaction is not clearly linked to a
        specific solicitation.
      score_0: Evidence describes the context, the character's actions, or the audience's
        reaction in isolation, but fails to capture the specific moment where the
        character directly solicits the audience's judgment or the immediate causal
        link between a specific prompt and the reaction.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_refusal_and_action_grounding
      description: Whether evidence explicitly captures the target entity's direct
        verbal or visual negation of a specific proposed action, rather than merely
        describing the context, general intent, or the action itself without the refusal.
      score_1: The evidence contains a direct statement or clear visual cue from the
        target entity explicitly refusing a specific action (e.g., 'I won't do X',
        'No, not shaking hands'), allowing the refusal to be verified.
      score_half: The evidence implies a refusal or shows hesitation but lacks a direct
        statement or clear visual confirmation of the specific action being denied.
      score_0: The evidence describes the context, general intent, or the action itself
        but contains no explicit statement or visual confirmation of the target entity
        refusing that specific action.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_refusal_object_grounding
      description: Whether evidence explicitly identifies the specific action, object,
        or proposition that is being refused or negated by the target entity, rather
        than merely capturing the negation itself or the context of the refusal.
      score_1: The evidence contains a direct statement or clear visual cue explicitly
        naming the specific action or object being refused (e.g., 'I won't shake hands',
        'No to the competition'), allowing the specific nature of the refusal to be
        verified.
      score_half: The evidence captures a refusal or negation (e.g., 'No', 'I won't
        do it') but the specific action or object being refused is only implied, ambiguous,
        or not explicitly stated.
      score_0: The evidence describes the context or shows a negative reaction but
        fails to explicitly identify what specific action or proposition is being
        refused, making it impossible to distinguish between different types of refusals.
      weight: 3.0
      failure_repair_action: refine_query
    - name: demographic_attribute_explicitness
      description: Whether evidence explicitly identifies the specific demographic
        or categorical attribute (e.g., gender, age group, specific role) for all
        entities in the set described in the option, rather than using generic terms
        or omitting the attribute entirely.
      score_1: Evidence explicitly states the specific demographic or categorical
        attribute (e.g., 'male dancers', 'children', 'teachers') for every entity
        in the set, allowing verification or exclusion of options regarding that attribute.
      score_half: Evidence implies the attribute for some entities or uses ambiguous
        terms, but does not explicitly state the specific attribute for the entire
        set.
      score_0: Evidence uses generic terms (e.g., 'performers', 'people', 'group')
        or fails to mention the specific demographic or categorical attribute for
        the entities, preventing verification or exclusion of options dependent on
        that attribute.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: explicit_tool_construction_grounding
      description: Whether evidence explicitly captures the specific steps of assembling,
        modifying, or creating the tool, device, or setup required by the option,
        rather than merely showing the use of pre-existing tools or unrelated actions.
      score_1: The evidence explicitly shows or states the specific process of constructing
        or modifying the tool (e.g., binding items, cutting, taping, assembling parts)
        that results in the functional setup described in the option.
      score_half: The evidence shows the final tool or the components separately but
        lacks the explicit steps of the construction or modification process.
      score_0: The evidence shows the use of pre-existing tools, unrelated actions,
        or a different construction process that does not match the specific assembly
        steps required by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_final_outcome_grounding
      description: Whether evidence explicitly captures the definitive final result,
        winner, or concluding state of the comparison, ranking, or competition described
        in the options, rather than merely showing intermediate scores, partial lists,
        or the process leading up to the conclusion.
      score_1: Evidence explicitly states the final outcome (e.g., 'X wins', 'X is
        the best', 'X takes first place') or the specific final state that resolves
        the question, allowing the correct option to be verified.
      score_half: Evidence shows the process, intermediate scores, or a partial ranking
        but lacks the explicit declaration of the final winner or concluding state.
      score_0: Evidence only depicts intermediate steps, isolated ratings, or context
        without ever capturing the definitive final result or winner required to answer
        the question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_superlative_attribution
      description: Whether evidence explicitly captures the target speaker's direct
        assertion of a specific qualitative superlative (e.g., 'most historical',
        'best', 'most iconic', 'greatest') or unique attribute regarding a specific
        entity, rather than merely listing entities, describing general qualities,
        or implying a preference.
      score_1: The evidence contains a direct statement from the target speaker explicitly
        attributing the specific superlative or unique qualitative judgment to the
        target entity (e.g., 'This place has the most history', 'This is the best
        X').
      score_half: The evidence mentions the entity and general positive qualities
        or implies a preference, but lacks the explicit superlative or specific qualitative
        judgment required by the option.
      score_0: The evidence lists entities, describes general features, or mentions
        the speaker's presence without any explicit statement attributing the specific
        superlative or unique qualitative judgment to the target entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_post_event_content_identification
      description: Whether evidence explicitly identifies the specific content, theme,
        or category of the action, video, or event occurring in the time window immediately
        following the trigger event described in the question, rather than discussing
        past events, the trigger event itself, or general context.
      score_1: Evidence explicitly states the specific theme, topic, or category of
        the post-trigger event (e.g., 'making a gaming video', 'cooking dinner') that
        directly answers the question about what happens next.
      score_half: Evidence mentions the post-trigger event generally or implies a
        theme, but does not explicitly state the specific content or category required
        to distinguish between options.
      score_0: Evidence discusses the trigger event, past events, or general context
        without explicitly identifying the specific content, theme, or category of
        the event occurring after the trigger.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  Object Recognition:
    rubric_criteria:
    - name: entity_temporal_recurrence
      description: Whether the evidence provides multiple distinct visual occurrences
        of the target entity across different time segments to support a frequency
        or count-based claim.
      score_1: The target entity is visually resolved in multiple distinct segments,
        enabling a count or frequency comparison.
      score_half: The target entity appears in only one segment or is mentioned without
        clear visual recurrence.
      score_0: The target entity is absent, mentioned only in narration without visual
        confirmation, or appears only once, making frequency determination impossible.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: procedural_grounding
      description: Whether the evidence explicitly grounds the specific method, strategy,
        or process described in the option, rather than merely mentioning the general
        topic or goal.
      score_1: The evidence details the specific steps, techniques, or mechanisms
        (e.g., encoding schemes, mathematical principles, transmission methods) required
        to verify the option's claim about a process.
      score_half: The evidence mentions the goal or topic but only vaguely alludes
        to a method without sufficient detail to verify the specific strategy.
      score_0: The evidence only mentions the general topic, goal, or existence of
        the subject without describing any specific method, strategy, or process.
      weight: 3.0
      failure_repair_action: refine_query
    - name: speaker_attribution
      description: Whether the evidence explicitly captures the target entity (speaker/subject)
        asserting the specific opinion, stance, or claim attributed to them in the
        option, rather than merely discussing the topic or having the claim attributed
        to a narrator or third party.
      score_1: The target entity is shown or heard explicitly stating the specific
        opinion, stance, or claim required to verify or exclude the option.
      score_half: The target entity discusses the topic generally, or the claim is
        mentioned in the segment but attributed to a narrator, another speaker, or
        implied rather than explicitly stated by the target.
      score_0: The target entity is absent, or the segment contains only general information
        about the topic or claims attributed to others, with no explicit statement
        of the target's specific stance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: contextual_binding
      description: Whether the evidence explicitly binds the specific method, technique,
        or action described in the option to the specific target entity, location,
        or event required to verify or exclude the option, rather than mentioning
        them in disjointed, generic, or unrelated contexts.
      score_1: The evidence clearly demonstrates the specific application of the method/technique
        to the target entity/event, establishing a direct link that allows verification
        or exclusion.
      score_half: The evidence mentions both the method and the target entity but
        the connection between them is ambiguous, implied, or split across segments
        without a clear narrative link.
      score_0: The evidence mentions the method or the target entity in isolation,
        or in contexts unrelated to each other, making it impossible to determine
        if the method was applied to the specific target.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instrumental_visualization
      description: Whether the evidence visually resolves the specific object, tool,
        or apparatus named in the option to confirm its presence or absence, rather
        than merely mentioning it in narration or showing a generic scene.
      score_1: The specific object, tool, or apparatus named in the option is clearly
        visually identified in the evidence, allowing verification of its presence
        or exclusion based on its absence.
      score_half: The object is mentioned in narration or shown in a generic context,
        but not clearly linked to the specific instance or option, or the visual is
        ambiguous.
      score_0: The specific object, tool, or apparatus is absent from the visual evidence;
        it is only discussed verbally or implied without visual confirmation.
      weight: 4
      failure_repair_action: dense_sample
    - name: outcome_explicitness
      description: Whether the evidence explicitly displays the specific result, outcome
        list, or status achieved in the target instance (e.g., a game round, a specific
        event) required to verify or exclude the option, rather than merely defining
        the rules, showing a generic example, or discussing the concept.
      score_1: The evidence visually presents the specific outcome list, score, or
        status achieved in the target instance, allowing direct verification of the
        option.
      score_half: The evidence shows a similar outcome in a different instance or
        implies the result through narration without explicit visual confirmation
        of the target instance's specific outcome.
      score_0: The evidence only defines the rules, shows generic examples, or discusses
        the concept without displaying the specific result or outcome list for the
        target instance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ranking_explicitness
      description: Whether the evidence explicitly presents a ranked list, ordinal
        sequence, or comparative hierarchy required to verify or exclude superlative
        claims (e.g., 'greatest', 'best', 'first'), rather than merely showing individual
        instances or generic comparisons.
      score_1: The evidence explicitly displays a ranked list, numbered order, or
        clear hierarchy that identifies the specific entity as the top-ranked or superlative
        item among the options.
      score_half: The evidence implies a comparison or shows multiple entities but
        lacks an explicit ranking, order, or definitive statement establishing a superlative
        status.
      score_0: The evidence shows only individual instances, generic interactions,
        or isolated events without any comparative ranking, list, or ordinal structure
        to determine a superlative.
      weight: 3.0
      failure_repair_action: refine_query
    - name: role_explicitness
      description: Whether the evidence explicitly states or visually resolves the
        specific role, class, occupation, or category of the target entity required
        to verify or exclude the option, rather than merely showing the entity performing
        actions or using tools associated with that role.
      score_1: The specific role, class, or occupation of the target entity is explicitly
        named in the narration/text or clearly visually identified (e.g., via a UI
        label, title, or direct statement).
      score_half: The role is strongly implied by the actions, tools, or cards used,
        but the specific label or category is not explicitly stated or visually confirmed.
      score_0: The evidence shows the entity performing actions or using items but
        never explicitly states or visually identifies the specific role, class, or
        occupation, making it impossible to verify the option without external inference.
      weight: 3.0
      failure_repair_action: refine_query
    - name: first_person_action_admission
      description: Whether the evidence explicitly captures the target entity (the
        subject of the option) directly stating or admitting to the specific action,
        rule violation, or event described in the option in the first person, rather
        than the action being described by a narrator, attributed to a generic group,
        or merely implied by context.
      score_1: The target entity is shown or heard explicitly stating the specific
        action or rule violation in the first person (e.g., 'I did X', 'I broke the
        rule'), allowing direct verification of the option.
      score_half: The target entity is present but discusses the topic generally,
        or the action is described by a narrator/third party without a direct first-person
        admission from the target entity.
      score_0: The target entity does not speak about the specific action, or the
        action is only described by a narrator, attributed to a generic group (e.g.,
        'students do X'), or implied without any explicit admission from the target
        entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_context_binding
      description: Whether the evidence explicitly binds the target action or state
        to the specific event, role, or situational constraint defined in the query
        (e.g., 'during the meeting with X', 'at the start of Y'), rather than showing
        the action in a generic or different context.
      score_1: The evidence clearly shows the target action occurring within the specific
        event or role context required by the query, establishing a direct link between
        the action and the constraint.
      score_half: The evidence shows the target action and mentions the event/role
        separately, but the temporal or causal link between them is ambiguous or implied
        rather than explicit.
      score_0: The evidence shows the target action in a generic context or a different
        event entirely, failing to establish that the action occurred under the specific
        constraint defined in the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_set_enumeration
      description: Whether the evidence visually resolves and enumerates the specific
        set of discrete values, labels, or attributes present on the target object
        required to verify or exclude options claiming a specific value is included
        or excluded from that set.
      score_1: The evidence clearly shows the specific set of values/attributes on
        the target object (e.g., all numbers printed on a token, all labels on a card),
        allowing direct verification of which values are present and which are absent.
      score_half: The evidence shows the target object but the specific set of values/attributes
        is partially obscured, implied, or only mentioned verbally without a complete
        visual enumeration.
      score_0: The evidence discusses the object or its values generically, hypothetically,
        or verbally without visually resolving the specific set of values/attributes
        present on the actual object, making it impossible to verify exclusion claims.
      weight: 3.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.7
  Counting Problem:
    rubric_criteria:
    - name: explicit_enumeration_of_instances
      description: Whether the evidence explicitly identifies, lists, or distinguishes
        the individual distinct instances required to verify or exclude a quantitative
        option (e.g., a count of cases, items, or events).
      score_1: The evidence explicitly names, describes, or visually distinguishes
        each distinct instance required to determine the count, allowing the specific
        number to be verified or excluded.
      score_half: The evidence mentions a quantity or implies multiple instances but
        fails to clearly distinguish or identify each specific instance individually.
      score_0: The evidence provides only generic references to the category (e.g.,
        'many', 'craters', 'cases') or discusses related concepts without enumerating
        the specific distinct instances needed to answer the count.
      weight: 5
      failure_repair_action: refine_query
    - name: categorical_identification_via_defining_attributes
      description: Whether the evidence provides the specific visual, auditory, or
        textual markers (e.g., broadcast logos, chyrons, anchor introductions, explicit
        labels) that definitively classify an instance as belonging to the target
        category required for the count, rather than merely showing a scene that could
        be misclassified.
      score_1: The evidence explicitly displays or states the defining attributes
        (e.g., 'live broadcast', 'news anchor', specific on-screen text) that confirm
        each counted instance belongs to the target category, allowing for unambiguous
        classification and counting.
      score_half: The evidence suggests the category through context or partial markers
        but lacks definitive proof for all instances, leaving some ambiguous between
        the target category and similar non-target content.
      score_0: The evidence shows scenes or clips that lack the specific defining
        attributes of the target category, making it impossible to distinguish target
        instances from non-target instances (e.g., generic scenes mistaken for news,
        or news segments lacking broadcast markers).
      weight: 5
      failure_repair_action: refine_query
    - name: explicit_visual_or_verbal_confirmation_of_concealment
      description: Whether the evidence explicitly confirms that a specific individual's
        face is concealed (via visual occlusion like masks/balaclavas or explicit
        verbal statement of hiding identity) rather than merely being unseen due to
        lighting, angle, or lack of focus.
      score_1: The evidence explicitly shows the target individual's face covered
        by an object (e.g., mask, balaclava) or includes a direct statement confirming
        the individual is hiding their face/identity, allowing the instance to be
        counted as 'unwilling to show face'.
      score_half: The evidence suggests concealment through context (e.g., dark clothing,
        shadows) or partial visual cues but lacks definitive proof of face covering
        or explicit confirmation of intent to hide.
      score_0: The evidence shows individuals whose faces are not visible due to generic
        reasons (silhouettes, distance, lighting) without any specific visual markers
        of concealment or verbal confirmation of hiding intent, making it impossible
        to distinguish 'unwilling to show face' from 'face simply not shown'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_superlative_grounding
      description: Whether the evidence explicitly asserts a superlative relationship
        (e.g., 'most', 'maximum', 'highest', 'best') or a direct comparison across
        all relevant options to verify or exclude a claim about an extreme value,
        rather than merely listing individual values without comparison.
      score_1: The evidence explicitly states that a specific entity holds the maximum/minimum
        value or is the 'most' among the group (e.g., 'X has the most kills', 'Y is
        the highest'), allowing the superlative claim to be verified directly.
      score_half: The evidence lists values for multiple entities but requires the
        verifier to perform the comparison mentally, or implies a superlative without
        explicit confirmation.
      score_0: The evidence lists individual values or events for some entities but
        provides no explicit comparative statement or superlative assertion, making
        it impossible to verify which entity holds the maximum/minimum without external
        inference.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_type_identification_via_specific_markers
      description: Whether the evidence contains the specific visual, auditory, or
        textual markers (e.g., on-screen graphics, commentary, distinct actions) that
        definitively identify an instance as belonging to the target event type required
        for the count, rather than showing generic scenes of the broader context.
      score_1: The evidence explicitly displays or states the defining markers (e.g.,
        substitution graphics, 'sub' commentary, specific action sequences) that confirm
        the occurrence of the target event type, allowing instances to be identified
        and counted.
      score_half: The evidence suggests the event type through context or partial
        markers but lacks definitive proof for all instances, leaving ambiguity about
        whether specific moments are the target event or generic activity.
      score_0: The evidence shows only generic scenes of the broader context (e.g.,
        general gameplay, crowd shots, score updates) without any specific markers
        identifying the target event type, making it impossible to distinguish target
        instances from non-target activity.
      weight: 3
      failure_repair_action: refine_query
    - name: explicit_assertion_of_cumulative_total
      description: Whether the evidence explicitly states the cumulative total, milestone,
        or aggregate count required to verify or exclude a quantitative option, rather
        than merely showing individual instances that would require manual enumeration.
      score_1: The evidence explicitly states the total count or milestone (e.g.,
        '200th goal', 'total of 50', 'reached 100') allowing the specific quantitative
        option to be verified or excluded directly.
      score_half: The evidence implies a large number or mentions a milestone vaguely
        but does not explicitly state the specific total required to distinguish between
        the options.
      score_0: The evidence shows individual instances of the event but provides no
        explicit statement of the cumulative total, making it impossible to verify
        the specific count without external inference or exhaustive manual counting.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_exhaustiveness_for_enumeration
      description: Whether the evidence spans the entire relevant temporal window
        of the video to ensure that all distinct instances required for a count are
        captured, rather than providing only a partial or sampled set of instances.
      score_1: The evidence covers the full duration or a continuous sequence of the
        video, ensuring no potential instances are missed and allowing for a definitive
        total count.
      score_half: The evidence covers a significant portion of the video but contains
        gaps or missing segments where additional instances could exist, making the
        total count uncertain.
      score_0: The evidence consists of only a few isolated clips or a non-exhaustive
        sample of the video, failing to cover the full timeline and making it impossible
        to verify if the count is complete.
      weight: 3
      failure_repair_action: refine_query
    - name: explicit_aggregation_of_instances_for_comparison
      description: Whether the evidence explicitly groups multiple distinct instances
        into a single category or provides a summarized count/comparison across categories,
        rather than listing instances in isolation without indicating their collective
        volume.
      score_1: The evidence explicitly states that multiple specific instances belong
        to the same category (e.g., 'A, B, and C are all in X') or provides a direct
        count/summary that allows the relative magnitude of categories to be determined
        without exhaustive manual tallying.
      score_half: The evidence lists several instances for a category but does so
        in a scattered manner without explicit grouping, requiring the verifier to
        mentally aggregate them to determine the total.
      score_0: The evidence mentions individual instances belonging to categories
        one by one without any grouping, summary, or comparative statement, making
        it impossible to verify which category has the highest count without assuming
        exhaustive coverage of the entire video.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_grounding_of_quantitative_thresholds
      description: Whether the evidence explicitly provides the specific numerical
        values (e.g., dates, durations, measurements) required to evaluate a quantitative
        condition or threshold (e.g., 'less than X years', 'greater than Y meters')
        for each instance, rather than merely listing instances without the data needed
        to test the condition.
      score_1: The evidence explicitly states the specific numerical values (e.g.,
        start/end years, exact duration) for each instance, allowing the verifier
        to directly calculate or compare against the quantitative threshold to verify
        or exclude the option.
      score_half: The evidence provides some numerical values but is missing key data
        points (e.g., only start date, only duration without dates) for some instances,
        making it impossible to definitively verify the threshold for all items.
      score_0: The evidence lists instances or describes them qualitatively but lacks
        the specific numerical values (dates, durations, measurements) required to
        evaluate the quantitative condition, making it impossible to determine if
        the instances meet the threshold.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_interval_completeness_for_duration_evaluation
      description: Whether the evidence provides the complete temporal interval (both
        start and end dates, or an explicit duration) for each instance required to
        evaluate a time-span condition (e.g., 'built in less than X years'), rather
        than providing only a single date, a vague estimate, or no timeline data.
      score_1: The evidence explicitly states both the start and end dates, or the
        total duration, for each instance, allowing the verifier to calculate the
        exact time span and verify if it meets the threshold.
      score_half: The evidence provides partial temporal data (e.g., only start date,
        only end date, or a vague duration like 'centuries') for some instances, making
        it impossible to definitively calculate the duration for all items.
      score_0: The evidence lacks the necessary paired dates or explicit duration
        for the instances, providing only single dates, unrelated time references,
        or no timeline information, making it impossible to evaluate the time-span
        condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_ordinal_sequencing_of_instances
      description: Whether the evidence explicitly uses ordinal markers (e.g., 'first',
        'second', 'third', 'question number X') or sequential indicators to distinguish
        and order the individual instances required for a count, rather than presenting
        instances as an unnumbered or unordered set.
      score_1: The evidence explicitly states the ordinal position of each instance
        (e.g., 'the first question', 'the second question', 'question number 4'),
        allowing the verifier to count the total number of distinct instances by following
        the sequence.
      score_half: The evidence uses some ordinal markers but leaves gaps in the sequence
        or mixes numbered and unnumbered instances, making the total count uncertain.
      score_0: The evidence presents instances without any explicit ordinal markers
        or sequential indicators, making it impossible to distinguish the count of
        distinct instances or verify the total number without external inference.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  OCR Problems:
    rubric_criteria:
    - name: functional_demonstration
      description: Whether evidence explicitly demonstrates the specific option performing
        the function or achieving the outcome asserted in the question, rather than
        merely mentioning the option or discussing it as a counter-example.
      score_1: The evidence shows the option actively executing the required function
        (e.g., a tool being used to achieve the goal, a process completing successfully).
      score_half: The evidence mentions the option in the context of the function
        but does not show the function being executed or the outcome achieved.
      score_0: The evidence mentions the option but explicitly excludes it from the
        function, shows it failing, or discusses it only as a counter-example without
        demonstrating the required capability.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_textual_metadata
      description: Whether evidence contains explicit on-screen text (OCR) that directly
        states the specific metadata (e.g., episode number, season, title, date) required
        to verify or exclude the options, rather than relying solely on visual scene
        content or dialogue.
      score_1: The evidence includes clear on-screen text explicitly stating the specific
        metadata value asserted in the correct option (or explicitly contradicting
        wrong options).
      score_half: The evidence contains on-screen text related to the content (e.g.,
        subtitles, generic titles) but does not explicitly state the specific metadata
        value needed to distinguish the options.
      score_0: The evidence lacks any on-screen text identifying the specific metadata;
        the scene is identified only by visual context or dialogue.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attempt_ordinal_grounding
      description: Whether evidence explicitly links the specific quantitative value
        (e.g., height, score, time) to the exact attempt ordinal (e.g., first, second,
        final) or specific instance required by the question, rather than providing
        values for different attempts, other athletes, or general records.
      score_1: The evidence explicitly states the value in the context of the specific
        attempt ordinal requested (e.g., 'first attempt at X', 'cleared X on his second
        try').
      score_half: The evidence mentions the value and the athlete but the specific
        attempt ordinal is ambiguous or inferred rather than explicitly stated.
      score_0: The evidence provides values for the athlete but for a different attempt
        ordinal, a different athlete, or a general record, failing to ground the value
        to the specific instance requested.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_event_value_cooccurrence
      description: Whether the specific quantitative value (e.g., count, score, time)
        required to verify or exclude an option is explicitly displayed or stated
        at the exact moment the target event or condition described in the question
        is occurring, rather than appearing in a different scene or time window.
      score_1: The evidence shows the target event (e.g., specific action, state,
        or group activity) and the specific quantitative value simultaneously (e.g.,
        a counter updating while the action happens, or a value stated while the condition
        is met).
      score_half: The evidence shows the target event and the quantitative value in
        the same video but in separate segments or time windows, requiring inference
        to link them.
      score_0: The evidence shows the target event without the quantitative value,
        or shows the quantitative value without the target event, making it impossible
        to verify the specific claim.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
  Spatial Perception:
    rubric_criteria:
    - name: simultaneous_visual_co_presence
      description: Whether the evidence visually presents the target entities or spatial
        components simultaneously within the same frame or continuous shot to allow
        direct observation of their relative positions or interactions.
      score_1: The evidence shows the relevant entities together in the same visual
        field, enabling direct verification of their spatial relationship.
      score_half: The evidence shows the entities in rapid succession or adjacent
        shots but not simultaneously, requiring inference of their relative positions.
      score_0: The evidence shows the entities only in isolation (separate shots)
        or mentions them without visual co-presence, making spatial relations impossible
        to verify directly.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relative_spatial_orientation_grounding
      description: Whether the evidence explicitly grounds the relative spatial orientation
        (e.g., left/right, front/back, above/below) between the target entities required
        to verify or exclude the directional options.
      score_1: The evidence explicitly describes or visually resolves the relative
        position of the target entities (e.g., 'A is to the left of B', 'A is facing
        B'), allowing the specific directional option to be verified or excluded.
      score_half: The evidence shows the entities together but the relative orientation
        is ambiguous, implied, or not explicitly described.
      score_0: The evidence mentions the entities or shows them in isolation without
        establishing their relative spatial configuration, making directional verification
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_visual_resolution
      description: Whether the evidence visually resolves the specific target entities
        mentioned in the options by their distinguishing features (e.g., clothing
        color, unique accessories, specific appearance) rather than referring to them
        generically or by role.
      score_1: The evidence explicitly identifies the target entities using the specific
        visual descriptors required by the question (e.g., 'the person in the red
        hoodie', 'the person in the green hoodie'), allowing the spatial relation
        between these specific individuals to be verified.
      score_half: The evidence shows the entities but refers to them generically (e.g.,
        'a man', 'the speaker') or uses descriptors that do not uniquely match the
        specific identifiers in the options, requiring inference to link them.
      score_0: The evidence mentions or shows people but fails to visually resolve
        the specific distinguishing features (e.g., colors, specific clothing) needed
        to identify the target entities, making it impossible to verify the spatial
        relation between the specific 'narrator in red' and 'narrator in green'.
      weight: 3.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.7
  Temporal Perception:
    rubric_criteria:
    - name: superlative_density
      description: Whether the evidence provides sufficient cumulative volume, distinct
        instances, or comparative density to verify or exclude superlative claims
        (e.g., 'most', 'least', 'first', 'only') or quantitative comparisons.
      score_1: Evidence presents multiple distinct instances, extended duration, or
        explicit comparative data for the target option that clearly exceeds the evidence
        volume for competing options, allowing the superlative to be verified.
      score_half: Evidence supports the target option but lacks sufficient distinct
        instances or comparative context to definitively rule out other options as
        having equal or greater coverage.
      score_0: Evidence consists of isolated mentions or insufficient volume for the
        target option, failing to establish a clear quantitative or comparative advantage
        over other options.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: temporal_bracketing_of_state_change
      description: Whether the evidence provides distinct temporal markers immediately
        before and after a queried state change (e.g., a lead change, a score tie,
        a status flip) to verify the interval in which the transition occurred.
      score_1: Evidence explicitly shows the state prior to the transition and the
        state after the transition, allowing the exact interval of change to be bounded.
      score_half: Evidence shows the state after the transition but lacks the immediate
        prior state, or shows the prior state but lacks the immediate subsequent state,
        leaving the exact transition interval ambiguous.
      score_0: Evidence only shows isolated states (e.g., only the final outcome or
        only one side of the transition) without the necessary before/after pair to
        locate the transition event.
      weight: 3.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.7
  Attribute Perception:
    rubric_criteria:
    - name: attribute_explicitness
      description: Whether the specific perceptual attribute (e.g., color, shape,
        texture, state) asserted by the options is explicitly stated or visually resolved
        in the evidence for the target entity.
      score_1: The evidence explicitly states or clearly resolves the specific attribute
        value (e.g., 'green garment') required to verify or exclude the options.
      score_half: The attribute is implied or partially visible but not explicitly
        stated or clearly resolved for the specific target.
      score_0: The specific attribute value is absent, ambiguous, or not mentioned
        for the target entity, making it impossible to verify or exclude options based
        on that attribute.
      weight: 3.0
      failure_repair_action: refine_query
    - name: rule_scoring_explicitness
      description: Whether the evidence explicitly states the rules, scoring criteria,
        or winning conditions required to verify or exclude options regarding the
        outcome or strategy of the activity.
      score_1: The evidence explicitly states the specific rules, point values, or
        winning conditions (e.g., 'points for height', 'last person standing') that
        determine the correct answer.
      score_half: The evidence implies rules or shows the outcome without explicitly
        stating the criteria used to determine it.
      score_0: The evidence describes the physical actions or events but contains
        no explicit statement of the rules, scoring, or winning conditions, making
        it impossible to verify the correct strategy or outcome.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.7
