general:
  rubric_criteria:
  - name: evidence_coverage
    description: Whether evidence covers the key event, time window, state change,
      comparison target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 1.0
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Whether evidence explicitly grounds the relevant person, object,
      action, scene, speaker, on-screen text, or spatial relation rather than a generic
      scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 1.0
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Whether evidence is internally consistent and contains enough contrary
      evidence to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 1.0
    failure_repair_action: broadcast
  scoring_rule: average
  sufficient_threshold: 0.8
type_aliases:
  Information Synopsis: Information Synopsis
  Object Reasoning: Object Reasoning
  Action Reasoning: Action Reasoning
  Counting Problem: Counting Problem
  Object Recognition: Object Recognition
  Temporal Reasoning: Temporal Reasoning
  Temporal Perception: Temporal Perception
  Attribute Perception: Attribute Perception
  Action Recognition: Action Recognition
  OCR Problems: OCR Problems
  Spatial Reasoning: Spatial Reasoning
templates:
  Information Synopsis:
    rubric_criteria:
    - name: scope_completeness
      description: Whether the evidence covers the full temporal or logical scope
        (e.g., start-to-end, rise-and-fall, cause-and-effect) required to verify or
        exclude a 'main idea' or 'synopsis' option, rather than only a partial segment.
      score_1: Evidence explicitly addresses all phases or components of the scope
        asserted in the option (e.g., both the rise and the fall).
      score_half: Evidence addresses the majority of the scope but misses a distinct
        phase (e.g., covers the fall but not the rise).
      score_0: Evidence covers only a single phase or a minor detail, failing to represent
        the full scope of the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: theme_vs_detail_distinction
      description: Whether the evidence distinguishes the central, unifying theme
        or narrative arc from specific supporting details, examples, or sub-topics,
        rather than treating a detail as the primary subject.
      score_1: Evidence explicitly identifies or links specific instances to the overarching
        central theme or main argument, allowing the primary theme to be verified
        or details to be excluded as secondary.
      score_half: Evidence presents specific details and hints at a broader context
        but does not explicitly establish the hierarchical relationship between the
        detail and the main theme.
      score_0: Evidence consists only of specific details, examples, or sub-topics
        without establishing a unifying central theme, making it impossible to distinguish
        the primary theme from supporting content.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_resolution
      description: Whether the evidence explicitly states or depicts the final outcome,
        climax, or resolution of the narrative arc, rather than only the setup, context,
        or intermediate steps.
      score_1: Evidence explicitly identifies the concluding event, result, or resolution
        that defines the narrative's endpoint.
      score_half: Evidence implies a conclusion or shows late-stage events but does
        not explicitly state the final outcome or resolution.
      score_0: Evidence covers only the setup, background, or intermediate phases
        without reaching the narrative's conclusion.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_boundary_explicitness
      description: Whether the evidence explicitly states or depicts the specific
        start and end points (dates, named eras, or defining events) that delimit
        the primary subject's scope, rather than only showing generic scenes within
        an undefined timeframe.
      score_1: Evidence explicitly identifies the specific beginning and ending markers
        (e.g., named event start, specific year of conclusion) that define the primary
        subject's temporal scope.
      score_half: Evidence identifies one boundary (start or end) or implies the timeframe
        through context without explicit markers.
      score_0: Evidence shows scenes from the subject but lacks any explicit temporal
        markers to define the specific start or end of the primary scope.
      weight: 3.0
      failure_repair_action: refine_query
    - name: meta_framing_evidence
      description: Whether the evidence explicitly captures the video's framing device,
        setting, or narrator's stated purpose (e.g., a tour, exhibition, documentary
        structure) rather than only the subject matter content discussed within that
        frame.
      score_1: Evidence explicitly identifies the video's overarching context, setting,
        or purpose (e.g., 'this exhibition', 'a journey through', 'a tour of'), allowing
        the main idea to be distinguished from the specific content discussed.
      score_half: Evidence hints at a broader context or setting but does not explicitly
        state the video's framing purpose or structure.
      score_0: Evidence consists solely of the subject matter content (e.g., descriptions
        of objects, events, or history) without any indication of the video's framing,
        setting, or narrative purpose.
      weight: 3.0
      failure_repair_action: refine_query
    - name: conflict_parties_explicitness
      description: Whether the evidence explicitly identifies the specific opposing
        parties, groups, or forces involved in the central conflict, rather than only
        stating the topic of disagreement or the general issue.
      score_1: Evidence explicitly names or describes the distinct opposing sides
        (e.g., 'X vs Y', 'establishment vs outsiders') that constitute the conflict.
      score_half: Evidence mentions the topic of conflict or one side but fails to
        explicitly identify the opposing force or the nature of the opposition.
      score_0: Evidence discusses the subject matter or a general problem without
        identifying any specific conflicting parties or opposing forces.
      weight: 3.0
      failure_repair_action: refine_query
    - name: contrast_axis_explicitness
      description: Whether the evidence explicitly states the specific contrasting
        dimensions, axes, or binary oppositions (e.g., 'X vs Y', 'stability vs returns')
        that define the disagreement, rather than only mentioning the general topic
        or one side of the argument.
      score_1: Evidence explicitly articulates the specific opposing concepts or dimensions
        that constitute the core conflict (e.g., explicitly contrasting 'stability'
        with 'high returns' or 'outsiders' with 'establishment').
      score_half: Evidence mentions the general topic of disagreement or one side
        of the contrast but fails to explicitly define the specific opposing dimension
        or the nature of the binary opposition.
      score_0: Evidence discusses the subject matter or a general problem without
        identifying the specific contrasting axes or dimensions that define the debate.
      weight: 3.0
      failure_repair_action: refine_query
    - name: historical_narrative_explicitness
      description: Whether the evidence explicitly identifies the specific historical
        era, period, or narrative scope (e.g., 'history of the world', '20th century',
        'rise and fall of X') that defines the video's subject, rather than discussing
        the topic in a generic or timeless manner.
      score_1: Evidence explicitly names or describes the specific historical period
        or narrative scope that the video covers, allowing options claiming a specific
        era to be verified or excluded.
      score_half: Evidence implies a historical context or mentions time-related terms
        but does not explicitly define the specific era or narrative scope as the
        central subject.
      score_0: Evidence discusses the topic in a generic, timeless, or purely definitional
        way without anchoring it to a specific historical period or narrative scope.
      weight: 3.0
      failure_repair_action: refine_query
    - name: title_card_explicitness
      description: Whether the evidence explicitly captures the video's opening title
        card, headline, or on-screen main topic statement that directly asserts the
        primary subject, rather than only showing content discussed within the video.
      score_1: Evidence explicitly includes the video's title card or headline that
        states the main topic, allowing the 'main focus' option to be directly verified
        or excluded.
      score_half: Evidence implies the topic through context or partial text but does
        not capture the explicit title card or headline statement.
      score_0: Evidence consists solely of content segments without the opening title
        card or headline that defines the video's primary subject.
      weight: 3.0
      failure_repair_action: refine_query
    - name: stakeholder_concern_attribution
      description: Whether the evidence explicitly attributes a specific concern,
        fear, motivation, or stance to the particular group, party, or individual
        mentioned in the option, rather than only describing the general event or
        the actions of other entities.
      score_1: Evidence explicitly links the specific group named in the option to
        the specific concern or stance asserted (e.g., 'Group X fears Y' or 'Advocates
        of Z worry about W').
      score_half: Evidence mentions the group and the concern separately or implies
        a link, but does not explicitly state that this specific group holds this
        specific concern.
      score_0: Evidence describes the event or the actions of other entities but fails
        to identify the specific group's concern or stance, making it impossible to
        verify the option's attribution.
      weight: 3.0
      failure_repair_action: refine_query
    - name: structural_agenda_explicitness
      description: Whether the evidence explicitly captures the video's structural
        roadmap, agenda, or topic list (e.g., a menu overlay, table of contents, or
        chapter list) that enumerates the specific sub-topics or narrative segments
        covered, rather than only showing the content of those segments.
      score_1: Evidence explicitly includes a visual or verbal list of the video's
        specific topics or segments, allowing options to be verified or excluded based
        on their presence or absence in the agenda.
      score_half: Evidence implies a structure or lists some topics but misses the
        explicit enumeration of the full agenda or specific segments relevant to the
        options.
      score_0: Evidence consists solely of content segments without any explicit structural
        roadmap, menu, or topic list defining the video's scope.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_mechanism_explicitness
      description: Whether the evidence explicitly identifies the specific mechanism,
        instrument, process, or causal agent asserted in the option as the driver
        of the central event or narrative, rather than only mentioning the event itself,
        the actors involved, or generic causes.
      score_1: Evidence explicitly names or describes the specific mechanism or instrument
        (e.g., a specific financial product, a named policy, a distinct process) that
        the option claims is the primary cause or focus.
      score_half: Evidence mentions the event and actors or implies a cause but fails
        to explicitly name the specific mechanism or instrument asserted in the option.
      score_0: Evidence describes the event or actors without identifying any specific
        causal mechanism, making it impossible to verify options that hinge on a particular
        cause.
      weight: 3.0
      failure_repair_action: refine_query
    - name: competing_narrative_exclusion
      description: Whether the evidence excludes significant competing narratives,
        secondary themes, or reactions that could be misinterpreted as the primary
        focus, ensuring the central argument or causal thesis is unambiguous.
      score_1: Evidence focuses exclusively on the central thesis or causal mechanism,
        with no significant competing narratives or secondary themes present that
        could confuse the main focus.
      score_half: Evidence includes the central thesis but also contains substantial
        secondary narratives or reactions, creating ambiguity about whether the video's
        main focus is the cause or the consequence/reaction.
      score_0: Evidence is dominated by secondary narratives, reactions, or consequences,
        making it impossible to distinguish the primary causal thesis or central argument
        from the fallout.
      weight: 1.0
      failure_repair_action: refine_query
    - name: debate_verdict_explicitness
      description: Whether the evidence explicitly states the final verdict, resolution,
        or consensus reached regarding a central scientific claim, debate, or controversy,
        rather than only presenting the claim, the controversy, or the initial findings
        without the concluding stance.
      score_1: Evidence explicitly articulates the final conclusion, consensus, or
        resolved stance (e.g., 'theory is confirmed', 'hypothesis is rejected', 'consensus
        is now X') that defines the narrative's ultimate point.
      score_half: Evidence presents the claim, the controversy, or the findings but
        leaves the final verdict or consensus ambiguous or unstated.
      score_0: Evidence only mentions the topic, the actors, or the initial findings
        without any indication of the final resolution, verdict, or consensus on the
        central claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: origin_to_evolution_scope
      description: Whether the evidence explicitly covers the genesis, formation,
        or origin phase of the subject and its subsequent development or evolution,
        rather than only a specific intermediate event, disaster, or consequence within
        that timeline.
      score_1: Evidence explicitly addresses both the origin/formation of the subject
        and its subsequent evolution or development, allowing 'formation and evolution'
        options to be verified and 'single event' options to be excluded.
      score_half: Evidence addresses the origin or the evolution but not both, or
        implies the full arc without explicitly covering the genesis phase.
      score_0: Evidence covers only a specific intermediate event, disaster, or consequence
        without addressing the subject's origin or the full evolutionary timeline.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_unit_alignment
      description: Whether the evidence is explicitly drawn from the specific narrative
        unit, case, or segment (e.g., 'the second case', 'the first story') requested
        by the query, rather than from a different unit within the same video.
      score_1: Evidence is explicitly anchored to the specific narrative unit or case
        segment targeted by the question, allowing verification of that unit's content
        and exclusion of content from other units.
      score_half: Evidence mentions the video's general topic or includes fragments
        from the target unit but is mixed with or dominated by content from a different
        narrative unit, creating ambiguity about which case is being addressed.
      score_0: Evidence is drawn entirely from a different narrative unit, case, or
        segment than the one specified in the query, making it impossible to verify
        the specific focus of the requested unit.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instructional_intent_explicitness
      description: Whether the evidence explicitly establishes the video's primary
        mode as an instructional or educational sequence (e.g., defining terms, explaining
        mechanisms, teaching fundamentals) rather than a demonstration, narrative,
        or specific application showcase.
      score_1: Evidence explicitly identifies the video's purpose as teaching or explaining
        core concepts/fundamentals, allowing 'course' or 'fundamentals' options to
        be verified and 'demo' or 'specific application' options to be excluded.
      score_half: Evidence shows educational content (e.g., definitions) but lacks
        explicit framing of the overall video as a course or instructional sequence,
        or mixes instruction with demonstration.
      score_0: Evidence consists only of specific applications, demonstrations, or
        narrative content without establishing an overarching instructional or educational
        intent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: curriculum_scope_explicitness
      description: Whether the evidence explicitly enumerates the specific learning
        outcomes, curriculum components, or topic list that defines the video's comprehensive
        instructional scope, rather than only showing a single step, a generic hook,
        or a specific application.
      score_1: Evidence explicitly lists the full set of topics, skills, or steps
        (e.g., a 'What You Will Learn' slide) that constitute the video's main subject,
        allowing the comprehensive scope to be verified and narrower options to be
        excluded.
      score_half: Evidence implies a broader scope or lists some topics but misses
        the explicit enumeration of the full curriculum or key components relevant
        to the options.
      score_0: Evidence consists only of a single step, a specific example, or a generic
        introduction without explicitly defining the full instructional scope or curriculum.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequence_enumeration_completeness
      description: Whether the evidence covers the complete sequence of enumerated
        items, speakers, or steps (e.g., 'first', 'second', 'third', 'fourth') within
        the targeted narrative unit, rather than only a partial subset of that sequence.
      score_1: Evidence explicitly includes all items in the sequence relevant to
        the options (e.g., all four speakers in a list), allowing verification of
        claims about specific positions in the sequence.
      score_half: Evidence includes some items in the sequence but misses others (e.g.,
        covers the first two speakers but not the third or fourth), making it impossible
        to verify claims about the missing positions.
      score_0: Evidence covers only a single item or an unconnected fragment of the
        sequence, failing to establish the full order or content of the enumerated
        list.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_position_verification
      description: Whether the evidence explicitly establishes the specific ordinal
        position (e.g., 'first', 'second', 'last') of the narrative unit, speaker,
        or event referenced in the option, rather than only providing content from
        that unit without confirming its sequence rank.
      score_1: Evidence explicitly identifies the ordinal rank (e.g., via a narrator's
        introduction, on-screen counter, or structural marker) of the specific unit
        or event, allowing the option's claim about its position to be verified or
        excluded.
      score_half: Evidence contains content from the correct unit but lacks explicit
        markers confirming its specific ordinal position, making it impossible to
        distinguish it from other similar units in the sequence.
      score_0: Evidence is drawn from a unit without any indication of its sequence
        rank, or the evidence is from a different unit entirely, failing to verify
        the ordinal claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: future_vision_explicitness
      description: Whether the evidence explicitly captures the future-oriented vision,
        aspirational goal, or long-term legacy that defines the video's central thesis,
        rather than only the historical context, current status, or past failures.
      score_1: Evidence explicitly states or depicts the future goal, legacy, or aspirational
        endpoint (e.g., 'generations to come', 'winning the race', 'holy grail') that
        constitutes the video's main argument.
      score_half: Evidence implies a future direction or mentions long-term goals
        but does not explicitly link them to the central thesis or the specific 'why'
        of the subject.
      score_0: Evidence consists only of historical events, current status, or past
        failures without any explicit articulation of the future vision or aspirational
        goal that defines the narrative's purpose.
      weight: 1.0
      failure_repair_action: refine_query
    - name: comparative_context_explicitness
      description: Whether the evidence explicitly includes the external comparative
        context (e.g., competitors, historical precedents, opposing forces, or industry
        landscape) required to verify a 'race', 'competition', or 'strategic advantage'
        synopsis, rather than only the subject's internal details or technical specifications.
      score_1: Evidence explicitly presents the external entities, historical events,
        or opposing forces that define the competitive landscape or 'race' asserted
        in the option.
      score_half: Evidence mentions the subject's internal details and implies a broader
        context but lacks explicit evidence of the specific competitors, historical
        precedents, or opposing forces needed to verify the 'race' or 'competition'
        claim.
      score_0: Evidence consists solely of the subject's internal details, technical
        specs, or self-referential narrative without any external comparative context,
        making it impossible to verify a 'race' or 'competition' synopsis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: subject_unification_vs_enumeration
      description: Whether the evidence establishes a single, unified subject or specific
        entity as the primary focus of the video, rather than presenting a list of
        disparate examples, sub-topics, or multiple distinct entities that could be
        misinterpreted as the whole scope.
      score_1: Evidence centers on a single, specific subject or entity as the primary
        topic, allowing options claiming a specific focus to be verified and options
        claiming a broad list of examples to be excluded.
      score_half: Evidence presents multiple examples or sub-topics and hints at a
        unifying theme, but does not explicitly establish a single specific subject
        as the dominant focus, creating ambiguity between a specific topic and a general
        survey.
      score_0: Evidence consists solely of a list of disparate examples, sub-topics,
        or multiple distinct entities without establishing a single unifying subject,
        making it impossible to distinguish the specific main focus from a general
        overview.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_mode_explicitness
      description: Whether the evidence explicitly establishes the specific narrative
        mode, genre, or type of interaction (e.g., a physical battle, a comedic prank,
        an instructional sequence, a debate) asserted in the option, rather than only
        showing the entities involved or disjointed scenes that could belong to multiple
        modes.
      score_1: Evidence explicitly depicts the defining characteristics of the specific
        narrative mode (e.g., combat actions for a 'battle', step-by-step instructions
        for a 'tutorial'), allowing the correct mode to be verified and alternative
        modes to be excluded.
      score_half: Evidence shows the entities or setting but the specific mode of
        interaction is ambiguous, implied, or could plausibly fit multiple narrative
        types (e.g., characters present but no clear action defining the event type).
      score_0: Evidence consists of disjointed scenes, generic shots, or content that
        fails to establish a coherent narrative mode, making it impossible to distinguish
        between options describing different types of events.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ranking_list_framing_explicitness
      description: Whether the evidence explicitly captures a framing device (e.g.,
        title card, narrator statement) that defines the video as a ranked list, countdown,
        or 'Top X' compilation, rather than only showing the individual items or a
        general topic discussion.
      score_1: Evidence explicitly identifies the video as a ranked list or countdown
        (e.g., 'Top 7', 'Greatest X', 'Number 1 to 10'), allowing options claiming
        a ranking to be verified and general topic options to be excluded.
      score_half: Evidence implies a list or sequence (e.g., shows multiple distinct
        items) but lacks the explicit 'ranking' or 'Top X' framing, making it ambiguous
        whether the video is a ranked list or a general survey.
      score_0: Evidence consists only of the content items or a general topic discussion
        without any explicit indication of a ranked list, countdown, or 'Top X' structure.
      weight: 3.0
      failure_repair_action: refine_query
    - name: enumerated_reasons_completeness
      description: Whether the evidence explicitly enumerates the specific set of
        reasons, causes, or factors asserted in the options, allowing the model to
        verify which items are present in the list and which are absent, rather than
        only mentioning the general topic or isolated examples.
      score_1: Evidence explicitly lists or articulates the specific reasons/factors
        corresponding to the options, enabling verification of presence and exclusion
        of unmentioned items.
      score_half: Evidence mentions the general topic or some specific reasons but
        fails to explicitly enumerate the full set or specific items required to distinguish
        between the options.
      score_0: Evidence discusses the general problem or shows isolated examples without
        explicitly listing the specific reasons or factors, making it impossible to
        determine which options were mentioned and which were not.
      weight: 3.0
      failure_repair_action: refine_query
    - name: experimental_finding_explicitness
      description: Whether the evidence explicitly states the specific empirical result,
        finding, or observation of an experiment, test, or measurement mentioned in
        the option, rather than only mentioning the experiment's existence, the researchers
        involved, or the general topic of the test.
      score_1: Evidence explicitly articulates the specific outcome or finding of
        the experiment (e.g., 'showed that X exists', 'measured Y', 'confirmed Z'),
        allowing the option's claim about the result to be verified or excluded.
      score_half: Evidence mentions the experiment, the researchers, or the setup
        but fails to explicitly state the specific result or finding, leaving the
        outcome ambiguous.
      score_0: Evidence discusses the topic or the existence of an experiment without
        any mention of its specific results, findings, or observations.
      weight: 3.0
      failure_repair_action: refine_query
    - name: initial_state_explicitness
      description: Whether the evidence explicitly identifies the specific initial
        condition, status, or state of the subject before the transformation, rather
        than only describing the subject's general situation, the cause of change,
        or the final outcome.
      score_1: Evidence explicitly names or describes the specific starting condition
        (e.g., a specific diagnosis, status, or state) that the option claims was
        the baseline before the change.
      score_half: Evidence implies a negative starting state or describes the subject's
        general situation but fails to explicitly name the specific condition asserted
        in the option.
      score_0: Evidence describes the subject, the cause, or the final outcome but
        contains no explicit identification of the specific initial condition, making
        it impossible to distinguish between options proposing different starting
        states.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negative_membership_explicitness
      description: Whether the evidence explicitly asserts the negation, exclusion,
        or departure of the target entity from the set or role specified in the option,
        rather than only listing positive associations or implying absence by omission.
      score_1: Evidence explicitly states the event or fact confirming the target
        did not serve, was not a member, or was excluded (e.g., 'resigned', 'fired',
        'never joined', 'did not serve').
      score_half: Evidence lists positive associations for the target but implies
        the negative claim only by the absence of a positive mention, without an explicit
        statement of exclusion or departure.
      score_0: Evidence only lists positive associations or discusses the target in
        a general context, providing no explicit information to verify the negative
        claim or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Reasoning:
    rubric_criteria:
    - name: causal_conditional_grounding
      description: Whether the evidence explicitly asserts the specific causal mechanism,
        conditional rule, or logical dependency (e.g., 'because', 'if...then', 'meant
        that') claimed in the option, rather than merely stating the antecedent or
        consequent in isolation.
      score_1: The evidence explicitly states the causal link or conditional rule
        that the option asserts or denies.
      score_half: The evidence mentions the components (cause and effect, or condition
        and result) but does not explicitly link them as a rule or cause.
      score_0: The evidence mentions only one side of the relationship or provides
        unrelated context, failing to ground the specific causal/conditional claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: semantic_definition_grounding
      description: Whether the evidence explicitly asserts the specific meaning, definition,
        or symbolic interpretation (e.g., 'meant', 'signified', 'represented', 'stood
        for') claimed in the option, rather than merely mentioning the symbol/term
        and the concept in isolation.
      score_1: The evidence explicitly states the semantic link or definition that
        the option asserts or denies.
      score_half: The evidence mentions the symbol/term and the concept separately
        but does not explicitly link them as a definition or meaning.
      score_0: The evidence mentions only the symbol/term or the concept in isolation,
        failing to ground the specific semantic claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribution_of_belief
      description: Whether the evidence explicitly attributes the specific belief,
        opinion, claim, or stance asserted in the option to the named entity, rather
        than merely mentioning the entity and the topic in proximity.
      score_1: The evidence explicitly states that the named entity holds, claims,
        or believes the specific proposition in the option.
      score_half: The evidence mentions the entity and the topic but the specific
        attribution of the belief/stance is implicit, ambiguous, or only partially
        stated.
      score_0: The evidence mentions the entity or the topic but fails to link the
        entity to the specific belief or stance required to verify or exclude the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: process_realization_grounding
      description: Whether the evidence explicitly asserts the successful execution,
        completion, or feasibility of the specific process, reconstruction, or technical
        action claimed in the option, rather than merely discussing the object's properties
        or the concept in the abstract.
      score_1: The evidence explicitly states that the specific process or reconstruction
        was completed, is possible, or has been realized as claimed.
      score_half: The evidence discusses the object or concept related to the process
        but does not explicitly confirm the execution, completion, or feasibility
        of the specific action.
      score_0: The evidence mentions only the object or unrelated context, failing
        to ground the claim about the process or reconstruction.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_grounding
      description: Whether the evidence explicitly provides the specific numerical
        value, measurement, or direct comparative scale (e.g., 'X meters', 'Y stories',
        'twice as tall as Z') required to verify or exclude a quantitative claim in
        the option, rather than merely using generic descriptors of size or magnitude.
      score_1: The evidence explicitly states the specific number, measurement, or
        direct comparison needed to confirm or refute the option's quantitative claim.
      score_half: The evidence provides related quantitative data or a vague comparison
        that partially constrains the claim but does not fully resolve the specific
        value or scale asserted.
      score_0: The evidence only uses generic qualitative descriptors (e.g., 'huge',
        'tall', 'grand') without specific numbers or direct comparisons, making the
        quantitative claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: legal_rule_content_grounding
      description: Whether the evidence explicitly asserts the specific content, provision,
        or rule of a legal code, statute, or institutional regulation claimed in the
        option, rather than merely mentioning the existence of the code, the actor's
        general legislative activity, or the political context.
      score_1: The evidence explicitly states the specific rule, right, or prohibition
        contained in the code or regulation that the option asserts or denies.
      score_half: The evidence mentions the existence of the code or the actor's general
        legislative actions but does not explicitly state the specific provision or
        rule required to verify or exclude the option.
      score_0: The evidence mentions only the actor, the general context, or unrelated
        political events, failing to ground the specific legal rule or provision.
      weight: 3.0
      failure_repair_action: refine_query
    - name: feasibility_status_grounding
      description: Whether the evidence explicitly asserts the feasibility, curability,
        solvability, or inherent possibility of the specific condition, disease, or
        problem claimed in the option, rather than merely describing the condition's
        existence, severity, or symptoms.
      score_1: The evidence explicitly states that the condition is curable, incurable,
        solvable, feasible, or impossible as claimed in the option.
      score_half: The evidence discusses the condition's severity, symptoms, or treatment
        difficulties but does not explicitly resolve the claim about its ultimate
        curability or feasibility.
      score_0: The evidence mentions the condition or related context but provides
        no information regarding whether it can be cured, solved, or resolved.
      weight: 3.0
      failure_repair_action: refine_query
    - name: population_subset_grounding
      description: Whether the evidence explicitly asserts the specific population
        scope and the specific subset within it (e.g., 'X% of Group A', 'most of Group
        B') required to verify or exclude a claim about a demographic distribution
        or subset behavior, rather than merely mentioning the general group or the
        subset in isolation.
      score_1: The evidence explicitly states the specific population scope and the
        specific subset relation (e.g., percentage, majority, specific group) claimed
        in the option.
      score_half: The evidence mentions the general population or the subset separately
        but fails to explicitly link them with the specific distribution or relation
        required.
      score_0: The evidence mentions only the general topic or unrelated groups, failing
        to ground the specific population scope or subset relation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_symbol_mapping_grounding
      description: Whether the evidence explicitly links a specific visual symbol,
        graphic element, color, or line on a map/diagram to the specific entity, route,
        or concept it represents (e.g., via on-screen labels, legends, or explicit
        narration defining the visual), rather than merely showing the visual and
        the concept in proximity.
      score_1: The evidence explicitly states or labels the specific meaning of the
        visual symbol (e.g., 'this red line represents X', 'the path of Y') required
        to verify or exclude the option.
      score_half: The evidence shows the visual symbol and mentions the related concept,
        but the explicit link defining what the symbol represents is implicit, ambiguous,
        or missing.
      score_0: The evidence shows the visual symbol or mentions the concept in isolation,
        but provides no information linking the specific visual element to its meaning.
      weight: 3.0
      failure_repair_action: refine_query
    - name: universal_quantifier_grounding
      description: Whether the evidence explicitly asserts the universal scope (e.g.,
        'all', 'every', 'universally', 'without exception') required to verify or
        exclude an option claiming a property holds for the entire set, rather than
        merely providing examples, partial coverage, or general trends.
      score_1: The evidence explicitly states that the property applies to all members
        of the set or that the condition is universal as claimed.
      score_half: The evidence provides strong examples or general trends suggesting
        the property is common, but lacks an explicit assertion of universality or
        'all'.
      score_0: The evidence only mentions specific instances, subsets, or general
        concepts without addressing whether the property applies to every member of
        the set.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_negation_grounding
      description: Whether the evidence explicitly asserts a negation, refutation,
        or denial of the specific proposition, scope, or identity claimed in an option
        (e.g., 'it is not X', 'this is an illusion', 'contrary to belief'), rather
        than merely failing to mention it or providing unrelated positive evidence.
      score_1: The evidence explicitly states that the option's claim is false, an
        illusion, or not the case, providing a direct basis for exclusion.
      score_half: The evidence implies the option is incorrect through context or
        partial contradiction but lacks an explicit statement of negation or refutation.
      score_0: The evidence does not address the option's claim with a negation; it
        either supports it, is neutral, or is silent on the specific refutation required.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agency_control_grounding
      description: Whether the evidence explicitly asserts the specific agent, mechanism,
        or nature of control/agency (e.g., 'X is in control', 'control is an illusion',
        'control is distributed') claimed in the option, rather than merely mentioning
        the entity or the concept of control in isolation.
      score_1: The evidence explicitly states the specific agent, mechanism, or nature
        of control (e.g., who is in control, or that control is an illusion/distributed)
        required to verify or exclude the option.
      score_half: The evidence mentions the entity or the concept of control but does
        not explicitly resolve the specific agent, mechanism, or nature of control
        claimed in the option.
      score_0: The evidence mentions only the entity or unrelated context, failing
        to ground the specific claim about who or what is in control or the nature
        of that control.
      weight: 3.0
      failure_repair_action: refine_query
    - name: shared_entity_grounding
      description: Whether the evidence explicitly asserts that the specific event,
        state, or attribute claimed in the option applies to all of the distinct entities
        or groups listed in the option (e.g., 'both X and Y', 'all three families'),
        rather than merely mentioning the entities separately or applying the claim
        to only one of them.
      score_1: The evidence explicitly links the specific claim to every entity or
        group mentioned in the option, confirming the shared nature of the event/state.
      score_half: The evidence mentions the entities and the claim, but the link is
        ambiguous, applies only to a subset of the entities, or implies the shared
        nature without explicit confirmation for all.
      score_0: The evidence mentions the entities or the claim in isolation, or applies
        the claim to only one entity, failing to verify that the event/state is shared
        by all specified entities.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thematic_scope_grounding
      description: Whether the evidence explicitly asserts the comprehensive scope,
        theme, or full range of topics covered by the video (e.g., 'covers everything
        from X to Y', 'the theme is Z') required to verify or exclude an option claiming
        to represent the whole, rather than merely providing evidence for a specific
        sub-topic or segment.
      score_1: The evidence explicitly states the overall theme, scope, or complete
        range of topics that the option claims to represent.
      score_half: The evidence mentions multiple topics or a broad context but does
        not explicitly define the comprehensive scope or theme as a unified whole.
      score_0: The evidence only covers a specific sub-topic, segment, or isolated
        detail without addressing the video's overall theme or scope.
      weight: 3.0
      failure_repair_action: refine_query
    - name: functional_role_composition_grounding
      description: Whether the evidence explicitly asserts the specific functional
        roles, capacities, or dual nature (e.g., 'X is both A and B', 'X is only A',
        'X functions as Y') claimed in the option, rather than merely describing the
        entity's operational flow, market position, or general activities.
      score_1: The evidence explicitly states the specific functional roles or composition
        (e.g., 'lender and network', 'network only') required to verify or exclude
        the option's claim about the entity's nature.
      score_half: The evidence describes the entity's operations or market behavior
        that implies the roles but does not explicitly state the specific functional
        composition or dual nature claimed.
      score_0: The evidence mentions the entity or its general activities but provides
        no explicit assertion of the specific functional roles or composition required
        to verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relationship_break_grounding
      description: Whether the evidence explicitly asserts a break, decoupling, weakening,
        or failure of the specific relationship or link between two variables claimed
        in the option (e.g., 'the link is broken', 'no longer correlated', 'decoupled'),
        rather than merely discussing the variables in isolation or asserting a different
        causal mechanism.
      score_1: The evidence explicitly states that the specific relationship or link
        between the variables has broken, weakened, or ceased to exist as claimed.
      score_half: The evidence discusses the variables and implies a change in their
        relationship but lacks an explicit assertion of a break, decoupling, or weakening.
      score_0: The evidence mentions the variables or discusses other causal factors
        but provides no explicit assertion that the specific relationship has broken
        or weakened.
      weight: 3.0
      failure_repair_action: refine_query
    - name: strategic_shift_grounding
      description: Whether the evidence explicitly asserts the specific strategic
        shift, business model change, or operational adaptation (e.g., 'shifted focus
        to X', 'adopted a new model', 'changed from A to B') claimed in the option,
        rather than merely describing the entity's static state, a causal outcome,
        or the context of the change.
      score_1: The evidence explicitly states the specific change in strategy, model,
        or operation that the option asserts or denies.
      score_half: The evidence describes the entity's state before or after the change,
        or the context necessitating a change, but does not explicitly state the specific
        strategic shift or adaptation itself.
      score_0: The evidence mentions the entity or the context but provides no information
        about a specific change in strategy, business model, or operational approach.
      weight: 3.0
      failure_repair_action: refine_query
    - name: system_development_attribution
      description: Whether the evidence explicitly attributes the creation, development,
        or introduction of a specific system, method, framework, or classification
        scheme to the named entity, rather than merely mentioning the entity and the
        concept or the existence of the system in isolation.
      score_1: The evidence explicitly states that the named entity created, developed,
        or introduced the specific system or method claimed in the option.
      score_half: The evidence mentions the entity and the system/method separately,
        or implies a connection, but lacks an explicit statement attributing the development
        or introduction of the system to the entity.
      score_0: The evidence mentions the entity or the system/method in isolation,
        failing to link the entity to the creation or development of the specific
        system.
      weight: 3.0
      failure_repair_action: refine_query
    - name: universal_stance_grounding
      description: Whether the evidence explicitly asserts that the specific belief,
        opinion, or stance claimed in the option is held by every member of the group
        specified in the option (e.g., 'both X and Y', 'all participants'), rather
        than merely attributing the stance to a subset or a single member.
      score_1: The evidence explicitly states or clearly implies that each named entity
        in the group holds the specific stance required to verify or exclude the option.
      score_half: The evidence attributes the stance to some but not all members of
        the specified group, or the attribution for one or more members is ambiguous
        or missing.
      score_0: The evidence attributes the stance to only one member, a subset, or
        fails to link the stance to the specific group members required to verify
        the 'all/both' claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: proposition_assertion_vs_hypothetical
      description: Whether the evidence explicitly asserts the specific proposition
        in the option as a fact, a plausible reality, or a held belief, rather than
        merely discussing the topic hypothetically, describing potential consequences,
        or stating it as a possibility without commitment.
      score_1: The evidence explicitly states that the proposition is true, plausible,
        or the speaker believes it to be the case.
      score_half: The evidence discusses the topic or its implications but the assertion
        of the proposition's truth is ambiguous, conditional, or presented only as
        a possibility without a clear stance.
      score_0: The evidence only discusses the topic hypothetically, describes what
        would happen if it were true, or mentions the concept without asserting its
        actual existence or plausibility.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_prediction_grounding
      description: Whether the evidence explicitly asserts the specific future timeline,
        deadline, or duration (e.g., 'within X years', 'by date Y', 'in the next decade')
        required to verify or exclude an option making a temporal prediction, rather
        than merely discussing the event's possibility or using vague temporal descriptors.
      score_1: The evidence explicitly states the specific time window, date, or duration
        that matches or contradicts the option's prediction.
      score_half: The evidence mentions a vague timeframe (e.g., 'soon', 'eventually',
        'long term') or discusses the event's likelihood without providing the specific
        numerical or dated prediction required to distinguish between options.
      score_0: The evidence discusses the event or topic but provides no specific
        temporal prediction, deadline, or duration to verify or exclude the option's
        timeline claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: trade_off_cost_grounding
      description: Whether the evidence explicitly asserts the specific cost, sacrifice,
        negative consequence, or 'catch' associated with the action, state, or benefit
        claimed in the option, rather than merely stating the benefit or action in
        isolation.
      score_1: The evidence explicitly states the specific cost, sacrifice, or negative
        consequence (e.g., 'no food', 'go hungry', 'lose weight') that accompanies
        the benefit or action mentioned in the option.
      score_half: The evidence mentions the benefit or action and implies a cost or
        difficulty, but does not explicitly state the specific negative consequence
        or trade-off required to fully verify the option's context.
      score_0: The evidence only mentions the benefit, action, or positive aspect
        without any reference to the associated cost, sacrifice, or negative consequence,
        failing to ground the trade-off claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_enumeration_grounding
      description: Whether the evidence explicitly asserts the specific ordinal position
        (e.g., 'first', 'second', 'last', 'next') of the item or event claimed in
        the option within a sequence, list, or timeline, rather than merely mentioning
        the item as part of a set without specifying its rank or order.
      score_1: The evidence explicitly states the specific ordinal position (e.g.,
        'the second line of evidence', 'the first step') required to verify or exclude
        the option's claim about sequence.
      score_half: The evidence mentions the item as part of a sequence or list but
        does not explicitly state its specific ordinal rank (e.g., mentions 'lines
        of evidence' but not which is 'second').
      score_0: The evidence mentions the item in isolation or as part of a general
        set without any reference to a sequence, order, or specific rank.
      weight: 3.0
      failure_repair_action: refine_query
    - name: mechanism_mode_grounding
      description: Whether the evidence explicitly asserts the specific physical mechanism,
        mode of action, or process type (e.g., 'shearing', 'erosion', 'chemical reaction',
        'mutual stress') claimed in the option, rather than merely describing the
        event's occurrence, the entities involved, or the outcome in isolation.
      score_1: The evidence explicitly states the specific mechanism or mode of action
        (e.g., 'due to shearing', 'caused by erosion') that the option asserts or
        denies.
      score_half: The evidence describes the event, the entities, or the outcome,
        and implies a mechanism, but does not explicitly name or define the specific
        physical process or mode of action claimed.
      score_0: The evidence mentions only the event, entities, or outcome without
        any reference to the specific mechanism or mode of action required to verify
        or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: functional_purpose_grounding
      description: Whether the evidence explicitly asserts the specific purpose, intended
        use, or primary function (e.g., 'used to X', 'designed for Y', 'functions
        to Z') of the target entity claimed in the option, rather than merely describing
        the entity's physical presence, location, or unrelated activities.
      score_1: The evidence explicitly states the specific purpose or function of
        the entity that the option asserts or denies.
      score_half: The evidence describes the entity's context, location, or related
        activities but does not explicitly state its specific intended purpose or
        function.
      score_0: The evidence mentions the entity or unrelated context but provides
        no information about what the entity is used for or its specific function.
      weight: 3.0
      failure_repair_action: refine_query
    - name: future_scenario_content_grounding
      description: Whether the evidence explicitly asserts the specific future event,
        state change, or hypothetical scenario (e.g., 'X will split', 'Y might become
        Z') claimed in the option, rather than merely discussing general future uncertainty,
        vague changes, or unrelated timelines.
      score_1: The evidence explicitly states the specific future event, outcome,
        or hypothetical scenario that the option asserts or denies.
      score_half: The evidence discusses future changes or possibilities in general
        terms or mentions a timeline but fails to specify the exact event or scenario
        claimed in the option.
      score_0: The evidence mentions the future or general uncertainty but provides
        no specific description of the event, state change, or scenario required to
        verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: status_identity_grounding
      description: Whether the evidence explicitly asserts the specific socio-economic
        status, occupation, role, or identity label (e.g., 'owner', 'farmer', 'merchant',
        'wealthy', 'poor') claimed in the option for the specific entity or group,
        rather than merely describing their possessions, actions, or general context
        that implies such a status.
      score_1: The evidence explicitly states that the specific entity or group holds
        the specific status, occupation, or identity label claimed in the option.
      score_half: The evidence describes the entity's possessions, actions, or context
        that strongly implies the status, but does not explicitly use the specific
        label or assert the identity directly.
      score_0: The evidence mentions the entity or related context but provides no
        explicit assertion of the specific status, occupation, or identity label required
        to verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_status_link_grounding
      description: Whether the evidence explicitly asserts that the specific observed
        feature, attribute, or artifact serves as the evidence or indicator for the
        specific socio-economic status, identity, or role claimed in the option, rather
        than merely mentioning the feature and the status separately or implying the
        link.
      score_1: The evidence explicitly states that the specific feature (e.g., tools,
        architecture, diet) indicates, suggests, or proves the specific status/identity
        claimed in the option.
      score_half: The evidence mentions the specific feature and the specific status,
        but the explicit link stating that the feature is the evidence for the status
        is implicit, ambiguous, or only partially stated.
      score_0: The evidence mentions the feature or the status in isolation, or mentions
        them in proximity without asserting that the feature is the specific evidence
        for that status.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relational_pair_grounding
      description: Whether the evidence explicitly identifies the specific entities
        on both sides of the relationship, conflict, or interaction claimed in the
        option (e.g., 'X and Y are the conflicting parties'), rather than merely mentioning
        one entity, the general context, or the entities in isolation without establishing
        the specific dyadic link.
      score_1: The evidence explicitly identifies both specific entities involved
        in the relationship or conflict and establishes their interaction as the focus.
      score_half: The evidence identifies one entity and implies the other, or mentions
        both entities but fails to explicitly establish the specific relationship
        or conflict between them.
      score_0: The evidence mentions only one entity, the general context, or unrelated
        entities, failing to identify the specific pair required to verify or exclude
        the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_invalidity_grounding
      description: Whether the evidence explicitly asserts a specific flaw, fabrication,
        error, or invalidity mechanism (e.g., 'the witness is a liar', 'the footage
        is duplicated', 'the sample was contaminated') that undermines the credibility
        of a specific piece of evidence claimed in the option, rather than merely
        discussing general procedural objections, legal strategy, or the existence
        of the evidence in isolation.
      score_1: The evidence explicitly states the specific flaw, fabrication, or error
        that invalidates the evidence as claimed in the option.
      score_half: The evidence discusses the evidence or implies a problem (e.g.,
        general doubt, procedural objection) but does not explicitly state the specific
        mechanism of invalidity (e.g., lying, duplication, contamination) required
        to verify or exclude the option.
      score_0: The evidence mentions the evidence or general legal context but provides
        no specific assertion of a flaw, fabrication, or error that would invalidate
        it.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Reasoning:
    rubric_criteria:
    - name: evidence_modality_match
      description: Whether the evidence contains the specific visual artifact, modality,
        or medium (e.g., murals, on-screen text, specific objects) that an option
        explicitly claims as the basis for a conclusion or observation.
      score_1: The specific visual artifact or medium cited in the option is present
        and verifiable in the evidence.
      score_half: The artifact is partially visible or the link between the artifact
        and the conclusion is ambiguous.
      score_0: The specific visual artifact or medium cited in the option is entirely
        absent from the evidence.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: evidence_spatial_extent
      description: Whether the evidence provides a view, map, or data spanning the
        full geographic scope, territorial boundaries, or spatial range required to
        verify or exclude an option's claim about extent.
      score_1: The evidence explicitly visualizes or states the full spatial range
        or boundaries asserted in the option.
      score_half: The evidence shows part of the range or implies the extent without
        explicitly covering the full scope.
      score_0: The evidence is limited to a single location or lacks any information
        about the spatial extent required by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_causal_linkage
      description: Whether the evidence explicitly states or visualizes the functional
        connection, causal mechanism, or transport route linking the entities or events
        asserted in the option, rather than merely presenting the entities in isolation.
      score_1: The evidence explicitly describes the mechanism, route, or causal link
        that connects the option's components (e.g., 'cargo moved via X to Y', 'need
        Z caused construction of W').
      score_half: The evidence presents the relevant entities or events but the specific
        link, route, or causal mechanism between them is implied or missing.
      score_0: The evidence lists the entities or events separately without any information
        connecting them functionally or causally.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_deviation_grounding
      description: Whether the evidence explicitly visualizes or states the specific
        deviation, modification, or substitution of a standard element, role, or expected
        state asserted in the option, rather than merely identifying the subject or
        the standard itself.
      score_1: The evidence explicitly shows or states the specific way the subject
        differs from the standard/expected state (e.g., 'X is holding Y instead of
        Z').
      score_half: The evidence identifies the subject and the standard but the specific
        deviation is only implied or partially visible.
      score_0: The evidence identifies the subject or the standard but provides no
        information about the specific deviation or modification claimed in the option.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: evidence_lineage_grounding
      description: Whether the evidence explicitly links a specific visual feature,
        motif, or stylistic element to its asserted historical origin, antecedent,
        or stylistic lineage, rather than merely identifying the feature or citing
        a different historical context.
      score_1: The evidence explicitly states or visualizes the connection between
        the specific feature and the specific historical source or style claimed in
        the option.
      score_half: The evidence identifies the feature and mentions a historical period
        or style, but the specific link between the feature and that source is ambiguous
        or conflated with other works.
      score_0: The evidence identifies the feature but provides no information about
        its historical origin, or links it to an incorrect or unrelated historical
        context.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_thematic_synthesis
      description: Whether the evidence explicitly states the overarching theme, main
        idea, or synthesized thesis asserted in the option, rather than merely listing
        the specific details, examples, or sub-topics discussed.
      score_1: The evidence explicitly contains the speaker's or narrator's summary
        statement, thesis, or main idea that matches the option's scope.
      score_half: The evidence lists the specific details or examples that support
        the theme, but the explicit summary statement or main idea is missing or implied.
      score_0: The evidence only contains isolated details or examples without any
        indication of the overarching theme or main idea.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_misconception_grounding
      description: Whether the evidence explicitly states the specific proposition,
        belief, or assumption that the subject holds (or lacks) which constitutes
        the misunderstanding, rather than merely identifying the subject or the correct
        fact in isolation.
      score_1: The evidence explicitly articulates the specific content of the subject's
        misunderstanding or the specific knowledge gap (e.g., 'X thinks Y' or 'X does
        not know Z').
      score_half: The evidence identifies the subject and the correct fact, but the
        specific content of the subject's erroneous belief or knowledge gap is only
        implied or not explicitly stated.
      score_0: The evidence identifies the subject or the correct fact but provides
        no information about the subject's specific belief, assumption, or lack of
        knowledge.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_format_artifacts
      description: Whether the evidence visualizes the specific format, aspect ratio,
        interface elements, or medium-specific artifacts of the content itself, which
        are necessary to deduce the capture method, source device, or production technique.
      score_1: The evidence explicitly shows the content's format, aspect ratio, or
        interface artifacts (e.g., vertical video, specific UI overlays, screen recording
        borders) that directly indicate the capture method or source.
      score_half: The evidence shows the content but the specific format or artifacts
        indicating the capture method are ambiguous, partially obscured, or not clearly
        linked to a specific device.
      score_0: The evidence discusses the content or the devices in abstract terms
        but does not visualize the content's specific format or artifacts needed to
        determine the capture method.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: evidence_content_visualization
      description: Whether the specific visual content instance, clip, or media object
        asserted or queried in the option is explicitly visualized in the evidence,
        rather than merely described, discussed, or referenced by name.
      score_1: The specific visual content instance (e.g., the video clip, image,
        or scene) is directly shown in the evidence, allowing its properties to be
        observed.
      score_half: The content is partially shown, obscured, or only a small fragment
        is visible, making full observation difficult.
      score_0: The content is only mentioned, described, or discussed in speech/text,
        but the visual instance itself is not present in the evidence.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: evidence_relational_dynamic
      description: Whether the evidence explicitly visualizes or states the specific
        interaction, dialogue, or behavior between the entities that demonstrates
        the relational dynamic (e.g., support, conflict, understanding, rejection)
        asserted in the option, rather than merely reporting the relationship status
        or describing it from a third-party perspective.
      score_1: The evidence contains direct interactions, dialogue, or actions between
        the entities that explicitly demonstrate the specific relational dynamic claimed
        in the option.
      score_half: The evidence contains third-party descriptions of the relationship
        or isolated actions that imply the dynamic but lack direct interaction between
        the specific entities.
      score_0: The evidence only mentions the entities or the relationship in abstract
        terms without any interaction, dialogue, or behavior demonstrating the specific
        dynamic.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_causal_grounding
      description: Whether the evidence explicitly states or visualizes the specific
        cause (internal motivation, external constraint, or physical mechanism) that
        explains why an agent performed an action or entered a specific state, rather
        than merely describing the action, its consequences, or ambiguous visual cues
        that could support multiple alternative causes.
      score_1: The evidence explicitly contains a specific indicator (e.g., dialogue,
        text, visual artifact) that identifies the precise cause (internal or external)
        of the action/state, allowing alternative causes to be excluded.
      score_half: The evidence shows the action and context, and the cause is strongly
        implied or suggested by ambiguous cues, but the specific mechanism or reason
        is not explicitly stated or visualized, leaving multiple options plausible.
      score_0: The evidence describes the action, the agent, or the outcome, but provides
        no specific information about the cause, or only provides ambiguous cues that
        do not distinguish between the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_temporal_bracketing
      description: Whether the evidence explicitly covers the specific time interval
        immediately following a triggering event or state change required to verify
        or exclude an option's claim about the subsequent reason, action, or state.
      score_1: The evidence explicitly includes the scene or dialogue occurring in
        the time window immediately after the triggering event, allowing the subsequent
        reason or action to be observed or inferred.
      score_half: The evidence includes the triggering event or the subsequent state,
        but the specific interval connecting them (the immediate aftermath) is missing
        or fragmented, making the causal link ambiguous.
      score_0: The evidence is limited to the time before the triggering event, or
        the subsequent interval is entirely absent, preventing verification of the
        reason for the post-event state.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: evidence_pre_action_context
      description: Whether the evidence explicitly covers the state, event, or context
        immediately preceding the queried action that serves as the trigger or motivation
        for that action, rather than only showing the action itself or its consequences.
      score_1: The evidence includes the specific scene, dialogue, or state change
        occurring immediately before the action that explains the agent's motivation
        or the cause of the action.
      score_half: The evidence shows the action and some context, but the specific
        pre-action trigger or motivating state is missing, fragmented, or ambiguous.
      score_0: The evidence is limited to the action itself, its consequences, or
        unrelated events, with no information about the state or trigger immediately
        preceding the action.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: evidence_auditory_tone
      description: Whether the evidence explicitly contains the specific auditory
        cues (dialogue content, vocal tone, laughter, specific sound effects) required
        to verify or exclude an option's claim about the emotional impression, mood,
        or tone of the scene.
      score_1: The evidence explicitly includes the specific dialogue, vocal quality,
        or sound that directly establishes the emotional tone or impression asserted
        in the option.
      score_half: The evidence mentions the presence of sound or dialogue but lacks
        the specific content or tonal quality needed to distinguish the specific impression,
        or the link between the sound and the impression is ambiguous.
      score_0: The evidence describes only visual elements, explicitly states the
        absence of relevant sound, or provides no auditory information to support
        or exclude the emotional impression.
      weight: 3.0
      failure_repair_action: asr_match
    - name: evidence_valence_consistency
      description: Whether the evidence presents a consistent directional signal (e.g.,
        exclusively positive, exclusively negative, or exclusively neutral) regarding
        the interaction or relationship, rather than a mixture of contradictory behaviors
        that creates ambiguity about the specific dynamic.
      score_1: The evidence contains only interactions or cues that align with a single
        relational valence (e.g., all friendly or all hostile), allowing the specific
        option to be verified and contradictory options excluded.
      score_half: The evidence contains a mix of positive and negative interactions,
        or the dominant valence is ambiguous, making it impossible to definitively
        verify one specific relational option over its opposite.
      score_0: The evidence lacks any clear interaction cues or contains only neutral/ambiguous
        behaviors that do not support any specific relational valence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_internal_reasoning_content
      description: Whether the evidence explicitly contains the specific propositional
        content of the agent's internal reasoning, thought process, or the specific
        details of the situation that constitute the cause of their state or action,
        rather than merely showing the state/action or a generic context that could
        support multiple alternative causes.
      score_1: The evidence explicitly states or visualizes the specific content of
        the agent's reasoning or the specific situational details that uniquely identify
        the cause (e.g., the specific lie, the specific fear, the specific constraint).
      score_half: The evidence shows the agent's state and a general context, but
        the specific content of their reasoning or the specific details distinguishing
        the cause are only implied or ambiguous.
      score_0: The evidence shows the agent's state or action and a generic context,
        but provides no specific information about the agent's internal reasoning
        or the specific details of the situation that would allow distinguishing between
        alternative causes.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_alternative_standard_explicitness
      description: Whether the evidence explicitly states the specific alternative
        behavior, normative standard, or preferred method that the agent advocates
        for, rather than merely describing the problem, the agent's negative reaction
        to the current behavior, or the context of the conflict.
      score_1: The evidence explicitly contains the agent's statement or demonstration
        of the specific alternative behavior or standard they want the subject to
        adopt.
      score_half: The evidence describes the problem or the agent's disapproval of
        the current behavior, and the alternative is strongly implied but not explicitly
        stated or demonstrated.
      score_0: The evidence only describes the problem, the agent's negative reaction,
        or the context, with no explicit statement or demonstration of the specific
        alternative behavior or standard advocated.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_temporal_alignment
      description: Whether the evidence explicitly covers the specific time window,
        life stage, or era asserted in the query (e.g., childhood, past, future) required
        to verify or exclude the option, rather than only providing evidence from
        a different time period.
      score_1: The evidence explicitly contains scenes, dialogue, or visual cues from
        the specific time window or life stage queried, allowing the state or trait
        to be verified or excluded for that period.
      score_half: The evidence contains some cues from the queried time window but
        is dominated by or mixed with evidence from a different period, making the
        specific state for the queried time ambiguous.
      score_0: The evidence is entirely from a different time period or life stage
        than the one queried, providing no information to verify or exclude the option
        for the specific time window.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: evidence_trait_explicitness
      description: Whether the evidence explicitly states or visualizes the specific
        internal state, personality trait, or behavioral disposition of the agent
        asserted in the option, rather than merely showing the agent's actions, identity,
        or generic context.
      score_1: The evidence explicitly contains a statement (by the agent or another
        character) or a clear visual demonstration that directly identifies the specific
        trait or state (e.g., 'X is naughty', 'X is quiet', 'X is acting rebelliously')
        required to verify or exclude the option.
      score_half: The evidence shows the agent's actions or context that imply the
        trait, but the specific trait is not explicitly stated or the visual demonstration
        is ambiguous, leaving multiple trait options plausible.
      score_0: The evidence only shows the agent's identity, generic actions, or context
        without any explicit statement or clear visual cue that identifies the specific
        internal state or personality trait asserted in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_target_belief_content
      description: Whether the evidence explicitly states the specific propositional
        content of the belief, assumption, or criterion held by the target agent that
        the persuader's action targets or relies upon, rather than merely showing
        the action or a generic context.
      score_1: The evidence explicitly articulates the specific belief, assumption,
        or criterion (e.g., 'X believes Y', 'X values Z') that the agent's action
        is designed to address or exploit.
      score_half: The evidence implies the target's belief or criterion through context
        or generic statements, but the specific propositional content is not explicitly
        stated.
      score_0: The evidence shows the agent's action or the target's reaction but
        provides no information about the specific belief, assumption, or criterion
        that the action targets.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_method_mechanism_explicitness
      description: Whether the evidence explicitly states the specific functional
        mechanism, operational logic, or intended outcome of a proposed method, research
        focus, or solution asserted in the option, rather than merely identifying
        the general topic, problem, or field of study.
      score_1: The evidence explicitly articulates the specific mechanism or outcome
        (e.g., 'evaluate X differently', 'use Y to achieve Z') that distinguishes
        the option from alternatives proposing different mechanisms.
      score_half: The evidence identifies the general topic or problem area and implies
        a solution, but the specific mechanism or intended outcome is not explicitly
        stated, leaving multiple mechanistic options plausible.
      score_0: The evidence only mentions the general topic, the researcher, or the
        problem being studied, with no information about the specific mechanism, method,
        or outcome of the proposed solution.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_diagnosis_explicitness
      description: Whether the evidence explicitly states or visualizes the specific
        medical diagnosis, clinical condition, or health label asserted in the option
        as the cause of the agent's action, rather than merely describing general
        symptoms, risks, or dietary habits that could support multiple alternative
        diagnoses.
      score_1: The evidence explicitly contains the specific medical diagnosis or
        clinical label (e.g., 'diabetes', 'anemia', 'tooth decay') that uniquely identifies
        the cause asserted in the option.
      score_half: The evidence describes symptoms, risks, or general health issues
        that imply a condition, but the specific medical diagnosis or label is not
        explicitly stated, leaving multiple diagnostic options plausible.
      score_0: The evidence only mentions general health risks, dietary habits, or
        vague symptoms without any specific medical diagnosis or clinical label to
        distinguish between the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_scope_completeness
      description: Whether the evidence explicitly addresses the full scope of the
        population, set, or group asserted in the option (e.g., 'all', 'only', 'the
        community') rather than only a specific subgroup, instance, or partial view
        that could support a different quantifier.
      score_1: The evidence explicitly covers the entire group or provides a definitive
        counter-example that allows universal claims (e.g., 'only X') to be verified
        or excluded for the whole group.
      score_half: The evidence covers a significant portion or a specific subgroup
        of the group, but lacks explicit information about the rest of the group or
        a definitive counter-example, leaving the scope of the claim ambiguous.
      score_0: The evidence is limited to a single instance, a specific subgroup,
        or a partial view that does not allow verification or exclusion of claims
        about the entire group or set.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_normative_self_report
      description: Whether the evidence explicitly contains the agent's own statement,
        rule, or self-identified standard regarding the behavior, practice, or preference
        asserted in the option, rather than relying solely on third-party observation
        of the agent's actions or the presence of related objects.
      score_1: The evidence includes a direct statement by the agent (or authoritative
        representative) explicitly defining their rule, preference, or standard for
        the behavior in question, allowing the distinction between observed exceptions
        and the normative practice.
      score_half: The evidence contains third-party descriptions or visual observations
        of the behavior, but the agent's own explicit articulation of their rule or
        preference is missing or ambiguous.
      score_0: The evidence relies entirely on visual observation of actions or objects
        without any explicit statement from the agent regarding their intended practice,
        rule, or preference.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evidence_exception_scope_explicitness
      description: Whether the evidence explicitly states the specific conditions,
        contexts, or functional roles under which a stated general rule, norm, or
        practice is deviated from or supplemented, rather than merely stating the
        general rule or showing isolated instances of deviation without context.
      score_1: The evidence explicitly articulates the specific scope, condition,
        or function (e.g., 'for business', 'in emergencies') that defines the exception
        or supplement to the general rule, allowing the distinction between 'only
        X' and 'X and Y' to be verified.
      score_half: The evidence states the general rule and shows or implies an exception,
        but the specific condition or functional scope defining the exception is ambiguous
        or not explicitly linked to the rule.
      score_0: The evidence states the general rule or shows isolated instances of
        deviation, but provides no explicit information about the specific conditions
        or scope under which the deviation occurs, making it impossible to distinguish
        between a universal rule and a rule with exceptions.
      weight: 1.0
      failure_repair_action: refine_query
    - name: evidence_attribution_scope
      description: Whether the evidence explicitly distinguishes which specific agents
        within a group hold the asserted motivation, trait, or preference, rather
        than merely showing the group's collective behavior or the behavior of a single
        member without clarifying the others' internal states.
      score_1: The evidence explicitly states or demonstrates the specific motivation/trait
        for each relevant agent (e.g., 'X does Y because of Z, but W does Y because
        of Q'), allowing options that misattribute the cause to the wrong agent or
        group to be excluded.
      score_half: The evidence shows the behavior of the group or a specific member,
        and implies the motivation for one, but lacks explicit information distinguishing
        the internal states or motivations of the other agents in the group.
      score_0: The evidence only shows the collective behavior or the behavior of
        one agent without any information about the specific motivations or internal
        states of the other agents, making it impossible to distinguish between options
        that attribute the cause to different members.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Counting Problem:
    rubric_criteria:
    - name: entity_uniqueness_and_completeness
      description: Whether the evidence identifies all distinct instances of the target
        entity type across the entire relevant duration and distinguishes them to
        support a precise count.
      score_1: Evidence explicitly identifies every unique instance of the target
        entity and provides sufficient distinguishing features to confirm the total
        count without omission or double-counting.
      score_half: Evidence identifies some instances but misses others, or fails to
        clearly distinguish between similar instances, making the exact count uncertain.
      score_0: Evidence only shows a subset of instances or cannot distinguish unique
        entities, making a precise count impossible.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: action_execution_verification
      description: Whether the evidence explicitly demonstrates the execution of the
        action or state change required to count an instance, rather than merely showing
        the presence of the entity or materials involved.
      score_1: Evidence explicitly shows the action (e.g., application, usage, occurrence)
        being performed for every instance counted.
      score_half: Evidence shows the action for some instances but only the presence
        of materials or potential for others.
      score_0: Evidence only shows materials, tools, or potential instances without
        confirming the action was actually performed.
      weight: 4.0
      failure_repair_action: refine_query
    - name: entity_identity_verification
      description: Whether the evidence explicitly identifies the target entity by
        name, label, or unique identifier required to confirm it matches the query's
        specific subject, rather than showing an unlabelled instance of a generic
        class.
      score_1: The evidence explicitly names or labels the target entity, confirming
        it is the specific subject of the query.
      score_half: The evidence shows an entity that likely matches the subject but
        lacks explicit naming or labeling, leaving identity uncertain.
      score_0: The evidence shows only generic instances of the entity type without
        any identification, making it impossible to confirm if the specific subject
        is present.
      weight: 4.0
      failure_repair_action: asr_match
    - name: temporal_context_alignment
      description: Whether the evidence explicitly confirms that each counted instance
        occurs within the specific time window, era, or contextual condition specified
        in the query, rather than merely showing the entity at any time.
      score_1: Evidence explicitly links every counted instance to the required time
        window or context, allowing instances outside this scope to be excluded.
      score_half: Evidence links some instances to the required scope but leaves the
        temporal or contextual status of others ambiguous.
      score_0: Evidence shows the entity but fails to establish whether the instances
        fall within the required time window or context, making it impossible to filter
        correctly.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: explicit_numerical_assertion
      description: Whether the evidence explicitly states the specific numerical count
        or quantity required to verify or exclude the options, rather than merely
        showing the instances to be counted or implying a number.
      score_1: The evidence explicitly states the exact number or quantity (e.g.,
        'two cases', 'three times') that matches or contradicts the options.
      score_half: The evidence implies a number through partial listing or vague quantifiers
        (e.g., 'several', 'a few') but does not state the exact count.
      score_0: The evidence shows instances or discusses the topic but provides no
        explicit numerical value or count to verify the options.
      weight: 4.0
      failure_repair_action: refine_query
    - name: instance_naming_for_counting
      description: Whether the evidence explicitly names or uniquely identifies each
        distinct instance required to verify the count, rather than merely showing
        generic examples of the entity class.
      score_1: Evidence explicitly names or provides unique identifiers for every
        instance counted, allowing the total number of cited cases to be determined.
      score_half: Evidence names some instances but leaves others unnamed or generic,
        making the exact count of cited cases uncertain.
      score_0: Evidence shows only generic examples of the entity type without naming
        or uniquely identifying specific instances, making it impossible to count
        the cited cases.
      weight: 4.0
      failure_repair_action: asr_match
    - name: process_finalization_verification
      description: Whether the evidence explicitly confirms that the action or process
        for each counted instance was completed, finalized, or transitioned to a new
        state, rather than merely showing the process in progress or potential.
      score_1: Evidence explicitly shows the completion, application, or finalization
        of the process for every instance counted (e.g., 'apply' button clicked, changes
        saved, transition to next item, or explicit statement of completion).
      score_half: Evidence shows the process for some instances is completed, but
        for others it is only shown in progress or the outcome is implied but not
        explicitly confirmed.
      score_0: Evidence only shows the process in progress, materials, or potential
        actions without confirming that the process was actually completed or finalized
        for any instance.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: sequential_distinction_verification
      description: Whether the evidence explicitly confirms that consecutive instances
        of the target entity or action are distinct from one another, rather than
        being repeated actions on the same instance.
      score_1: Evidence explicitly shows a transition, state change, or explicit statement
        confirming that each subsequent instance is a new, distinct entity or event
        separate from the previous one.
      score_half: Evidence shows multiple instances but the distinction between them
        is implied or ambiguous (e.g., no clear transition shown, or it is unclear
        if the action is on a new item or the same one).
      score_0: Evidence shows a sequence of actions or instances but provides no confirmation
        that they are distinct, leaving open the possibility that they all refer to
        the same single instance.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: complete_set_enumeration
      description: Whether the evidence presents a complete, aggregated enumeration
        of all instances in the target set (e.g., via a list, chart, or explicit total)
        rather than merely showing a subset of examples or individual instances.
      score_1: Evidence provides a complete view or explicit list of all instances
        required for the count, allowing the total to be determined directly.
      score_half: Evidence shows a significant portion of the set or implies the total
        but lacks a complete, explicit enumeration of all instances.
      score_0: Evidence only shows a subset of instances or individual examples without
        providing a mechanism to determine the total count of the entire set.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: grouping_rule_application
      description: Whether the evidence explicitly supports the application of a specific
        grouping, aggregation, or classification rule required to merge distinct named
        instances into a single countable unit, rather than merely listing the distinct
        instances.
      score_1: Evidence explicitly demonstrates or states the rule for grouping distinct
        instances (e.g., variants, sub-models) into a single unit, allowing the correct
        aggregated count to be derived.
      score_half: Evidence lists the distinct instances and implies a relationship,
        but does not explicitly confirm the grouping rule or the resulting merged
        count.
      score_0: Evidence lists distinct instances but provides no basis for applying
        the required grouping rule, making it impossible to determine if they should
        be counted separately or together.
      weight: 4.0
      failure_repair_action: refine_query
    - name: threshold_condition_verification
      description: Whether the evidence explicitly confirms that the specific attribute
        value for each counted instance satisfies the quantitative threshold or comparative
        condition specified in the query, rather than merely listing attribute values
        that do not meet the condition.
      score_1: Evidence explicitly shows or states that the attribute value for every
        counted instance meets or exceeds the required threshold (e.g., speed > 300
        mph), allowing instances below the threshold to be excluded.
      score_half: Evidence shows attribute values for some instances but fails to
        explicitly confirm whether they meet the threshold, or shows values that are
        close but ambiguous relative to the threshold.
      score_0: Evidence lists attribute values for instances but none are explicitly
        confirmed to meet the required threshold, or the evidence only shows values
        that clearly fail the condition.
      weight: 4.0
      failure_repair_action: refine_query
    - name: simultaneous_set_visibility
      description: Whether the evidence presents all instances of the target entity
        type simultaneously within a single visual frame or continuous shot, allowing
        the total count to be verified by direct observation of the complete set rather
        than by aggregating disjointed glimpses.
      score_1: Evidence shows all instances of the target entity type together in
        one view, enabling a direct count of the total set.
      score_half: Evidence shows multiple instances but they are split across different
        shots or times, requiring inference to determine if they form a complete set.
      score_0: Evidence shows only isolated instances or disjointed views, making
        it impossible to determine the total count of the set from the visual evidence
        alone.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: boundary_transition_verification
      description: Whether the evidence explicitly captures the start and end boundaries,
        transitions, or delimiters that define each distinct instance in a sequence,
        rather than merely showing the content within the instances.
      score_1: Evidence explicitly shows the transitions, title cards, or scene changes
        that mark the beginning and end of every counted instance, allowing the total
        number of distinct segments to be determined.
      score_half: Evidence shows the content of some instances and transitions for
        others, or shows transitions that are ambiguous, making the exact count of
        distinct segments uncertain.
      score_0: Evidence only shows the content within instances without capturing
        the boundaries or transitions that separate them, making it impossible to
        distinguish distinct instances or determine the total count.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: narrative_vs_actual_distinction
      description: Whether the evidence correctly identifies the specific visual manifestation
        of the target entity (e.g., the event itself, a title card, a summary screen,
        or a description) as the valid instance to be counted, rather than conflating
        the representation with the described content or missing the representation
        entirely.
      score_1: Evidence explicitly identifies the correct visual format (e.g., title
        card, scene, summary) as the target entity instance, distinguishing it from
        the content it describes or other non-target elements.
      score_half: Evidence identifies the visual format but ambiguously treats it
        as a mere description of an event, or fails to clearly distinguish between
        the representation and the described content.
      score_0: Evidence conflates the representation (e.g., title card) with the described
        event, or fails to recognize the representation as a valid instance, leading
        to incorrect counts.
      weight: 4.0
      failure_repair_action: refine_query
    - name: instance_vs_aggregate_distinction
      description: Whether the evidence presents the target entities as distinct,
        countable instances (e.g., individual people, specific events) rather than
        as aggregate statistics, rates, percentages, or general descriptions of a
        group.
      score_1: Evidence explicitly shows or lists distinct, countable instances of
        the target entity, allowing a precise count to be derived from the instances
        themselves.
      score_half: Evidence mixes distinct instances with aggregate statistics or general
        descriptions, making it unclear which data points should be counted or if
        the statistics represent the count.
      score_0: Evidence provides only aggregate statistics, rates, percentages, or
        general descriptions of the group without identifying any distinct, countable
        instances of the target entity.
      weight: 1.0
      failure_repair_action: refine_query
    - name: validity_condition_verification
      description: Whether the evidence explicitly confirms that each counted instance
        satisfies the specific qualitative validity, legality, or official status
        condition required by the query, rather than merely showing instances that
        might be disqualified or disputed.
      score_1: Evidence explicitly confirms that every counted instance meets the
        required validity condition (e.g., 'valid', 'legal', 'official') or provides
        a definitive outcome that validates the set.
      score_half: Evidence shows instances that likely meet the condition but lacks
        explicit confirmation of their validity, or the validity of some instances
        is ambiguous.
      score_0: Evidence shows instances but fails to confirm they meet the validity
        condition, or the context suggests the instances may be invalid, disputed,
        or unofficial.
      weight: 4.0
      failure_repair_action: refine_query
    - name: resource_consumption_attribution
      description: Whether the evidence explicitly attributes the consumption or decrement
        of a limited resource (e.g., timeout, foul, point) to the specific target
        entity, rather than merely showing the resource state changing or the entity
        being present during the event.
      score_1: Evidence explicitly confirms the target entity initiated or was responsible
        for the resource consumption (e.g., coach signaling, referee acknowledging
        the call for that team, counter decrementing specifically for that team).
      score_half: Evidence shows the resource changing or the entity present, but
        the specific attribution of the consumption to the target entity is ambiguous
        or implied.
      score_0: Evidence shows the resource state changing or the entity present, but
        provides no confirmation that the target entity was responsible for the consumption
        (e.g., could be a media timeout, opponent's call, or passive observation).
      weight: 4.0
      failure_repair_action: refine_query
    - name: action_entity_attribution
      description: Whether the evidence explicitly attributes the specific action
        or event required for the count to the target entity, rather than merely showing
        the entity present during the event or the event occurring without clear linkage
        to the specific subject.
      score_1: Evidence explicitly links the action/event (e.g., via visual overlay,
        commentary, or clear visual causality) to the specific target entity, confirming
        the entity performed the action.
      score_half: Evidence shows the target entity and the action/event in close proximity
        or context, but the explicit link attributing the action to that specific
        entity is ambiguous or implied.
      score_0: Evidence shows the action/event occurring or the entity present, but
        provides no confirmation that the specific target entity was the one who performed
        the action (e.g., could be a teammate, opponent, or unattributed event).
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_aggregated_listing
      description: Whether the evidence provides an explicit, aggregated list or summary
        (e.g., a scoreboard, graphic, or text overlay) that enumerates the target
        instances and attributes them to the specific subject, rather than requiring
        the count to be derived solely from observing disjointed individual events.
      score_1: Evidence includes a clear summary or list explicitly stating the total
        count or listing all instances attributed to the target subject, allowing
        the count to be verified directly from the summary.
      score_half: Evidence includes a partial summary or a list that is ambiguous
        regarding the target subject or the total count, requiring inference to determine
        the final number.
      score_0: Evidence lacks any aggregated summary or list, requiring the count
        to be derived entirely from observing and aggregating individual, disjointed
        instances without a definitive total provided.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: outcome_status_verification
      description: Whether the evidence explicitly confirms the specific outcome,
        status change, or consequence (e.g., elimination, victory, disqualification)
        for each instance that satisfies the query's condition, rather than merely
        showing the instance meeting the condition or the condition itself.
      score_1: Evidence explicitly states or shows the specific outcome (e.g., 'eliminated',
        'won', 'disqualified') for every instance that meets the query's condition,
        allowing the count of such outcomes to be verified.
      score_half: Evidence shows instances meeting the condition but the specific
        outcome for some is implied, ambiguous, or not explicitly confirmed.
      score_0: Evidence shows instances meeting the condition but provides no confirmation
        of the specific outcome or status change, making it impossible to count how
        many resulted in that outcome.
      weight: 4.0
      failure_repair_action: refine_query
    - name: status_change_confirmation
      description: Whether the evidence explicitly confirms that the specific status
        change, record-breaking event, or definitive outcome occurred for each instance,
        rather than merely indicating proximity, potential, or a near-miss.
      score_1: Evidence explicitly states or displays the confirmation of the specific
        status change (e.g., 'World Record Broken', 'New Record', 'Eliminated') for
        every counted instance.
      score_half: Evidence indicates the instance was close to the status change or
        implies it might have occurred, but lacks explicit confirmation of the final
        status.
      score_0: Evidence only shows the instance approaching the condition or discusses
        the potential for the status change without confirming it actually happened.
      weight: 4.0
      failure_repair_action: refine_query
    - name: status_label_explicitness
      description: Whether the evidence explicitly asserts or displays the specific
        status label, condition, or classification (e.g., 'match point', 'set point',
        'record broken') required to verify the count, rather than merely showing
        the raw data or score from which the status must be inferred.
      score_1: Evidence explicitly states or displays the specific status label (e.g.,
        text overlay '2 MATCH POINTS', commentary 'two set points') for the instances
        being counted.
      score_half: Evidence shows the raw data (e.g., game score) that implies the
        status but lacks the explicit label or confirmation that the specific condition
        is met.
      score_0: Evidence shows only generic data or context without any indication
        of the specific status label required to verify the count.
      weight: 4.0
      failure_repair_action: refine_query
    - name: displayed_number_vs_actual_count_distinction
      description: Whether the evidence distinguishes between a displayed numerical
        value (e.g., a score, timer, partial count, or graphic) and the actual count
        of distinct target instances, ensuring the count is derived from the instances
        themselves rather than a potentially misleading on-screen number.
      score_1: Evidence clearly distinguishes the target instances from any displayed
        numbers, confirming the count is based on the actual occurrences and not a
        score, timer, or partial graphic.
      score_half: Evidence shows both instances and displayed numbers, but the relationship
        is ambiguous, leaving open the possibility that the displayed number is the
        intended count or a distractor.
      score_0: Evidence relies on a displayed number (score, timer, graphic) as the
        count without verifying the actual number of distinct instances, or conflates
        the two.
      weight: 4.0
      failure_repair_action: refine_query
    - name: answer_correctness_verification
      description: Whether the evidence explicitly confirms that the specific answer
        provided by the target entity was correct, rather than merely showing the
        answer was given or the question was asked.
      score_1: Evidence explicitly states or shows confirmation (e.g., 'correct',
        'right', buzzer light, host affirmation) that the specific answer given by
        the target entity was accurate.
      score_half: Evidence shows the answer was given and implies correctness through
        context, but lacks explicit confirmation of the answer's accuracy.
      score_0: Evidence shows the question and the answer provided, but provides no
        confirmation of whether the answer was correct or incorrect.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Recognition:
    rubric_criteria:
    - name: causal_link_explicitness
      description: Whether the evidence explicitly asserts or denies the specific
        causal relationship (cause, effect, reason, result) proposed in the option,
        rather than merely mentioning the entities involved.
      score_1: The evidence explicitly states that the factor is (or is not) the cause/reason
        for the event in question.
      score_half: The evidence mentions the factor and the event in close proximity
        or context, but the causal link is implied rather than explicitly stated.
      score_0: The evidence mentions the factor or the event, but provides no information
        linking them causally.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_fact_vs_belief_distinction
      description: Whether the evidence distinguishes between a causal claim presented
        as an established fact and one presented merely as a common belief, perception,
        or historical misconception.
      score_1: The evidence explicitly confirms the causal link as fact or explicitly
        refutes a commonly cited belief as the true cause.
      score_half: The evidence mentions a causal link but attributes it to 'people
        say', 'historians argue', or similar, without clarifying if it is the actual
        cause or a misconception.
      score_0: The evidence only presents the causal link as a belief or opinion without
        any factual confirmation or refutation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_factor_enumeration
      description: Whether the evidence explicitly mentions the specific factor proposed
        in the option as a cause or reason for the event, rather than only discussing
        the event or other unrelated causes.
      score_1: The evidence explicitly lists the specific factor from the option as
        a cause/reason for the event.
      score_half: The evidence mentions the factor in the context of the event but
        does not explicitly label it as a cause, or mentions it as a potential cause
        without confirmation.
      score_0: The evidence discusses the event or other causes but does not mention
        the specific factor proposed in the option at all.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_transition_explicitness
      description: Whether the evidence explicitly asserts or describes a specific
        transition, shift, or change in state (e.g., from romanticized to non-romanticized,
        from belief A to belief B) rather than merely describing the initial or final
        state in isolation.
      score_1: The evidence explicitly states that a specific shift or transition
        occurred (e.g., 'shifted to', 'ended', 'changed from X to Y').
      score_half: The evidence describes the initial and final states separately or
        implies a change through context, but does not explicitly state the transition
        event itself.
      score_0: The evidence describes only one state (initial or final) or discusses
        the topic without indicating any change or transition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: enumeration_completeness
      description: Whether the evidence explicitly enumerates the specific set of
        items, conditions, or factors proposed in the option, rather than mentioning
        only a subset or a single item.
      score_1: The evidence explicitly lists all the specific items/conditions required
        to verify the option's set, or explicitly excludes items not in the set.
      score_half: The evidence mentions some of the items in the option's set but
        omits others, making it impossible to confirm the full list or distinguish
        between options with overlapping items.
      score_0: The evidence mentions only one or none of the specific items in the
        option's set, or discusses the topic generally without listing the specific
        components.
      weight: 3.0
      failure_repair_action: refine_query
    - name: frequency_superlative_grounding
      description: Whether the evidence provides sufficient counts, temporal distribution,
        or an explicit comparative statement to verify or exclude a superlative claim
        (e.g., 'most frequently', 'least often', 'first', 'last'), rather than merely
        listing instances of the entities.
      score_1: The evidence explicitly states the frequency/rank or provides a complete
        set of instances allowing an unambiguous count/comparison to verify the superlative.
      score_half: The evidence lists some instances or implies a frequency but lacks
        the complete data or explicit comparison needed to definitively rank the options.
      score_0: The evidence mentions the entities but provides no information about
        their frequency, count, or relative occurrence, making the superlative claim
        unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_direction_explicitness
      description: Whether the evidence explicitly distinguishes the direction of
        the interaction or action (e.g., receiving/observing vs. creating/sending,
        input vs. output) proposed in the option, rather than merely mentioning the
        entities involved in a generic context.
      score_1: The evidence explicitly states the specific direction of the action
        (e.g., 'composing a message', 'sending signals', 'receiving data') that matches
        or contradicts the option's claim.
      score_half: The evidence mentions the entities or the general topic but the
        direction of the action is ambiguous, implied, or could apply to multiple
        opposing options (e.g., discussing 'communication' without specifying if it
        is sending or receiving).
      score_0: The evidence mentions the topic or entities but provides no information
        about the direction of the action, making it impossible to distinguish between
        options that differ only by direction.
      weight: 3.0
      failure_repair_action: refine_query
    - name: activity_mode_explicitness
      description: Whether the evidence explicitly asserts the specific mode, nature,
        or type of activity (e.g., composing, decoding, observing, simulating, receiving)
        proposed in the option, rather than merely mentioning the general topic or
        a different mode of the same topic.
      score_1: The evidence explicitly states the specific mode of activity (e.g.,
        'composing a message', 'decoding a signal') that matches or contradicts the
        option's claim.
      score_half: The evidence mentions the general topic or a related activity but
        the specific mode is ambiguous, implied, or could apply to multiple opposing
        options (e.g., discussing 'communication' without specifying if it is composing,
        receiving, or decoding).
      score_0: The evidence mentions the topic or entities but provides no information
        about the specific mode of activity, making it impossible to distinguish between
        options that differ only by the nature of the action.
      weight: 3.0
      failure_repair_action: refine_query
    - name: stance_attribution_explicitness
      description: Whether the evidence explicitly attributes the specific opinion,
        belief, or stance proposed in the option to the target entity, rather than
        merely presenting the topic as a general fact, a narrator's description, or
        a concept discussed in the entity's presence.
      score_1: The evidence explicitly shows or states the target entity expressing
        the specific view or stance (e.g., 'I believe', 'In my view', or direct assertion
        of the opinion).
      score_half: The evidence mentions the target entity and the topic, but the specific
        stance is attributed to a narrator, a general consensus, or is implied rather
        than explicitly voiced by the entity.
      score_0: The evidence discusses the topic or shows the entity but provides no
        link between the entity and the specific opinion/stance, making it impossible
        to verify the entity's view.
      weight: 3.0
      failure_repair_action: refine_query
    - name: topic_explicitness
      description: Whether the evidence explicitly mentions or depicts the specific
        topic, system, or concept proposed in the option, rather than discussing a
        related general context or unrelated specific details.
      score_1: The evidence explicitly states or shows the specific topic/system from
        the option, allowing it to be verified as discussed or excluded as not discussed.
      score_half: The evidence mentions a related general context or a component of
        the topic but does not explicitly name or depict the specific topic/system
        itself, leaving its discussion status ambiguous.
      score_0: The evidence discusses unrelated topics or general context without
        any mention or depiction of the specific topic/system proposed in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: method_explicitness
      description: Whether the evidence explicitly identifies the specific method,
        tool, instrument, or technique proposed in the option as the means to achieve
        the stated goal or result, rather than merely mentioning the goal, the actors,
        or a related general context.
      score_1: The evidence explicitly states that the specific method/tool from the
        option is used (or not used) to achieve the goal/result.
      score_half: The evidence mentions the goal and the actors, or mentions the tool
        in a different context, but does not explicitly link the specific tool to
        the goal as the method of achievement.
      score_0: The evidence mentions the goal or actors but provides no information
        about the specific method, tool, or technique used, making it impossible to
        verify or exclude options based on the means.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negation_explicitness
      description: Whether the evidence explicitly asserts the absence, non-use, or
        failure of the specific method, technique, or entity proposed in the option,
        rather than merely listing what was present or used.
      score_1: The evidence explicitly states that the specific method/technique was
        NOT used, did NOT occur, or is absent (e.g., 'no one used X', 'X was not found').
      score_half: The evidence lists other methods used or discusses the topic generally,
        implying the option might be unused, but does not explicitly state the absence
        or non-use of the specific option.
      score_0: The evidence only confirms the presence or use of other methods, or
        discusses the topic without any mention of what was excluded or not used,
        making it impossible to verify a negative claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: method_entity_binding_explicitness
      description: Whether the evidence explicitly links the specific method, technique,
        or tool proposed in the option to the specific target entity, event, or location,
        rather than mentioning the method in a general context, for a different entity,
        or without specifying the target of application.
      score_1: The evidence explicitly states or depicts the specific method being
        applied to (or not applied to) the specific target entity/event in question.
      score_half: The evidence mentions the method and the target entity separately
        or in close proximity, but the explicit link of application (or non-application)
        between them is ambiguous or implied.
      score_0: The evidence mentions the method in a general context or for a different
        entity, or mentions the target entity without linking it to the specific method,
        making it impossible to verify the method's status for that target.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ranking_list_enumeration
      description: Whether the evidence explicitly enumerates the specific ranked
        list, ordered set, or sequence of entities required to verify or exclude a
        superlative identity claim (e.g., 'the greatest', 'the first', 'the last'),
        rather than merely mentioning the existence of such a list or showing a generic
        title.
      score_1: 'The evidence explicitly lists the entities in their specific order/rank,
        allowing the superlative (e.g., #1) to be identified or the option to be excluded
        based on its position.'
      score_half: The evidence mentions the existence of a ranking or list (e.g.,
        a title card) or shows some items but omits the specific rank or the top/bottom
        item needed to resolve the superlative claim.
      score_0: The evidence mentions the topic or shows a generic scene related to
        the list but provides no enumeration of the entities or their ranks, making
        the superlative claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: inventory_exhaustiveness
      description: Whether the evidence provides an exhaustive list or complete inventory
        of the items, actions, or components involved in the event, allowing the exclusion
        of options not mentioned, rather than merely listing a subset of what was
        present.
      score_1: The evidence explicitly states that the listed items/actions are the
        only ones used (e.g., 'all you need are...', 'these are the only tools...')
        or provides a complete step-by-step account that leaves no room for unlisted
        items.
      score_half: The evidence lists several items or actions but does not explicitly
        state that the list is complete, leaving ambiguity about whether unlisted
        items were also used.
      score_0: The evidence lists only a few items or actions without any indication
        of completeness, making it impossible to exclude options that are not mentioned.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_phase_grounding
      description: Whether the evidence explicitly depicts or describes the specific
        temporal phase (e.g., start, end, specific turn, transition moment) required
        by the option, rather than showing a generic or different phase of the event.
      score_1: The evidence explicitly shows or states the event occurring at the
        specific phase queried (e.g., 'starting hand', 'end of game', 'turn 1').
      score_half: The evidence shows the event occurring but the specific phase is
        ambiguous, implied, or could be a different part of the sequence.
      score_0: The evidence shows the event occurring at a clearly different phase
        (e.g., mid-game instead of start) or provides no temporal context to locate
        the phase.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: requirement_vs_instance_distinction
      description: Whether the evidence explicitly identifies the specific requirement,
        rule, or mandatory condition proposed in the option, rather than merely depicting
        an instance, outcome, or optional occurrence of the event.
      score_1: The evidence explicitly states the rule, requirement, or mandatory
        condition (e.g., 'must have', 'requires', 'only X is allowed') or provides
        sufficient context to deduce the mandatory nature of the option.
      score_half: The evidence shows an instance of the option occurring or discusses
        the topic, but does not explicitly confirm it is a requirement or rule, leaving
        ambiguity between 'required' and 'optional/observed'.
      score_0: The evidence only shows an instance or outcome without any indication
        of a rule or requirement, making it impossible to distinguish between a mandatory
        condition and a random occurrence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_entity_binding_explicitness
      description: Whether the evidence explicitly links the specific attribute, role,
        or classification proposed in the option to the target entity, rather than
        merely mentioning the attribute in a general context or showing the entity
        without the specific attribute.
      score_1: The evidence explicitly states or depicts the target entity possessing
        the specific attribute/role (e.g., 'the player is a Warlock', 'the character
        is a thief').
      score_half: The evidence mentions the attribute and the target entity in close
        proximity or context, but the explicit link is ambiguous, implied, or could
        apply to a different entity.
      score_0: The evidence mentions the attribute in a general context or shows the
        target entity without any link to the specific attribute, making it impossible
        to verify the entity's role.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_attribute_explicitness
      description: Whether the evidence explicitly asserts or provides the necessary
        data to verify a comparative or superlative attribute (e.g., 'stronger', 'better',
        'weakest', 'most effective') proposed in the option, rather than merely describing
        the entities or their individual states without comparison.
      score_1: The evidence explicitly states the comparative relationship (e.g.,
        'X is stronger than Y') or provides a complete set of comparable metrics allowing
        the relative ranking to be definitively determined.
      score_half: The evidence describes the entities or their individual states but
        the comparative link is implied, ambiguous, or relies on external assumptions
        not present in the video.
      score_0: The evidence describes the entities or events but provides no information
        about their relative standing, making the comparative claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequence_exhaustiveness
      description: Whether the evidence provides a complete, ordered enumeration of
        all instances in a repeated sequence (e.g., all attempts, all rounds, all
        turns) required to verify a claim about the pattern or status of the entire
        set (e.g., 'all except the first', 'every time', 'never'), rather than merely
        showing a subset or isolated instances.
      score_1: The evidence explicitly depicts or lists every instance in the sequence,
        allowing the pattern (e.g., success/failure of each) to be fully verified
        or excluded.
      score_half: The evidence shows some instances of the sequence but omits others,
        making it impossible to confirm if the pattern holds for the entire set (e.g.,
        missing the 'first' or 'last' attempt needed to verify 'all except').
      score_0: The evidence shows only one or a few isolated instances without indicating
        the full sequence, making any claim about the pattern across all instances
        unverifiable.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: identity_resolution_explicitness
      description: Whether the evidence explicitly provides the specific identifier
        (e.g., name, number, title, unique label) required to distinguish the target
        entity from other similar entities, rather than merely depicting the entity
        or describing its actions without identification.
      score_1: The evidence explicitly states or displays the specific identifier
        (name, number, etc.) that matches or excludes the option's entity claim.
      score_half: The evidence depicts the specific entity or describes its unique
        actions but does not explicitly state the identifier, leaving the specific
        identity ambiguous or requiring external inference.
      score_0: The evidence shows a generic entity or describes actions without any
        specific identifier, making it impossible to verify which specific entity
        is involved.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_scope_exhaustiveness
      description: Whether the evidence covers the complete set of entities or instances
        required to verify a superlative claim (e.g., 'best', 'fastest', 'most') across
        the entire relevant domain, rather than merely providing a comparison within
        a subset or a single instance.
      score_1: The evidence explicitly presents the full ranking, complete list, or
        aggregate data for all relevant entities, allowing the global superlative
        to be verified or excluded.
      score_half: The evidence provides a comparison or ranking for a subset of entities
        (e.g., a single heat, a partial list) but does not confirm whether this subset
        represents the entire domain or if other entities outside the subset could
        rank higher.
      score_0: The evidence only shows a single entity's performance or a comparison
        within a clearly limited subset without any indication of the full scope,
        making a global superlative claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_instance_explicitness
      description: Whether the evidence explicitly identifies the specific event instance,
        category, or sub-event (e.g., 'A final', 'B final', 'heat 1', 'semifinal')
        required to verify or exclude the option, rather than merely describing a
        generic event or a different instance of the same type.
      score_1: The evidence explicitly states or displays the specific event instance/category
        (e.g., 'A final') that matches the query, allowing the option to be verified
        or excluded based on that specific context.
      score_half: The evidence describes the event type (e.g., 'final') but the specific
        instance (e.g., 'A' vs 'B') is ambiguous, implied, or could refer to a different
        sub-event.
      score_0: The evidence describes a generic event or a clearly different instance
        (e.g., 'B final' when 'A final' is queried) without linking it to the specific
        instance required by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_sequence_grounding
      description: Whether the evidence provides the necessary chronological ordering
        of distinct events or instances to verify or exclude an ordinal claim (e.g.,
        'first', 'second', 'last', 'next'), rather than merely depicting the events
        in isolation without establishing their relative sequence.
      score_1: The evidence explicitly depicts or states the chronological order of
        the relevant events, allowing the specific ordinal position (e.g., which event
        occurred first) to be verified or excluded.
      score_half: The evidence depicts the relevant events but their relative chronological
        order is ambiguous, implied, or presented out of sequence without clear temporal
        markers to distinguish the ordinal claim.
      score_0: The evidence depicts the events in isolation or provides no information
        about their relative timing, making it impossible to determine which event
        corresponds to the queried ordinal position.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: quantitative_value_explicitness
      description: Whether the evidence explicitly provides the specific numerical
        values (e.g., prices, counts, scores, measurements) required to verify a quantitative
        claim or perform a necessary calculation (e.g., difference, ratio, deviation),
        rather than merely identifying the entities involved or stating a qualitative
        result.
      score_1: The evidence explicitly states all specific numerical values (e.g.,
        the guessed price and the actual price) needed to verify the option or perform
        the required calculation.
      score_half: The evidence provides some numerical values or a qualitative result
        (e.g., 'it was close') but lacks the specific raw numbers needed to definitively
        calculate the metric or verify the exact claim.
      score_0: The evidence identifies the entities or discusses the topic but provides
        no specific numerical values, making any quantitative verification or calculation
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_result_explicitness
      description: Whether the evidence explicitly states or depicts the specific
        result, outcome, or verdict (e.g., win/loss, pass/fail, heavier/lighter, success/failure)
        of the event or comparison proposed in the option, rather than merely showing
        the setup, the action, or the participants without the resolution.
      score_1: The evidence explicitly states or clearly depicts the final result/outcome
        of the event (e.g., 'X won', 'Y lost', 'the scale tipped to Z'), allowing
        the option's claim about the result to be verified or excluded.
      score_half: The evidence shows the event occurring or the action being taken,
        but the specific result is ambiguous, implied, or not yet revealed (e.g.,
        showing the scale tipping but not stating which side won, or showing the action
        without the consequence).
      score_0: The evidence only shows the setup, the participants, or the action
        leading up to the event, with no information about the result or outcome,
        making it impossible to verify claims about who won, lost, or succeeded.
      weight: 3.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Reasoning:
    rubric_criteria:
    - name: temporal_anchor_completeness
      description: Whether the evidence provides explicit temporal anchors (dates,
        years, or clear chronological markers) for the events described in ALL options,
        enabling a direct comparison against the queried time boundary.
      score_1: Evidence explicitly states or displays the specific date/year for the
        event in every option, allowing all to be verified or excluded relative to
        the query time.
      score_half: Evidence provides dates for some options but lacks explicit temporal
        anchors for others, preventing full exclusion/verification of the set.
      score_0: Evidence lacks explicit dates for the events in the options, or only
        provides a general era without specific anchors needed for the comparison.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_habit_assertion
      description: Whether the evidence contains an explicit verbal assertion by the
        subject regarding their habitual action, preference, or inability to perform
        a specific task, rather than relying solely on visual depiction of the activity
        or implied context.
      score_1: The subject explicitly states their habit, preference, or inability
        regarding the action in question, allowing direct verification or exclusion
        of options.
      score_half: The subject discusses related topics or the activity is visually
        depicted, but no explicit statement of habit/preference/inability is made.
      score_0: No verbal assertion by the subject regarding the action; evidence relies
        entirely on visual context or third-party narration without the subject's
        direct confirmation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: alternative_action_explicitness
      description: Whether the evidence explicitly states the alternative action or
        habit that the subject performs when a primary action is negated or deemed
        impossible, rather than only stating the negation.
      score_1: Evidence explicitly states both the negation of the primary action
        and the specific alternative action the subject performs instead.
      score_half: Evidence states the negation of the primary action but the alternative
        action is only implied, visually depicted without confirmation, or missing.
      score_0: Evidence only states the negation of the primary action with no mention
        or indication of what the subject does instead.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_sequence_verification
      description: Whether the evidence explicitly establishes the chronological order
        of events required by the query's temporal preposition (e.g., 'after', 'before',
        'between'), rather than merely confirming the existence of the events in isolation.
      score_1: Evidence clearly shows the sequence of events matching the query's
        temporal constraint (e.g., Event A is shown, followed immediately by Event
        B for an 'after' query).
      score_half: Evidence shows both events but the transition or relative order
        is ambiguous, or the events are shown out of sequence without clear markers.
      score_0: Evidence shows the events but fails to establish their relative order,
        or only shows one of the events involved in the temporal relationship.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: narrative_continuity
      description: Whether the evidence forms a continuous narrative segment that
        captures the transition from the anchor event to the target event, rather
        than consisting of disjointed snapshots from different parts of the video.
      score_1: Evidence provides a continuous sequence of events or a coherent segment
        that directly links the anchor event to the target event, establishing the
        temporal flow.
      score_half: Evidence contains relevant events but they are presented as disjointed
        clips or out-of-order segments, making the transition or immediate sequence
        ambiguous.
      score_0: Evidence consists of isolated snapshots from unrelated parts of the
        video, failing to establish any narrative connection or temporal flow between
        the anchor and target events.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: sequence_item_completeness
      description: Whether the evidence contains explicit temporal markers or content
        for EVERY item listed in the options that must be ordered, rather than only
        a subset of the items.
      score_1: Evidence provides clear temporal grounding (time, scene, or explicit
        mention) for all items required to establish the full sequence.
      score_half: Evidence grounds some items in the sequence but lacks temporal information
        for at least one item, preventing a complete ordering.
      score_0: Evidence is missing temporal grounding for multiple items or fails
        to identify the specific items needed to construct the sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_link_explicitness
      description: Whether the evidence explicitly asserts or visually demonstrates
        the causal, mechanistic, or influential relationship between the specific
        factors mentioned in the option, rather than merely identifying the factors
        in isolation or as static labels.
      score_1: Evidence explicitly states or shows the mechanism by which one factor
        influences, causes, or affects the other (e.g., 'X impacts Y', 'X leads to
        Y', or a dynamic visual of the interaction).
      score_half: Evidence mentions both factors or shows them in proximity, but the
        specific causal or influential link is implied, ambiguous, or not explicitly
        stated.
      score_0: Evidence identifies the factors but provides no indication of a relationship,
        or the relationship described contradicts the option's claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_role_explicitness
      description: Whether the evidence explicitly identifies the specific role, category,
        or expertise of each entity required to verify the sequence, rather than merely
        showing generic individuals or events without categorical labels.
      score_1: Evidence explicitly states or visually confirms the specific role/category
        (e.g., 'neuroscientist', 'spiritual leader') for every entity in the sequence.
      score_half: Evidence identifies some entities by role but leaves others generic,
        or relies on ambiguous visual cues that do not definitively confirm the specific
        category.
      score_0: Evidence shows generic individuals or events without any explicit identification
        of their specific roles or categories required by the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: intermediate_content_enumeration
      description: Whether the evidence explicitly enumerates the specific items,
        events, or concepts presented in the video segment located strictly between
        the two temporal anchors defined by the query, rather than only identifying
        the anchors themselves.
      score_1: Evidence lists or describes every distinct item/event occurring in
        the interval between the start and end anchors, enabling verification of which
        options are present or absent in that gap.
      score_half: Evidence identifies the anchors and some intermediate items, but
        misses at least one item that appears in the interval, leaving ambiguity about
        the completeness of the sequence.
      score_0: Evidence identifies the start and end anchors but provides no information
        about the specific content or items occurring in the interval between them.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: structural_sequence_context
      description: Whether the evidence captures the structural markers (e.g., title
        cards, introductory narration, explicit list declarations) that define the
        scope and ordering of the sequence, rather than merely showing isolated instances
        of the items involved.
      score_1: Evidence includes the structural context (title, intro, or explicit
        list statement) that establishes the sequence's existence and order, allowing
        the relative positions of items to be determined.
      score_half: Evidence shows the items but lacks the explicit structural markers
        (title/intro) that define the sequence, making the order ambiguous or reliant
        on inference.
      score_0: Evidence only shows isolated instances of the items without any structural
        context indicating they form a specific ordered sequence.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: explicit_entity_identification
      description: Whether the evidence explicitly states the specific names, labels,
        or identifiers of the entities required to verify the sequence, rather than
        relying solely on visual descriptions or generic references.
      score_1: Evidence explicitly names or labels every entity mentioned in the options
        (e.g., 'Venus', 'Jupiter'), allowing direct matching to the sequence.
      score_half: Evidence names some entities but relies on visual descriptions or
        generic terms (e.g., 'a red planet') for others, creating ambiguity in the
        sequence.
      score_0: Evidence provides only visual descriptions or generic references without
        explicitly naming the specific entities required to distinguish the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: introduction_event_grounding
      description: Whether the evidence explicitly captures the specific moment or
        segment where the target entity is first introduced or presented as a distinct
        topic, rather than merely mentioning it within a generic list, classification,
        or background context.
      score_1: Evidence clearly shows the specific segment where the entity is introduced
        as a distinct subject (e.g., via a dedicated title card, specific narration
        focus, or visual transition), allowing its position in the sequence to be
        determined.
      score_half: Evidence mentions the entity or shows it within a broader context
        (e.g., a list of types), but the specific moment of its individual introduction
        is ambiguous or not clearly distinguished from other items.
      score_0: Evidence only lists the entity as part of a generic group or classification
        without any indication of when or how it was specifically introduced as a
        distinct topic.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: temporal_ranking_resolution
      description: Whether the evidence provides sufficient temporal granularity (e.g.,
        distinct timestamps, segment order, or explicit 'first/next' markers) for
        EVERY item in the set to be ranked or ordered relative to one another, rather
        than merely confirming the existence of the items.
      score_1: Evidence provides clear temporal positioning for all items in the set,
        enabling a definitive ranking or ordering of their introduction/occurrence.
      score_half: Evidence provides temporal positioning for some items but lacks
        sufficient granularity for others, preventing a complete or definitive ordering
        of the full set.
      score_0: Evidence confirms the existence of the items but provides no temporal
        markers or sequence information to determine their relative order.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: first_introduction_temporal_priority
      description: Whether the evidence captures the earliest temporal occurrence
        where the target entity is introduced or defined as a distinct topic, rather
        than only capturing a subsequent mention, reference, or visual depiction of
        the entity.
      score_1: Evidence explicitly identifies the first moment the entity is introduced
        as a distinct topic, allowing its position as the earliest item in the sequence
        to be verified.
      score_half: Evidence identifies the entity but only in a later segment (subsequent
        mention or reference), failing to confirm whether an earlier introduction
        occurred.
      score_0: Evidence fails to identify the entity's introduction at all, or only
        shows the entity in a context that does not constitute an introduction (e.g.,
        background visual without definition).
      weight: 3.0
      failure_repair_action: time_sorted
    - name: event_vs_meta_discussion
      description: Whether the evidence captures the actual occurrence of the event
        described in the option (the narrative action itself) rather than merely capturing
        a speaker discussing, analyzing, questioning, or narrating that event as a
        topic.
      score_1: Evidence shows the event actually happening or explicitly confirms
        its occurrence in the narrative timeline, not just as a subject of discussion.
      score_half: Evidence shows the event being discussed or analyzed, but the actual
        occurrence of the event in the narrative is not shown or explicitly confirmed.
      score_0: Evidence only contains meta-commentary, questions, or descriptions
        of the event without any indication of the event actually occurring in the
        story.
      weight: 3.0
      failure_repair_action: refine_query
    - name: step_segmentation_distinctness
      description: Whether the evidence captures distinct temporal segments for each
        step in the sequence, rather than a single segment where multiple steps are
        merely listed, intended, or discussed together.
      score_1: Evidence provides separate, distinct segments for each step in the
        sequence, allowing their relative order to be determined by segment boundaries.
      score_half: Evidence provides distinct segments for some steps but groups others
        together in a single segment (e.g., a list of intentions), making the order
        of the grouped steps ambiguous.
      score_0: Evidence only contains a single segment where all steps are mentioned,
        listed, or intended together, with no distinct segments to establish their
        individual order.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: intent_vs_execution_distinction
      description: Whether the evidence captures the actual execution or demonstration
        of the action described in the option, rather than merely capturing a speaker's
        stated intention, plan, or promise to perform that action later.
      score_1: Evidence shows the action actually being performed or completed, or
        explicitly confirms its occurrence in the narrative timeline, distinguishing
        it from mere statements of intent.
      score_half: Evidence shows the speaker stating an intention or plan to perform
        the action, but the actual execution is not shown or confirmed within the
        provided segment.
      score_0: Evidence only contains statements of intent, plans, or promises to
        perform the action, with no visual or narrative confirmation of the action
        actually occurring.
      weight: 3.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Perception:
    rubric_criteria:
    - name: temporal_topical_alignment
      description: Whether the evidence is temporally and topically aligned with the
        specific time window and subject entity queried, rather than covering a different
        time, event, or entity.
      score_1: The evidence explicitly pertains to the queried time window and subject
        entity.
      score_half: The evidence pertains to the correct subject but the time window
        is ambiguous or only partially overlapping, or the time is correct but the
        subject is only loosely related.
      score_0: The evidence pertains to a different time window, a different event,
        or a different subject entity entirely.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_onset_capture
      description: Whether the evidence captures the specific onset, transition, or
        state change of the queried event (e.g., an entity appearing, moving, or a
        pose being entered/exited) rather than merely showing the entity or state
        in a static condition during the time window.
      score_1: The evidence explicitly shows the moment the event begins, the transition
        occurs, or the state changes as required by the option.
      score_half: The evidence shows the entity or state in the correct time window
        but the specific onset or transition is ambiguous or not clearly depicted.
      score_0: The evidence only shows the entity or state in a static condition without
        capturing the required event onset or transition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_superlative_grounding
      description: Whether the evidence provides the necessary comparative or quantitative
        basis (e.g., relative duration, frequency, magnitude, or explicit ranking)
        to verify or exclude options that assert a superlative (most/least) or comparative
        (more/less) relationship.
      score_1: The evidence explicitly states the ranking, provides sufficient relative
        data (e.g., duration, count) to determine the superlative/comparative, or
        clearly demonstrates the dominance of one option over others in the relevant
        dimension.
      score_half: The evidence mentions the entities involved in the comparison but
        lacks explicit ranking or sufficient relative data to definitively determine
        which option satisfies the superlative/comparative claim.
      score_0: The evidence lists entities or events without any comparative context,
        relative metrics, or ranking information, making it impossible to verify or
        exclude superlative/comparative options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_bracketing_of_transition
      description: Whether the evidence provides a continuous or sufficiently dense
        sequence of timestamps that brackets the exact moment of the queried state
        change or transition, allowing the specific interval to be identified.
      score_1: The evidence explicitly shows the clock or time progression ticking
        through the exact moment the state changes, clearly bracketing the transition
        within the queried interval.
      score_half: The evidence shows the state before and after the transition but
        lacks the continuous progression or precise timestamps needed to definitively
        pinpoint the exact moment of change within the interval.
      score_0: The evidence only shows static snapshots of the state before or after
        the transition, or disjointed time points that do not bracket the specific
        moment of change.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_transition_localization
      description: Whether the evidence explicitly captures the exact moment a quantitative
        value, status, or ranking changes (e.g., a score flip, a lead change, a count
        increment) within the queried time interval, rather than only showing the
        static state before or after the change.
      score_1: The evidence explicitly shows the clock or time progression ticking
        through the exact moment the value/status changes, confirming the transition
        occurs within the queried interval.
      score_half: The evidence shows the state before and after the transition but
        lacks the continuous progression or precise timestamps needed to definitively
        pinpoint the exact moment of change within the interval.
      score_0: The evidence only shows static snapshots of the state before or after
        the transition, or disjointed time points that do not bracket the specific
        moment of change, making it impossible to verify when the transition occurred.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_scope_consistency
      description: Whether the evidence covers the full temporal scope required by
        the option's claim (e.g., 'throughout', 'ultimately', 'from start to finish')
        rather than only a subset of the interval, allowing verification of the state's
        consistency or change over the entire queried period.
      score_1: The evidence explicitly covers the entire duration or trajectory implied
        by the option, showing the state holds consistently or changes as claimed
        across the full interval.
      score_half: The evidence covers a significant portion of the interval but leaves
        gaps in the timeline, making it impossible to confirm if the state held consistently
        or changed during the missing segments.
      score_0: The evidence only covers a single moment or a small fragment of the
        queried interval, insufficient to verify claims about the state's consistency,
        duration, or ultimate outcome over the whole period.
      weight: 3.0
      failure_repair_action: refine_query
    - name: direct_observation_vs_retrospective_assertion
      description: Whether the evidence provides direct visual or auditory observation
        of the state, action, or outcome at the queried time, rather than relying
        solely on a retrospective summary, narrator's claim, or historical description
        of that period.
      score_1: The evidence explicitly shows the state, action, or outcome occurring
        in real-time or via direct visual/auditory cues at the queried moment, allowing
        independent verification.
      score_half: The evidence contains a mix of direct observation and retrospective
        commentary, but the direct observation is ambiguous or insufficient to fully
        verify the claim without the commentary.
      score_0: The evidence relies entirely on a narrator's summary, a historical
        description, or a retrospective claim about the queried period without providing
        direct visual or auditory evidence of the state at that time.
      weight: 3.0
      failure_repair_action: refine_query
    - name: pattern_vs_isolated_instance
      description: Whether the evidence provides sufficient instances, time points,
        or contextual data to verify or exclude options that describe a pattern, trend,
        historical narrative, or multi-stage evolution (e.g., 'comeback', 'tale of
        two halves', 'struggling throughout') rather than relying on a single isolated
        event or snapshot.
      score_1: The evidence explicitly covers multiple distinct instances, time points,
        or narrative stages required to establish the pattern, trend, or evolution
        claimed by the option.
      score_half: The evidence covers some aspects of the pattern or trend but relies
        heavily on a single instance or lacks sufficient temporal breadth to definitively
        confirm the multi-stage nature of the claim.
      score_0: The evidence relies entirely on a single isolated event, snapshot,
        or moment, making it impossible to verify or exclude options that describe
        a broader pattern, trend, or historical narrative.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_label_explicitness
      description: Whether the evidence explicitly states or displays the specific
        temporal category (e.g., day of week, meal name, time of day) asserted by
        the option, rather than merely showing an event that could occur at that time
        without explicit labeling.
      score_1: The evidence explicitly contains the specific temporal label (e.g.,
        'Tuesday', 'dinner', '8:30 AM') that matches or contradicts the option's claim.
      score_half: The evidence implies the temporal category through context (e.g.,
        lighting, activity) but lacks an explicit label or text overlay confirming
        the specific day/meal/time.
      score_0: The evidence shows the event but provides no explicit temporal label
        or context to determine the specific day, meal, or time of day required to
        verify the option.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Attribute Perception:
    rubric_criteria:
    - name: proposition_explicitness
      description: Whether the evidence explicitly asserts or denies the specific
        proposition in the option, rather than merely implying it, discussing the
        topic generally, or attributing the claim to a third party without direct
        confirmation.
      score_1: The evidence explicitly states the specific fact or negation required
        to verify or exclude the option.
      score_half: The evidence strongly implies the proposition or attributes it to
        a source without the video itself explicitly confirming the fact.
      score_0: The evidence only discusses the topic generally, mentions the entity,
        or relies on external opinions without explicitly asserting the specific proposition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparison_grounding
      description: Whether the evidence explicitly grounds a comparison, contrast,
        or superlative claim across the specific items, categories, or scenarios mentioned
        in the option, rather than discussing them in isolation or generally.
      score_1: The evidence explicitly states the relationship (e.g., better/worse,
        can/cannot, more/less) between the specific items or categories required to
        verify or exclude the option.
      score_half: The evidence discusses the items or categories separately or implies
        a relationship without explicitly stating the comparative claim.
      score_0: The evidence mentions the items or categories but provides no basis
        for comparison or contrast between them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_ordering
      description: Whether the evidence explicitly establishes the chronological sequence,
        introduction dates, or production timeline of the entities involved to verify
        or exclude superlative claims regarding order (e.g., first, last, earliest,
        latest).
      score_1: The evidence provides explicit dates, years, or a clear sequential
        narrative that allows the relative order of all relevant options to be determined.
      score_half: The evidence provides dates or sequence for some but not all relevant
        options, or implies an order without explicit temporal markers.
      score_0: The evidence mentions the entities or their attributes but provides
        no dates, years, or sequential information to determine their relative order
        in time.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_state_verification
      description: Whether the evidence explicitly captures the specific state transition
        or final condition (e.g., completion, failure, victory, defeat) required to
        verify or exclude options describing an outcome, rather than only showing
        the process, attempt, or intermediate steps.
      score_1: The evidence explicitly shows the moment the outcome is achieved or
        the final state is reached (e.g., the winning move, the collapse, the final
        score), allowing the option to be verified or excluded.
      score_half: The evidence shows the process leading up to the outcome or implies
        the result, but the specific moment of state change or final confirmation
        is missing or ambiguous.
      score_0: The evidence only depicts the process, attempts, or intermediate states
        without showing the final outcome or state transition required to determine
        the result.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Recognition:
    rubric_criteria:
    - name: evidence_negation_explicitness
      description: Whether the evidence explicitly asserts the absence, non-occurrence,
        or impossibility of the action/state in a negative option, rather than merely
        describing the scene without ruling it out.
      score_1: The evidence explicitly states the action did not happen, the state
        is absent, or an intervening factor prevents it.
      score_half: The evidence implies the absence through context or description
        but does not explicitly deny the action or state.
      score_0: The evidence describes the scene or entities but provides no information
        to confirm the action did not happen or the state is absent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: spatial_relation_resolution
      description: Whether the evidence explicitly resolves the spatial relation (e.g.,
        contact, proximity, separation) between entities, distinguishing between apparent
        and actual states (e.g., intervening objects, gaps) rather than merely describing
        the action or implying the relation.
      score_1: The evidence explicitly shows or states the specific spatial configuration
        (e.g., an intervening object preventing contact, a visible gap) that verifies
        or excludes the option's claim about physical interaction.
      score_half: The evidence describes the action or entities in a way that implies
        the spatial relation but does not explicitly resolve the ambiguity (e.g.,
        'reaching for' without confirming contact or lack thereof).
      score_0: The evidence describes the scene or action generically without providing
        visual or explicit information to determine the specific spatial relation
        between the entities.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: process_explicitness
      description: Whether the evidence explicitly states the causal mechanism, physical
        process, or dynamic interaction that produces the observed state or outcome,
        rather than merely describing the static result or visual appearance.
      score_1: The evidence explicitly describes the mechanism (e.g., 'gas escapes',
        'rapid cooling prevents crystals') that causes the state change or outcome
        asserted in the option.
      score_half: The evidence describes the visual result or state change but implies
        the mechanism without explicitly stating the causal process.
      score_0: The evidence only describes the static scene or final state without
        any information about the process or mechanism that produced it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: topic_discussion_explicitness
      description: Whether the evidence explicitly captures a segment where the speaker
        introduces, defines, or discusses a specific topic or concept as the subject
        matter, rather than merely depicting a scene where the topic is contextually
        relevant or implied.
      score_1: The evidence contains a clear segment where the speaker explicitly
        introduces, defines, or discusses the specific topic/concept asserted in the
        option.
      score_half: The evidence depicts a scene related to the topic or implies the
        topic is relevant, but lacks an explicit segment where the speaker discusses
        it as a subject.
      score_0: The evidence provides no indication that the specific topic or concept
        was discussed or introduced by the speaker.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_scope_isolation
      description: Whether the evidence is strictly bounded to the specific temporal
        segment (e.g., introduction, first scene, specific chapter) required to verify
        or exclude options based on what was mentioned or occurred within that segment,
        rather than aggregating evidence from the entire video.
      score_1: The evidence is restricted to the specific time window defined by the
        question, allowing for a complete verification of what was or was not mentioned/occurred
        in that segment.
      score_half: The evidence includes the target segment but is mixed with content
        from outside the required time window, making it difficult to distinguish
        between 'mentioned in the segment' and 'mentioned elsewhere'.
      score_0: The evidence aggregates content from the entire video or irrelevant
        segments, failing to isolate the specific time window needed to verify the
        claim.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: enumeration_completeness
      description: Whether the evidence captures the complete set of items, entities,
        or actions mentioned or depicted within the target segment, rather than a
        partial subset, to allow for the verification of negative claims (e.g., 'not
        mentioned').
      score_1: The evidence explicitly lists or depicts all items mentioned in the
        target segment, allowing any unlisted option to be definitively excluded.
      score_half: The evidence lists or depicts some but not all items mentioned in
        the target segment, leaving ambiguity about whether unlisted options were
        mentioned but missed.
      score_0: The evidence provides only a partial or single example from the target
        segment, making it impossible to determine if other options were mentioned
        or not.
      weight: 3.0
      failure_repair_action: refine_query
    - name: scene_instance_isolation
      description: Whether the evidence explicitly isolates the specific scene or
        temporal instance where the target event occurs, distinguishing it from other
        scenes in the video where similar entities or actions appear in different
        contexts.
      score_1: The evidence clearly identifies and restricts the analysis to the unique
        scene matching the question's specific context (e.g., correct vehicle, correct
        location, correct sequence of events), excluding other similar scenes.
      score_half: The evidence includes the target scene but is mixed with or confused
        by other scenes involving similar entities or actions, creating ambiguity
        about which instance is being analyzed.
      score_0: The evidence analyzes a different scene entirely (e.g., wrong vehicle,
        wrong location) or aggregates multiple scenes without distinguishing the specific
        instance required to answer the question.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: visual_realization_vs_claim
      description: Whether the evidence visually demonstrates the actual occurrence
        of the action, state change, or effect asserted in the option, rather than
        merely capturing a character's dialogue, thought, or hypothetical claim about
        that effect.
      score_1: The evidence explicitly shows the action or effect taking place (e.g.,
        the transformation happens, the transport occurs) as described in the option.
      score_half: The evidence shows characters discussing, imagining, or claiming
        the effect, but the visual scene does not confirm the effect is actually occurring.
      score_0: The evidence only contains dialogue or text mentioning the effect without
        any visual context, or the visual context contradicts the claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_action_vs_resulting_state
      description: Whether the evidence explicitly depicts the specific action or
        event performed by the target entity that causes a state change or reaction,
        rather than merely depicting the resulting state, reaction, or emotional expression
        of the entity.
      score_1: The evidence explicitly shows the target entity performing the specific
        action or event that causes the observed state or reaction (e.g., pumping
        gas, throwing an object, speaking a specific phrase).
      score_half: The evidence shows the resulting state or reaction (e.g., laughing,
        falling, being startled) and implies a cause, but does not explicitly depict
        the specific action performed by the target entity that produced it.
      score_0: The evidence only depicts the resulting state, reaction, or emotional
        expression without any visual or explicit information about the specific action
        or event that caused it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: production_layer_vs_narrative_layer
      description: Whether the evidence explicitly captures the production context
        (e.g., cameras, crew, equipment, artificial sets, or the act of filming) to
        verify a meta-action option, rather than merely describing the narrative content
        or fictional events depicted within the scene.
      score_1: The evidence explicitly shows the production apparatus or the act of
        creating the content (e.g., cameras, crew, equipment, or the artificial nature
        of the scene) that verifies the option describes the production process.
      score_half: The evidence shows the narrative content clearly but lacks explicit
        visual confirmation of the production context, making it ambiguous whether
        the option refers to the story or the act of making it.
      score_0: The evidence only describes the narrative events, characters, or fictional
        actions within the scene, providing no information about the production process
        or the act of filming.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_attribute_resolution
      description: Whether the evidence explicitly resolves the target entity by confirming
        the specific visual attributes, states, or possessions (e.g., clothing, injuries,
        held objects) described in the question, distinguishing it from other entities
        that may appear in the video.
      score_1: The evidence explicitly shows the target entity possessing all the
        specific attributes or states mentioned in the question (e.g., the specific
        injury, the specific object held), confirming the correct subject is being
        analyzed.
      score_half: The evidence shows an entity with some matching attributes but misses
        key distinguishing features, or shows the attributes on a different entity,
        creating ambiguity about the target subject.
      score_0: The evidence fails to show the specific attributes or states described
        in the question, or analyzes an entity that clearly lacks these attributes,
        making it impossible to verify the claim about the specific target.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: frequency_superlative_grounding
      description: Whether the evidence provides sufficient instances, counts, or
        explicit statements to verify or exclude a claim about frequency, prevalence,
        or a superlative (e.g., 'mostly', 'most often', 'always'), rather than relying
        on a single isolated instance or a generic description.
      score_1: The evidence explicitly states the frequency/count or provides multiple
        distinct instances across the video that collectively verify the superlative
        or frequency claim.
      score_half: The evidence provides a single instance or implies the frequency
        but lacks the multiple instances or explicit count needed to definitively
        verify the superlative.
      score_0: The evidence only describes a single instance or a generic scene, providing
        no basis to determine if the action occurs 'mostly' or is the 'most' common.
      weight: 3.0
      failure_repair_action: refine_query
    - name: turn_sequence_isolation
      description: Whether the evidence explicitly isolates the specific turn, phase,
        or sequential slot of the target entity within a multi-agent process, rather
        than merely describing the general phase or the actions of other entities.
      score_1: The evidence clearly identifies the specific turn or slot belonging
        to the target entity and shows the action (or lack thereof) taken during that
        specific interval.
      score_half: The evidence describes the general phase or the actions of other
        entities in the sequence but does not explicitly isolate the target entity's
        specific turn or slot.
      score_0: The evidence only describes the overall process or phase without distinguishing
        the specific turns or slots of individual entities, making it impossible to
        verify actions attributed to a specific turn.
      weight: 3.0
      failure_repair_action: refine_query
    - name: turn_action_vs_pass_explicitness
      description: Whether the evidence explicitly confirms the specific action taken
        (or the explicit lack of action/pass) by the target entity during their isolated
        turn, rather than merely describing the turn's existence or the general phase.
      score_1: The evidence explicitly shows or states the specific action performed
        by the target entity during their turn, or explicitly confirms that no action
        was taken (a pass/skip) during that turn.
      score_half: The evidence isolates the target entity's turn but implies the action
        or lack thereof without explicit confirmation (e.g., showing the timer expiring
        without showing the selection or the 'pass' indicator).
      score_0: The evidence describes the general phase or the turn's existence but
        provides no information about what the target entity actually did or did not
        do during that specific interval.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_finality_grounding
      description: Whether the evidence explicitly confirms that the depicted event
        is the final, game-ending, or conclusive instance required to verify a claim
        about the 'final' outcome, rather than merely showing an event that occurs
        during the process.
      score_1: The evidence explicitly states or visually demonstrates that the event
        is the final one (e.g., 'final structure', 'game over', 'victory screen',
        'match ends'), confirming the terminal status.
      score_half: The evidence shows a significant event or a late-stage action but
        lacks explicit confirmation that this specific instance is the one that concludes
        the game or process.
      score_0: The evidence shows an event that could be intermediate or early in
        the sequence, with no information to confirm it is the final or conclusive
        event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: cross_segment_mapping_coverage
      description: Whether the evidence explicitly covers all distinct temporal segments
        or contexts required to map, compare, or link entities, actions, or rules
        across them, rather than providing details for only one side of the comparison.
      score_1: The evidence includes explicit content from every distinct segment
        or context mentioned in the question, allowing the specific link or comparison
        (e.g., matching rules, identifying the same entity) to be verified.
      score_half: The evidence covers one side of the comparison or link (e.g., the
        rules of one game) but lacks the corresponding content from the other segment
        needed to establish the connection.
      score_0: The evidence is restricted to a single segment or context, making it
        impossible to perform the required cross-segment mapping or comparison.
      weight: 3.0
      failure_repair_action: refine_query
    - name: identity_label_explicitness
      description: Whether the evidence explicitly resolves the specific identity,
        name, or label of the target entity (e.g., via on-screen text, spoken name,
        or clear visual identifier) required to map or compare it across different
        segments, rather than merely depicting the entity or describing the segment
        context.
      score_1: The evidence explicitly states or displays the specific name, label,
        or unique identifier of the target entity, allowing it to be definitively
        linked to other segments or options.
      score_half: The evidence depicts the entity or implies its identity through
        context (e.g., showing a jersey without the name, or discussing the segment
        without naming the player), but lacks the explicit label needed for definitive
        cross-segment mapping.
      score_0: The evidence shows the entity or segment but provides no information
        to determine the specific identity or name of the target, making cross-segment
        comparison impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: identity_based_cross_segment_anchoring
      description: Whether the evidence explicitly resolves the specific identity
        (name, label, or unique visual marker) of a target entity in one segment to
        serve as an anchor for locating, verifying, or excluding that same entity's
        specific instance or ordinal position in a different segment.
      score_1: The evidence explicitly identifies the target entity (e.g., via name,
        jersey number, or unique visual) in the source segment and provides sufficient
        context in the target segment to definitively locate or verify the entity's
        specific instance or position there.
      score_half: The evidence identifies the entity in one segment but lacks the
        specific visual or textual cues in the other segment needed to definitively
        link the entity to a specific instance or position, or vice versa.
      score_0: The evidence fails to explicitly identify the target entity in either
        segment, or provides no information to link the entity across the different
        segments, making the cross-segment comparison impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: game_rule_explicitness
      description: Whether the evidence explicitly states the specific rules, format,
        constraints, or official name of the game or challenge being played, rather
        than merely depicting the action or implying the rules through context.
      score_1: The evidence explicitly states the game's name, specific rules, constraints
        (e.g., number of shots, scoring method), or format required to verify the
        option.
      score_half: The evidence depicts the game being played or implies the rules
        through the actions shown, but does not explicitly state the specific format
        or constraints.
      score_0: The evidence shows a generic activity or scene without any explicit
        information about the specific rules, format, or name of the game being played.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  OCR Problems:
    rubric_criteria:
    - name: absence_verification
      description: Whether the evidence explicitly confirms the absence of the option's
        proposition or covers the complete set of described topics to logically exclude
        the option.
      score_1: Evidence explicitly states the concept is not discussed, or the evidence
        comprehensively covers all described topics, leaving no room for the option
        to be present.
      score_half: Evidence covers most described topics but leaves a gap where the
        option could theoretically exist, or implies absence without explicit confirmation.
      score_0: Evidence only confirms the presence of other concepts without establishing
        the absence of the target option or covering the full scope of the video.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_attribution
      description: Whether the evidence explicitly attributes the specific event,
        outcome, or state change to the specific entity identifier (e.g., mission
        name, person, object) asserted in the option, rather than presenting them
        as separate or unlinked facts.
      score_1: The evidence explicitly states that the specific entity experienced
        the specific event/outcome.
      score_half: The evidence mentions the entity and the event separately, or implies
        the link without explicit attribution.
      score_0: The evidence mentions the event without the entity, the entity without
        the event, or links the event to a different entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: proposition_exactness
      description: Whether the evidence explicitly asserts the specific proposition
        (including the precise nature of the event, outcome, or state) claimed in
        the option, rather than a related but distinct concept (e.g., 'glitch' vs
        'failure', 'challenge' vs 'disaster').
      score_1: The evidence explicitly states the exact event/outcome/state asserted
        in the option.
      score_half: The evidence states a related concept (e.g., a minor issue vs a
        major failure) that implies but does not explicitly confirm the option's specific
        proposition.
      score_0: The evidence states a different event/outcome, or mentions the entity
        without any event matching the option's claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_identifier_explicitness
      description: Whether the evidence explicitly provides the specific temporal
        identifier (e.g., season/episode number, date, timestamp, or chapter title)
        asserted in the option, rather than merely depicting the event without its
        temporal label.
      score_1: The evidence explicitly states or displays the exact temporal identifier
        (e.g., 'S10/E01') required to verify or exclude the option.
      score_half: The evidence implies a time period or shows a related identifier,
        but the exact specific identifier asserted in the option is missing or ambiguous.
      score_0: The evidence depicts the event or context but contains no explicit
        temporal identifier to distinguish between options differing by time.
      weight: 4.0
      failure_repair_action: refine_query
    - name: event_identifier_linkage
      description: Whether the evidence explicitly links the specific event or state
        change to the specific temporal identifier (e.g., season/episode, date) asserted
        in the option, rather than presenting the event and the identifier in separate,
        unconnected contexts.
      score_1: The evidence explicitly associates the specific event with the specific
        temporal identifier (e.g., the event occurs while the identifier is displayed
        or stated).
      score_half: The evidence contains both the event and the identifier, but they
        appear in separate segments or contexts without an explicit link confirming
        they refer to the same instance.
      score_0: The evidence contains the event without the identifier, the identifier
        without the event, or links the event to a different identifier.
      weight: 4.0
      failure_repair_action: refine_query
    - name: sequence_ordinal_explicitness
      description: Whether the evidence explicitly identifies the ordinal position
        (e.g., first, second, third, last, final) of the specific event instance within
        the sequence of actions performed by the target entity, rather than merely
        depicting the action without its sequence index.
      score_1: The evidence explicitly states or displays the specific ordinal position
        (e.g., 'third attempt', 'last jump') of the event instance.
      score_half: The evidence implies a sequence or shows multiple instances but
        the specific ordinal position of the target instance is ambiguous or not explicitly
        stated.
      score_0: The evidence depicts the event instance but contains no information
        about its position in the sequence (e.g., first vs last vs middle).
      weight: 4.0
      failure_repair_action: refine_query
    - name: superlative_grounding
      description: Whether the evidence explicitly links a comparative superlative
        (e.g., 'best', 'worst', 'biggest', 'most') to the specific instance or ordinal
        position asserted in the option, rather than merely mentioning the superlative
        in a general context or describing the instance without the superlative.
      score_1: The evidence explicitly states that the specific instance (e.g., the
        last jump) is the one that holds the superlative quality (e.g., 'the best').
      score_half: The evidence mentions the superlative quality generally or describes
        the specific instance, but does not explicitly link the two (e.g., 'a great
        jump' vs 'the best jump', or 'the last jump' without stating it was the best).
      score_0: The evidence mentions neither the superlative quality nor the specific
        instance, or links the superlative to a different instance.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_quantitative_linkage
      description: Whether the evidence explicitly links a specific quantitative value
        (e.g., height, score, time) to the specific ordinal instance (e.g., first,
        second, final) of the target entity's action, rather than presenting the value
        and the ordinal instance in separate or unconnected contexts.
      score_1: The evidence explicitly states that the specific ordinal instance (e.g.,
        'first attempt') resulted in or was set at the specific quantitative value
        asserted in the option.
      score_half: The evidence mentions the specific ordinal instance and the specific
        quantitative value separately, or implies a link without explicitly confirming
        that the value belongs to that specific instance.
      score_0: The evidence mentions the ordinal instance without the value, the value
        without the ordinal instance, or links the value to a different ordinal instance.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_boundary_verification
      description: Whether the evidence explicitly confirms the state, value, or event
        at the specific temporal boundary (e.g., start, end, halftime, final whistle)
        asserted in the option, rather than merely showing the state at some point
        within the interval.
      score_1: The evidence explicitly displays or states the state/value at the exact
        boundary moment (e.g., a scoreboard labeled 'HALF TIME' or 'FULL TIME' showing
        the final score).
      score_half: The evidence shows the state near the boundary or implies it remained
        constant, but lacks an explicit marker confirming the state at the exact boundary
        moment.
      score_0: The evidence only shows the state at an arbitrary point within the
        interval, with no information about the state at the specific boundary.
      weight: 4.0
      failure_repair_action: refine_query
    - name: quantitative_event_linkage
      description: Whether the evidence explicitly links the specific quantitative
        value (e.g., total count, score, amount) asserted in the option to the specific
        event, milestone, or temporal boundary (e.g., 'when meeting X', 'at the end
        of the race') required by the question, rather than presenting the value and
        the event in separate, unconnected contexts.
      score_1: The evidence explicitly states or displays the specific quantitative
        value occurring at or resulting from the specific event/milestone asserted
        in the option.
      score_half: The evidence mentions the specific quantitative value and the specific
        event separately, or implies a link without explicitly confirming that the
        value applies to that exact moment.
      score_0: The evidence mentions the quantitative value without the event, the
        event without the value, or links the value to a different event/time.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Spatial Reasoning:
    rubric_criteria:
    - name: quantitative_rate_grounding
      description: Whether the evidence provides explicit rate, split, or pace data
        (e.g., time per distance, distance per time) sufficient to mathematically
        extrapolate or verify the quantitative value in the option for the queried
        interval.
      score_1: Evidence explicitly states a rate, split time, or pace that allows
        direct calculation or verification of the option's quantity for the target
        interval.
      score_half: Evidence provides partial quantitative data (e.g., total time without
        distance, or distance without time) or data for a non-representative segment
        that makes extrapolation uncertain.
      score_0: Evidence lacks any explicit rate, split, or pace data; the quantity
        must be guessed or inferred from unrelated context.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_scope_alignment
      description: Whether the quantitative rate, split, or pace data provided in
        the evidence is explicitly anchored to the specific time window or interval
        queried in the question, rather than a different segment of the event.
      score_1: The evidence provides rate/split data explicitly tied to the queried
        time interval (e.g., 'at the 25-minute mark', 'average over the first 25 minutes'),
        allowing direct verification.
      score_half: The evidence provides rate/split data for a segment that partially
        overlaps or is adjacent to the queried interval, but the exact rate for the
        target window is not explicitly stated.
      score_0: The evidence provides rate/split data only for segments clearly outside
        the queried interval (e.g., start, finish, or a random middle segment) with
        no data for the target window.
      weight: 4.0
      failure_repair_action: refine_query
    - name: rate_representativeness
      description: Whether the quantitative rate, split, or pace data provided is
        explicitly stated as a stable average or current representative value for
        the queried interval, rather than a variable, historical, or segment-specific
        value that would invalidate extrapolation.
      score_1: Evidence explicitly states a rate/pace as an average, current, or representative
        value for the target interval, allowing valid mathematical extrapolation.
      score_half: Evidence provides a rate/pace but it is ambiguous whether it is
        representative (e.g., no mention of 'average' or 'current', or mixed with
        variable pace indicators).
      score_0: Evidence provides rate/pace data that is explicitly non-representative
        (e.g., historical, from a different segment, or described as variable/increasing)
        making extrapolation invalid.
      weight: 4.0
      failure_repair_action: refine_query
    - name: landmark_identity_grounding
      description: Whether the evidence explicitly identifies the specific landmark,
        named location, or unique scene identifier required to verify or exclude the
        geographic options, rather than providing only generic scene descriptions.
      score_1: Evidence explicitly names the landmark/location or provides a unique
        visual identifier (e.g., 'Spanish Steps', 'Eiffel Tower') that directly maps
        to one option and excludes others.
      score_half: Evidence provides strong visual cues or partial names that suggest
        a location but do not explicitly confirm the specific landmark needed to rule
        out all distractors.
      score_0: Evidence describes only generic scene features (e.g., 'stone stairs',
        'plaza', 'crowd') without naming or uniquely identifying the specific location.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
