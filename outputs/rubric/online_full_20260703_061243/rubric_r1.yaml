general:
  rubric_criteria:
  - name: evidence_coverage
    description: Evidence covers the key event, time window, state change, comparison
      target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 1.0
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Evidence explicitly grounds the relevant person, object, action,
      scene, speaker, on-screen text, or spatial relation rather than a generic scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 1.0
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Evidence is internally consistent and contains enough contrary evidence
      to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 1.0
    failure_repair_action: broadcast
  scoring_rule: average
  sufficient_threshold: 0.8
type_aliases:
  Temporal Reasoning: Temporal Reasoning
  Action Reasoning: Action Reasoning
  Object Reasoning: Object Reasoning
  Attribute Perception: Attribute Perception
  Object Recognition: Object Recognition
  Temporal Perception: Temporal Perception
  Information Synopsis: Information Synopsis
  Counting Problem: Counting Problem
  Action Recognition: Action Recognition
  OCR Problems: OCR Problems
  Spatial Reasoning: Spatial Reasoning
  Spatial Perception: Spatial Perception
templates:
  Temporal Reasoning:
    rubric_criteria:
    - name: narrative_sequence_grounding
      description: Evidence must contain explicit temporal markers (e.g., 'first',
        'then', 'finally', 'after', 'before', 'por último', 'primero') that directly
        link the specific items listed in the options to a chronological order. Evidence
        showing items without these connecting markers, or showing items in a non-sequential
        manner, is insufficient to verify the sequence.
      score_1: Evidence explicitly uses temporal markers to order the specific items
        mentioned in the options, allowing the exact sequence to be reconstructed
        or wrong orders to be excluded (e.g., identifying the final item via 'por
        último').
      score_half: Evidence mentions the items and implies a flow (e.g., showing them
        one after another) but lacks explicit temporal markers connecting them, making
        the exact sequence ambiguous.
      score_0: Evidence lists or shows the items individually or in a non-sequential
        manner without any temporal markers indicating the order of presentation.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Reasoning:
    rubric_criteria:
    - name: tactical_intent_verification
      description: Evidence must explicitly state the specific strategic intent or
        tactical definition (e.g., 'proactive engagement', 'skirmishing', 'forcing
        enemy movement') that defines the team's approach, rather than just describing
        the resulting actions (e.g., 'pushing', 'attacking') or isolated trade-offs.
      score_1: Commentary or text explicitly names or describes the specific tactical
        concept (e.g., 'proactive engagement', 'skirmish', 'forcing a return') that
        matches or excludes the options, often by linking actions to strategic goals
        like timing or enemy positioning.
      score_half: Evidence describes specific actions or trade-offs (e.g., 'sacrificed
        tower') that imply a strategy, but lacks the explicit naming or description
        of the specific tactical concept required to distinguish between similar options.
      score_0: Evidence only lists generic actions (e.g., 'pushing', 'fighting') or
        objectives secured without any mention of the underlying tactical intent or
        strategic definition.
      weight: 5.0
      failure_repair_action: refine_query
    - name: action_tactic_mapping
      description: Evidence must explicitly link the observed in-game actions to the
        specific tactical definition in the options by citing the strategic consequence,
        timing, or intent (e.g., linking 'pushing after Baron' to 'proactive engagement'
        to 'force enemy to return' or 'end the game').
      score_1: The evidence explicitly connects the specific actions observed to the
        tactical concept in the option by stating the strategic consequence or intent
        (e.g., 'pushing to force enemy return' or 'engaging to secure timing advantage').
      score_half: Actions are described that could fit the option, but the explicit
        link to the specific tactical definition via strategic consequence, timing,
        or intent is missing or ambiguous.
      score_0: Actions are described but do not align with the specific tactical definitions
        in the options, or the link is completely absent.
      weight: 4.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Reasoning:
    rubric_criteria:
    - name: numerical_rule_grounding
      description: Evidence must explicitly state the total number of items in the
        system (e.g., '12 locations on the map') and the resulting mathematical invariant
        (e.g., 'sum is always 12') to verify the correct option or exclude incorrect
        totals.
      score_1: Evidence explicitly states both the total system count and the invariant
        sum (e.g., '12 locations, so sum is 12'), allowing verification of the correct
        option and exclusion of others.
      score_half: Evidence mentions a counter or tracking mechanism and implies a
        total, but fails to explicitly state the specific total count or the invariant
        sum, making it impossible to verify the exact numerical rule.
      score_0: Evidence describes the visual components or general function of the
        board without mentioning any specific numerical values, totals, or mathematical
        rules.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Attribute Perception:
    rubric_criteria:
    - name: winning_condition_isolation
      description: Evidence must isolate the specific game's winning condition (tallest
        tower) and explicitly exclude rules, actions, or scoring from unrelated games
        (e.g., weighing games, elimination rounds) that could confuse the strategy.
      score_1: Evidence contains only the tower game context; no rules or actions
        from other games are present, allowing clear verification of the 'do not knock
        down' strategy.
      score_half: Evidence contains the tower game but is mixed with rules or actions
        from a different game, creating ambiguity about whether the 'do not knock
        down' rule applies to the current task.
      score_0: Evidence is dominated by unrelated game rules or actions, making it
        impossible to determine the specific winning condition for the tower game.
      weight: 5.0
      failure_repair_action: refine_query
    - name: strategy_action_verification
      description: Evidence must explicitly show the specific action required to win
        (stacking without knocking down) and provide sufficient context to exclude
        contradictory strategies (e.g., knocking down to restart).
      score_1: Evidence clearly shows the winning method (stacking without knocking
        down) and contains no evidence of contradictory actions (e.g., knocking down
        the tower) that would suggest a different strategy.
      score_half: Evidence shows the winning method but also includes contradictory
        actions (e.g., a scene where the tower is knocked down) or is ambiguous about
        whether the 'do not knock down' strategy is the only valid one.
      score_0: Evidence fails to link the rule to the method, or primarily consists
        of contradictory actions (e.g., knocking down the tower), making it impossible
        to verify the correct strategy.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Recognition:
    rubric_criteria:
    - name: object_value_enumeration
      description: Evidence must explicitly list or visually display the complete
        set of numerical values printed on the faces of the target game pieces (e.g.,
        hexagonal tokens) to distinguish between values that are permanently printed
        and values that only appear as transient states (e.g., damage results or evolution
        steps).
      score_1: Evidence explicitly enumerates the specific values printed on the object
        faces (e.g., '1, 2, 3, and 5') and clarifies the distinction between these
        printed values and values that appear only during state changes (e.g., '4
        becomes 3'), allowing definitive exclusion of values not in the printed set.
      score_half: Evidence mentions specific values or discusses state changes (e.g.,
        '2 becomes 1') but fails to explicitly list the complete set of values printed
        on the object faces, leaving ambiguity about which values are excluded from
        the printed set.
      score_0: Evidence fails to identify the specific values on the target objects
        or only discusses generic numbers without linking them to the printed faces
        of the game pieces.
      weight: 5.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Perception:
    rubric_criteria:
    - name: event_time_slot_grounding
      description: Evidence must explicitly co-locate the specific target event (e.g.,
        'kitchen mishap', 'spilled') with a specific temporal slot (Day of week +
        Meal type) in a single assertion or a direct causal link. It must not merely
        list the event and the time slot in separate, unconnected segments.
      score_1: Evidence explicitly states that the target event occurred during a
        specific Day/Meal combination (e.g., 'On Tuesday dinner, I spilled...') or
        provides a direct link allowing the specific option to be verified or excluded.
      score_half: Evidence mentions the target event and mentions a time slot, but
        fails to explicitly link them (e.g., 'I had a mishap' in one clip and 'It
        is Tuesday' in another without connection), leaving the specific option unverifiable.
      score_0: Evidence lacks the target event entirely, lacks the specific temporal
        slots, or the link between them is completely absent.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Information Synopsis:
    rubric_criteria:
    - name: fitness_activity_evidence
      description: Evidence must visually depict the heroine actively performing specific
        physical fitness exercises (e.g., running on a treadmill, stretching, lifting
        weights) within a gym or workout setting to verify the 'fitness' synopsis.
        Metaphorical references to exercise (e.g., 'cleaning is cardio') or mere presence
        in a gym without activity are insufficient.
      score_1: Evidence clearly shows the heroine actively performing a specific workout
        routine (e.g., running, stretching) in a gym environment, allowing definitive
        verification of the fitness focus.
      score_half: Evidence shows the heroine in a gym setting but not exercising,
        or mentions fitness verbally without visual confirmation of the specific physical
        activity.
      score_0: Evidence shows only daily life, eating, or home activities, or mentions
        fitness only metaphorically (e.g., 'cleaning is cardio') without visual evidence
        of actual exercise, failing to verify the fitness focus.
      weight: 5.0
      failure_repair_action: refine_query
    - name: exclusion_of_alternative_foci
      description: Evidence must contain sufficient duration and density of the primary
        activity (fitness) to establish it as the dominant theme, thereby excluding
        other activities (eating, shopping, home life) as the *primary* focus of the
        video.
      score_1: Evidence is dominated by the primary activity (fitness), with clear
        visual and temporal weight making it evident that other activities shown are
        secondary or incidental.
      score_half: Evidence shows a mix of activities where the primary focus is not
        clearly distinguishable from secondary ones, or the fitness content is too
        sparse to claim dominance.
      score_0: Evidence only shows alternative activities (eating, cleaning) or is
        too sparse to determine the primary focus, failing to exclude wrong options.
      weight: 4.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.8
  Counting Problem:
    rubric_criteria:
    - name: explicit_total_count
      description: Evidence must provide a definitive total count either by explicitly
        stating the number (e.g., '7 questions') or by presenting a complete sequence
        of explicitly marked question events from the first to the last, with no unaccounted
        intervals where a question could have occurred.
      score_1: Evidence explicitly states the total number OR presents a sequence
        where every distinct question is explicitly marked (e.g., 'first', 'second',
        ..., 'last'), allowing the total to be derived unambiguously.
      score_half: Evidence lists some questions (e.g., first and last) and implies
        others, but lacks explicit markers for all intermediate questions, leaving
        the total count ambiguous.
      score_0: Evidence shows only a subset of questions or provides no list/count,
        making it impossible to determine the total number of distinct events due
        to missing intermediate question markers.
      weight: 5.0
      failure_repair_action: refine_query
    - name: scope_definition
      description: Evidence must establish the scope of the counting task (e.g., 'Part
        1', 'all techniques in this video') to ensure the count corresponds to the
        specific set of options provided.
      score_1: Evidence explicitly defines the scope (e.g., 'Learn different leaf
        embroidery stitches 1', 'Part 2') and confirms the count applies to this specific
        scope.
      score_half: Evidence implies a scope but does not explicitly link the count
        to a specific segment or part of the video.
      score_0: Evidence provides no context regarding the scope, making it unclear
        if the count refers to the whole video or a subset.
      weight: 4.0
      failure_repair_action: refine_query
    - name: question_event_identification
      description: Evidence must contain explicit verbal markers that frame a specific
        utterance as a distinct question event (e.g., 'la prima domanda', 'la prossima
        domanda', 'l'ultima domanda', 'my next question is'). This distinguishes questions
        from general conversation, follow-ups, or answers.
      score_1: Evidence explicitly labels the start of each question event with a
        clear verbal marker (e.g., 'first question', 'last question'), allowing the
        total count to be derived by counting these markers.
      score_half: Evidence contains some question markers but misses others, or the
        markers are ambiguous (e.g., 'I want to ask' without a clear boundary), leaving
        the total count uncertain.
      score_0: Evidence shows conversation flow but lacks explicit verbal markers
        framing utterances as distinct questions; it is impossible to distinguish
        questions from general dialogue.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Recognition:
    rubric_criteria:
    - name: final_state_visualization
      description: Evidence must explicitly show the protagonist in a static, motionless
        state (e.g., lying flat, collapsed) specifically ON TOP of the key scene object
        (the red table/box) at the narrative conclusion to verify the 'dead on table'
        ending.
      score_1: The evidence clearly depicts the protagonist lying motionless directly
        on top of the red table/box with no subsequent movement, confirming the specific
        final outcome.
      score_half: The evidence shows the protagonist in a vulnerable state (e.g.,
        kneeling, sitting, falling) or lying on the floor/chair, but does not confirm
        the final static state specifically on top of the table/box.
      score_0: The evidence only shows the protagonist active, arguing, or in a non-final
        state without visual confirmation of the final collapse on the table.
      weight: 5.0
      failure_repair_action: refine_query
    - name: spatial_resolution_grounding
      description: Evidence must explicitly ground the protagonist's final position
        as being ON TOP of the red table/box (not merely near, beside, or on the floor)
        to distinguish the specific ending scenario.
      score_1: The evidence explicitly shows the protagonist's final location as lying
        on top of the red table/box, matching the specific spatial claim of the correct
        option.
      score_half: The evidence shows the protagonist near the table, on the floor,
        or on a chair, but the exact final position 'on top of the table' is ambiguous
        or not shown.
      score_0: The evidence lacks clear spatial grounding of the protagonist's final
        position relative to the table, or shows them in a location inconsistent with
        the 'on table' claim.
      weight: 5.0
      failure_repair_action: dense_sample
    - name: narrative_causality_closure
      description: Evidence must capture the causal link between the antagonist's
        action and the protagonist's final state to verify the mechanism of the ending
        (e.g., killed, scared away, awakened).
      score_1: The evidence shows the sequence leading to the final state (e.g., antagonist's
        action followed by protagonist collapsing and remaining still), allowing verification
        of the cause of the ending.
      score_half: The evidence shows the final state but the immediate preceding action
        causing it is missing or unclear.
      score_0: The evidence shows the characters interacting but lacks the specific
        action that leads to the final resolution state.
      weight: 3.0
      failure_repair_action: time_sorted
    scoring_rule: average
    sufficient_threshold: 0.8
  OCR Problems:
    rubric_criteria:
    - name: scoreboard_ocr_at_halftime
      description: Evidence must contain a clear, legible visual of the scoreboard
        displaying scores for BOTH teams at a timestamp explicitly corresponding to
        the HALFTIME state (e.g., clock at 00:00 of the 2nd period, 'Halftime' indicator,
        or commentary confirming the score at the break).
      score_1: Evidence explicitly shows a scoreboard with legible scores at a moment
        confirmed to be halftime (e.g., clock reads 00:00 after 2nd quarter, or audio/visual
        confirms 'halftime score'), allowing the exact score to be verified.
      score_half: Evidence shows a scoreboard with legible scores, but the timestamp
        is ambiguous regarding the period (e.g., no clock visible, or clock is blurry)
        AND there is no explicit confirmation that it is the halftime break.
      score_0: Evidence lacks a scoreboard at the halftime moment, the scores are
        illegible, OR the evidence explicitly shows a timestamp that is NOT halftime
        (e.g., clock shows 8:05 remaining, or commentary confirms a specific quarter
        other than the break), making it impossible to verify the halftime score.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Spatial Reasoning:
    rubric_criteria:
    - name: location_specific_anchor
      description: Evidence explicitly identifies a unique visual marker (e.g., specific
        landmark name, distinct architectural style, flag, or cultural symbol) that
        is characteristic of one option and allows the exclusion of the other country
        options.
      score_1: Evidence contains a specific, unique visual marker (e.g., 'Spanish
        Steps', 'Eiffel Tower', 'distinctive colonial architecture', 'national flag',
        'brand sign in a specific city') that definitively points to one country and
        excludes the others.
      score_half: Evidence contains visual elements that are suggestive of a region
        or style but not unique enough to definitively exclude other options (e.g.,
        'stone stairs' without naming the landmark, 'tropical beach' without specific
        flora/fauna, 'historic architecture' without specific identifiers).
      score_0: Evidence contains only generic scene descriptions (e.g., 'plaza', 'stairs',
        'crowd', 'costumes', 'stone lion') that could plausibly exist in any of the
        option countries, providing no basis to exclude any specific country.
      weight: 5.0
      failure_repair_action: dense_sample
    scoring_rule: average
    sufficient_threshold: 0.8
  Spatial Perception:
    rubric_criteria:
    - name: object_placement_relation
      description: Evidence contains a direct verbal statement of intent explicitly
        linking the specific target object (e.g., 'neon sign', 'lamp') to the specific
        reference location (e.g., 'above the clothing rack', 'above the hangers')
        mentioned in the options.
      score_1: The evidence includes a clear statement where the speaker explicitly
        declares the plan to place the specific target object in the specific spatial
        relationship to the reference location (e.g., 'I'm gonna put the neon sign
        above the clothing rack'), allowing definitive verification of the correct
        option.
      score_half: The evidence mentions the target object and the reference location
        in the same context or scene, or implies a connection, but lacks an explicit
        verbal statement of the intended spatial relationship (e.g., shows the object
        and location separately, or discusses the object without stating where it
        will go).
      score_0: The evidence mentions the target object or reference location in isolation,
        discusses unrelated objects/locations, or fails to establish any link between
        the specific object and the specific location required to verify or exclude
        the options.
      weight: 5.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
