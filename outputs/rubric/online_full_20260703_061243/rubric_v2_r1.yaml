general:
  rubric_criteria:
  - name: evidence_coverage
    description: Evidence covers the key event, time window, state change, comparison
      target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 1.0
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Evidence explicitly grounds the relevant person, object, action,
      scene, speaker, on-screen text, or spatial relation rather than a generic scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 1.0
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Evidence is internally consistent and contains enough contrary evidence
      to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 1.0
    failure_repair_action: broadcast
  scoring_rule: average
  sufficient_threshold: 0.8
type_aliases:
  Temporal Reasoning: Temporal Reasoning
  Action Reasoning: Action Reasoning
  Object Reasoning: Object Reasoning
  Attribute Perception: Attribute Perception
  Object Recognition: Object Recognition
  Temporal Perception: Temporal Perception
  Information Synopsis: Information Synopsis
  Counting Problem: Counting Problem
  Action Recognition: Action Recognition
  OCR Problems: OCR Problems
  Spatial Reasoning: Spatial Reasoning
  Spatial Perception: Spatial Perception
templates:
  Temporal Reasoning:
    rubric_criteria:
    - name: temporal_boundary_verification
      description: Evidence contains explicit temporal markers (dates, eras, reigns)
        that allow the solver to definitively place the event in question relative
        to the query's temporal boundary (e.g., before, after, during).
      score_1: Evidence explicitly states dates or time periods for all relevant events,
        allowing clear verification of whether they fall before, after, or during
        the queried boundary.
      score_half: Evidence provides dates for some events but lacks specific temporal
        markers for others, making it impossible to definitively place all options
        relative to the boundary.
      score_0: Evidence lacks specific temporal markers or only provides a general
        timeframe that does not allow distinguishing events relative to the queried
        boundary.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequential_enumeration
      description: Evidence explicitly presents the target items in a specific sequence
        (e.g., a list, a chronological narrative, or a visual progression) that allows
        the solver to verify the relative order of the items as asserted by the options.
      score_1: Evidence explicitly lists or sequences all target items in the correct
        order, allowing direct verification of the option's sequence.
      score_half: Evidence mentions the target items but fails to present them in
        a clear sequence, or the sequence is incomplete/ambiguous.
      score_0: Evidence mentions the target items only in isolation or without any
        indication of their relative order.
      weight: 3.0
      failure_repair_action: refine_query
    - name: directional_trajectory
      description: Evidence establishes a clear spatial or narrative trajectory (origin,
        path, direction) that allows the solver to verify or exclude options based
        on movement relative to the established path (e.g., ruling out 'returning'
        or 'staying' when the evidence shows forward progression).
      score_1: Evidence explicitly defines the starting point and current position/direction,
        allowing definitive exclusion of options that contradict the established trajectory
        (e.g., moving backward or staying put).
      score_half: Evidence shows movement or location but lacks a clear origin or
        direction, making it difficult to rule out options involving reversal or stasis.
      score_0: Evidence describes isolated events or locations without establishing
        a directional path or trajectory.
      weight: 3.0
      failure_repair_action: refine_query
    - name: post_event_outcome_explicitness
      description: Evidence explicitly describes the specific action, state change,
        or event that occurs immediately after the queried temporal boundary or event,
        rather than stopping at the boundary itself.
      score_1: Evidence explicitly details the subsequent event or outcome that follows
        the queried moment, allowing direct verification of 'what happened next' options.
      score_half: Evidence implies a continuation or mentions future events vaguely,
        but does not explicitly describe the specific immediate outcome required to
        distinguish between options.
      score_0: Evidence describes the queried event or the state leading up to it,
        but contains no information about what happens immediately afterward.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_habit_affirmation
      description: Evidence explicitly states the specific action, habit, or capability
        the subject performs (or does not perform) in the queried context, rather
        than merely implying it through the negation of other options or general descriptions
        of the subject's role.
      score_1: Evidence explicitly affirms the specific action or habit asserted by
        the correct option (or explicitly denies the specific action of incorrect
        options) in the context of the query.
      score_half: Evidence negates incorrect options or describes the subject's general
        role but lacks an explicit statement confirming the specific action or habit
        of the correct option.
      score_0: Evidence provides no explicit statement regarding the specific action
        or habit, relying entirely on inference or unrelated context.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_continuity
      description: Evidence establishes a continuous narrative or visual thread linking
        the target items in a specific sequence, proving their relative order through
        immediate transitions rather than presenting them as isolated, disjointed
        events.
      score_1: Evidence explicitly shows or states the transitions between all target
        items in a continuous flow, confirming the relative order required by the
        query.
      score_half: Evidence mentions the target items and some transitions, but the
        sequence is broken, ambiguous, or relies on inference to connect disjointed
        segments.
      score_0: Evidence describes the target items in isolation or at widely separated
        timestamps with no narrative link establishing their relative order.
      weight: 3.0
      failure_repair_action: refine_query
    - name: complete_temporal_anchoring
      description: Evidence provides explicit temporal markers (timestamps, sequential
        cues, or narrative transitions) for every single item in the set being ordered,
        allowing the solver to place each item on the timeline relative to the others.
      score_1: Every item mentioned in the options is explicitly located in time within
        the evidence, enabling a complete reconstruction of the sequence.
      score_half: Temporal markers are provided for some items, but at least one item
        in the set lacks a specific temporal location, preventing a definitive ordering
        of the full set.
      score_0: Evidence fails to provide temporal markers for most or all items, or
        the items are presented without any indication of their relative timing.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_span_coverage
      description: Evidence spans the full temporal range of the video (or the relevant
        segment) required to capture the earliest and latest occurrences of the target
        items, ensuring no item is missed due to a gap at the beginning or end of
        the evidence set.
      score_1: Evidence includes segments from the start and end of the relevant timeline,
        ensuring all items in the sequence are captured and their relative order can
        be fully reconstructed.
      score_half: Evidence covers a significant portion of the timeline but misses
        the very beginning or very end, potentially omitting the first or last item
        in the sequence.
      score_0: Evidence is restricted to a narrow window in the middle of the video,
        failing to capture items that appear at the start or end, making sequence
        reconstruction impossible.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: set_completeness_for_ordering
      description: Evidence contains at least one instance of every distinct item
        or event listed in the options, ensuring the full set required to construct
        the sequence is present.
      score_1: Evidence explicitly mentions or depicts every single item required
        to form the complete sequence asserted in the options.
      score_half: Evidence mentions most items in the set, but at least one item required
        for the full sequence is missing, preventing a definitive ordering of the
        entire set.
      score_0: Evidence mentions only a subset of the items, leaving the majority
        of the sequence undefined.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_category_attribution
      description: Evidence explicitly states the specific category, role, or label
        (e.g., 'neuroscientist', 'spiritual leader') asserted in the options for each
        entity in the sequence, rather than requiring inference from related descriptions,
        job titles, or general fields.
      score_1: Evidence explicitly uses the exact category or role terms found in
        the options to describe each entity in the sequence.
      score_half: Evidence describes the entities with related but non-matching terms
        (e.g., 'professor of AI' instead of 'neuroscientist'), requiring inference
        to map to the option categories.
      score_0: Evidence provides no clear role or category for the entities, or the
        descriptions are too generic to map to any specific option category.
      weight: 3.0
      failure_repair_action: refine_query
    - name: meta_structural_labeling
      description: Evidence explicitly contains the meta-structural labels, section
        headers, on-screen titles, or headlines (e.g., 'Part 1', 'Intermission', lower-third
        news titles) that define the boundaries of the items being ordered, rather
        than relying solely on narrative content or implicit transitions.
      score_1: Evidence explicitly displays or states the specific structural labels
        or headers for all items in the sequence, allowing direct mapping to the options
        and definitive identification of each distinct item.
      score_half: Evidence contains some structural labels but misses others, or the
        labels are ambiguous, requiring inference to map them to the specific items
        in the options.
      score_0: Evidence describes the narrative content or events but lacks the explicit
        meta-structural labels, headers, or headlines needed to definitively identify
        and order the distinct items.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_marker_explicitness
      description: Evidence explicitly contains the ordinal markers (e.g., numbers,
        'first/second', 'step 1/2') that define the sequence of items in a list or
        ordered set, allowing the solver to definitively identify the items falling
        between two specific markers.
      score_1: Evidence explicitly displays or states the ordinal markers for the
        boundary items and any intermediate items, enabling a definitive reconstruction
        of the sequence and identification of items 'between' the boundaries.
      score_half: Evidence mentions the content of the items but lacks explicit ordinal
        markers for at least one boundary or intermediate item, making the relative
        order or the specific interval ambiguous.
      score_0: Evidence describes the items in isolation or without any ordinal markers,
        making it impossible to determine the sequence or what lies between specific
        points.
      weight: 4.0
      failure_repair_action: refine_query
    - name: interval_content_coverage
      description: Evidence explicitly captures the content, events, or items occurring
        strictly between the two boundary markers defined in the query, rather than
        only identifying the boundaries themselves.
      score_1: Evidence includes the specific items or events that fall between the
        two queried boundaries, allowing definitive verification of what is (or is
        not) in the interval.
      score_half: Evidence identifies the boundaries but provides incomplete or ambiguous
        information about the content between them, leaving the interval partially
        undefined.
      score_0: Evidence identifies the boundaries but contains no information about
        the content occurring between them, making it impossible to determine what
        lies in the interval.
      weight: 4.0
      failure_repair_action: refine_query
    - name: entity_identity_explicitness
      description: Evidence explicitly names or identifies the specific entities (e.g.,
        by proper noun, unique label, or unambiguous title) asserted in the options,
        rather than relying solely on visual descriptions, generic categories, or
        inferred identities that could apply to multiple candidates.
      score_1: Evidence explicitly states the specific name or unique identifier for
        every entity required to verify or exclude the options, leaving no ambiguity
        about which specific item is being discussed.
      score_half: Evidence provides visual descriptions or generic categories for
        the entities but lacks the explicit names or unique identifiers needed to
        definitively map them to the specific options.
      score_0: Evidence describes entities only through generic visual features or
        context without any explicit naming, making it impossible to distinguish between
        similar candidates or match them to option terms.
      weight: 4.0
      failure_repair_action: refine_query
    - name: evidence_timestamp_ordering
      description: Evidence segments include explicit temporal markers (timestamps,
        start/end times) that allow the solver to reconstruct the chronological sequence
        of events by sorting the evidence, even if the video content itself does not
        explicitly state the order or present items in a list.
      score_1: Evidence segments contain precise timestamps for all target items,
        enabling a definitive reconstruction of the sequence by sorting the segments
        chronologically.
      score_half: Evidence segments contain timestamps for some items but not all,
        or the timestamps are ambiguous, preventing a complete or definitive ordering
        of the full set.
      score_0: Evidence segments lack timestamps or temporal markers, making it impossible
        to determine the relative order of events based on the evidence's position
        in the video timeline.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: first_occurrence_identification
      description: Evidence explicitly captures the first occurrence or introduction
        of each target item in the sequence, rather than a later mention, re-reference,
        or summary, ensuring the relative order reflects the actual introduction timeline.
      score_1: Evidence identifies the first instance of every item in the sequence,
        allowing the solver to reconstruct the true introduction order.
      score_half: Evidence identifies the first instance for some items but relies
        on later mentions or ambiguous references for others, potentially distorting
        the sequence.
      score_0: Evidence relies entirely on later mentions, summaries, or re-references
        of items, failing to capture their initial introduction and making the sequence
        order unverifiable.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: narrative_vs_meta_distinction
      description: Evidence distinguishes between the actual occurrence, demonstration,
        or visual presentation of an event/topic within the video timeline and meta-commentary,
        analysis, definition, or discussion about that event/topic (e.g., a speaker
        explaining a concept vs. the concept being visually demonstrated or occurring).
      score_1: Evidence explicitly depicts or presents the event/topic as occurring
        or being demonstrated within the timeline, rather than merely discussing,
        defining, or analyzing it from an external perspective.
      score_half: Evidence contains a mix of occurrence/demonstration and meta-commentary,
        or the distinction is ambiguous, making it unclear if the event actually happened
        or is just being discussed.
      score_0: Evidence consists entirely of meta-commentary, analysis, definition,
        or discussion about the event/topic without depicting or stating its actual
        occurrence or demonstration in the timeline.
      weight: 4.0
      failure_repair_action: refine_query
    - name: sequential_adjacency_verification
      description: Evidence explicitly captures the immediate transition or temporal
        adjacency between consecutive items in the sequence, rather than merely providing
        isolated timestamps for each item that could be separated by unobserved intervening
        events.
      score_1: Evidence includes the specific segment where one item in the sequence
        immediately follows the previous one, confirming their direct order without
        gaps.
      score_half: Evidence provides timestamps for consecutive items but lacks the
        specific segment showing the transition or immediate adjacency, leaving the
        possibility of intervening unobserved events.
      score_0: Evidence presents items in isolation with large temporal gaps or no
        indication of their relative proximity, making it impossible to verify if
        they are consecutive.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: agenda_vs_execution_distinction
      description: Evidence distinguishes between a list, agenda, or table of contents
        that outlines planned topics and the actual temporal occurrence or presentation
        of those topics within the video timeline, ensuring the sequence is derived
        from the execution rather than the plan.
      score_1: Evidence captures the actual presentation, demonstration, or section
        headers of the target items as they occur in the video timeline, rather than
        relying solely on an agenda, list, or summary slide that outlines the topics.
      score_half: Evidence contains both the agenda/list and some instances of the
        actual presentation, but the sequence is ambiguous or relies on the assumption
        that the agenda matches the execution order.
      score_0: Evidence relies entirely on an agenda, table of contents, or summary
        list to determine the sequence, without capturing the actual temporal occurrence
        or presentation of the items in the video.
      weight: 4.0
      failure_repair_action: refine_query
    - name: superlative_temporal_grounding
      description: Evidence explicitly establishes the absence of prior instances
        or the novelty of the target event to verify superlative temporal claims (e.g.,
        'first', 'earliest', 'initial'), rather than merely providing a date for the
        event itself.
      score_1: Evidence explicitly states or strongly implies that no prior instances
        existed (e.g., 'first ever', 'broke the industry standard', 'no one had done
        this before'), allowing definitive verification of the superlative claim.
      score_half: Evidence provides a date for the event and mentions its significance
        but lacks explicit confirmation that it was the absolute first or earliest,
        leaving the possibility of unmentioned predecessors.
      score_0: Evidence only provides a date or description of the event without any
        context regarding its precedence or novelty, making it impossible to verify
        if it was the 'first' or merely 'an' instance.
      weight: 4.0
      failure_repair_action: refine_query
    - name: relational_chain_verification
      description: Evidence explicitly links the anchor entity (identified by a superlative,
        specific attribute, or unique identifier) to the target entity via the queried
        relationship (e.g., 'previous generation', 'creator of', 'located in'), and
        further links the target entity to the specific attribute asserted in the
        options, rather than providing these pieces of information in isolation.
      score_1: Evidence explicitly connects the anchor entity to the target entity
        through the specific relationship and confirms the target entity's attribute,
        allowing the full multi-hop inference to be verified or excluded.
      score_half: Evidence identifies the anchor entity and the target entity separately,
        or provides the relationship and the attribute separately, but fails to explicitly
        link all three components (anchor, relation, target attribute) in a way that
        confirms the specific chain.
      score_0: Evidence provides information about the anchor, the relationship, or
        the target attribute in isolation, making it impossible to verify the specific
        multi-hop connection required by the query.
      weight: 4.0
      failure_repair_action: refine_query
    - name: superlative_anchor_resolution
      description: Evidence contains the comparative data (e.g., explicit values,
        rankings, or direct comparisons) across the relevant set of items required
        to definitively identify the entity satisfying a superlative or extremal condition
        (e.g., 'most expensive', 'first', 'largest') that serves as the starting point
        for the query.
      score_1: Evidence explicitly provides the values or comparisons for all candidates
        in the set, allowing the solver to definitively identify the single entity
        that satisfies the superlative condition.
      score_half: Evidence provides values or comparisons for some candidates but
        misses others, or the comparison is ambiguous, leaving the identity of the
        superlative entity uncertain.
      score_0: Evidence lists candidates or describes them individually but lacks
        the comparative data or values needed to determine which one satisfies the
        superlative condition.
      weight: 4.0
      failure_repair_action: refine_query
    - name: thematic_predicate_grounding
      description: Evidence explicitly links each target entity in the sequence to
        the specific thematic constraint or predicate defined in the query (e.g.,
        'related to water scarcity', 'involved in the protest'), rather than merely
        mentioning the entity in a different context or without the qualifying attribute.
      score_1: Evidence explicitly states or depicts the specific thematic link (predicate)
        for every entity in the sequence, confirming they all satisfy the query's
        constraint.
      score_half: Evidence links some entities to the theme but leaves others ambiguous
        or mentions them in a context that does not clearly satisfy the specific constraint.
      score_0: Evidence mentions the entities but fails to establish the required
        thematic link for one or more of them, making it impossible to verify if they
        belong to the specific subset requested.
      weight: 4.0
      failure_repair_action: refine_query
    - name: terminal_boundary_verification
      description: Evidence explicitly captures the final item or event in the sequence
        (the absolute end of the relevant timeline), allowing the solver to verify
        ordinal positions relative to the end (e.g., 'last', 'second to last', 'final')
        rather than relying on incomplete sequences that miss the terminal point.
      score_1: Evidence explicitly includes the final item or event in the sequence,
        enabling definitive identification of items at the end of the timeline (e.g.,
        the last item and the one immediately preceding it).
      score_half: Evidence includes items near the end but misses the definitive final
        item or the transition to it, making it impossible to confirm the exact ordinal
        position of the last few items.
      score_0: Evidence is restricted to the beginning or middle of the sequence,
        completely missing the final item or the end of the timeline, rendering any
        query about the 'last' or 'second to last' item unverifiable.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: outcome_explicitness_at_anchor
      description: Evidence explicitly states the specific result, outcome, or state
        change (e.g., victory, defeat, score, rejection) of the event occurring at
        the queried temporal anchor, rather than merely identifying the event or the
        time of the event without its result.
      score_1: Evidence explicitly describes the specific outcome or result of the
        event at the queried time, allowing direct verification of options describing
        that result.
      score_half: Evidence identifies the event and the time but describes the outcome
        vaguely, ambiguously, or only implies it, making it difficult to distinguish
        between specific result options.
      score_0: Evidence identifies the event and/or the time but contains no information
        about the specific outcome or result, making it impossible to verify options
        that hinge on the result.
      weight: 4.0
      failure_repair_action: refine_query
    - name: event_scope_disambiguation
      description: Evidence explicitly confirms that the observed sequence, entities,
        or events belong to the specific event instance, category, or competition
        defined in the query (e.g., 'Men's' vs 'Women's', 'Final' vs 'Preliminary',
        specific tournament name), rather than a different but similar event occurring
        in the same video.
      score_1: Evidence explicitly identifies the specific event instance (e.g., via
        on-screen titles, announcer statements, or context) that matches the query's
        constraints, ensuring the sequence is derived from the correct scenario.
      score_half: Evidence mentions the event type or entities but lacks explicit
        confirmation of the specific instance (e.g., missing the gender, round, or
        tournament name), leaving ambiguity about whether the sequence applies to
        the queried event or a similar one.
      score_0: Evidence describes a sequence or entities that belong to a different
        event instance (e.g., wrong gender, wrong round, wrong tournament) than the
        one queried, or fails to distinguish between multiple similar events in the
        video.
      weight: 4.0
      failure_repair_action: refine_query
    - name: superlative_metric_grounding
      description: Evidence explicitly states the specific quantitative metric (e.g.,
        time, score, count) and the specific instance (e.g., lap number, round, attempt)
        that satisfies the superlative or extremal condition (e.g., 'fastest', 'highest',
        'most'), rather than merely mentioning the superlative status or providing
        metrics for other instances.
      score_1: Evidence explicitly provides the specific metric value and the specific
        instance identifier (e.g., 'Lap 2 was 22.8s, the fastest') required to verify
        the superlative claim.
      score_half: Evidence mentions the superlative status or provides metrics for
        some instances but fails to explicitly link the specific metric value to the
        specific instance that satisfies the condition, or the metric is vague.
      score_0: Evidence mentions the superlative claim or provides general metrics
        but lacks the specific metric value and instance identifier needed to verify
        which specific instance holds the superlative property.
      weight: 4.0
      failure_repair_action: refine_query
    - name: dual_occurrence_verification
      description: Evidence explicitly confirms that the target entity satisfies the
        queried condition (e.g., being interviewed, appearing, performing an action)
        in at least two distinct temporal regions defined by the query's boundary
        (e.g., both before and after a specific event), rather than only in one region
        or in an ambiguous timeframe.
      score_1: Evidence explicitly shows or states the target entity satisfying the
        condition in both the pre-boundary and post-boundary regions, allowing definitive
        verification of the 'both' claim.
      score_half: Evidence confirms the entity satisfies the condition in one region
        (e.g., only after the event) but lacks explicit confirmation for the other
        region, or the temporal placement of one instance is ambiguous.
      score_0: Evidence only shows the entity satisfying the condition in one region,
        or fails to link the entity to the condition in either region, making it impossible
        to verify the 'both' requirement.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: event_realization_completeness
      description: Evidence captures the full realization of the target event, including
        both the initiation/setup and the specific outcome or resolution, rather than
        stopping at the preparation phase or implying the result without showing it.
      score_1: Evidence explicitly depicts or states both the start of the event (e.g.,
        preparation, attempt) and the specific outcome or resolution (e.g., success,
        failure, specific result) required to verify the event's description.
      score_half: Evidence shows the initiation or preparation of the event but lacks
        explicit confirmation of the specific outcome, or shows the outcome without
        the context of the attempt, leaving the full narrative arc incomplete.
      score_0: Evidence only describes the setup, preparation, or intent of the event
        without any information about the actual result or resolution, making it impossible
        to verify the event's specific description.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_verb_explicitness
      description: Evidence explicitly depicts or states the specific dynamic action
        (verb) asserted in the option (e.g., 'unfurl', 'tumble', 'catch') rather than
        merely showing the static presence of the object or a related but different
        action.
      score_1: Evidence explicitly shows or describes the exact action verb required
        by the option, allowing definitive verification of that specific event in
        the sequence.
      score_half: Evidence shows the object involved or a related action but lacks
        the explicit depiction of the specific verb asserted in the option, making
        it ambiguous whether the exact action occurred.
      score_0: Evidence only shows the static presence of the object or a completely
        different action, failing to verify the specific dynamic event described in
        the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: execution_vs_preparation_distinction
      description: Evidence explicitly depicts the actual occurrence, execution, or
        realization of the target event, action, or visit (e.g., arriving at a location,
        performing an activity) rather than merely showing the planning, preparation,
        intent, research, or discussion of that event (e.g., maps, search queries,
        agendas, or statements of intent).
      score_1: Evidence explicitly shows or states the target event/action/visit actually
        occurring or being completed, confirming the step happened.
      score_half: Evidence shows the planning, preparation, research, or intent to
        perform the event (e.g., maps, search results, discussions) but lacks explicit
        depiction of the actual execution or occurrence.
      score_0: Evidence only describes the context, materials, or intent without any
        indication that the target event, action, or visit was ever performed or realized.
      weight: 4.0
      failure_repair_action: refine_query
    - name: transformation_state_verification
      description: Evidence explicitly depicts the target action or state change occurring
        on the entity in its transformed or final state (the result of the process),
        rather than on the raw source material, the initial frame, or the pre-transformation
        object.
      score_1: Evidence clearly shows the specific action (e.g., attaching a tail,
        wrapping yarn) being performed on the entity after it has undergone the primary
        transformation (e.g., the yarn-wrapped rabbit, not the wire frame), confirming
        the step applies to the final product.
      score_half: Evidence shows the action on the source material or implies the
        transformation but does not explicitly depict the action occurring on the
        fully transformed entity, leaving ambiguity about whether the step applies
        to the final product.
      score_0: Evidence only shows the source material, the initial frame, or the
        preparation phase, with no depiction of the action being performed on the
        transformed or final entity.
      weight: 4.0
      failure_repair_action: refine_query
    - name: introduction_event_verification
      description: Evidence explicitly captures the specific moment of introduction,
        demonstration, or first active presentation of each target item in the sequence,
        rather than relying on mentions, lists, background appearances, or summaries
        that do not constitute the actual introduction event.
      score_1: Evidence explicitly depicts or states the specific introduction/demonstration
        event for every item in the sequence, allowing the solver to verify the exact
        order of these events.
      score_half: Evidence captures the introduction event for some items but relies
        on mentions, lists, or background appearances for others, making the relative
        order of the missing events ambiguous.
      score_0: Evidence only contains mentions, lists, or background appearances of
        the items without capturing the specific introduction/demonstration events
        required to establish the sequence.
      weight: 4.0
      failure_repair_action: refine_query
    - name: visual_state_differentiation
      description: Evidence explicitly describes the specific visual attributes (e.g.,
        clothing, accessories, physical state) of a recurring entity in each observed
        instance, allowing the solver to distinguish between distinct states of the
        same entity versus repeated instances of the same state.
      score_1: Evidence explicitly details the distinguishing visual features for
        every instance of the recurring entity, enabling a definitive count of unique
        states or verification of state changes.
      score_half: Evidence describes the entity in some instances but lacks specific
        visual details for others, or the descriptions are too generic to determine
        if the entity's state has changed between instances.
      score_0: Evidence mentions the entity's presence in multiple segments but provides
        no visual details to distinguish between instances, making it impossible to
        determine if the entity is in a new state or the same state.
      weight: 4.0
      failure_repair_action: dense_sample
    - name: selection_decision_explicitness
      description: Evidence explicitly captures the moment of selection, decision,
        or intent to perform the specific sequence of actions or prepare the specific
        set of items, rather than merely showing the items available, discussed in
        passing, or present in a final state without the initiating choice.
      score_1: Evidence explicitly depicts or states the specific decision or selection
        process that initiates the sequence (e.g., 'we will do X, then Y'), allowing
        definitive verification of the intended order.
      score_half: Evidence mentions the items or implies a sequence but lacks the
        explicit moment of decision or selection, making it ambiguous whether the
        observed order reflects the intended preparation sequence or just a collection
        of items.
      score_0: Evidence only shows the items in isolation, as a final result, or in
        a context where no specific selection or sequence decision is made, making
        it impossible to verify the preparation order.
      weight: 4.0
      failure_repair_action: refine_query
    - name: visual_differentiation_of_similar_entities
      description: Evidence provides sufficient specific visual attributes (e.g.,
        shape, pattern, material, color, unique design features) to distinguish between
        multiple similar entities of the same type (e.g., different earrings, bracelets,
        or clothing items) appearing in the sequence, rather than describing them
        only with generic terms that could apply to any of the candidates.
      score_1: Evidence explicitly describes the unique visual features of every similar
        entity in the sequence, allowing definitive mapping to the specific option
        labels and verification of their relative order.
      score_half: Evidence describes some entities with unique visual features but
        relies on generic descriptions for others, or the descriptions are ambiguous
        enough that multiple candidates could fit, making the specific sequence unverifiable.
      score_0: Evidence describes all similar entities only with generic terms (e.g.,
        'earring', 'bracelet') or lacks visual detail entirely, making it impossible
        to distinguish between the specific items required to verify the sequence.
      weight: 4.0
      failure_repair_action: dense_sample
    - name: trigger_event_adjacency
      description: Evidence explicitly captures the specific action or event defined
        in the query's temporal clause (the trigger) and the immediate subsequent
        occurrence of the target event, establishing the direct causal or temporal
        link required by the 'when' condition, rather than presenting the trigger
        state and the target event in isolation or with a temporal gap.
      score_1: Evidence explicitly depicts the trigger action occurring and the target
        event happening immediately afterward, allowing definitive verification of
        the 'when' relationship.
      score_half: Evidence shows the trigger action and the target event separately,
        or shows the state before the trigger and the event later, but lacks the specific
        segment linking the two in immediate succession.
      score_0: Evidence describes the trigger state or the target event in isolation,
        or fails to capture the specific trigger action entirely, making it impossible
        to verify the temporal dependency.
      weight: 4.0
      failure_repair_action: refine_query
    - name: variant_disambiguation
      description: Evidence explicitly distinguishes the target entity from similar
        variants, sub-types, or related items that share a name prefix or visual similarity
        but differ in the specific attribute or label asserted in the options (e.g.,
        distinguishing 'X' from 'X Intense' or 'X Pro').
      score_1: Evidence explicitly identifies the specific variant or attribute matching
        the option label, clearly distinguishing it from similar but distinct items
        that might otherwise be confused.
      score_half: Evidence mentions the target entity but also includes or focuses
        on similar variants, creating ambiguity about whether the specific option
        label is satisfied or if a related item is being discussed.
      score_0: Evidence only identifies a similar variant or related item (e.g., 'X
        Intense' when 'X' is required) without confirming the specific target entity,
        making it impossible to verify the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: event_instance_specificity
      description: Evidence explicitly identifies the specific instance, occurrence,
        or discrete event corresponding to the option's label (e.g., a specific lawsuit,
        a specific scandal report, a specific celebration), rather than merely mentioning
        the general topic, category, or ongoing trend associated with that label.
      score_1: Evidence explicitly depicts or describes the specific discrete event
        instance required by the option, distinguishing it from general discussions
        or trends about the topic.
      score_half: Evidence mentions the topic or general trend (e.g., 'scandals',
        'plagiarism accusations') but lacks the specific details or context to identify
        the discrete event instance required for ordering.
      score_0: Evidence only provides general background, definitions, or trends related
        to the topic without any reference to a specific event instance.
      weight: 4.0
      failure_repair_action: refine_query
    - name: montage_vs_execution_distinction
      description: Evidence distinguishes between a summary montage, recap, or non-chronological
        list of events and the actual chronological execution of those events within
        the video timeline, ensuring the sequence is derived from the real-time flow
        rather than a compressed or reordered overview.
      score_1: Evidence explicitly captures the events occurring in their actual chronological
        sequence (execution), or clearly distinguishes a summary montage from the
        real-time events, allowing the solver to rely only on the chronological segments
        for ordering.
      score_half: Evidence contains a mix of summary montage and execution segments,
        or the distinction is ambiguous, making it unclear whether the observed order
        reflects the actual timeline or a compressed recap.
      score_0: Evidence relies entirely on a summary montage, recap, or non-chronological
        list to determine the sequence, without capturing the actual temporal flow
        of the events, making the true order unverifiable.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: temporal_context_disambiguation
      description: Evidence explicitly provides time-of-day markers (e.g., clock time,
        'morning', 'night') or narrative state descriptors (e.g., 'after work', 'before
        sunrise') that allow the solver to distinguish between options that describe
        the same action or entity but at different times of day.
      score_1: Evidence explicitly states the time of day or provides a clear narrative
        context (e.g., 'end of shift', 'dawn') that definitively places the event
        in one specific temporal category (e.g., Night) and excludes others.
      score_half: Evidence implies a time of day through lighting or vague context
        but lacks explicit markers or clear narrative anchors, leaving ambiguity between
        similar temporal options.
      score_0: Evidence describes the action or entity but provides no temporal markers
        or context to distinguish between different times of day, making it impossible
        to verify the specific time-based option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_negation_of_predicate
      description: Evidence explicitly states the absence, non-occurrence, or negation
        of the specific action, state, or condition asserted in the option for the
        queried temporal window, rather than merely showing the subject performing
        other actions or failing to show the action in question.
      score_1: Evidence contains an explicit statement or clear depiction confirming
        that the specific action or state did not occur during the queried time (e.g.,
        'did not speak', 'was not present', 'never happened'), allowing definitive
        verification of the negative claim.
      score_half: Evidence implies the absence of the action (e.g., by showing the
        subject doing something else) or mentions the action in a different context,
        but lacks an explicit confirmation that it did not occur during the specific
        queried window.
      score_0: Evidence only shows the subject performing other actions or is silent
        regarding the specific action, providing no basis to confirm its absence during
        the queried time.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_scope_exclusivity
      description: Evidence explicitly restricts the observed events to the specific
        temporal window defined in the query (e.g., 'first day', 'morning', 'before
        lunch') and excludes events occurring in adjacent or different temporal windows
        (e.g., 'previous day', 'next day', 'evening') that might otherwise be confused
        with the target sequence.
      score_1: Evidence clearly delineates the queried temporal window and contains
        only events occurring within that specific window, allowing definitive verification
        of the sequence without contamination from adjacent time periods.
      score_half: Evidence contains events from the queried window but also includes
        events from adjacent or different time periods without clear distinction,
        creating ambiguity about which events belong to the target sequence.
      score_0: Evidence fails to distinguish the queried temporal window from adjacent
        periods, mixing events from different times or lacking markers to isolate
        the specific window required by the query.
      weight: 4.0
      failure_repair_action: refine_query
    - name: departure_vs_preparation_distinction
      description: Evidence explicitly captures the specific act of leaving a location
        (departure) or the transition away from a place, rather than merely showing
        preparation for departure (packing, planning), arrival at a destination, or
        the state of being at the location.
      score_1: Evidence explicitly depicts or states the moment the subject leaves
        the specific location in question (e.g., driving away, walking out, departing),
        allowing definitive verification of the 'leaving' event.
      score_half: Evidence shows preparation for leaving (packing, discussing plans)
        or the state of being at the location, but lacks the explicit depiction or
        statement of the actual departure act.
      score_0: Evidence only shows the subject at the location, preparing to leave,
        or arriving elsewhere, with no information about the specific act of leaving
        the queried place.
      weight: 4.0
      failure_repair_action: refine_query
    - name: distinct_event_granularity
      description: Evidence presents each target item in the sequence as a distinct,
        temporally separated event or explicitly ordered list entry, rather than aggregating
        multiple items into a single mention, summary, or group description where
        their relative order is not specified.
      score_1: Evidence provides a distinct segment, timestamp, or explicit ordinal
        marker for every item in the sequence, ensuring each item's position is individually
        verifiable.
      score_half: Evidence provides distinct markers for some items but aggregates
        others into a single mention or group description, leaving the relative order
        of the aggregated items ambiguous.
      score_0: Evidence presents the target items only as a single aggregated list,
        summary, or group mention without any internal ordering or distinct temporal
        markers for individual items.
      weight: 4.0
      failure_repair_action: refine_query
    - name: named_temporal_unit_explicitness
      description: Evidence explicitly states the specific named temporal unit (e.g.,
        day of the week, specific date, named holiday) required to verify or exclude
        options that hinge on these specific labels, rather than providing only relative
        time markers (e.g., 'yesterday', 'tomorrow'), generic timeframes, or activity
        descriptions without temporal labels.
      score_1: Evidence explicitly names the specific temporal unit (e.g., 'Thursday',
        'Monday') for every event or state required to verify the option's set of
        days.
      score_half: Evidence names the temporal unit for some events but relies on relative
        markers (e.g., 'the day after') or lacks the specific name for at least one
        required event, making the full set of days unverifiable.
      score_0: Evidence describes events or states but provides no specific named
        temporal units (days, dates) for them, relying entirely on relative time or
        context that cannot be mapped to the specific options.
      weight: 4.0
      failure_repair_action: refine_query
    - name: interval_consistency_verification
      description: Evidence explicitly provides the timestamps or temporal markers
        for multiple occurrences of the target event, allowing the solver to calculate
        the time intervals between them and verify whether they are consistent (supporting
        a specific frequency) or inconsistent (supporting 'no regular pattern').
      score_1: Evidence includes timestamps for at least two consecutive occurrences
        of the event, allowing the calculation of the interval and verification of
        its consistency with the option's frequency claim.
      score_half: Evidence provides timestamps for the event but lacks sufficient
        occurrences (e.g., only one instance) or the timestamps are ambiguous, preventing
        the calculation of a consistent interval.
      score_0: Evidence mentions the event but provides no temporal markers or multiple
        instances, making it impossible to determine the frequency or regularity of
        the occurrences.
      weight: 4.0
      failure_repair_action: time_sorted
    - name: recurring_pattern_explicitness
      description: Evidence explicitly identifies multiple instances of a recurring
        event with specific sequence labels (e.g., 'first', 'second', 'halfway') or
        narrative markers that confirm the regularity or frequency of the event, rather
        than merely providing isolated timestamps or mentions of the event without
        establishing the pattern.
      score_1: Evidence explicitly labels or narratively confirms the sequence of
        multiple instances (e.g., 'first break', 'halfway point', 'every 5 minutes'),
        allowing definitive verification of the frequency or pattern.
      score_half: Evidence provides timestamps for multiple instances but lacks explicit
        sequence labels or narrative confirmation of the pattern, making the frequency
        ambiguous or reliant on inference.
      score_0: Evidence mentions the event only once or provides isolated instances
        without any sequence labels or narrative markers to establish a recurring
        pattern or frequency.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_ordinal_enumeration
      description: Evidence explicitly contains an ordered list, numbered sequence,
        or enumerated set (e.g., on-screen text, spoken list) that defines the relative
        order of the target items, rather than relying solely on the chronological
        order of their individual visual or narrative presentation which may be non-sequential
        or incomplete.
      score_1: Evidence explicitly displays or states a complete ordered list or numbered
        sequence of all target items, allowing definitive verification of the relative
        order regardless of the presentation flow.
      score_half: Evidence contains a partial list, an unordered list, or a mix of
        list and narrative presentation, leaving the relative order of some items
        ambiguous or reliant on inference from the presentation sequence.
      score_0: Evidence presents items only through individual visual or narrative
        segments without any explicit ordered list or enumeration, making it impossible
        to verify the sequence if the presentation order is non-chronological or incomplete.
      weight: 4.0
      failure_repair_action: refine_query
    - name: procedural_sequence_vs_collection
      description: Evidence explicitly depicts the target items being introduced,
        used, or presented in a specific temporal order (a procedure or sequence),
        rather than merely showing them as a static collection, a haul, or a set of
        available items where no relative order is established.
      score_1: Evidence clearly shows the items appearing or being handled in a specific,
        non-arbitrary sequence, allowing the solver to verify the relative order of
        the items.
      score_half: Evidence shows the items together or in separate segments but lacks
        clear indicators of a specific procedural order, leaving it ambiguous whether
        the observed order is intentional or arbitrary.
      score_0: Evidence presents the items only as a collection, a list of available
        goods, or isolated mentions without any indication of a temporal sequence
        or procedural flow.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Reasoning:
    rubric_criteria:
    - name: inference_grounding
      description: Evidence explicitly states or denies the logical link (inference,
        speculation, deduction) claimed in the option, rather than merely presenting
        the premises or the conclusion separately.
      score_1: The evidence explicitly confirms or refutes the specific inference
        mechanism (e.g., 'X allows us to guess Y', 'Y is inferred from X').
      score_half: The evidence presents the components (X and Y) but the logical link
        between them is implicit or ambiguous.
      score_0: The evidence lacks the specific inference claim or the link is entirely
        absent, making it impossible to verify or exclude the option's reasoning.
      weight: 3.0
      failure_repair_action: refine_query
    - name: pathway_continuity
      description: Evidence explicitly describes the complete sequence of steps, intermediate
        locations, or mechanisms required to traverse the specific path, route, or
        process claimed in the option, rather than merely identifying the start and
        end points.
      score_1: The evidence details the full chain of events or spatial transitions
        (e.g., A -> B -> C) that constitute the claimed pathway.
      score_half: The evidence identifies the start and end points but omits one or
        more critical intermediate steps or mechanisms required to verify the specific
        route.
      score_0: The evidence only mentions isolated points or generic concepts without
        establishing the connecting sequence, making the specific pathway unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: spatial_scope_verification
      description: Evidence explicitly demonstrates the full spatial extent, territorial
        boundaries, or geographic distribution claimed in the option, rather than
        merely identifying isolated locations or a single point within the claimed
        area.
      score_1: The evidence visually or narratively confirms the complete scope (e.g.,
        a map showing all claimed regions, a list covering all mentioned areas) required
        to verify or exclude the option's spatial claim.
      score_half: The evidence shows parts of the claimed scope or a single representative
        location, but does not confirm the full extent or distribution asserted.
      score_0: The evidence is limited to a single location or generic concept, providing
        no basis to verify the specific spatial scope or territorial claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: modal_claim_grounding
      description: Evidence explicitly validates the modality (possibility, probability,
        speculation) asserted in the option, rather than merely presenting the constituent
        elements or a different instance that implies it implicitly.
      score_1: The evidence explicitly confirms or refutes the specific modal claim
        (e.g., 'X might happen', 'Y is probable') by stating the feasibility, likelihood,
        or the specific reasoning for the speculation.
      score_half: The evidence presents the necessary components or a similar instance,
        but the explicit link to the specific possibility or probability claimed is
        implicit or requires external inference.
      score_0: The evidence only shows isolated components or unrelated instances,
        providing no basis to verify or exclude the specific modal claim (possibility/probability).
      weight: 3.0
      failure_repair_action: refine_query
    - name: contrast_with_standard
      description: Evidence explicitly establishes the deviation or difference between
        the observed state and the expected, traditional, or standard state required
        to verify or exclude options claiming a specific alteration, anomaly, or non-standard
        attribute.
      score_1: The evidence explicitly states both the observed state and the expected/standard
        state, allowing the specific deviation to be verified or excluded.
      score_half: The evidence describes the observed state or the standard state,
        but the explicit contrast or the specific nature of the deviation is implicit
        or missing.
      score_0: The evidence lacks any reference to the standard/expected state or
        the specific deviation, making it impossible to verify or exclude claims about
        anomalies or alterations.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thematic_synthesis
      description: Evidence explicitly states the central theme, main idea, or overarching
        summary and clearly distinguishes it from specific supporting details, examples,
        or sub-topics, ensuring the main idea is not obscured or confused with a specific
        instance.
      score_1: The evidence contains an explicit statement of the main idea and frames
        specific details as supporting examples, or the synthesis of details unambiguously
        points to the central concept without ambiguity.
      score_half: The evidence lists relevant supporting details and mentions the
        theme, but the distinction between the main idea and specific examples is
        ambiguous, or the specific details are presented with equal or greater prominence
        than the theme.
      score_0: The evidence consists only of isolated facts, examples, or specific
        details with no indication of the central theme, or the specific details are
        presented in a way that makes it impossible to distinguish the primary purpose
        from secondary details.
      weight: 3.0
      failure_repair_action: refine_query
    - name: misconception_attribution
      description: Evidence explicitly attributes a specific false belief, misunderstanding,
        or gap in knowledge to the target agent, rather than merely stating the correct
        fact or describing the agent's actions without reference to their mental state.
      score_1: The evidence explicitly states what the specific agent thought, believed,
        or failed to know, and contrasts it with the correct information required
        to verify or exclude the option.
      score_half: The evidence states the correct fact and identifies the agent, but
        the specific content of the agent's misunderstanding or the explicit link
        between the agent and the false belief is implicit or missing.
      score_0: The evidence provides general facts or describes the agent's actions
        without any reference to their specific beliefs, misunderstandings, or knowledge
        gaps, making it impossible to verify what they misunderstood.
      weight: 3.0
      failure_repair_action: refine_query
    - name: historical_status_attribution
      description: Evidence explicitly attributes a specific past event, outcome,
        status, or historical fact (e.g., a conviction, a specific sentence, a prior
        action) to the target entity, rather than merely showing the entity in a related
        context or discussing generic past events without linking them to the specific
        claim.
      score_1: The evidence explicitly states the specific past event/outcome and
        directly links it to the target entity (e.g., 'X was arrested for Y', 'X spent
        Z years in prison for W').
      score_half: The evidence mentions the target entity and a related past event
        or context, but the specific link between the entity and the claimed outcome
        is implicit, ambiguous, or requires inference.
      score_0: The evidence shows the entity or discusses generic past events but
        provides no explicit attribution of the specific claimed historical status
        or outcome to the entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_repetition_grounding
      description: Evidence explicitly demonstrates the recurrence of identical visual
        states, objects, or timestamps across distinct time intervals required to
        verify or exclude claims of duplication, tampering, or looped footage, rather
        than merely showing a single instance or describing the event generically.
      score_1: The evidence explicitly shows the same specific visual element (e.g.,
        object position, timestamp, background detail) appearing at multiple distinct
        times, or explicitly states the mechanism of duplication/repetition, allowing
        the claim of tampering or anomaly to be verified or excluded.
      score_half: The evidence shows the visual element at one time or mentions the
        concept of repetition/duplication without explicitly demonstrating the recurrence
        across distinct intervals or the specific mechanism.
      score_0: The evidence shows only a single instance of the event or generic descriptions,
        providing no basis to verify or exclude claims based on temporal repetition
        or duplication.
      weight: 3.0
      failure_repair_action: refine_query
    - name: mechanism_explicitness
      description: Evidence explicitly describes the specific method, process, or
        causal mechanism by which the claimed action, anomaly, or state change was
        produced, rather than merely observing the outcome or the existence of the
        anomaly.
      score_1: The evidence explicitly states the 'how' or 'why' (e.g., 'X was done
        by Y method', 'the anomaly occurred because Z happened'), allowing the specific
        mechanism claimed in the option to be verified or excluded.
      score_half: The evidence shows the outcome or anomaly (e.g., the duplication,
        the error) but the specific method or causal process that produced it is implicit,
        inferred, or not stated.
      score_0: The evidence only presents the result or the existence of the anomaly
        without any information about the underlying mechanism, making it impossible
        to verify the specific method claimed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: capture_source_attribution
      description: Evidence explicitly attributes the specific visual content, clip,
        or scene to the device, method, or source claimed in the option, rather than
        merely discussing the device's general capabilities, features, or comparing
        it to other devices.
      score_1: The evidence explicitly states that the specific visual content was
        captured, recorded, or produced by the claimed device/method (e.g., 'this
        video was shot with X', 'recorded using Y').
      score_half: The evidence discusses the device's capabilities or shows the device
        in use, but the explicit link between the specific visual content and the
        capture method is implicit or requires inference.
      score_0: The evidence only discusses the device's features, compares it to others,
        or shows the device without explicitly stating it was the source of the specific
        visual content in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: object_function_attribution
      description: Evidence explicitly attributes a specific function, capability,
        or causal role to the target object required to verify or exclude options
        claiming that object performs a specific action, rather than merely showing
        the object present during the action or showing the action occurring without
        the object.
      score_1: The evidence explicitly states that the specific object caused, enabled,
        or performed the claimed function (e.g., 'the necklace allowed her to take
        powers', 'the device generated the fire').
      score_half: The evidence shows the object and the outcome in the same scene
        or context, but the explicit causal link or functional attribution between
        the object and the outcome is implicit or ambiguous.
      score_0: The evidence shows the object or the outcome separately, or shows the
        object in a context where its function is unrelated to the claim, providing
        no basis to verify the specific function attributed to it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_ordering_verification
      description: Evidence explicitly establishes the chronological sequence of events
        required to verify or exclude options claiming an action occurred after, before,
        or during a specific trigger event, rather than merely showing the events
        in isolation or implying the order.
      score_1: The evidence explicitly confirms the temporal order (e.g., 'Event A
        happened, then Event B occurred') required to verify the option's claim about
        the timing of the action relative to the trigger.
      score_half: The evidence shows both the trigger event and the action, but the
        explicit chronological link or the specific order is implicit, ambiguous,
        or requires inference.
      score_0: The evidence shows the trigger event and the action separately or in
        a way that makes the temporal relationship unverifiable, preventing confirmation
        of whether the action occurred after the trigger.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_intent_explicitness
      description: Evidence explicitly states or clearly demonstrates the specific
        motivation, purpose, or reason for the target agent's action or presence,
        rather than merely describing the action itself, the outcome, or the agent's
        capabilities.
      score_1: The evidence explicitly states the agent's reason (e.g., 'I am here
        to find X', 'She did Y because Z') or provides unambiguous contextual cues
        (dialogue, interaction) that directly ground the specific intent claimed in
        the option.
      score_half: The evidence describes the agent's action and the outcome, but the
        specific motivation or reason is implicit, ambiguous, or requires inference
        from general context.
      score_0: The evidence only describes the action, the agent's capabilities, or
        the outcome without any reference to the agent's specific purpose or reason,
        making it impossible to verify or exclude options about 'why'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: internal_state_attribution
      description: Evidence explicitly attributes a specific internal mental state,
        emotion, belief, or relational attitude to the target agent required to verify
        or exclude options claiming such a state, rather than merely describing the
        agent's external actions, third-party observations, or situational context
        that implies the state.
      score_1: The evidence explicitly states the agent's specific feeling, belief,
        or attitude (e.g., via direct speech, internal monologue, or explicit narration)
        or provides unambiguous visual cues that directly ground the specific internal
        state claimed.
      score_half: The evidence describes the agent's actions, the reactions of others,
        or the context, but the specific internal state is implicit, inferred, or
        attributed only by a third party without the agent's confirmation.
      score_0: The evidence only presents external behaviors, generic context, or
        third-party speculation without any explicit link to the agent's specific
        internal state, making it impossible to verify or exclude claims about feelings
        or beliefs.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relational_claim_grounding
      description: Evidence explicitly grounds the specific relationship, dynamic,
        or interaction between agents through direct testimony from the target agent,
        mutual interaction, or explicit narration, rather than relying solely on third-party
        speculation, generalization, or external observation of the agents.
      score_1: The evidence contains direct statements from the target agent about
        the relationship, shows the specific interaction between the agents, or provides
        explicit narration confirming the dynamic, allowing the option to be verified
        or excluded.
      score_half: The evidence includes third-party comments or observations about
        the relationship, or shows the agents in the same scene without explicit confirmation
        of the specific dynamic claimed, requiring inference to link the observation
        to the relationship.
      score_0: The evidence relies entirely on third-party speculation, generalizations,
        or isolated observations of the agents without any direct link to the specific
        relationship or dynamic claimed, making it impossible to verify or exclude
        the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_object_grounding
      description: Evidence explicitly identifies the specific entity, event, or object
        that is the target or cause of the agent's internal state (e.g., the person
        realized to be hurt, the specific thing feared), rather than merely showing
        the agent in a generic state of that type or showing the entity/event in isolation
        without the link.
      score_1: The evidence explicitly links the agent's specific internal state to
        the specific target entity or triggering event (e.g., 'X realized Y happened
        to Z', 'X is sad because of W'), allowing the specific reason to be verified
        or excluded.
      score_half: The evidence shows the agent in the relevant state and the relevant
        entity/event, but the explicit link between the state and the specific target
        is implicit or ambiguous.
      score_0: The evidence shows the agent in a generic state or the entity/event
        separately, without establishing the specific target or cause of the state,
        making it impossible to verify the specific reason claimed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: interactional_reciprocity
      description: Evidence explicitly demonstrates a bidirectional exchange (verbal,
        gestural, or physical) between the specific agents claimed to have a relationship,
        rather than showing them in the same scene without mutual engagement, or showing
        one agent acting independently or upon a non-target entity.
      score_1: The evidence shows the specific agents directly responding to each
        other's actions, expressions, or words, establishing a clear dynamic of interaction
        required to verify the relationship.
      score_half: The evidence shows the agents in the same scene or context, but
        the interaction is one-sided, ambiguous, or lacks clear mutual responsiveness,
        making the specific relationship dynamic difficult to verify.
      score_0: The evidence shows the agents in isolation, interacting with other
        entities, or merely co-existing without any direct exchange, providing no
        basis to verify the specific relationship between them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: interaction_valence_grounding
      description: Evidence explicitly demonstrates the specific emotional tone, nature,
        or valence (e.g., hostile, friendly, cooperative, neutral) of the interaction
        between agents required to verify or exclude options claiming a specific relationship
        type, rather than merely showing that an interaction occurred or that agents
        are present together.
      score_1: The evidence explicitly shows or states the specific nature of the
        interaction (e.g., mutual smiling, aggressive struggling, cooperative helping)
        that directly confirms or refutes the relationship type claimed in the option.
      score_half: The evidence shows interaction between the agents, but the specific
        emotional tone or nature is ambiguous, mixed, or requires inference to determine
        if it matches the claimed relationship type.
      score_0: The evidence shows agents in the same scene or interacting in a generic
        way without any clear indication of the specific emotional tone or nature
        required to verify or exclude the relationship claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: impression_generative_cues
      description: Evidence explicitly contains the specific sensory cues (e.g., tone
        of voice, specific sound effects, distinct visual actions) or interactive
        dynamics that actively generate the claimed impression (e.g., funny, sad,
        horrible), rather than merely describing the setting, background, or generic
        visual state.
      score_1: The evidence includes the specific auditory, visual, or interactive
        elements (e.g., a sing-song voice, a specific comedic action) that directly
        produce the claimed impression, allowing it to be verified or excluded.
      score_half: The evidence describes the setting or generic actions related to
        the impression but lacks the specific generative cue (e.g., shows a sad scene
        but no crying/sad music; shows a funny character but no funny action/voice),
        making the specific impression ambiguous.
      score_0: The evidence only describes the background, setting, or static visual
        state without any specific cues that would generate the claimed impression,
        making it impossible to verify or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_knowledge_grounding
      description: Evidence explicitly establishes the specific knowledge, awareness,
        or information state of the target agent regarding the event or entity in
        question, rather than merely showing the agent's reaction to the event or
        the event itself occurring.
      score_1: The evidence explicitly states or demonstrates what the agent knows,
        believes, or is aware of (e.g., via direct speech, internal monologue, or
        unambiguous context) that is required to verify the specific reason for their
        action.
      score_half: The evidence shows the agent reacting to the event or the event
        occurring, but the specific content of the agent's knowledge or awareness
        is implicit, ambiguous, or requires inference.
      score_0: The evidence shows the event or the agent's reaction without any indication
        of what the agent specifically knows or is aware of, making it impossible
        to verify reasons based on their knowledge state (e.g., lying, hiding, or
        acting on specific information).
      weight: 3.0
      failure_repair_action: refine_query
    - name: interaction_content_grounding
      description: Evidence explicitly contains the specific content (dialogue, text,
        or specific action details) of the interaction or event claimed to trigger
        the agent's state, rather than merely showing the interaction occurred, the
        agent's reaction, or the general context of the event.
      score_1: The evidence includes the specific words spoken, text read, or precise
        actions performed during the interaction that directly explain the agent's
        specific state or reaction.
      score_half: The evidence shows the interaction occurring and the agent's reaction,
        but the specific content (what was said/done) is missing, generic, or requires
        inference to link to the specific state.
      score_0: The evidence shows the agent in a state or the general context of an
        event, but lacks any specific content of the interaction that would explain
        the cause of the state.
      weight: 3.0
      failure_repair_action: refine_query
    - name: trait_attribution_explicitness
      description: Evidence explicitly attributes the specific behavioral trait, character
        quality, or descriptive adjective claimed in the option to the target agent,
        rather than merely showing the agent performing actions that could imply the
        trait or describing the agent's identity/context without the specific label.
      score_1: The evidence explicitly states or unambiguously demonstrates the specific
        trait (e.g., 'X is Y', 'X is known for being Y') required to verify or exclude
        the option.
      score_half: The evidence shows the agent performing actions consistent with
        the trait or mentions the trait in a generic context, but the explicit link
        between the specific agent and the specific trait is implicit or requires
        inference.
      score_0: The evidence describes the agent's actions, identity, or context without
        any explicit attribution of the specific behavioral trait or quality claimed,
        making it impossible to verify or exclude the option based on the trait alone.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_phase_alignment
      description: Evidence explicitly pertains to the specific life stage, time period,
        or temporal phase (e.g., childhood, adulthood, past, future) claimed in the
        query, rather than presenting evidence from a different phase of the entity's
        existence or a generic timeline.
      score_1: The evidence explicitly identifies the entity within the specific temporal
        phase required by the query (e.g., 'as a child', 'in 1990', 'before the war'),
        allowing the state or trait to be verified or excluded for that specific period.
      score_half: The evidence shows the entity but the specific temporal phase is
        ambiguous, mixed with other phases, or requires inference to determine if
        it matches the queried period.
      score_0: The evidence pertains to a different life stage or time period than
        the one queried, or provides no temporal context, making it impossible to
        verify or exclude claims about the specific phase.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_negation_grounding
      description: Evidence explicitly contains a direct denial, refutation, or negation
        of the specific proposition (intent, action, state, or relationship) claimed
        in the option, rather than merely presenting evidence that is consistent with
        the option or implies the opposite through context.
      score_1: The evidence includes a direct statement or unambiguous cue that explicitly
        denies the specific claim in the option (e.g., 'I do not want X', 'It was
        not Y', 'X is false'), allowing the option to be definitively excluded.
      score_half: The evidence presents facts that contradict the option or implies
        the negation, but lacks an explicit statement or direct denial of the specific
        claim, requiring inference to exclude the option.
      score_0: The evidence is silent on the specific claim, consistent with it, or
        only provides generic context, making it impossible to definitively exclude
        the option based on an explicit denial.
      weight: 3.0
      failure_repair_action: refine_query
    - name: evaluative_judgment_attribution
      description: Evidence explicitly attributes a specific qualitative evaluation,
        rating, or judgment (e.g., 'perfect', 'bad', 'appropriate', 'worst') to the
        target entity or work by the speaker, rather than merely describing the entity's
        features, showing scenes from it, or stating generic opinions about the genre.
      score_1: The evidence contains a direct statement by the speaker assigning the
        specific qualitative label or judgment claimed in the option to the target
        entity (e.g., 'X is perfect', 'Y is a bad adaptation').
      score_half: The evidence describes the target entity's features or the speaker's
        general feelings, but the specific qualitative label or judgment is implicit,
        ambiguous, or requires inference to link the description to the specific evaluation.
      score_0: The evidence only shows the target entity, describes its content, or
        presents generic opinions without any explicit attribution of the specific
        qualitative judgment claimed in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: persuasion_target_grounding
      description: Evidence explicitly contains the specific criteria, vulnerability,
        or logical hook of the target agent that the option claims the persuader exploits,
        rather than merely showing a generic interaction, the persuader's actions,
        or the target's general state.
      score_1: The evidence explicitly states or demonstrates the specific reason,
        belief, or criterion the target agent holds (e.g., 'I always believe guys
        who say they changed') that directly validates or invalidates the specific
        persuasion strategy claimed in the option.
      score_half: The evidence shows the persuader's actions or the target's general
        reaction, but the specific criteria or vulnerability the target uses to evaluate
        the persuasion is implicit, generic, or missing.
      score_0: The evidence shows a generic interaction or the persuader's actions
        without any reference to the target's specific criteria, beliefs, or vulnerabilities,
        making it impossible to verify the specific strategy claimed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: methodology_explicitness
      description: Evidence explicitly describes the specific method, procedure, or
        technique claimed in the option as the means to achieve a stated goal or change,
        rather than merely stating the goal, the general topic, or the outcome without
        the specific 'how'.
      score_1: The evidence explicitly names or describes the specific method/procedure
        (e.g., 'training method', 'using X technique') and links it to the intended
        outcome or research focus claimed in the option.
      score_half: The evidence states the goal or general topic of the action but
        the specific method or procedure is implicit, generic, or missing, making
        it impossible to distinguish between options proposing different methods.
      score_0: The evidence only mentions the goal, the agent's interest, or the outcome
        without any reference to the specific method or procedure, making it impossible
        to verify or exclude options based on the 'how'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: utterance_causal_grounding
      description: Evidence explicitly links the specific utterance or statement in
        the query to the preceding events, facts, or state changes that serve as its
        direct cause or reason, rather than merely providing general context about
        the speaker or the setting.
      score_1: The evidence explicitly states or demonstrates the specific event(s)
        or fact(s) that caused the agent to make the specific statement (e.g., 'Because
        X happened, he said Y').
      score_half: The evidence provides context about the speaker or the general situation
        but the specific causal link between the event and the specific utterance
        is implicit or requires inference.
      score_0: The evidence provides general background or unrelated events without
        establishing a causal connection to the specific reason for the utterance,
        making it impossible to verify why the statement was made.
      weight: 3.0
      failure_repair_action: refine_query
    - name: composite_cause_aggregation
      description: Evidence explicitly enumerates and links the specific set of distinct
        events, outcomes, or factors that collectively constitute the reason for a
        summary statement, evaluation, or aggregate claim, rather than merely presenting
        isolated events or a single factor that does not account for the full scope
        of the summary.
      score_1: The evidence explicitly lists the specific distinct events or factors
        and frames them as the collective basis for the summary statement or evaluation
        (e.g., 'Because X, Y, and Z happened, the day was great').
      score_half: The evidence presents some of the relevant events or factors but
        fails to explicitly link them as a collective cause for the summary, or presents
        them in isolation without the synthesizing statement.
      score_0: The evidence presents only isolated events, a single factor, or generic
        context without establishing the specific set of distinct causes required
        to verify or exclude the summary claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: exclusivity_scope_verification
      description: Evidence explicitly addresses the existence or non-existence of
        alternative modes, attributes, or instances required to verify or exclude
        options claiming exclusivity (e.g., 'only X') versus inclusivity (e.g., 'X
        and Y'), rather than merely confirming the presence of the primary element.
      score_1: The evidence explicitly confirms or denies the presence of alternative
        elements (e.g., 'they also use Y', 'they never use Z'), allowing the exclusivity
        claim to be definitively verified or excluded.
      score_half: The evidence confirms the primary element but the status of alternative
        elements is implicit, ambiguous, or relies on general context rather than
        explicit confirmation/denial.
      score_0: The evidence only confirms the primary element without addressing alternatives,
        making it impossible to distinguish between 'only X' and 'X and Y' claims.
      weight: 3.0
      failure_repair_action: refine_query
    - name: demonstration_mapping_explicitness
      description: Evidence explicitly maps a specific visual demonstration, analogy,
        or physical setup to the abstract concept, principle, or phenomenon it is
        intended to illustrate, rather than merely showing the demonstration or mentioning
        the concept in isolation.
      score_1: The evidence explicitly states the connection (e.g., 'this setup illustrates
        X', 'it is like Y') between the visual demonstration and the abstract concept,
        allowing the purpose of the segment to be verified or excluded.
      score_half: The evidence shows the demonstration and mentions the concept, but
        the explicit link or mapping between the two is implicit, ambiguous, or requires
        inference.
      score_0: The evidence shows the demonstration or mentions the concept separately
        without establishing the specific illustrative relationship, making it impossible
        to verify what the demonstration is trying to show.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_scope_coverage
      description: Evidence explicitly provides the specific attribute, state, or
        motivation for every agent or entity involved in a comparative claim, rather
        than providing sufficient evidence for only one side of the comparison or
        a generic description of the group.
      score_1: The evidence explicitly grounds the specific claim (e.g., motivation,
        state, action) for each distinct agent or entity required to verify the difference
        or similarity asserted in the option.
      score_half: The evidence provides the specific claim for one or some of the
        agents/entities involved in the comparison, but lacks explicit grounding for
        at least one other required agent, making the comparative distinction unverifiable.
      score_0: The evidence provides no specific grounding for the claim regarding
        any of the agents/entities involved in the comparison, or only provides generic
        context that does not distinguish between them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: precipitating_event_specificity
      description: Evidence explicitly identifies the specific event, diagnosis, or
        concrete outcome that served as the direct trigger for the agent's change
        in motivation or action, rather than merely stating a general category of
        cause, a chronic condition, or a vague reason.
      score_1: The evidence explicitly names the specific incident, diagnosis, or
        immediate outcome (e.g., 'the dentist said X', 'the report showed Y') that
        directly caused the agent to decide to act.
      score_half: The evidence mentions a general category of cause (e.g., 'health
        issues', 'unhealthy habits') or a chronic state, but the specific triggering
        event or concrete diagnosis is implicit, generic, or missing.
      score_0: The evidence provides only vague reasons, general context, or unrelated
        events, making it impossible to verify the specific precipitating factor claimed
        in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_attribution_to_agent
      description: Evidence explicitly attributes a specific event, diagnosis, or
        outcome as the direct cause or reason for the target agent's specific decision,
        motivation, or change in behavior, rather than merely stating the event occurred
        or the agent decided without linking the two.
      score_1: The evidence explicitly states or demonstrates that the specific event/outcome
        (e.g., a diagnosis, a specific incident) is the reason the target agent made
        the specific decision or changed their behavior (e.g., 'Because X happened,
        Y decided to Z').
      score_half: The evidence mentions the specific event/outcome and the agent's
        decision separately, or implies a connection, but lacks an explicit statement
        or unambiguous cue linking the event as the direct cause of the agent's specific
        motivation.
      score_0: The evidence describes the event or the agent's decision in isolation,
        or links the event to a different agent/outcome, providing no basis to verify
        that the specific event caused the target agent's specific decision.
      weight: 3.0
      failure_repair_action: refine_query
    - name: judgment_basis_explicitness
      description: Evidence explicitly identifies the specific sensory cue, visual
        indicator, or factual premise that the target agent explicitly cites as the
        basis for their judgment, assessment, or conclusion about an event or state,
        rather than merely presenting the agent's conclusion or discussing the event
        in general terms.
      score_1: The evidence explicitly states or shows the specific indicator (e.g.,
        'the lights went out', 'the sound of X') that the agent claims to have observed
        to form their specific judgment or conclusion.
      score_half: The evidence presents the agent's conclusion or discusses the event,
        but the specific indicator or premise the agent used to reach that judgment
        is implicit, generic, or not explicitly linked to the agent's reasoning.
      score_0: The evidence only provides the agent's conclusion or general context
        without any reference to the specific cue or basis the agent used to form
        their judgment, making it impossible to verify 'how' they judged the event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: rationale_explicitness
      description: Evidence explicitly states the specific reason, justification,
        or necessity for a proposed action, solution, or theme, rather than merely
        presenting the problem, the action itself, or a generic context that implies
        a connection.
      score_1: The evidence explicitly articulates the specific rationale (e.g., 'X
        is needed because of Y', 'Z is the solution to W') that validates the option's
        claim about the purpose or necessity of the action/theme.
      score_half: The evidence presents the problem and the action/solution, but the
        explicit link explaining *why* the action is the solution or *why* it is necessary
        is implicit, ambiguous, or requires inference.
      score_0: The evidence only describes the problem, the action, or the context
        without any explicit statement of the specific justification or reason connecting
        them, making it impossible to verify the option's claim about the rationale.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_efficacy_grounding
      description: Evidence explicitly states or demonstrates that the specific action,
        treatment, or intervention resulted in the specific claimed outcome or efficacy
        for the target entity, rather than merely describing the action, the general
        capability of the tool, or a different outcome.
      score_1: The evidence explicitly links the specific action/intervention to the
        specific claimed result (e.g., 'the treatment reduced X's pain', 'the device
        successfully stopped Y') for the target entity.
      score_half: The evidence describes the action/intervention and the general capability
        of the tool, or shows the target entity in a state consistent with the outcome,
        but the explicit link confirming the specific result for that target is implicit
        or ambiguous.
      score_0: The evidence only describes the action, the tool's general function,
        or a different outcome (e.g., failure, side effect), providing no basis to
        verify the specific efficacy or result claimed for the target.
      weight: 3.0
      failure_repair_action: refine_query
    - name: significance_explicitness
      description: Evidence explicitly states the specific outcome, implication, or
        meaning (significance) of the event or action claimed in the option, rather
        than merely describing the event's components, the agents' actions, or the
        context without the resulting interpretation or ruling.
      score_1: The evidence explicitly articulates the specific significance, outcome,
        or meaning (e.g., 'this signifies X', 'the ruling means Y', 'the result was
        Z') required to verify or exclude the option's claim about what the event
        represents.
      score_half: The evidence describes the event, the agents, and the context, but
        the explicit statement of the specific significance, outcome, or meaning is
        implicit, ambiguous, or requires inference to connect the event to its broader
        implication.
      score_0: The evidence only presents the event details, the agents' actions,
        or the context without any explicit statement of the specific outcome, implication,
        or meaning, making it impossible to verify or exclude claims about what the
        event signifies.
      weight: 3.0
      failure_repair_action: refine_query
    - name: strategic_prescription_grounding
      description: Evidence explicitly states or demonstrates the specific recommended
        course of action, strategy, or optimal behavior required to achieve the goal
        claimed in the option, rather than merely describing the current state, the
        agent's past actions, or the opponent's situation.
      score_1: The evidence explicitly articulates the specific strategy or action
        the agent should take to succeed (e.g., 'they need to X', 'the way to win
        is Y', 'they should focus on Z'), allowing the option to be verified or excluded.
      score_half: The evidence describes the agent's current actions, the game state,
        or the opponent's weaknesses, but the explicit recommendation for the specific
        winning strategy is implicit, inferred, or not directly stated.
      score_0: The evidence only presents the current situation, past events, or generic
        context without any explicit statement of what the agent should do to achieve
        the goal, making it impossible to verify the specific strategic prescription.
      weight: 3.0
      failure_repair_action: refine_query
    - name: situational_necessity_grounding
      description: Evidence explicitly states or demonstrates the specific external
        constraint, threat, or situational factor that necessitated or forced the
        agent's specific action, rather than merely describing the action itself or
        the general context in which it occurred.
      score_1: The evidence explicitly links a specific situational constraint (e.g.,
        being surrounded, low health, lack of escape routes) to the agent's action
        as the direct cause or necessity (e.g., 'forced to X because of Y', 'had to
        Z due to W').
      score_half: The evidence describes the action and the general context or threat,
        but the explicit link establishing that the specific constraint *forced* or
        *necessitated* the action is implicit, ambiguous, or requires inference.
      score_0: The evidence describes the action or the context separately without
        establishing the specific external constraint that compelled the action, making
        it impossible to verify the 'forced' or 'necessitated' nature of the claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_magnitude_grounding
      description: Evidence explicitly establishes the relative scale, intensity,
        or magnitude of the attribute across all compared entities required to verify
        or exclude superlative or comparative claims (e.g., 'biggest', 'most', 'better
        than'), rather than merely confirming the presence of the attribute in each
        entity without establishing the ranking.
      score_1: The evidence explicitly demonstrates or states the relative difference
        in magnitude (e.g., 'X is significantly larger than Y', 'Z is the only one
        with a decisive lead') allowing the superlative or comparative ranking to
        be definitively verified or excluded.
      score_half: The evidence confirms the attribute exists for the compared entities
        but the relative scale or magnitude difference is implicit, ambiguous, or
        insufficient to distinguish the 'biggest' or 'best' from the others.
      score_0: The evidence confirms the attribute for one or more entities but provides
        no basis for comparing their magnitudes, making it impossible to verify or
        exclude superlative or comparative claims.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_interval_coverage
      description: Evidence explicitly covers the specific time window, duration,
        or phase (e.g., 'early game', 'first 5 minutes', 'during the intro') queried,
        rather than presenting evidence from a different phase of the event or a generic
        timeline that does not address the specific interval.
      score_1: The evidence explicitly pertains to the specific time interval or phase
        requested (e.g., shows the clock at the queried time, describes events occurring
        within that specific window), allowing the state at that time to be verified
        or excluded.
      score_half: The evidence shows the event or entity but the specific temporal
        phase is ambiguous, mixed with other phases, or the evidence is from a different
        part of the timeline (e.g., late game instead of early game), making the specific
        interval claim unverifiable.
      score_0: The evidence pertains to a completely different time period or phase
        than the one queried, or provides no temporal context, making it impossible
        to verify or exclude claims about the specific interval.
      weight: 3.0
      failure_repair_action: refine_query
    - name: capability_state_grounding
      description: Evidence explicitly attributes a specific capability, ease, difficulty,
        or state of feasibility to the target situation or agent required to verify
        or exclude options claiming 'can', 'cannot', 'easily', or 'hard', rather than
        merely showing actions that imply the state or describing the context without
        the explicit attribution of the capability.
      score_1: The evidence explicitly states or demonstrates the specific capability
        or state of ease/difficulty (e.g., 'it is easy to X', 'they cannot Y', 'the
        situation allows Z') required to verify or exclude the option's claim about
        what is possible or feasible.
      score_half: The evidence shows actions or context consistent with the capability
        or state, but the explicit attribution of the specific capability (can/cannot)
        or the degree of ease/difficulty is implicit, ambiguous, or requires inference.
      score_0: The evidence only shows isolated actions or generic context without
        any explicit link to the specific capability, ease, or difficulty claimed,
        making it impossible to verify or exclude the option based on the stated feasibility.
      weight: 3.0
      failure_repair_action: refine_query
    - name: spatial_subregion_grounding
      description: Evidence explicitly covers the specific spatial sub-region, zone,
        or sector (e.g., a specific lane, room, or area) queried, rather than merely
        presenting evidence from the general scene, a different sub-region, or the
        entire map without isolating the specific area of interest.
      score_1: The evidence explicitly shows or describes events, states, or actions
        occurring within the specific sub-region (e.g., 'bottom lane', 'kitchen',
        'north sector') required to verify or exclude the option.
      score_half: The evidence shows the general scene or a different sub-region,
        but the specific queried area is only implied, mentioned in passing, or not
        visually/narratively isolated, making the specific state of that sub-region
        ambiguous.
      score_0: The evidence pertains to a completely different sub-region, the general
        scene without specific localization, or lacks any spatial context for the
        queried area, making it impossible to verify or exclude claims about that
        specific location.
      weight: 3.0
      failure_repair_action: refine_query
    - name: group_trait_attribution
      description: Evidence explicitly attributes a specific collective behavioral
        trait, relational state, or group dynamic (e.g., trust, cohesion, hostility)
        to the target group or team, rather than merely describing individual actions,
        isolated player states, or game mechanics that could imply the trait without
        confirming it.
      score_1: The evidence explicitly states or unambiguously demonstrates the specific
        group-level trait or dynamic (e.g., 'the team trusts each other', 'they are
        built on emotion') required to verify or exclude the option.
      score_half: The evidence describes individual actions or isolated states consistent
        with the trait, or mentions the group in a generic context, but the explicit
        link to the specific collective trait is implicit, ambiguous, or requires
        inference.
      score_0: The evidence only presents individual actions, game mechanics, or isolated
        player states without any explicit attribution of the specific collective
        trait or dynamic to the group, making it impossible to verify or exclude the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_metric_grounding
      description: Evidence explicitly provides the specific metric, rating, or quantitative/qualitative
        scale required to establish the relative magnitude or ranking between compared
        entities, rather than merely confirming the existence of the entities or providing
        a single isolated data point that does not support a relative judgment.
      score_1: The evidence explicitly presents the specific metric (e.g., ratings,
        scores, K-D ratios, explicit rankings) for the compared entities, allowing
        the relative difference or similarity to be definitively verified or excluded.
      score_half: The evidence provides some data for the entities (e.g., a single
        score, a generic description) but lacks the specific comparative metric or
        sufficient data points to establish the relative magnitude or ranking claimed.
      score_0: The evidence mentions the entities or provides unrelated data without
        any specific metric or scale that would allow for a comparison of their relative
        strength, level, or magnitude.
      weight: 3.0
      failure_repair_action: refine_query
    - name: collective_property_verification
      description: Evidence explicitly confirms the specific attribute, state, or
        interaction applies to *all* members of the claimed set or group, rather than
        merely identifying the set members or confirming the attribute for only a
        subset.
      score_1: The evidence explicitly states or demonstrates that the specific property
        (e.g., 'all are X', 'they all cooperate') holds for every member of the group
        or the entire set claimed in the option.
      score_half: The evidence identifies the group members and confirms the property
        for some, but lacks explicit confirmation for all members, or the collective
