        than merely showing the agent performing the action in a scene where others
        are present or absent without clarifying their role.
      score_1: The evidence explicitly shows the agent performing the specific physical
        steps of the action without any assistance (for 'on their own') or explicitly
        shows others assisting/participating in the specific steps (for 'not on their
        own'), allowing the independence claim to be verified or excluded.
      score_half: The evidence shows the agent performing the action and others are
        present in the scene, but it is ambiguous whether the others are assisting,
        observing, or working on unrelated tasks, making the 'on their own' claim
        unverifiable.
      score_0: The evidence shows the agent discussing the action, the outcome, or
        the agent present while others perform the action, or the scene lacks clarity
        on whether assistance was provided, making it impossible to verify if the
        action was done independently.
      weight: 3.0
      failure_repair_action: refine_query
    - name: assembly_configuration_grounding
      description: Evidence explicitly demonstrates the specific physical arrangement,
        assembly, or configuration of multiple objects or components required to verify
        or exclude options claiming a specific method based on that configuration,
        rather than merely showing the individual objects, the outcome, or a different
        arrangement.
      score_1: The evidence explicitly shows or describes the specific assembly state
        (e.g., 'markers bound together', 'straws flattened and stapled') that constitutes
        the claimed method, allowing the option to be verified or excluded.
      score_half: The evidence shows the individual components or the outcome of the
        method, but the specific physical configuration or assembly process linking
        them is implicit, ambiguous, or missing.
      score_0: The evidence only shows the individual objects in isolation, the final
        result, or a different configuration, providing no basis to verify or exclude
        the specific assembly-based method claimed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequence_rule_grounding
      description: Evidence explicitly provides the specific attribute value (e.g.,
        age, size, score) for every entity in the sequence required to verify or exclude
        the specific sorting rule or ordering mechanism claimed in the option, rather
        than merely listing the entities, showing their order, or providing the attribute
        for only a subset.
      score_1: The evidence explicitly states or demonstrates the specific attribute
        value for each entity in the sequence, allowing the claimed sorting rule (e.g.,
        'ascending age', 'alternating gender') to be definitively verified or excluded.
      score_half: The evidence shows the sequence of entities and provides the attribute
        for some but not all, or shows the order without the specific attribute values
        needed to confirm the sorting mechanism, making the rule unverifiable.
      score_0: The evidence lists the entities or shows the sequence but lacks the
        specific attribute values for the entities required to determine if the claimed
        sorting rule applies, making it impossible to verify or exclude the ordering
        mechanism.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_status_attribution
      description: Evidence explicitly attributes a specific superlative status, ranking,
        or qualitative label (e.g., 'most popular', 'beloved', 'best', 'centerpiece')
        to the target entity within the claimed scope, rather than merely describing
        the entity's features, presence, or generic popularity without the specific
        ranking claim.
      score_1: The evidence explicitly states the specific superlative or ranking
        label (e.g., 'most popular', 'number one', 'beloved') and links it to the
        target entity within the relevant scope, allowing the option to be verified
        or excluded.
      score_half: The evidence describes the entity as popular, common, or significant,
        but the specific superlative label or ranking (e.g., 'most' vs. 'a') is implicit,
        ambiguous, or not explicitly stated.
      score_0: The evidence only describes the entity's features, presence, or generic
        context without any explicit attribution of a specific superlative status
        or ranking, making it impossible to verify or exclude claims about being the
        'most' or 'best'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: remedial_target_explicitness
      description: Evidence explicitly identifies the specific unwanted element, obstacle,
        or visual defect that the agent's action is intended to cover, hide, fix,
        or resolve, rather than merely describing the action or the general context
        without naming the specific target of the remediation.
      score_1: The evidence explicitly states the specific target (e.g., 'cover the
        electrical panel', 'hide the stain', 'fix the leak') that the action is designed
        to address, allowing the specific remedial reason to be verified or excluded.
      score_half: The evidence describes the action and implies a problem or shows
        the target, but the explicit link stating that the action is *for the purpose
        of* addressing that specific target is implicit or ambiguous.
      score_0: The evidence describes the action or the context but fails to identify
        the specific unwanted element or problem the action is meant to resolve, making
        it impossible to verify the specific remedial reason claimed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: physical_trait_attribution
      description: Evidence explicitly identifies and attributes the specific physical
        attribute, physiological condition, or bodily state (e.g., skin tone, eye
        color, specific defect, hereditary trait) claimed in the option to the target
        agent, rather than merely describing the agent's actions, general appearance,
        or unrelated context.
      score_1: The evidence explicitly states or visually demonstrates the specific
        physical trait (e.g., 'I have dark circles', 'my skin is yellow') and links
        it to the agent, allowing the option's claim about this specific trait to
        be verified or excluded.
      score_half: The evidence shows the agent or describes their general appearance,
        but the specific physical trait claimed in the option is implicit, ambiguous,
        or not explicitly attributed to the agent as a specific condition.
      score_0: The evidence describes the agent's actions, general context, or unrelated
        topics without any explicit identification or attribution of the specific
        physical trait claimed in the option, making it impossible to verify if the
        agent has that specific condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: content_category_attribution
      description: Evidence explicitly attributes a specific content category, genre,
        or theme (e.g., 'gaming', 'vlog', 'tutorial') to the specific work, video,
        or output claimed in the option, rather than merely showing the agent performing
        related actions, discussing the work in general terms, or presenting the work
        without identifying its specific type.
      score_1: The evidence explicitly states or demonstrates the specific category/theme
        of the work (e.g., 'this is a gaming video', 'I am making a vlog') required
        to verify or exclude the option.
      score_half: The evidence shows the agent creating content or performing actions
        consistent with a category, but the explicit label or specific theme of the
        work is implicit, ambiguous, or requires inference.
      score_0: The evidence shows the agent's actions, the work itself, or general
        context without any explicit identification of the specific content category
        or theme, making it impossible to verify or exclude options proposing different
        genres.
      weight: 3.0
      failure_repair_action: refine_query
    - name: beneficiary_link_grounding
      description: Evidence explicitly links the specific outcome, product, or result
        of an action to the specific entity, group, or recipient that receives, uses,
        or benefits from it, rather than merely showing the action, the result, and
        the potential recipients in isolation or separate contexts.
      score_1: The evidence explicitly demonstrates the connection between the action's
        result and the specific recipient (e.g., the modified object is placed with
        the specific animals, the food is given to the specific person), allowing
        the beneficiary claim to be verified or excluded.
      score_half: The evidence shows the action and the result, and mentions or shows
        potential recipients, but the explicit link connecting the specific result
        to the specific recipient is implicit, ambiguous, or requires inference from
        separate scenes.
      score_0: The evidence shows the action and the result, or shows potential recipients,
        but provides no basis to link the specific result to a specific recipient,
        making it impossible to verify who the action was intended for.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negative_explanation_grounding
      description: Evidence explicitly confirms the absence of an explanation, the
        lack of knowledge, or the impossibility of deducing a reason for the specific
        event or attribute claimed in the option, rather than merely failing to find
        an explanation or presenting unrelated content.
      score_1: The evidence explicitly states that the reason is unknown, not provided,
        or impossible to deduce (e.g., 'we don't know why', 'no explanation given',
        'it is impossible to tell'), allowing the option claiming 'no explanation'
        to be verified or the option claiming a specific reason to be excluded.
      score_half: The evidence does not contain an explicit explanation for the event,
        but also lacks an explicit statement confirming the absence of knowledge or
        the impossibility of deduction, leaving the status of the explanation ambiguous
        (it might be missing or just not shown).
      score_0: The evidence presents an explanation (even if incorrect or partial)
        or provides no information regarding the existence or absence of an explanation,
        making it impossible to verify or exclude claims about the lack of an explanation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: transactional_source_grounding
      description: Evidence explicitly identifies the specific vendor, shop, or entity
        providing the item, money, or service claimed in the option, rather than merely
        showing the item, a generic transaction, or the recipient without establishing
        the specific source identity.
      score_1: The evidence explicitly links the item/money to the specific source
        entity (e.g., via signage, dialogue, or visual context of the specific stall/shop)
        required to verify or exclude options differing by source.
      score_half: The evidence shows the item or a transaction occurring, but the
        specific identity of the source entity is implicit, generic, or ambiguous,
        making it impossible to distinguish between competing source options.
      score_0: The evidence shows the item or recipient but provides no information
        about the specific source entity, making it impossible to verify or exclude
        claims about where the item/money came from.
      weight: 3.0
      failure_repair_action: refine_query
    - name: destination_explicitness
      description: Evidence explicitly identifies the specific destination, target
        location, or endpoint of the agent's movement or transportation action, rather
        than merely describing the action of moving, the vehicle used, or the general
        context without specifying where the agent is going.
      score_1: The evidence explicitly states or visually confirms the specific destination
        (e.g., 'to the hospital', 'to the park', 'home') required to verify or exclude
        options proposing different endpoints.
      score_half: The evidence describes the movement action and the agent/vehicle
        but the specific destination is implicit, generic (e.g., 'somewhere'), or
        requires inference from context, making it impossible to distinguish between
        specific destination options.
      score_0: The evidence only shows the agent moving or the vehicle in motion without
        any reference to a specific destination or target location, making it impossible
        to verify or exclude options based on where the agent is going.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_breadth_for_existence
      description: Evidence explicitly spans a sufficiently wide temporal range or
        includes a montage of distinct scenes required to verify or exclude options
        claiming the existence of a specific event in a long video, rather than providing
        deep detail on a narrow subset of the timeline that may miss the target event.
      score_1: The evidence covers multiple distinct time intervals or a rapid sequence
        of varied scenes, ensuring the specific event claimed in the option is either
        captured or definitively absent across the sampled breadth.
      score_half: The evidence covers a significant portion of the video but focuses
        on a limited set of scenes or a continuous segment that may not include the
        specific event, leaving the existence claim unverifiable due to potential
        sampling gaps.
      score_0: The evidence is limited to a single scene, a very short duration, or
        a narrow subset of the video's content, providing no basis to confirm or deny
        the existence of an event that may occur elsewhere in the timeline.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: habit_vs_trigger_differentiation
      description: Evidence explicitly distinguishes whether the agent's action is
        driven by a specific, immediate situational trigger (e.g., a threat, a command,
        a specific event) versus a general habit, capability, or routine behavior,
        rather than merely showing the action occurring or describing the agent's
        general traits.
      score_1: The evidence explicitly identifies a specific, immediate trigger (e.g.,
        a predator appearing, a specific sound) that caused the action, allowing options
        claiming a general habit or capability to be excluded.
      score_half: The evidence shows the action and the agent's general traits or
        capabilities, but the specific immediate trigger is implicit, ambiguous, or
        not explicitly linked to the action, making it difficult to distinguish between
        a habit and a reaction.
      score_0: The evidence only describes the agent's general capabilities, habits,
        or the action itself without any reference to a specific situational trigger,
        making it impossible to exclude options claiming the action is merely a habit
        or routine.
      weight: 3.0
      failure_repair_action: refine_query
    - name: interaction_nature_explicitness
      description: Evidence explicitly states or unambiguously demonstrates the specific
        nature, valence, or classification of the interaction (e.g., play, aggression,
        hunting, ritual, accident) required to verify or exclude options proposing
        different types of interaction, rather than merely describing the physical
        actions, the outcome, or the context that could imply multiple interaction
        types.
      score_1: The evidence explicitly labels or provides unambiguous cues (e.g.,
        'they are playing', 'a deadly struggle', 'a ritual display') that definitively
        classify the interaction type claimed in the option.
      score_half: The evidence describes the physical actions and context consistent
        with the interaction type, but the specific classification (e.g., play vs.
        fight) is implicit, ambiguous, or requires inference from general behavior.
      score_0: The evidence only describes the physical actions, the agents, or the
        outcome without any explicit indication of the specific nature or valence
        of the interaction, making it impossible to distinguish between options like
        'playing', 'fighting', or 'hunting'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_cause_grounding
      description: Evidence explicitly identifies the specific event, factor, or mechanism
        that caused the difference, disparity, or relative state (e.g., one agent
        being behind, faster, or in a different condition) between the compared entities,
        rather than merely showing the entities in their respective states or providing
        a generic cause that applies to both.
      score_1: The evidence explicitly states or demonstrates the specific cause (e.g.,
        'X took a wrong turn', 'Y's bike broke') that directly explains the difference
        or relative state between the agents, allowing the comparative claim to be
        verified or excluded.
      score_half: The evidence shows the agents in their respective states and mentions
        a cause, but the explicit link between that specific cause and the *difference*
        between them is implicit, ambiguous, or the cause applies generally to the
        situation rather than distinguishing the agents.
      score_0: The evidence shows the agents in their respective states or provides
        a generic context, but lacks any specific event or factor that explains why
        one is different from the other, making it impossible to verify the reason
        for the disparity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_completeness_verification
      description: Evidence explicitly confirms whether the target agent completed
        the specific action, task, or endurance event to its defined endpoint, or
        explicitly demonstrates the point of abandonment/termination, rather than
        merely showing the agent struggling, experiencing pain, or facing adverse
        conditions during the process.
      score_1: The evidence explicitly states or visually demonstrates the final outcome
        (e.g., 'finished the run', 'completed the task', 'gave up at X point', 'abandoned
        the attempt'), allowing the completion vs. abandonment claim to be definitively
        verified or excluded.
      score_half: The evidence shows the agent struggling, in pain, or facing difficulties
        consistent with either outcome, but lacks an explicit statement or visual
        confirmation of the final result (completion or abandonment), leaving the
        outcome ambiguous.
      score_0: The evidence only describes the process, conditions, or intermediate
        states without any indication of whether the action was ultimately completed
        or abandoned, making it impossible to verify the final outcome.
      weight: 3.0
      failure_repair_action: refine_query
    - name: cross_phase_recurrence_verification
      description: Evidence explicitly demonstrates the occurrence of the specific
        action, state, or entity in each of the distinct phases, segments, or time
        periods required by the query (e.g., 'warm-up' AND 'workout', 'before' AND
        'after'), rather than merely showing it in one phase or implying it occurs
        in the other.
      score_1: The evidence explicitly shows or states the specific action/entity
        occurring in every distinct phase required by the query, allowing the claim
        of presence in all phases to be verified or excluded.
      score_half: The evidence shows the action/entity in one of the required phases
        but lacks explicit confirmation for at least one other required phase, making
        the 'all phases' claim unverifiable.
      score_0: The evidence shows the action/entity in only a single phase or provides
        no evidence for any of the specific phases required, making it impossible
        to verify or exclude claims about recurrence across phases.
      weight: 3.0
      failure_repair_action: refine_query
    - name: marking_content_grounding
      description: Evidence explicitly resolves the specific textual, graphic, or
        symbolic content of a marking (e.g., text, logo, pattern) on an object required
        to verify or exclude options claiming a specific meaning, identity, or origin
        for that marking, rather than merely noting the presence of a marking or describing
        its generic appearance.
      score_1: The evidence explicitly displays or states the specific content of
        the marking (e.g., the exact text, the specific logo design, the distinct
        pattern) that allows the option's claim about its meaning or identity to be
        verified or excluded.
      score_half: The evidence shows a marking is present and describes its general
        appearance (e.g., 'text on the back', 'a logo'), but the specific content
        required to distinguish between competing claims (e.g., 'winner's logo' vs
        'personal name') is implicit, illegible, or not fully resolved.
      score_0: The evidence mentions the presence of a marking or describes the object
        generically without resolving the specific content, making it impossible to
        verify or exclude options that depend on the specific meaning or identity
        of the marking.
      weight: 3.0
      failure_repair_action: refine_query
    - name: marking_semantic_grounding
      description: Evidence explicitly establishes the specific meaning, definition,
        or semantic interpretation of a marking, symbol, or written record (e.g.,
        text, numbers, symbols) required to verify or exclude options claiming a specific
        content, rather than merely noting the presence of the marking or describing
        its visual appearance without defining what it represents.
      score_1: The evidence explicitly states or demonstrates the specific meaning
        of the marking (e.g., via direct narration, dialogue defining the marks, or
        clear context linking the marks to a specific concept), allowing the option's
        claim about the content to be verified or excluded.
      score_half: The evidence shows the marking and provides some context, but the
        specific semantic link between the visual marks and their meaning is implicit,
        ambiguous, or requires inference to determine what the marks represent.
      score_0: The evidence only shows the presence of the marking or describes its
        visual features (e.g., 'numbers on a board') without any explicit information
        defining what those marks mean, making it impossible to verify or exclude
        claims about the specific content.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequential_target_grounding
      description: Evidence explicitly identifies the specific target entity, object,
        or body part that is the focus of the action immediately following a reference
        event, rather than merely listing the subsequent action, describing general
        muscle groups, or implying the target without explicit attribution.
      score_1: The evidence explicitly states or demonstrates the specific target
        (e.g., 'next exercise targets X', 'focus on Y') for the action that follows
        the reference event, allowing the specific option to be verified or excluded.
      score_half: The evidence identifies the subsequent action and mentions general
        categories or multiple potential targets, but the explicit link to the specific
        single target claimed in the option is implicit, ambiguous, or requires inference.
      score_0: The evidence describes the subsequent action or general context but
        fails to identify the specific target entity or body part, making it impossible
        to distinguish between options proposing different targets.
      weight: 3.0
      failure_repair_action: refine_query
    - name: duration_quantifier_grounding
      description: Evidence explicitly states the specific quantitative duration,
        time span, or frequency interval (e.g., '8 months', '3 years', 'every day')
        claimed in the option regarding an agent's history, experience, or state,
        rather than merely describing the event, the agent's general status, or providing
        unrelated temporal markers.
      score_1: The evidence explicitly provides the specific numerical or defined
        time span (e.g., 'X months', 'Y years') required to verify or exclude the
        option's claim about the duration of the agent's involvement or state.
      score_half: The evidence mentions the agent's involvement or a general timeframe
        (e.g., 'a long time', 'recently') but lacks the specific quantitative duration
        or defined interval required to distinguish between options proposing different
        time spans.
      score_0: The evidence describes the event, the agent's actions, or unrelated
        temporal markers (e.g., distance, clock time) without any explicit statement
        of the specific duration or time span claimed in the option, making it impossible
        to verify or exclude options based on the length of time.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_origin_temporal_grounding
      description: Evidence explicitly establishes the specific time of onset, origin,
        or acquisition of the causal factor (e.g., injury, condition, knowledge) relative
        to the queried event, rather than merely showing the factor's presence during
        the event or discussing it in a generic timeframe.
      score_1: The evidence explicitly states or demonstrates when the causal factor
        originated (e.g., 'injured before the race', 'learned yesterday', 'acquired
        prior to the event'), allowing options claiming a different origin time (e.g.,
        'during the event') to be definitively verified or excluded.
      score_half: The evidence shows the causal factor present during the event or
        mentions a timeframe, but the specific origin time relative to the event is
        implicit, ambiguous, or not explicitly linked, making it impossible to distinguish
        between 'prior to' and 'during' claims.
      score_0: The evidence only shows the causal factor during the event or provides
        no temporal context for its origin, making it impossible to verify or exclude
        options based on when the factor was acquired or the injury occurred.
      weight: 3.0
      failure_repair_action: refine_query
    - name: diagnostic_specificity
      description: Evidence explicitly states the specific diagnosis, medical condition,
        or technical classification of the agent's state required to verify or exclude
        options proposing different specific causes (e.g., distinguishing a 'stress
        reaction' from a 'fracture', or a 'sprain' from a 'strain'), rather than merely
        describing generic symptoms, pain, or the use of medication without the specific
        label.
      score_1: The evidence explicitly names or describes the specific condition/diagnosis
        (e.g., 'stress reaction', 'fracture', 'infection') that allows the option's
        specific claim about the nature of the problem to be verified or excluded.
      score_half: The evidence describes symptoms, pain, or treatment (e.g., 'pain',
        'taking pills') but the specific medical or technical classification of the
        condition is implicit, generic, or missing, making it impossible to distinguish
        between options proposing different specific diagnoses.
      score_0: The evidence only mentions generic discomfort, the presence of an injury,
        or the use of remedies without any specific identification of the underlying
        condition, making it impossible to verify or exclude options based on the
        specific nature of the problem.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_outcome_attribution
      description: Evidence explicitly states the specific quantitative result (e.g.,
        distance, score, time, rank) or precise completion status for each specific
        agent involved in a multi-agent event, rather than merely identifying the
        agents, the event, or providing a generic outcome that does not distinguish
        between the agents' specific performances.
      score_1: The evidence explicitly links a specific quantitative value or precise
        status (e.g., 'ran 38km', 'finished full', 'scored 100') to each specific
        agent required to verify or exclude the option's claim about their individual
        results.
      score_half: The evidence identifies the agents and the event, and may provide
        a generic outcome or a result for only one agent, but lacks the specific quantitative
        value or precise status for at least one agent required to distinguish between
        competing options.
      score_0: The evidence identifies the agents and the event but provides no specific
        quantitative results or precise completion statuses for any of the agents,
        making it impossible to verify or exclude options based on their specific
        performances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: asset_outcome_verification
      description: Evidence explicitly confirms the specific final status (e.g., lost,
        retained, destroyed, secured) of the target asset, objective, or entity claimed
        in the option, rather than merely showing the attempt, the conflict, or the
        general context without resolving the specific outcome for that asset.
      score_1: The evidence explicitly states or visually demonstrates the specific
        final status of the target asset (e.g., 'the dragon was lost', 'the soul was
        secured', 'the objective was destroyed'), allowing the claim about the outcome
        to be definitively verified or excluded.
      score_half: The evidence shows the conflict, the attempt, or the general context
        involving the asset, but the specific final status (loss vs. retention) is
        implicit, ambiguous, or not explicitly resolved.
      score_0: The evidence only shows the attempt, the agents involved, or the general
        setting without any information about the specific final status of the target
        asset, making it impossible to verify or exclude claims about whether it was
        lost or retained.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_comparative_state_grounding
      description: Evidence explicitly attributes a comparative state (e.g., advantage,
        disadvantage, lead, deficit) to the target entity or team within the specific
        temporal window queried, rather than merely showing events that imply a state
        at a different time or showing the state without explicit temporal localization.
      score_1: The evidence explicitly states or demonstrates the comparative state
        (e.g., 'Team X has the advantage', 'Team Y is at a disadvantage') and explicitly
        links this state to the specific time interval or phase requested in the query.
      score_half: The evidence shows the comparative state or the specific time interval,
        but the explicit link between the state and the queried time is implicit,
        ambiguous, or the state is shown for a different time period.
      score_0: The evidence shows events or a state at a different time, or shows
        the state without any temporal context, making it impossible to verify if
        the comparative state held during the specific queried interval.
      weight: 3.0
      failure_repair_action: refine_query
    - name: team_tactic_attribution
      description: Evidence explicitly attributes a specific collective strategy,
        tactical style, or overarching plan to the target team or group, rather than
        merely listing isolated actions, individual player behaviors, or game outcomes
        that could imply multiple different strategies.
      score_1: The evidence explicitly states or unambiguously demonstrates the specific
        team-level tactic (e.g., 'their strategy is to X', 'they are playing a Y style')
        that defines the group's approach, allowing the option to be verified or excluded.
      score_half: The evidence shows the team performing actions consistent with the
        tactic, but the explicit link to a specific collective strategy or the definition
        of their 'tactics' is implicit, ambiguous, or requires inference from isolated
        events.
      score_0: The evidence only lists individual actions, game states, or outcomes
        without any explicit attribution of a specific collective strategy or tactical
        style to the team, making it impossible to verify or exclude options about
        their 'tactics'.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Reasoning:
    rubric_criteria:
    - name: causal_attribution_explicitness
      description: Evidence explicitly states the specific reason, cause, or motivation
        for a phenomenon, event, or naming, rather than merely presenting the phenomenon
        and a related factor separately.
      score_1: The specific causal link or reason asserted in the option is explicitly
        stated or directly implied as the cause in the evidence.
      score_half: The phenomenon and a potential cause are both present, but the explicit
        link between them is missing or ambiguous.
      score_0: The phenomenon is mentioned, but the specific reason or cause asserted
        in the option is absent or contradicted.
      weight: 3.0
      failure_repair_action: refine_query
    - name: property_status_explicitness
      description: Evidence explicitly asserts or denies a specific property, status,
        or attribute of an entity (e.g., curability, prevalence, identity, state)
        rather than merely mentioning the entity or a related context without defining
        that specific attribute.
      score_1: The specific property or status asserted in the option is explicitly
        stated or directly denied in the evidence.
      score_half: The entity is mentioned and context is provided, but the specific
        property or status is only implied or ambiguous.
      score_0: The entity is mentioned, but the specific property or status asserted
        in the option is entirely absent from the evidence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: quantitative_and_scope_explicitness
      description: Evidence explicitly states the specific numerical value, percentage,
        count, or precise demographic scope asserted in an option, rather than merely
        mentioning the general phenomenon or a related entity without the specific
        quantification or boundary.
      score_1: The specific number, percentage, count, or precise group scope asserted
        in the option is explicitly stated in the evidence.
      score_half: The general phenomenon or entity is mentioned, but the specific
        numerical value or precise scope is missing, vague, or only implied.
