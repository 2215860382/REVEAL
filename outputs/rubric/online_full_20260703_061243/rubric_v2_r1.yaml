      weight: 3.0
      failure_repair_action: refine_query
    - name: method_revelation_grounding
      description: Evidence explicitly exposes the mechanism, secret, or method behind
        an illusion, trick, or deceptive act (e.g., showing the hidden thread, explaining
        the sleight of hand), rather than merely depicting the performance of the
        illusion or the final effect without revealing how it is achieved.
      score_1: Evidence explicitly demonstrates or states the specific method or secret
        that makes the illusion possible, allowing verification of a 'reveals secrets'
        claim and exclusion of a 'merely performs' claim.
      score_half: Evidence shows the performance of the trick and hints at a method
        (e.g., showing props) but lacks an explicit demonstration or statement of
        how the trick is actually executed.
      score_0: Evidence only depicts the performance of the illusion or the final
        effect without any indication of the underlying method, making it impossible
        to verify a claim that the video 'reveals secrets'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: transformation_mechanism_grounding
      description: Evidence explicitly depicts or states the specific process, intervention,
        or mechanism that drives the change asserted in the option (e.g., the makeover,
        the therapy, the training), rather than merely presenting the 'before' and
        'after' states in isolation or implying the change occurred without showing
        the transformative act.
      score_1: Evidence explicitly shows or describes the specific action, event,
        or process that constitutes the transformation (e.g., the act of styling,
        the specific advice given, the renovation work), linking the initial state
        to the final state.
      score_half: Evidence shows the initial and final states and implies a change
        occurred, but lacks explicit depiction or description of the specific mechanism
        or process that caused the transformation.
      score_0: Evidence presents only the initial state, only the final state, or
        both in isolation without any indication of the process or mechanism that
        connects them, making the 'transformation' claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: initial_state_explicitness
      description: Evidence explicitly depicts or states the specific condition, status,
        or attribute of the subject at the start of the transformation (the 'from'
        state), rather than merely showing the final result or implying the initial
        state through generic scenes.
      score_1: Evidence explicitly identifies the specific initial condition (e.g.,
        specific grooming state, financial status, emotional state) that the option
        claims the subject started with.
      score_half: Evidence shows the subject in a generic or ambiguous initial state,
        or implies the initial condition without explicitly defining the specific
        attribute required to distinguish between transformation options.
      score_0: Evidence presents only the final state or the transformation process
        without any explicit depiction or statement of the specific initial condition,
        making the 'from' part of the transformation unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_persistence_verification
      description: Evidence explicitly confirms that a specific attribute, feature,
        or state of the subject remained unchanged throughout the transformation or
        process, either by showing the attribute in both the initial and final states
        with no difference, or by explicitly stating that the attribute was not altered,
        rather than merely showing the initial state or the changes to other attributes.
      score_1: Evidence explicitly demonstrates or states that the specific attribute
        remained constant from start to finish (e.g., showing the same hairstyle in
        before/after shots or stating 'we didn't touch his hair').
      score_half: Evidence shows the initial state and the final state but the attribute
        is not clearly visible or compared in both, or the lack of change is implied
        but not explicitly confirmed.
      score_0: Evidence only shows the initial state, only shows the changes to other
        attributes, or provides no information about the specific attribute's status
        at the end, making it impossible to verify that it remained unchanged.
      weight: 3.0
      failure_repair_action: refine_query
    - name: biographical_trajectory_articulation
      description: Evidence explicitly narrates the specific sequence of personal
        decisions, life events, and causal transitions (e.g., quitting a job, facing
        conflict, starting a new path) that constitute the subject's life story or
        career change, rather than merely describing the subject's current role, the
        setting, or isolated facts about their profession.
      score_1: Evidence explicitly details the subject's personal journey, including
        the inciting incident, the decision to change, the conflict faced, and the
        resulting new path, allowing verification of a 'life of' or 'career change'
        synopsis.
      score_half: Evidence mentions the subject's current role or some life events
        but lacks the explicit causal narrative linking the decision to the outcome,
        or omits key phases of the personal transition.
      score_0: Evidence presents only the subject's current state, the setting, or
        isolated facts about their profession without any narrative of personal decisions
        or life transitions, making a 'life story' synopsis unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: opening_scope_declaration
      description: Evidence explicitly contains the video's opening segment where
        the narrator or on-screen text declares the video's total scope, thesis, or
        quantitative limit (e.g., 'top 10', 'history of X', 'guide to Y'), rather
        than relying on mid-video content or inferring the scope from a sequence of
        examples.
      score_1: Evidence includes the opening segment with an explicit statement defining
        the video's full scope, thesis, or total count (e.g., 'top 10 projects'),
        allowing definitive verification of the synopsis.
      score_half: Evidence includes the opening segment but the scope declaration
        is implicit, vague, or missing the specific quantitative/qualitative limit
        required to distinguish between options.
      score_0: Evidence lacks the opening segment or any explicit declaration of the
        video's total scope/thesis, making it impossible to verify options that hinge
        on the specific count or main theme defined at the start.
      weight: 3.0
      failure_repair_action: refine_query
    - name: material_origin_grounding
      description: Evidence explicitly depicts or states the specific material composition,
        construction method, or origin (e.g., 'handmade', 'cardboard', '3D printed',
        'mass-produced') asserted in the option, rather than merely showing the object's
        final form, generic appearance, or unrelated context.
      score_1: Evidence explicitly shows the specific material (e.g., visible cardboard
        layers, raw wood) or construction process (e.g., hands assembling, drawing
        on material) that verifies the option's claim about the object's origin or
        composition.
      score_half: Evidence shows the object but the specific material or construction
        method is ambiguous, implied, or obscured (e.g., a finished product where
        the material is not clearly distinguishable from alternatives).
      score_0: Evidence shows only the object's final appearance, generic setting,
        or unrelated elements without any indication of the specific material or origin
        required to verify the option.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: functional_behavior_grounding
      description: Evidence explicitly depicts the target object or system performing
        specific operational functions, interactive behaviors, or dynamic responses
        (e.g., booting up, screen transitions, mechanical movement, user interaction)
        asserted by the option, rather than merely showing the object's static appearance,
        setting, or passive presence.
      score_1: Evidence explicitly shows the object executing the specific functions
        or behaviors claimed (e.g., a device turning on, a mechanism moving, an interface
        responding to touch), verifying the 'working' or 'functional' nature of the
        synopsis.
      score_half: Evidence shows the object and implies functionality (e.g., showing
        a screen with an image) but lacks explicit depiction of the dynamic behavior,
        interaction, or operational process required to confirm it is 'working'.
      score_0: Evidence shows only the static object, its setting, or unrelated environmental
        changes without any indication of the object performing functions or responding
        to interaction, making a 'working' or 'functional' claim unverifiable.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: primary_vs_referenced_topic_distinction
      description: Evidence explicitly distinguishes the video's primary subject matter
        from topics that are merely mentioned as future plans, secondary examples,
        or related but distinct content, rather than treating any mentioned topic
        as the main focus.
      score_1: Evidence clearly identifies the content being actively presented as
        the main topic and explicitly excludes or contextualizes other mentioned topics
        as future, secondary, or distinct from the current video's scope.
      score_half: Evidence shows the primary content but also includes mentions of
        other topics without clear framing to distinguish the main focus from the
        referenced ones, requiring inference to determine the primary subject.
      score_0: Evidence relies on mentions of topics (e.g., in a closing statement
        or intro teaser) without showing the actual content of the primary subject,
        or fails to distinguish between the main topic and referenced topics, making
        it impossible to verify the correct synopsis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: integrated_program_articulation
      description: Evidence explicitly states that distinct components (e.g., diet
        and exercise, theory and practice, steps and tools) are part of a single,
        unified, or curated program/system, rather than merely showing the components
        occurring separately or in a generic sequence.
      score_1: Evidence contains an explicit statement or visual framing defining
        the components as a combined, curated, or integrated plan (e.g., 'meals paired
        with workouts', 'a guide combining X and Y').
      score_half: Evidence shows the distinct components occurring in the video but
        lacks an explicit statement linking them as a unified or curated system, requiring
        inference to determine if they are part of a single plan.
      score_0: Evidence presents the components in isolation or as separate events
        without any indication of a unifying program, making it impossible to verify
        a synopsis claiming an integrated or combined approach.
      weight: 3.0
      failure_repair_action: refine_query
    - name: behavioral_strategy_articulation
      description: Evidence explicitly states the specific behavioral strategy, rule,
        or method (e.g., 'do as you go', '10-minute rule') asserted in the option
        as the solution or main topic, rather than merely describing the problem,
        the general goal, or the act of performing the task without defining the specific
        approach.
      score_1: Evidence explicitly names or defines the specific strategy or rule
        that constitutes the main topic or solution.
      score_half: Evidence describes the problem or the general goal and implies a
        strategy, but lacks an explicit statement defining the specific method or
        rule.
      score_0: Evidence only describes the problem, the general desire to change,
        or the act of performing the task without any explicit articulation of a specific
        strategy or method.
      weight: 3.0
      failure_repair_action: refine_query
    - name: situational_state_grounding
      description: Evidence explicitly depicts the specific physical state, activity,
        posture, or immediate setting (e.g., 'lying in bed', 'driving', 'standing
        in a kitchen') asserted in the query, rather than showing the subject in a
        different state, a generic setting, or a different time, which is required
        to verify or exclude claims about what occurred specifically in that state.
      score_1: Evidence explicitly shows the subject in the exact state, activity,
        or setting described in the query (e.g., the subject is visibly lying in bed
        if the query specifies 'lying in bed').
      score_half: Evidence shows the subject in a related but distinct state or setting
        (e.g., the subject is in the bedroom but sitting up, or in a different room
        entirely), making it ambiguous whether the specific claim applies to the queried
        state.
      score_0: Evidence shows the subject in a completely different state, activity,
        or setting, or fails to resolve the subject's state, making it impossible
        to verify claims tied to the specific situational context.
      weight: 3.0
      failure_repair_action: refine_query
    - name: format_mechanism_grounding
      description: Evidence explicitly contains the specific mechanisms (e.g., comparisons,
        definitions, instructions, pricing, evaluations, step-by-step demonstrations)
        that constitute the claimed video format (e.g., 'guide', 'review', 'tutorial',
        'how-to'), rather than merely depicting the subject matter in a narrative,
        descriptive, or montage style that could apply to multiple formats.
      score_1: Evidence explicitly demonstrates the defining mechanisms of the claimed
        format (e.g., explicit comparisons, price listings, instructional steps, or
        evaluative criteria) that verify the video is a 'guide' or 'review' rather
        than just a narrative log.
      score_half: Evidence shows the subject matter and some elements of the format
        (e.g., mentions a price or shows a comparison) but lacks the comprehensive
        or explicit application of the format's defining mechanisms, leaving the format
        ambiguous.
      score_0: Evidence presents only a narrative sequence, descriptive scenes, or
        a montage of events without any explicit mechanisms (comparisons, instructions,
        evaluations) that would define the video as a specific format like a 'guide'
        or 'review'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: primary_subject_dominance
      description: Evidence explicitly establishes the target entity as the central,
        consistent focus of the video's narrative or visual content, rather than merely
        appearing incidentally, in the background, or as a minor element alongside
        other dominant subjects or activities.
      score_1: Evidence shows the target entity as the primary subject in the majority
        of relevant segments, driving the action or being the clear center of attention,
        allowing verification that it is the 'main focus'.
      score_half: Evidence shows the target entity present but mixed with other dominant
        subjects or activities, or the entity appears only in isolated segments, making
        it ambiguous whether it is the main focus or just one of several topics.
      score_0: Evidence shows the target entity only incidentally, in the background,
        or in a segment where it is clearly not the main subject (e.g., overshadowed
        by another entity or activity), making it impossible to verify it as the video's
        main focus.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sustained_primary_activity_grounding
      description: Evidence explicitly depicts the specific activity asserted in the
        option as the video's sustained, central focus (e.g., a continuous session
        of the activity, a dedicated segment, or the primary narrative thread), rather
        than merely showing the subject present in the setting, performing the activity
        incidentally, or presenting a fragmented montage where the activity is not
        the dominant theme.
      score_1: Evidence shows the specific activity as the continuous, primary focus
        of the video, with the subject actively engaged in it for a significant portion
        of the content, clearly establishing it as the main theme.
      score_half: Evidence shows the subject performing the activity, but it is fragmented,
        brief, or mixed with other unrelated activities, making it ambiguous whether
        this activity is the video's main focus or just one of many elements.
      score_0: Evidence shows the subject in the setting or performing the activity
        only incidentally, briefly, or in a way that does not establish it as the
        central, sustained theme of the video, making the 'main focus' claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_scope_delimitation_via_contrast
      description: Evidence explicitly defines the video's primary scope or thesis
        by contrasting it with a plausible alternative topic, or by providing a specific
        call-to-action/instruction that frames the content as one specific type of
        activity (e.g., 'performance', 'rescue', 'tutorial') while implicitly or explicitly
        excluding others, rather than merely presenting content that could support
        multiple competing synopses.
      score_1: Evidence contains an explicit statement, text, or call-to-action that
        clearly frames the video's main focus and distinguishes it from other plausible
        themes (e.g., 'Make Your Pet Famous' frames it as performance, excluding 'rescue'
        as the main theme).
      score_half: Evidence suggests a primary theme through content but lacks an explicit
        statement or framing device that definitively excludes competing plausible
        synopses, leaving ambiguity about the main intent.
      score_0: Evidence presents content consistent with multiple competing synopses
        without any explicit framing, contrast, or call-to-action to distinguish the
        primary theme from secondary or incidental elements.
      weight: 3.0
      failure_repair_action: refine_query
    - name: environmental_scope_grounding
      description: Evidence explicitly identifies the specific environmental setting,
        habitat, or physical context (e.g., 'rivers', 'urban streets', 'deep ocean')
        that constitutes the video's primary scope, rather than merely showing generic
        scenes or multiple disparate settings that could support a broader, less specific
        synopsis.
      score_1: Evidence explicitly names or visually confirms the specific environment
        as the central, unifying context of the video, allowing definitive verification
        of options that hinge on that specific setting.
      score_half: Evidence shows scenes consistent with the environment but lacks
        explicit naming or a unifying visual theme, or presents multiple settings
        without clearly establishing one as the primary scope.
      score_0: Evidence presents generic scenes, multiple disparate environments,
        or lacks any specific environmental markers, making it impossible to distinguish
        a specific setting-based synopsis from a generic one.
      weight: 3.0
      failure_repair_action: refine_query
    - name: production_identity_grounding
      description: Evidence explicitly contains the production identity markers (e.g.,
        channel logo, series title card, specific crew names, or documentary branding)
        that define the video as a specific recorded story or episode, rather than
        merely showing the subject matter or generic scenes that could belong to any
        source.
      score_1: Evidence includes explicit visual or auditory markers (e.g., a specific
        channel logo, series title, or named crew) that definitively identify the
        video's production source and context.
      score_half: Evidence shows content consistent with a specific production but
        lacks the explicit branding, title, or crew identification required to verify
        the specific 'recorded story' or series context.
      score_0: Evidence presents only the subject matter or generic scenes without
        any production identity markers, making it impossible to verify the specific
        source or series context of the synopsis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: categorical_scope_exclusivity
      description: Evidence explicitly restricts the video's content to the specific
        sub-category, taxonomic group, or domain asserted in the option, either by
        enumerating only members of that group or by explicitly excluding members
        of broader or alternative categories, rather than presenting a mixed set of
        entities that could support a broader or different synopsis.
      score_1: Evidence confirms the content is limited to the specific category (e.g.,
        only fish, only mammals) or explicitly excludes other categories, allowing
        definitive verification of the specific sub-category option.
      score_half: Evidence shows members of the specific category but also includes
        members of broader or alternative categories without explicit exclusion, leaving
        ambiguity about whether the video is about the specific sub-category or the
        broader group.
      score_0: Evidence presents a mixed set of entities from multiple categories
        or domains, making it impossible to verify that the video is specifically
        about the narrow sub-category asserted in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: multi_stage_completion_verification
      description: Evidence explicitly confirms the successful completion of all distinct
        stages or components of a multi-part sequence asserted in the option (e.g.,
        finishing the swim, bike, and run legs of a triathlon), rather than merely
        showing the plan, the start of the sequence, or the completion of only a subset
        of the stages.
      score_1: Evidence explicitly shows or states that the subject completed every
        stage of the sequence (e.g., finishing the final leg, displaying cumulative
        stats, or explicit confirmation of full completion).
      score_half: Evidence shows the start of the sequence or completion of some stages
        but lacks explicit confirmation that all stages were successfully finished
        by the subject.
      score_0: Evidence only shows the plan, the start of the sequence, or isolated
        stages without any indication that the full sequence was completed, making
        it impossible to verify a 'successfully completed' claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: motivational_rationale_articulation
      description: Evidence explicitly states the specific reason, motivation, or
        emotional driver (e.g., 'reasons to love', 'why I started', 'what inspired
        me') asserted in the option, rather than merely describing the activity, the
        context, or the outcome without linking it to the subject's personal motivation.
      score_1: Evidence explicitly articulates the specific reason or motivation (e.g.,
        'I love X because of Y') that matches the option's claim about the subject's
        feelings or drivers.
      score_half: Evidence describes the activity or context and implies a positive
        sentiment, but lacks an explicit statement defining the specific reason or
        motivation for the subject's attachment or preference.
      score_0: Evidence describes the activity, context, or outcome without any explicit
        mention of the subject's specific reason, motivation, or emotional driver,
        making it impossible to verify a 'reason' or 'motivation' claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_title_grounding
      description: Evidence explicitly states or displays the specific proper name,
        title, or unique identifier of the narrative work (e.g., opera title, play
        name, story title) asserted in the option, rather than merely describing generic
        scenes, character types, or dialogue lines that could apply to multiple works.
      score_1: Evidence explicitly names or displays the specific title or unique
        identifier of the narrative work, allowing definitive verification of the
        plot synopsis.
      score_half: Evidence shows scenes or dialogue consistent with the work but lacks
        the explicit title or unique identifier, requiring inference to distinguish
        between similar narratives.
      score_0: Evidence presents only generic scenes, character descriptions, or dialogue
        without any explicit mention of the specific work's title or unique identifier,
        making it impossible to verify the specific plot synopsis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: dual_aspect_verification
      description: Evidence explicitly covers both distinct aspects, sides, or dimensions
        (e.g., advantages and disadvantages, causes and effects, pros and cons) asserted
        in an option that claims a balanced or dual-scope discussion, rather than
        providing evidence for only one side or a single dimension of the topic.
      score_1: Evidence explicitly addresses both required aspects (e.g., states the
        benefits and explicitly raises the drawbacks or questions the quality), allowing
        verification of the 'and' or 'versus' claim in the option.
      score_half: Evidence covers one aspect clearly (e.g., the advantages) but only
        implies, hints at, or fails to explicitly address the second aspect (e.g.,
        the disadvantages), leaving the dual-scope claim partially unverified.
      score_0: Evidence covers only a single aspect or dimension of the topic (e.g.,
        only the process, only the benefits) without any explicit mention or discussion
        of the contrasting or complementary aspect required by the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: narrative_closure_verification
      description: Evidence explicitly includes the video's concluding segment (e.g.,
        sign-off, farewell, 'see you next time', credits, or final summary) that confirms
        the video is a complete, self-contained unit, rather than merely providing
        the opening or middle segments which could represent a fragment of a longer
        or different narrative.
      score_1: Evidence contains the explicit closing markers (farewell, end-of-video
        statement, credits) that definitively establish the video's conclusion and
        full scope.
      score_half: Evidence includes the opening and middle content but lacks the explicit
        closing segment, leaving ambiguity about whether the video continues or if
        the presented content is the full scope.
      score_0: Evidence is limited to the opening or middle segments without any indication
        of the video's conclusion, making it impossible to verify the video as a complete
        synopsis unit.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Counting Problem:
    rubric_criteria:
    - name: count_verification
      description: Evidence explicitly identifies and enumerates all distinct instances
        of the target entity required to verify a count, distinguishing between unique
        occurrences and duplicates or non-targets.
      score_1: All distinct instances required for the count are explicitly identified
        and distinguished from non-targets or duplicates.
      score_half: Some instances are identified, but the evidence is ambiguous about
        whether the count is complete or if some instances are duplicates.
      score_0: Evidence fails to identify distinct instances, making it impossible
        to verify the total count or exclude options based on quantity.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: temporal_aggregation
      description: Evidence spans the full temporal duration required to identify
        all distinct instances of the target entity, ensuring no occurrences in unobserved
        time windows are missed.
      score_1: Evidence covers the entire relevant time window, allowing all distinct
        instances to be identified and aggregated.
      score_half: Evidence covers only a partial time window; some instances may exist
        in unobserved segments, making the total count uncertain.
      score_0: Evidence is confined to a single short segment or disjointed moments
        that clearly miss significant portions of the timeline where instances could
        occur.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: set_completeness
      description: Evidence explicitly confirms that the identified instances constitute
        the complete set of target entities, ruling out the existence of unobserved
        or unmentioned instances required to verify the total count.
      score_1: Evidence explicitly demonstrates that no other instances exist beyond
        those identified, allowing the total count to be verified as exhaustive.
      score_half: Evidence identifies multiple instances but lacks explicit confirmation
        that the set is complete, leaving the possibility of unobserved instances.
      score_0: Evidence identifies only a subset of instances with no indication of
        whether the set is complete, making it impossible to verify the total count.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: contextual_filtering
      description: Evidence explicitly verifies that each identified instance satisfies
        the specific contextual qualifiers (e.g., specific time period, role, action
        type, or condition) required by the query, distinguishing target instances
        from non-target instances that share the same entity or general topic.
      score_1: Evidence explicitly confirms that every counted instance meets all
        specific qualifiers of the query, and non-target instances are clearly distinguished
        or excluded based on these qualifiers.
      score_half: Evidence identifies instances of the entity but lacks explicit confirmation
        that they satisfy all specific qualifiers, leaving ambiguity about whether
        some instances should be excluded.
      score_0: Evidence fails to distinguish between target and non-target instances
        based on the query's specific qualifiers, making it impossible to verify the
        count of the specific subset.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_numerical_grounding
      description: Evidence explicitly states the specific count as a number or visually
        enumerates the distinct instances to a specific total, rather than merely
        naming the group or implying a quantity.
      score_1: The specific count is explicitly stated as a number or the distinct
        instances are visually enumerated to a definitive total.
      score_half: The count is implied or partially enumerated, but the exact total
        is not explicitly stated or fully resolved.
      score_0: The group is named or referenced, but no specific count is stated or
        visually enumerated, making the total quantity unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instance_distinctness
      description: Evidence explicitly distinguishes between distinct instances of
        the target entity and repeated occurrences of the same entity, ensuring that
        the count reflects unique items rather than multiple actions on a single item.
      score_1: Evidence provides clear visual or textual markers (e.g., different
        source thumbnails, explicit naming, or distinct visual content) that confirm
        each counted instance is a unique entity.
      score_half: Evidence shows multiple instances but lacks definitive proof that
        they are distinct; it is ambiguous whether some instances are repeated edits
        of the same entity.
      score_0: Evidence shows only a single entity or fails to distinguish between
        instances, making it impossible to verify if the count represents unique items
        or repeated actions on one item.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: full_sequence_enumeration
      description: Evidence presents the complete set of target instances as a single,
        contiguous, and explicitly labeled sequence (e.g., a timeline, chart, or list)
        that allows the total count to be derived directly from the visual or textual
        enumeration of all items in order.
      score_1: The evidence displays the entire sequence of target instances in a
        single view with explicit labels for each item, allowing the total count to
        be verified by direct enumeration.
      score_half: The evidence displays a partial sequence or disjointed instances
        that imply a sequence but do not explicitly label every item in a single contiguous
        view, requiring inference to determine the total count.
      score_0: The evidence shows only isolated instances or a generic reference to
        the group without a contiguous, labeled enumeration of the full sequence,
        making the total count unverifiable.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: threshold_verification
      description: Evidence explicitly demonstrates that the quantitative attribute
        of each counted instance satisfies the specific threshold or condition required
        by the query (e.g., speed > X, count >= Y), rather than merely stating the
        attribute's value without confirming it meets the condition.
      score_1: Evidence explicitly shows the attribute value meeting or exceeding
        the required threshold for every counted instance, allowing the count to be
        verified.
      score_half: Evidence states the attribute values for instances but does not
        explicitly confirm they meet the threshold, requiring inference or leaving
        ambiguity about whether the condition is satisfied.
      score_0: Evidence fails to provide attribute values or does not show any instance
        meeting the required threshold, making it impossible to verify the count of
        qualifying instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: category_membership_verification
      description: Evidence explicitly confirms that each identified instance satisfies
        the semantic definition or category qualifiers of the target entity in the
        query, distinguishing true members from non-members that may share superficial
        visual or contextual features.
      score_1: Evidence explicitly demonstrates that every counted instance belongs
        to the target category (e.g., via explicit naming, functional description,
        or visual confirmation of category-defining features), and non-members are
        clearly excluded based on these criteria.
      score_half: Evidence identifies instances that appear to be the target but lacks
        explicit confirmation of their category membership, leaving ambiguity about
        whether they truly satisfy the query's definition.
      score_0: Evidence identifies instances without verifying their category membership,
        making it impossible to determine if they are true targets or non-targets
        that merely resemble the target.
      weight: 3.0
      failure_repair_action: refine_query
    - name: format_distinction
      description: Evidence explicitly distinguishes between the specific media format
        or presentation style required by the query (e.g., a live broadcast, a specific
        document type, a direct quote) and other representations of the same topic
        (e.g., a summary title card, a narrative description, a mention in dialogue),
        ensuring only instances matching the exact format are counted.
      score_1: Evidence clearly identifies instances that match the specific required
        format and explicitly excludes instances that are merely summaries, mentions,
        or different formats of the same topic.
      score_half: Evidence identifies instances of the topic but is ambiguous about
        whether they match the specific required format, potentially conflating summaries
        or mentions with the target format.
      score_0: Evidence fails to distinguish between the target format and other representations,
        counting summaries or mentions as valid instances of the specific format.
      weight: 3.0
      failure_repair_action: refine_query
    - name: structural_delimiter_recognition
      description: Evidence explicitly identifies the specific visual or textual delimiters
        (e.g., title cards, lower-thirds, logos, or transition graphics) that mark
        the boundaries or existence of the target entity type, distinguishing these
        structural markers from the continuous narrative content.
      score_1: Evidence clearly identifies the specific structural markers that define
        the target entities, allowing for accurate counting based on these delimiters.
      score_half: Evidence shows some structural markers but misses others, or the
        markers are ambiguous, leading to uncertainty in the total count.
      score_0: Evidence contains only narrative content without identifying the specific
        structural delimiters required to define the target entities, making the count
        unverifiable.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: agent_specificity
      description: Evidence explicitly identifies the specific agent, subgroup, or
        entity responsible for the target event or attribute, distinguishing them
        from a generic class, broader category, or unrelated actors mentioned in the
        context.
      score_1: The specific agent or subgroup responsible for the target event is
        explicitly named or visually identified, allowing the count to be attributed
        to the correct entity.
      score_half: The evidence mentions a general class of actors or the topic broadly
        but fails to explicitly identify the specific subgroup or agent responsible
        for the target event.
      score_0: The evidence fails to identify any specific agent, or attributes the
        event to a generic group that does not match the specific entity required
        by the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instance_vs_aggregate_distinction
      description: Evidence explicitly enumerates distinct individual instances of
        the target entity rather than relying on aggregate statistics, percentages,
        rates, or population-level totals that do not correspond to a count of specific,
        identifiable items.
      score_1: Evidence provides a count based on the explicit identification or enumeration
        of distinct individual instances, clearly distinguishing them from aggregate
        data.
      score_half: Evidence contains both individual instances and aggregate data,
        but it is ambiguous whether the count is derived from the individuals or the
        aggregate, or if the aggregate is being misinterpreted as a count of individuals.
      score_0: Evidence relies solely on aggregate statistics, percentages, or rates
        without identifying or enumerating the specific individual instances required
        to verify the count.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_comparison_grounding
      description: Evidence explicitly compares the quantitative attribute of the
        target entity against all other relevant candidates in the set to verify a
        superlative claim (e.g., maximum, minimum, most, least), rather than merely
        establishing the target's value in isolation.
      score_1: Evidence explicitly provides the attribute values or relative rankings
        for all candidates, allowing the superlative claim to be verified by direct
        comparison.
      score_half: Evidence establishes the target's value but lacks explicit data
        for one or more other candidates, leaving the superlative claim unverified
        due to missing comparison points.
      score_0: Evidence only establishes the target's value without any information
        about other candidates, making it impossible to verify if the target holds
        the superlative status.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_outcome_verification
      description: Evidence explicitly confirms the successful completion or specific
        result of the target action for each counted instance, rather than merely
        describing the attempt, preparation, or initiation of the action.
      score_1: Evidence explicitly states or visually demonstrates the successful
        outcome (e.g., goal scored, shot made, task completed) for every instance
        included in the count.
      score_half: Evidence describes the attempt or initiation of the action for some
        instances but lacks explicit confirmation of the outcome for all, leaving
        ambiguity about whether the action was successful.
      score_0: Evidence only describes the attempt, preparation, or general activity
        without confirming the specific result required to count the instance as valid.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: session_boundary_verification
      description: Evidence explicitly identifies the specific session, game, or challenge
        instance required by the query, distinguishing it from other similar sessions
        or segments in the video that may contain the same entity or action type.
      score_1: Evidence clearly demarcates the boundaries of the target session (e.g.,
        via title cards, explicit dialogue, or distinct visual context) and isolates
        the count to this specific instance, excluding data from other sessions.
      score_half: Evidence identifies the target session but the boundaries are ambiguous,
        or evidence from other sessions is present without clear exclusion, creating
        uncertainty about which count applies.
      score_0: Evidence fails to distinguish the target session from other similar
        sessions, aggregating counts across multiple distinct games or challenges,
        or selecting the wrong session entirely.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_boundary_anchoring
      description: Evidence explicitly links the counted instances to the specific
        temporal boundary or trigger event defined in the query (e.g., 'after X',
        'before Y', 'during Z'), distinguishing the state of the count at that specific
        moment from counts at other times.
      score_1: Evidence explicitly identifies the trigger event and provides the count
        or state of instances immediately following (or preceding) that event, allowing
        the specific subset to be verified.
      score_half: Evidence identifies the trigger event and provides counts, but the
        temporal relationship between the event and the count is ambiguous or requires
        inference to determine if the count applies to the specific boundary.
      score_0: Evidence provides counts or the trigger event in isolation, but fails
        to link them, making it impossible to verify the count specifically for the
        time period defined by the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: non_target_exclusion
      description: Evidence explicitly identifies the agent, outcome, or context of
        observed events that do NOT match the target query, allowing the exclusion
        of these instances from the count and ruling out options with higher quantities.
      score_1: Evidence explicitly confirms that observed non-target instances (e.g.,
        goals by other players, missed attempts, or events in wrong sessions) are
        definitively not the target, allowing all such instances to be excluded from
        the count.
      score_half: Evidence shows non-target instances but lacks explicit confirmation
        of the agent or outcome, leaving ambiguity about whether some could be the
        target.
      score_0: Evidence fails to distinguish non-target instances from potential targets,
        making it impossible to exclude them and verify the total count against higher
        options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: aggregate_milestone_grounding
      description: Evidence explicitly states a cumulative total, milestone number,
        or aggregate statistic required by the query, rather than requiring the verifier
        to manually enumerate individual instances to derive the total.
      score_1: The specific cumulative count or milestone is explicitly stated as
        a number or confirmed via a definitive textual/audio declaration (e.g., '200th
        goal', 'total of 50').
      score_half: Evidence implies a large number or mentions a milestone context
        but lacks the explicit numerical confirmation of the total count.
      score_0: Evidence only provides individual instances or generic references to
        the entity's history without stating the specific aggregate total or milestone
        number required to verify the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: failure_event_verification
      description: Evidence explicitly confirms the specific negative outcome (e.g.,
        failure, elimination, miss, rejection) for each counted instance, rather than
        merely inferring the outcome from a final status, aggregate result, or the
        absence of a success.
      score_1: Evidence explicitly demonstrates the failure event (e.g., visual of
        a miss, explicit 'failed' marker, or commentary confirming the elimination)
        for every instance included in the count.
      score_half: Evidence implies the failure (e.g., via a final ranking or lack
        of success) but does not explicitly show or state the specific failure event
        for all instances.
      score_0: Evidence only shows successful outcomes, final standings, or generic
        activity without confirming the specific failure event required to count the
        instance as eliminated or failed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: multi_attribute_coverage
      description: Evidence explicitly identifies and verifies instances for every
        distinct attribute, entity type, or event category requested in the query,
        rather than providing sufficient evidence for only a subset of the required
        components.
      score_1: Evidence explicitly identifies and verifies instances for all distinct
        attributes or categories required by the query, allowing the complete answer
        to be constructed.
      score_half: Evidence identifies instances for some but not all required attributes
        or categories, leaving parts of the answer unverifiable.
      score_0: Evidence fails to identify instances for one or more required attributes
        or categories, making it impossible to verify the full answer.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_segment_identification
      description: Evidence explicitly identifies the specific ordinal markers, labels,
        or structural delimiters (e.g., '1st period', '2nd round', 'Part 3') that
        define the distinct countable units within a sequence, rather than merely
        showing continuous activity or the start/end of the overall event.
      score_1: Evidence explicitly displays or states the ordinal identifiers for
        all distinct units required to verify the count (e.g., confirming the existence
        of a 1st, 2nd, and 3rd unit).
      score_half: Evidence identifies some ordinal units but misses others, or the
        labels are ambiguous, leaving the total count of distinct units uncertain.
      score_0: Evidence shows the activity or the overall event but fails to identify
        the specific ordinal markers or structural boundaries that distinguish the
        individual countable units from one another.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_composition_verification
      description: Evidence explicitly identifies the number of distinct agents or
        performers comprising each instance, allowing the verifier to distinguish
        between single-agent (solo) and multi-agent (group) instances required by
        the query.
      score_1: Evidence explicitly states or visually confirms the exact number of
        agents for every instance, enabling clear distinction between solo and group
        acts.
      score_half: Evidence identifies agents for some instances but is ambiguous about
        the total count for others (e.g., uses generic terms like 'performers' or
        'group' without specifying if it is one or many), leaving the solo/group status
        uncertain.
      score_0: Evidence fails to identify the number of agents for any instance, making
        it impossible to determine if an act is solo or a group performance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_enumeration_view
      description: Evidence presents a single view (e.g., a numbered list, grid, summary
        chart, or labeled collage) that explicitly enumerates all target instances
        with distinct identifiers, allowing the total count to be derived directly
        from the visual or textual labels without manual aggregation of disjointed
        segments.
      score_1: Evidence displays a single contiguous view where all target instances
        are explicitly labeled or numbered, allowing the total count to be verified
        by direct reading of the enumeration.
      score_half: Evidence displays a partial enumeration or a view where some instances
        are labeled but others are not, or the view is disjointed, requiring inference
        to determine the total count.
      score_0: Evidence shows only isolated instances or generic references without
        a single view that explicitly enumerates the full set, making the total count
        unverifiable without aggregating separate segments.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: relational_depth_verification
      description: Evidence explicitly spans the necessary depth of the hierarchical
        or relational structure to identify the target entities, confirming the existence
        of the specific generation, level, or relationship step required by the query
        (e.g., verifying grandchildren by showing the grandchild generation, not just
        children).
      score_1: Evidence explicitly displays or describes the specific relational level
        required (e.g., the grandchild generation) and connects it to the root entity,
        allowing the target set to be identified and counted.
      score_half: Evidence identifies the immediate predecessors (e.g., children)
        but fails to explicitly confirm the existence or identity of the specific
        deeper level (e.g., grandchildren) required by the query.
      score_0: Evidence is confined to a higher level of the hierarchy (e.g., only
        the founder or only the children) and provides no information about the specific
        relational depth required to identify the target entities.
      weight: 3.0
      failure_repair_action: refine_query
    - name: category_definition_grounding
      description: Evidence explicitly states the semantic definition, criteria, or
        distinguishing features of the categories or groups required by the query,
        rather than merely listing their names or labels.
      score_1: Evidence explicitly defines the criteria or characteristics that determine
        membership in each relevant category, allowing instances to be correctly classified.
      score_half: Evidence lists category names or labels but provides only partial
        or ambiguous definitions, leaving the classification criteria unclear.
      score_0: Evidence mentions category names or labels without providing any definition
        or criteria for membership, making it impossible to determine which instances
        belong to which category.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_occurrence_verification
      description: Evidence explicitly confirms the occurrence of the specific target
        action (e.g., visiting, purchasing, completing) for each counted instance,
        distinguishing it from mere proximity, observation, transit, or attempts that
        do not constitute the target event.
      score_1: Evidence explicitly demonstrates the target action occurring for every
        counted instance (e.g., entering a store, interacting with a product), clearly
        distinguishing these from instances where the subject was merely nearby or
        observing.
      score_half: Evidence shows the subject near the target or engaging in related
        activities, but lacks definitive confirmation that the specific target action
        (e.g., a full visit) occurred for all instances, leaving ambiguity between
        transit and the target event.
      score_0: Evidence only shows the subject in proximity to the target or observing
        it without any indication of the specific target action occurring, making
        it impossible to verify the count of actual instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: reunion_event_distinction
      description: Evidence explicitly distinguishes between discrete reunion events
        (separation followed by re-encounter) and continuous co-presence or single
        meetings, ensuring that only instances involving a prior separation and subsequent
        meeting are counted as reunions.
      score_1: Evidence clearly identifies the separation and subsequent re-encounter
        for each counted instance, explicitly excluding periods of continuous togetherness
        or single meetings that do not involve a reunion.
      score_half: Evidence identifies instances of togetherness but is ambiguous about
        whether a separation occurred prior to each instance, leaving uncertainty
        about whether they are reunions or continuous presence.
      score_0: Evidence fails to distinguish between reunions and continuous co-presence,
        potentially counting a single long stay or a single meeting as multiple reunions,
        or missing the separation requirement entirely.
      weight: 3.0
      failure_repair_action: refine_query
    - name: holistic_set_enumeration
      description: Evidence presents a single, contiguous view (e.g., a summary shot,
        list, or chart) that displays all distinct target instances simultaneously,
        allowing the total count to be verified by direct enumeration of the visible
        set rather than by aggregating disjointed temporal segments.
      score_1: Evidence displays all target instances in a single view with clear
        visual or textual markers, enabling the total count to be verified by direct
        counting of the set.
      score_half: Evidence displays a partial set in a single view or shows instances
        in disjointed segments that imply a total but do not allow for direct enumeration
        of the complete set in one view.
      score_0: Evidence only shows isolated instances or sequential demonstrations
        without a single view of the complete set, making it impossible to verify
        the total count without inferring from unobserved segments.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: interaction_type_verification
      description: Evidence explicitly distinguishes the specific type of interaction
        or communicative act required by the query (e.g., asking a question, making
        a statement, giving an order) from other interactions performed by the same
        agent toward the same target, ensuring only instances matching the specific
        interaction type are counted.
      score_1: Evidence explicitly confirms that each counted instance involves the
        specific interaction type (e.g., a question is asked) and clearly distinguishes
        these from other interactions (e.g., statements, agreements) by the same agent.
      score_half: Evidence identifies the agent and target but is ambiguous about
        the specific interaction type, potentially conflating the target interaction
        with other forms of communication.
      score_0: Evidence fails to distinguish the specific interaction type, counting
        any interaction between the agent and target as a valid instance regardless
        of the action performed.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Action Recognition:
    rubric_criteria:
    - name: attribute_resolution
      description: Evidence visually resolves or explicitly describes the specific
        physical attribute (texture, shape, material state, color, or fine-grained
        detail) that an option asserts or denies, rather than merely identifying the
        object or describing the general scene.
      score_1: The specific attribute is visually resolved or explicitly described
        in the evidence.
      score_half: The object is identified, but the specific attribute is only implied
        or described generically.
      score_0: The evidence shows the object or scene but provides no visual or descriptive
        information about the specific attribute in question.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: process_mechanism_resolution
      description: Evidence explicitly describes or visually demonstrates the specific
        dynamic process, mechanism, or causal action (e.g., flow, escape, drainage,
        transformation) occurring within the target material or scene, rather than
        merely identifying the material, its static state, or the general location.
      score_1: The specific process or mechanism asserted by the option is explicitly
        described or visually demonstrated in the evidence.
      score_half: The material or scene is identified, and a related process is implied
        or described generically, but the specific mechanism is not resolved.
      score_0: The evidence shows the material or scene but provides no information
        about the specific dynamic process or mechanism in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: structural_consequence_resolution
      description: Evidence explicitly demonstrates or describes the specific structural
        function, outcome, or consequence (e.g., acting as a conduit, forming a barrier,
        creating a hollow) resulting from a state change or process, rather than merely
        describing the process or the static state itself.
      score_1: The specific structural function or consequence asserted by the option
        is explicitly demonstrated or described in the evidence.
      score_half: The process or static state is described, but the specific functional
        outcome or structural consequence is only implied or not mentioned.
      score_0: The evidence describes the process or state but provides no information
        about the specific structural function or consequence in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: topic_presence_verification
      description: Evidence explicitly confirms the presence or absence of the specific
        topic, concept, or subject matter asserted by an option within the video's
        content, rather than merely showing related scenes, generic actions, or unrelated
        details.
      score_1: The evidence explicitly states or demonstrates that the specific topic
        was discussed (or explicitly states it was not), allowing the option to be
        verified or excluded.
      score_half: The evidence shows related scenes or generic actions that imply
        the topic might be relevant, but does not explicitly confirm the topic was
        discussed or excluded.
      score_0: The evidence shows unrelated content or generic scenes with no explicit
        confirmation of the topic's presence or absence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: set_exhaustiveness
      description: Evidence provides an exhaustive list or explicit confirmation of
        the complete set of items, topics, or entities discussed, allowing options
        asserting 'not mentioned' or 'not included' to be definitively excluded based
        on the absence from the complete set.
      score_1: The evidence explicitly lists all items discussed or states the complete
        set, allowing any option not in the list to be excluded.
      score_half: The evidence lists some items but does not confirm the list is complete
        or explicitly state the absence of other potential items.
      score_0: The evidence mentions only a subset of items or provides no information
        about the completeness of the discussion, making it impossible to verify 'not
        mentioned' claims.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_context_alignment
      description: Evidence is explicitly anchored to the specific event, time window,
        or contextual boundary defined in the query, rather than merely showing the
        topic in a different context, era, or unrelated segment of the video.
      score_1: The evidence explicitly links the topic or action to the specific event/timeframe
        queried, allowing verification or exclusion based on that specific context.
      score_half: The evidence shows the topic or action but the link to the specific
        queried event/timeframe is ambiguous, implied, or potentially from a different
        context.
      score_0: The evidence shows the topic or action in a clearly different context,
        era, or unrelated segment, failing to address the specific event constraints
        of the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_control_resolution
      description: Evidence explicitly identifies the specific agent (e.g., human
        hand, mouse cursor, external device) performing a control action on the target,
        or explicitly demonstrates the absence of such an agent, rather than merely
        showing the target undergoing a state change or event.
      score_1: The specific agent performing the control action is visually resolved
        or explicitly described, allowing verification of 'controlled by others' or
        exclusion of autonomous failure.
      score_half: The action or state change is shown, but the specific agent performing
        it is ambiguous, implied, or not visually resolved.
      score_0: The evidence shows the target undergoing an event or state change but
        provides no information about an external agent or control source.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: interaction_mechanism_resolution
      description: Evidence explicitly resolves the specific interaction mechanism
        (e.g., mouse cursor movement, click events, touch input, keyboard activity)
        occurring on the target interface or device, rather than merely showing the
        static state of the interface or the content displayed on it.
      score_1: The specific interaction mechanism asserted or implied by the option
        is visually resolved or explicitly described in the evidence.
      score_half: The interface or device is shown, and an interaction is implied
        by state changes, but the specific mechanism (e.g., cursor, input) is not
        visually resolved.
      score_0: The evidence shows the interface or device in a static state or with
        content changes but provides no visual or descriptive information about the
        interaction mechanism causing those changes.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: intent_purpose_resolution
      description: Evidence explicitly grounds the specific intent, goal, or purpose
        behind an action or event via on-screen text (signs, notices, lists), dialogue,
        or explicit contextual declarations, rather than merely describing the physical
        mechanics or the occurrence of the action itself.
      score_1: The specific intent or purpose asserted by the option is explicitly
        stated or demonstrated via text, dialogue, or clear contextual markers (e.g.,
        a sign stating the goal).
      score_half: The action is shown, and the intent is implied by context or generic
        cues, but not explicitly confirmed by text or speech.
      score_0: The evidence describes the physical action or event but provides no
        information about the agent's specific intent, goal, or purpose.
      weight: 3.0
      failure_repair_action: refine_query
    - name: structural_separation_resolution
      description: Evidence explicitly demonstrates or describes the specific structural
        separation, disassembly, or fragmentation of the target object (e.g., a vehicle
        splitting, a container breaking open) that constitutes the escape or action
        mechanism, rather than merely showing the object moving, flying, or changing
        state generically.
      score_1: The specific structural separation or disassembly asserted by the option
        is visually resolved or explicitly described.
      score_half: The object is shown moving or changing state, but the specific mechanism
        of separation or disassembly is implied, ambiguous, or not visually resolved.
      score_0: The evidence shows the object in motion or a generic state change but
        provides no visual or descriptive information about a specific structural
        separation or disassembly event.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: stimulus_effect_explicitness
      description: Evidence explicitly states or demonstrates the specific effect,
        outcome, or mechanism resulting from a stimulus (e.g., a song, event, or action)
        asserted by an option, rather than merely mentioning the stimulus, describing
        generic reactions, or implying a vague impact.
      score_1: The specific effect or mechanism of the stimulus is explicitly stated
        or demonstrated in the evidence.
      score_half: The stimulus is mentioned and a generic reaction or vague impact
        is implied, but the specific effect asserted by the option is not explicitly
        defined.
      score_0: The evidence mentions the stimulus or shows unrelated content but provides
        no information about the specific effect or mechanism in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: literal_vs_metaphorical_grounding
      description: Evidence distinguishes between literal demonstrations of an abstract
        effect (e.g., actual transformation, transport, or emotional shift) and mere
        metaphorical, hypothetical, or denied references to that effect in dialogue
        or narration.
      score_1: The evidence explicitly demonstrates the abstract effect literally
        (visually or via confirmed fact) or explicitly confirms the metaphor as a
        literal reality within the video's context.
      score_half: The evidence contains dialogue or narration mentioning the abstract
        effect, but it is presented as a metaphor, a hypothetical scenario, a joke,
        or is explicitly denied, leaving the literal occurrence unverified.
      score_0: The evidence mentions the abstract concept only in a generic, unrelated,
        or purely metaphorical way with no visual or factual confirmation of the effect
        occurring.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_category_resolution
      description: Evidence explicitly resolves the specific high-level activity or
        action category (e.g., filming, fighting, watching, saving) performed by the
        agents, distinguishing it from other plausible activities involving the same
        entities, rather than merely showing the agents in a scene or performing generic
        movements that could be interpreted as multiple activities.
      score_1: The specific action category asserted by the option is explicitly demonstrated
        or described, allowing it to be verified or excluded based on the distinct
        nature of the activity.
      score_half: The agents and scene are shown, and an activity is implied, but
        the specific action category is ambiguous or could be confused with other
        plausible activities.
      score_0: The evidence shows the agents or scene but provides no information
        about the specific high-level activity being performed, making it impossible
        to distinguish between the options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: production_context_grounding
      description: Evidence explicitly grounds the action within a production, performance,
        or meta-context (e.g., filming, rehearsing, storyboarding, acting) via artifacts
        like cameras, clapperboards, directors, scripts, or stage setups, rather than
        merely describing the narrative content or fictional events depicted within
        that context.
      score_1: The evidence explicitly shows production artifacts or meta-contextual
        cues that verify the action is a performance/production, allowing options
        describing the fictional narrative as literal reality to be excluded.
      score_half: The evidence shows the narrative content or generic performance
        cues, but lacks explicit production artifacts to definitively distinguish
        the act of producing from the fictional event itself.
      score_0: The evidence describes only the narrative content or fictional events
        without any indication of a production context, making it impossible to verify
        'filming' or 'acting' options against literal narrative options.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_event_resolution
      description: Evidence explicitly demonstrates the specific physical interaction,
        impact, or causal event (e.g., collision, strike, fall, contact) that directly
        results in the outcome or state change asserted by an option, rather than
        merely showing the presence of the causal agent, the context, or the outcome
        itself.
      score_1: The specific physical interaction or causal event asserted by the option
        is visually resolved or explicitly described, allowing the mechanism of the
        outcome to be verified or excluded.
      score_half: The causal agent or context is shown, and the outcome is implied,
        but the specific physical interaction or event causing the outcome is not
        visually resolved or is ambiguous.
      score_0: The evidence shows the causal agent, the context, or the outcome, but
        provides no visual or descriptive information about the specific physical
        interaction or event that links them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_spatial_resolution
      description: Evidence explicitly resolves the specific spatial relationship,
        relative position, or alignment between two or more distinct entities (e.g.,
        same side, opposite sides, adjacent, separated) asserted by an option, rather
        than merely identifying the location of individual entities or describing
        the scene generically.
      score_1: The specific spatial relationship or relative positioning between the
        entities is explicitly demonstrated or described, allowing the option to be
        verified or excluded.
      score_half: The locations of individual entities are shown or mentioned, but
        the specific relationship between them (e.g., whether they are on the same
        or different sides) is ambiguous, implied, or not explicitly resolved.
      score_0: The evidence shows the entities or the scene but provides no information
        about their relative positions or spatial relationship to one another.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: superlative_frequency_grounding
      description: Evidence explicitly grounds the frequency, count, or comparative
        ranking required to verify superlative or frequency-based options (e.g., 'mostly',
        'most', 'always', 'never'), rather than merely citing a single instance, a
        historical occurrence, or a generic possibility.
      score_1: The evidence explicitly states the frequency, count, or comparative
        ranking that verifies the superlative claim or allows the exclusion of options
        with lower frequency.
      score_half: The evidence mentions the event or concept occurring, but only as
        a single instance, a vague historical reference, or without comparative data,
        making it impossible to verify the superlative/frequency claim.
      score_0: The evidence provides no information about the frequency or comparative
        ranking of the event, or only mentions unrelated instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: mechanic_activation_resolution
      description: Evidence explicitly resolves the specific activation of a game
        mechanic, ability, or item (e.g., casting a spell, using a teleport, activating
        an ultimate) by an agent, rather than merely showing the agent's presence,
        the availability of the ability, or the resulting state change without the
        activation event.
      score_1: The specific mechanic activation asserted by the option is visually
        resolved (e.g., animation, icon usage) or explicitly described in the evidence.
      score_half: The agent and the ability are present or mentioned, but the specific
        moment of activation or the link between the activation and the outcome is
        ambiguous or implied.
      score_0: The evidence shows the agent or the outcome but provides no visual
        or descriptive information about the specific mechanic or ability being activated.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: turn_outcome_resolution
      description: Evidence explicitly captures the resolution of a specific turn,
        phase, or sequential slot, confirming whether the target action was performed
        or omitted, rather than merely showing the start of the turn, the agents'
        presence, or the context without the final decision/outcome.
      score_1: The evidence explicitly shows the turn ending with the action performed
        or the turn passing without the action, allowing verification of 'did' or
        'did not' options.
      score_half: The evidence shows the turn in progress or the agents preparing,
        but the final outcome (action taken vs. skipped) is ambiguous or cut off before
        resolution.
      score_0: The evidence shows the context or start of the turn but provides no
        information about the final decision or outcome of that specific sequential
        slot.
      weight: 3.0
      failure_repair_action: refine_query
    - name: game_statistic_resolution
      description: Evidence explicitly resolves the specific quantitative outcome,
        statistic, or game result (e.g., final score, record broken, specific count
        of rebounds, shutout status) asserted by an option, rather than merely describing
        the game context, player effort, or generic play.
      score_1: The specific statistic, count, or game result asserted by the option
        is explicitly stated or visually demonstrated (e.g., scoreboard, commentary
        confirming the stat).
      score_half: The game context and player actions are shown, and a generic outcome
        is implied, but the specific statistic or result required to verify the option
        is not explicitly resolved.
      score_0: The evidence shows the game or player but provides no information about
        the specific quantitative outcome, statistic, or result in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_sequence_resolution
      description: Evidence explicitly resolves the specific temporal order or sequence
        of two or more distinct events (e.g., Event A followed by Event B) required
        to verify or exclude options that hinge on the outcome of a specific preceding
        action, rather than merely showing the events in isolation or in an ambiguous
        order.
      score_1: The evidence explicitly demonstrates the specific sequence (e.g., the
        trigger event occurring immediately before the outcome event), allowing the
        option to be verified or excluded based on the order.
      score_half: The evidence shows the relevant events but the specific temporal
        order or the link between the trigger and the outcome is ambiguous, implied,
        or potentially from different segments.
      score_0: The evidence shows the events in isolation or in a different order,
        failing to establish the specific sequence required by the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_instance_verification
      description: Evidence explicitly covers the timeline or sequence of events required
        to verify or exclude options that depend on a specific ordinal instance (e.g.,
        'first', 'second', 'last', 'only') of an action, rather than merely showing
        an instance of the action without confirming its position in the sequence.
      score_1: The evidence explicitly demonstrates the sequence of all relevant instances
        up to the queried ordinal, allowing the specific instance (e.g., the first
        one) to be identified and its outcome verified or excluded.
      score_half: The evidence shows an instance of the action and its outcome, but
        does not provide sufficient temporal coverage to confirm it is the specific
        ordinal instance (e.g., the first) or to rule out prior instances.
      score_0: The evidence shows an instance of the action but provides no information
        about the sequence or prior occurrences, making it impossible to verify ordinal
        constraints.
      weight: 3.0
      failure_repair_action: refine_query
    - name: statistic_as_identifier_resolution
      description: Evidence explicitly states the specific quantitative value (e.g.,
        percentage, score, count) that serves as the unique identifier or key condition
        for the target entity or event, allowing the specific game mode, context,
        or option to be verified, rather than merely showing generic statistics, unrelated
        numbers, or the game context without the specific identifying value.
      score_1: The specific quantitative value required to identify the target or
        verify the context is explicitly stated and linked to the relevant event or
        game mode.
      score_half: The evidence mentions statistics or numbers, but the specific value
        required to identify the target is missing, ambiguous, or not linked to the
        specific game mode/context in question.
      score_0: The evidence shows the game context or generic statistics but provides
        no specific quantitative value that serves as the key identifier for the target
        entity or event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_mechanism_binding
      description: Evidence explicitly links a specific quantitative outcome, statistic,
        or result to the specific game mechanic, challenge, or activity that produced
        it, rather than merely showing the statistic and the activity in the same
        video segment without establishing the causal or contextual link between them.
      score_1: The evidence explicitly states or demonstrates that the specific statistic/outcome
        is the direct result of the specific game mechanic or challenge asserted by
        the option.
      score_half: The evidence shows both the statistic and the game mechanic, but
        the link between them is ambiguous, implied, or potentially refers to different
        events/players.
      score_0: The evidence shows the statistic and the game mechanic in isolation,
        or links them to different events, making it impossible to verify that the
        specific outcome resulted from the specific activity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: statistic_context_binding
      description: Evidence explicitly links a specific quantitative value, statistic,
        or fact to the specific scenario, challenge, or game mode asserted by the
        option, rather than merely mentioning the statistic in a different context
        or the scenario without the specific statistic.
      score_1: The evidence explicitly states or demonstrates that the specific statistic/fact
        is the one associated with the specific scenario/challenge queried.
      score_half: The evidence mentions the statistic and the scenario, but the link
        between them is ambiguous, implied, or potentially refers to different events/contexts.
      score_0: The evidence mentions the statistic in a different context, or the
        scenario without the specific statistic, failing to establish the required
        association.
      weight: 3.0
      failure_repair_action: refine_query
    - name: segment_identity_resolution
      description: Evidence explicitly identifies the specific segment, episode, named
        context, or distinct video section (e.g., 'Guess Nash', 'Episode 3', 'Part
        2') required to disambiguate between multiple similar events or to perform
        cross-segment comparisons, rather than merely showing generic content that
        could belong to any segment.
      score_1: The specific segment or named context is explicitly identified (via
        text, dialogue, or clear visual markers), allowing the user to distinguish
        it from other segments and map ordinal instances or comparisons correctly.
      score_half: The content is shown, and the segment is implied by context or generic
        cues, but the specific name or identity required to distinguish it from other
        similar segments is not explicitly confirmed.
      score_0: The evidence shows the content but provides no information about the
        specific segment, episode, or named context, making it impossible to distinguish
        between multiple similar events or perform cross-segment comparisons.
      weight: 3.0
      failure_repair_action: refine_query
    - name: match_state_termination_grounding
      description: Evidence explicitly confirms that the specific event or turn shown
        constitutes the final, match-ending moment (e.g., 'match point', 'game winner',
        'final set') via explicit commentary, on-screen text, or definitive visual
        cues, rather than merely showing a point being scored or a celebration that
        could occur at any stage of the match.
      score_1: The evidence explicitly states or demonstrates that the specific event
        is the match-ending moment, allowing verification of 'win the match' or exclusion
        of options describing non-terminal events.
      score_half: The evidence shows a point being won and a celebration, but the
        specific status of the event as the 'match point' or final moment is implied,
        ambiguous, or not explicitly confirmed.
      score_0: The evidence shows a rally or point but provides no information confirming
        whether it is the final point of the match or just a regular point in the
        sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ritual_sequence_verification
      description: Evidence explicitly confirms the occurrence, order, or specific
        components of a formal ritual, ceremony, or protocol sequence (e.g., national
        anthems, coin toss, handshakes, specific dance routines) asserted by an option,
        rather than merely showing generic pre-event gathering, crowd atmosphere,
        or unrelated performance elements.
      score_1: The specific ritual steps, their order, or the explicit mention of
        the ceremony (e.g., 'anthems', 'coin toss') is clearly demonstrated or stated,
        allowing verification or exclusion of options describing the ritual.
      score_half: The evidence shows a formal gathering or performance elements (e.g.,
        music, dancing) but does not explicitly confirm the specific ritual protocol
        or its sequence, leaving the option ambiguous.
      score_0: The evidence shows generic pre-event activity, crowd scenes, or unrelated
        performances without any confirmation of the specific ritual or protocol sequence
        in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_demonstration_vs_reference
      description: Evidence explicitly demonstrates the specific action or performance
        being performed (visual execution of the activity) rather than merely referencing,
        discussing, or describing the action in dialogue, narration, or static context.
      score_1: The specific action asserted by the option is visually demonstrated
        or performed in the evidence.
      score_half: The action is mentioned, described, or implied in dialogue or context,
        but the actual performance or execution is not visually shown.
      score_0: The evidence contains no reference to the action, or only unrelated
        content is shown.
      weight: 3.0
      failure_repair_action: refine_query
    - name: contact_point_resolution
      description: Evidence explicitly resolves the specific physical contact point,
        attachment method, or grip location (e.g., head, tail, handle, rope attachment)
        used by an agent to perform an action on a target, rather than merely showing
        the agent interacting with the target generically or the target moving without
        a resolved contact point.
      score_1: The specific contact point, attachment method, or grip location asserted
        by the option is visually resolved or explicitly described in the evidence.
      score_half: The agent is shown interacting with the target, but the specific
        contact point or attachment method is ambiguous, implied, or not visually
        resolved.
      score_0: The evidence shows the agent and target but provides no visual or descriptive
        information about the specific point of contact or attachment method used.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: temporal_scope_for_absence
      description: Evidence spans the complete relevant time window or explicitly
        confirms the absence of the target action across the entire video duration,
        rather than showing only a subset of segments where the action might be missing
        but could exist in unobserved gaps.
      score_1: The evidence covers the full duration of the relevant event or explicitly
        states that the action does not occur at any point, allowing 'absent' options
        to be definitively verified.
      score_half: The evidence covers a significant portion of the video but leaves
        gaps in the timeline where the action could potentially occur, making the
        'absent' claim unverified.
      score_0: The evidence covers only a small fragment of the video, providing no
        basis to claim the action is absent from the entire sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: conjunctive_claim_verification
      description: Evidence explicitly confirms the occurrence of every distinct component
        asserted in a conjunctive option (e.g., 'all of the above', 'both X and Y')
        or explicitly demonstrates the absence of at least one component to exclude
        the option, rather than merely showing some components and implying the rest.
      score_1: The evidence explicitly shows all required components occurring or
        explicitly shows at least one component failing to occur, allowing the conjunctive
        option to be verified or excluded.
      score_half: The evidence shows some components of the conjunctive option but
        leaves the status of others ambiguous, implied, or unobserved, making it impossible
        to verify or exclude the 'all' claim.
      score_0: The evidence shows only a subset of the components or provides no information
        about the other components, failing to address the conjunctive nature of the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_boundary_resolution
      description: Evidence explicitly resolves the specific start or end boundary
        of the reference event (e.g., performance, match, ceremony) required to verify
        or exclude options asserting actions occurring 'before', 'after', or 'during'
        that event, rather than merely showing the event in progress or actions occurring
        in an ambiguous temporal relation to the event's lifecycle.
      score_1: The evidence explicitly demonstrates or states the specific moment
        the reference event begins or ends, allowing actions to be definitively classified
        as occurring before, during, or after.
      score_half: The evidence shows the event and related actions, but the specific
        start or end boundary is ambiguous, implied, or not explicitly resolved, making
        the temporal classification of the action uncertain.
      score_0: The evidence shows the event or actions but provides no information
        about the event's boundaries, making it impossible to verify temporal constraints
        like 'after' or 'before'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_action_binding
      description: Evidence explicitly links the specific agent queried to the performance
        of the specific action asserted by the option, rather than merely showing
        the action being performed by an unidentified or different agent, or showing
        the agent in a passive role (e.g., watching, discussing) relative to the action.
      score_1: The evidence explicitly demonstrates or states that the specific queried
        agent performed the specific action (e.g., via visual confirmation of the
        agent executing the act, or the agent explicitly claiming 'I did X').
      score_half: The evidence shows the action being performed and the agent present,
        but the link between the specific agent and the specific action is ambiguous,
        implied, or the agent is shown only observing or discussing the act.
      score_0: The evidence shows the action performed by a different or unidentified
        agent, or shows the queried agent in a context unrelated to performing the
        specific action, failing to verify the agent's participation.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_naming_explicitness
      description: Evidence explicitly states or displays the specific name, title,
        or technical term of the action or performance asserted by an option (e.g.,
        via on-screen text, dialogue, or narration), rather than merely showing the
        visual execution of the action which might be ambiguous or generic.
      score_1: The specific name or technical term of the action is explicitly stated
        or displayed in the evidence, allowing the option to be verified or excluded
        based on the label.
      score_half: The action is visually demonstrated, but the specific name or technical
        term is not explicitly stated or displayed, leaving the option ambiguous if
        multiple similar actions exist.
      score_0: The evidence shows the action or related context but provides no explicit
        name, title, or technical term for the specific performance in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: component_configuration_resolution
      description: Evidence explicitly resolves the specific configuration, subset,
        or arrangement of components of a multi-part object (e.g., which specific
        parts of a headset, tool, or vehicle are present, active, or attached to the
        target) rather than merely identifying the object as a whole or describing
        its general state.
      score_1: The specific configuration or subset of components asserted by the
        option (e.g., 'left only', 'both', 'none') is visually resolved or explicitly
        described, allowing verification or exclusion.
      score_half: The object is identified, and some components are visible, but the
        specific configuration (e.g., distinguishing 'left only' from 'both') is ambiguous,
        implied, or not fully resolved.
      score_0: The evidence shows the object or scene but provides no visual or descriptive
        information about the specific arrangement or subset of components in question.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: temporal_adjacency_verification
      description: Evidence explicitly covers the continuous time interval between
        a reference event and a target event, confirming that the target event occurs
        immediately after the reference event without intervening significant actions
        or gaps, rather than merely showing that the target event occurred at some
        point after the reference event.
      score_1: The evidence spans the transition from the reference event to the target
        event, explicitly showing the immediate succession or confirming no intervening
        events occurred.
      score_half: The evidence shows both the reference and target events in the correct
        order, but leaves a temporal gap or ambiguity about whether other events occurred
        in between, failing to verify 'immediately'.
      score_0: The evidence shows the events in isolation or with a clear gap, making
        it impossible to verify that the target event followed the reference event
        immediately.
      weight: 3.0
      failure_repair_action: refine_query
    - name: challenge_completion_status_verification
      description: Evidence explicitly confirms the resolution of a specific challenge,
        task, or conditional goal (e.g., 'beat the challenge', 'failed', 'completed',
        'did not finish') by demonstrating the satisfaction or failure of the specific
        winning/losing conditions, rather than merely showing the rules, the attempt,
        or the context of the challenge.
      score_1: The evidence explicitly states or demonstrates that the specific challenge
        was completed (or failed) by meeting (or failing to meet) the defined conditions.
      score_half: The evidence shows the challenge rules, the attempt, or the context,
        but the final status (success/failure) is implied, ambiguous, or not explicitly
        confirmed.
      score_0: The evidence shows only the rules, the setup, or unrelated content,
        providing no information about whether the challenge was completed or failed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: predation_target_resolution
      description: Evidence explicitly resolves the specific prey species or target
        entity being hunted, caught, or consumed by a predator, rather than merely
        showing the predator eating an unidentified animal, a different prey species,
        or the predator in a generic hunting context.
      score_1: The specific prey species or target entity asserted by the option is
        visually resolved or explicitly identified as the object of the predation
        event.
      score_half: The predator is shown hunting or eating, but the specific prey species
        is ambiguous, unidentified, or clearly a different species than the one asserted.
      score_0: The evidence shows the predator or a hunting context but provides no
        visual or descriptive information about the specific prey being targeted or
        consumed.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: behavioral_outcome_resolution
      description: Evidence explicitly resolves the specific behavioral response,
        social dynamic, or interaction outcome (e.g., submission, aggression, escape,
        play) asserted by an option, rather than merely showing the agents present,
        the context of the encounter, or generic movements that could imply multiple
        outcomes.
      score_1: The specific behavioral response or social outcome asserted by the
        option is explicitly demonstrated or described, allowing verification or exclusion
        based on the distinct nature of the interaction.
      score_half: The agents and context are shown, and an interaction is implied,
        but the specific behavioral outcome (e.g., whether it was submission or a
        fight) is ambiguous or could be interpreted as multiple plausible responses.
      score_0: The evidence shows the agents or the encounter context but provides
        no information about the specific behavioral response or social outcome, making
        it impossible to distinguish between options like 'submit', 'fight', or 'escape'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: interaction_resolution_verification
      description: Evidence explicitly captures the final state, conclusion, or resolution
        of a dynamic interaction or encounter (e.g., the end of a fight, the result
        of a chase, the outcome of a negotiation), rather than merely showing the
        process, the start, or an intermediate stage of the interaction.
      score_1: The evidence explicitly demonstrates or states the final outcome or
        resolution of the interaction, allowing the specific result (e.g., submission,
        victory, escape) to be verified or excluded.
      score_half: The evidence shows the interaction in progress or an intermediate
        stage, but the final resolution or outcome is ambiguous, cut off, or not explicitly
        confirmed.
      score_0: The evidence shows only the start or a fragment of the interaction
        without any information about how the encounter concluded or what the final
        state was.
      weight: 3.0
      failure_repair_action: refine_query
    - name: tournament_phase_resolution
      description: Evidence explicitly identifies the specific tournament phase, round,
        or structural stage (e.g., 'Round of 16', 'Quarter Finals', 'Semi Finals')
        via on-screen graphics, brackets, or commentary, rather than merely showing
        generic gameplay that could belong to any stage of the competition.
      score_1: The specific tournament phase or round asserted by the query is explicitly
        identified (e.g., via bracket graphics or explicit text), allowing the event
        to be anchored to the correct stage.
      score_half: The evidence shows gameplay or tournament context, but the specific
        phase or round is ambiguous, implied, or not explicitly labeled, making it
        impossible to distinguish between different stages.
      score_0: The evidence shows generic gameplay or unrelated content with no indication
        of the specific tournament phase or round, failing to address the structural
        constraints of the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: terminal_state_resolution
      description: Evidence explicitly demonstrates or describes the final physical
        state, condition, or status of the target entity (e.g., dead, alive, injured,
        transformed, unconscious) at the conclusion of the relevant sequence, rather
        than merely showing the preceding actions, the conflict, or an intermediate
        state.
      score_1: The specific final state asserted by the option is visually resolved
        or explicitly described in the evidence (e.g., the character is shown motionless/dead,
        or explicitly stated to be alive).
      score_half: The evidence shows the sequence leading up to the conclusion or
        an intermediate state, but the specific final physical state of the entity
        is ambiguous, cut off, or not explicitly confirmed.
      score_0: The evidence shows only the context, the conflict, or early stages
        of the event, providing no information about the final physical state of the
        target entity.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  OCR Problems:
    rubric_criteria:
    - name: concept_labeling
      description: Evidence explicitly contains the specific textual label, on-screen
        title, or named entity corresponding to the option's concept, rather than
        just a visual representation or generic description.
      score_1: The specific concept name or label is explicitly visible as text or
        clearly stated in narration.
      score_half: The concept is visually represented or described generically, but
        the specific label/name is absent.
      score_0: No visual or textual evidence links the scene to the specific concept
        name.
      weight: 3.0
      failure_repair_action: refine_query
    - name: option_space_exhaustiveness
      description: For questions requiring the identification of an absent or excluded
        item, evidence must explicitly address the presence or absence of every option's
        specific concept, rather than only a subset.
      score_1: Evidence explicitly confirms the presence of all described options
        or confirms the absence of the target option, allowing all distractors to
        be ruled out.
      score_half: Evidence addresses most options but leaves at least one option's
        status (present/absent) unverified.
      score_0: Evidence addresses only a subset of options, leaving the status of
        others unknown and preventing a definitive exclusion.
      weight: 4.0
      failure_repair_action: refine_query
    - name: identifier_metadata_explicitness
      description: Evidence explicitly contains the specific identifier (e.g., episode
        code, timestamp, date, version number) required to distinguish between options,
        rather than just the generic event or entity.
      score_1: The specific identifier matching the option is explicitly visible as
        on-screen text or clearly stated in narration.
      score_half: The event is identified, but the specific distinguishing identifier
        is absent or ambiguous.
      score_0: No evidence links the event to the specific identifier required to
        verify or exclude the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: event_identifier_binding
      description: Evidence explicitly links the specific event or state change described
        in the option to the specific identifier (e.g., episode, timestamp, date)
        required to distinguish it, rather than presenting the event and the identifier
        in separate, unconnected contexts.
      score_1: The specific event and the distinguishing identifier are explicitly
        co-located or linked in the evidence, confirming the event occurs in that
        specific context.
      score_half: The event and the identifier are present in the evidence but not
        explicitly linked or co-located, leaving ambiguity about whether the event
        belongs to that specific context.
      score_0: Either the event or the identifier is missing, or they are presented
        in a way that prevents linking the specific event to the specific context.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_event_binding
      description: Evidence explicitly links the specific ordinal identifier (e.g.,
        'first', 'second', 'last', 'final') required by the option to the specific
        event instance, rather than presenting the ordinal and the event in separate
        or unconnected contexts.
      score_1: The specific ordinal identifier and the event it describes are explicitly
        co-located or linked in the evidence (e.g., 'second round' explicitly tied
        to a specific jump result).
      score_half: The ordinal identifier and the event are present in the evidence
        but not explicitly linked, leaving ambiguity about which instance the ordinal
        refers to.
      score_0: The specific ordinal identifier is missing, or the evidence fails to
        link the ordinal to the specific event instance required to verify or exclude
        the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: status_event_binding
      description: Evidence explicitly links the specific dynamic status, rank, or
        role (e.g., 'silver medalist', 'leader', 'winner') required by the option
        to the specific event instance or time window, rather than presenting the
        status and the event in separate or unconnected contexts.
      score_1: The specific status/rank and the event instance are explicitly co-located
        or linked in the evidence, confirming the entity holds that status during
        that specific event.
      score_half: The status and the event are present in the evidence but not explicitly
        linked, leaving ambiguity about whether the entity held that status during
        the specific event instance.
      score_0: The specific status is missing, or the evidence fails to link the status
        to the specific event instance required to verify or exclude the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: superlative_grounding
      description: Evidence explicitly grounds the superlative or comparative claim
        (e.g., 'best', 'highest', 'most', 'worst') by providing the necessary comparison
        across the relevant set of instances, rather than merely describing a single
        instance or a static status.
      score_1: Evidence explicitly states or provides data allowing the determination
        of which specific instance satisfies the superlative/comparative condition
        relative to all other relevant instances.
      score_half: Evidence describes the superlative status or individual instances
        but lacks the explicit comparative link or data needed to definitively identify
        the specific instance that satisfies the condition.
      score_0: Evidence describes only a single instance or a static status without
        any comparative context or data to verify the superlative claim against other
        options.
      weight: 4.0
      failure_repair_action: refine_query
    - name: ordinal_quantitative_binding
      description: Evidence explicitly links the specific ordinal or temporal qualifier
        (e.g., 'first', 'second', 'initial') to the specific quantitative value (e.g.,
        height, score, time) required by the option, rather than linking the qualifier
        to a generic event or a different value.
      score_1: The specific ordinal/temporal qualifier and the specific quantitative
        value are explicitly co-located or linked in the evidence (e.g., 'first attempt
        at 5.60m').
      score_half: The ordinal/temporal qualifier and a quantitative value are present,
        but the link between the specific qualifier and the specific value is ambiguous
        or missing (e.g., 'first attempt' mentioned separately from '5.60m', or 'first
        attempt at 5.85m' for a different entity).
      score_0: The specific ordinal/temporal qualifier is missing, or the evidence
        fails to link the qualifier to the specific quantitative value required to
        verify or exclude the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: temporal_boundary_explicitness
      description: Evidence explicitly captures the state, value, or event at the
        specific temporal boundary (e.g., 'half-time', 'end of game', 'start of round')
        required by the query, rather than only providing evidence from the intervals
        immediately preceding or following that boundary.
      score_1: The evidence explicitly shows the state or value at the exact temporal
        boundary (e.g., a scoreboard labeled 'HALF TIME' or a clock reading '00:00'
        with the final state visible).
      score_half: Evidence shows the state in the interval immediately before or after
        the boundary, but the state at the exact boundary moment is not explicitly
        captured or is ambiguous.
      score_0: Evidence only covers intervals far from the boundary or fails to link
        any state to the specific temporal boundary required.
      weight: 4.0
      failure_repair_action: refine_query
    - name: cumulative_value_event_binding
      description: Evidence explicitly links a cumulative or running quantitative
        value (e.g., total calories, score, distance) to the specific event instance
        or state change required by the query, rather than presenting the value and
        the event in separate, unconnected contexts or linking the value to a different
        time point.
      score_1: The specific cumulative value and the specific event instance are explicitly
        co-located or linked in the evidence, confirming the value represents the
        state at that exact event.
      score_half: The cumulative value and the event are present in the evidence,
        but the link between the specific value and the specific event instance is
        ambiguous or missing (e.g., the value is shown for a different time, or the
        event is shown without the specific running total).
      score_0: The specific cumulative value is missing, or the evidence fails to
        link the value to the specific event instance required to verify or exclude
        the option.
      weight: 4.0
      failure_repair_action: refine_query
    - name: concurrent_state_binding
      description: Evidence explicitly captures the state, value, or status of the
        target entity at the exact moment a specific concurrent event or action (described
        in the query) is occurring, rather than presenting the state and the concurrent
        event in separate, unconnected temporal contexts.
      score_1: The specific state/value of the target entity and the concurrent event/action
        are explicitly co-located in the evidence (e.g., a counter visible while the
        other team eats), confirming the state holds at that exact moment.
      score_half: The state/value and the concurrent event are present in the evidence
        but not explicitly linked in time (e.g., the count is shown in a different
        scene or time than the concurrent event), leaving ambiguity about the state
        at the specific moment.
      score_0: The evidence fails to link the target entity's state to the specific
        moment the concurrent event occurs, or the concurrent event is missing entirely.
      weight: 4.0
      failure_repair_action: refine_query
    - name: perspective_entity_binding
      description: Evidence explicitly links a perspective-based or attribution-based
        reference (e.g., 'the team I support', 'the winner', 'the loser', 'our team')
        to a specific concrete entity (e.g., a named team, a jersey color, a specific
        player) required to verify or exclude the option, rather than leaving the
        reference ambiguous or unlinked.
      score_1: The perspective-based reference is explicitly linked to a specific
        concrete entity in the evidence (e.g., narration states 'our team' is the
        'visitors' or 'Team X').
      score_half: The perspective-based reference and a concrete entity are present,
        but the explicit link between them is missing or ambiguous (e.g., 'our team'
        is mentioned, but it is unclear which of the two teams on court is meant).
      score_0: The perspective-based reference is missing, or the evidence fails to
        link it to any specific entity, making it impossible to determine which entity
        the option refers to.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Spatial Reasoning:
    rubric_criteria:
    - name: status_change_verification
      description: Evidence explicitly demonstrates the specific condition, action,
        or state change that triggers a rule exception, status shift, or conditional
        outcome asserted in the options, rather than just stating the general rule
        or the final outcome.
      score_1: The evidence clearly shows the specific trigger (e.g., fortification,
        storage of weapons) that changes the entity's status or validates the exception
        to a general rule.
      score_half: The evidence mentions the general rule or the final status but the
        specific triggering condition is implied or missing.
      score_0: The evidence only states the general rule or shows the entity in its
        default state, with no indication of the condition required to change that
        status.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relational_attribute_grounding
      description: Evidence explicitly confirms the specific relational attribute
        (e.g., kinship, ownership, role, or affiliation) between entities asserted
        in the options, rather than merely identifying the entities or the action
        performed.
      score_1: The specific relationship (e.g., 'father', 'neighbor', 'owner') required
        to distinguish options is explicitly stated or visually confirmed.
      score_half: The entities and action are identified, but the specific relationship
        is implied, ambiguous, or not explicitly stated.
      score_0: The relationship is entirely absent or contradicted by the evidence,
        making it impossible to distinguish between options differing only by this
        attribute.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_disambiguation
      description: Evidence explicitly resolves the specific attribute (e.g., quantity,
        color, model, material) that differentiates the options, rather than merely
        identifying the general category of the object or event.
      score_1: The specific attribute (e.g., 'one shoe' vs 'two shoes', 'red' vs 'blue')
        required to distinguish between options is explicitly stated or visually confirmed.
      score_half: The general category is identified, but the specific differentiating
        attribute is implied, ambiguous, or not explicitly resolved.
      score_0: The evidence only identifies the general category or is missing the
        attribute entirely, making it impossible to distinguish between options differing
        by this attribute.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_rationale_grounding
      description: Evidence explicitly states or demonstrates the specific reason,
        strategy, rule, or intent that causes the spatial configuration, arrangement,
        or action asserted in the options, rather than merely showing the configuration
        or the outcome.
      score_1: The specific causal mechanism or strategic rationale (e.g., 'to avoid
        blocking', 'based on height', 'for safety') required to verify the option
        is explicitly stated or clearly demonstrated.
      score_half: The configuration is shown, and a general reason is implied or partially
        stated, but the specific rationale distinguishing the options is ambiguous
        or missing.
      score_0: Only the spatial configuration or the event outcome is shown; the reason
        or intent behind the arrangement is entirely absent.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_spatial_rate_grounding
      description: Evidence explicitly provides the rate, pace, or temporal-spatial
        mapping (e.g., distance per unit time, time per unit distance) required to
        verify or exclude options that depend on converting between time and distance,
        rather than merely stating isolated time or distance values.
      score_1: The specific rate or mapping (e.g., '1000m in 4 minutes', 'pace of
        X') needed to calculate the queried value is explicitly stated or visually
        confirmed.
      score_half: Isolated time and distance values are present, but the specific
        rate or mapping linking them is implied, ambiguous, or missing, preventing
        accurate calculation.
      score_0: Only isolated time or distance values are present with no indication
        of the rate or relationship between them, making it impossible to verify the
        option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: landmark_identification
      description: Evidence explicitly identifies the specific named landmark, unique
        geographic feature, or distinct location required to verify or exclude location-based
        options, rather than merely describing generic visual attributes (e.g., 'stone
        steps', 'plaza') that could apply to multiple locations.
      score_1: The specific landmark or unique location (e.g., 'Spanish Steps', 'Eiffel
        Tower') is explicitly named or visually resolved to a unique entity that distinguishes
        the correct location from all others.
      score_half: The scene is described with specific visual details, but the unique
        landmark is not explicitly named or identified, leaving ambiguity between
        multiple possible locations.
      score_0: Only generic scene attributes (e.g., 'stairs', 'crowd', 'building')
        are present with no unique identifiers, making it impossible to distinguish
        between location options.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Spatial Perception:
    rubric_criteria:
    - name: joint_visual_co_presence
      description: Evidence shows the target entities simultaneously within the same
        visual frame or continuous shot, enabling direct observation of their relative
        spatial relationship (e.g., facing direction, distance, alignment) rather
        than inferring it from separate, disjointed appearances.
      score_1: The target entities are visible together in the same frame/shot, allowing
        direct verification of their relative spatial configuration.
      score_half: The entities appear in the same scene or sequence but are never
        shown simultaneously in a single frame, requiring inference of their relative
        positions.
      score_0: The entities appear only in separate, disjointed shots or scenes with
        no visual overlap, making relative spatial verification impossible.
      weight: 4.0
      failure_repair_action: refine_query
    - name: facing_direction_resolution
      description: Evidence explicitly resolves the facing direction or body orientation
        of the target entities relative to each other or the camera, rather than merely
        confirming their presence or describing unrelated actions.
      score_1: The evidence explicitly describes the orientation (e.g., facing forward,
        looking left, back turned) of the target entities, allowing direct verification
        of their relative spatial configuration.
      score_half: The evidence shows the entities but their specific facing direction
        is ambiguous, implied, or not described, requiring inference.
      score_0: The evidence mentions the entities or their actions but provides no
        information about their body orientation or facing direction.
      weight: 4.0
      failure_repair_action: refine_query
    - name: explicit_spatial_intent
      description: Evidence explicitly states the intended spatial placement, location,
        or arrangement of the target object relative to other entities, rather than
        relying solely on visual inference from the current state or generic scene
        context.
      score_1: The evidence contains a direct assertion (verbal or text) specifying
        exactly where the target object will be placed or is located relative to other
        entities.
      score_half: The evidence implies a location through context or partial description
        but lacks a definitive statement of the specific spatial relationship required
        to verify the option.
      score_0: The evidence shows the object or related actions but provides no information
        about its intended or actual spatial placement relative to other entities.
      weight: 4.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
