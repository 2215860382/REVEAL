      score_1: The specific magnitude or degree (e.g., 'large', 'small', 'tight')
        asserted in the option is explicitly stated or directly demonstrated by the
        numerical gap in the evidence.
      score_half: The raw numerical values are present, allowing the magnitude to
        be inferred, but the explicit characterization of the degree (e.g., 'large
        margin') is missing or ambiguous.
      score_0: The evidence lacks the specific numerical values or the explicit characterization
        of the magnitude required to verify the degree of the difference asserted
        in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sub_component_outcome_verification
      description: Evidence explicitly provides the specific outcome, result, or state
        for every distinct sub-component (e.g., each set, round, stage, or phase)
        of a composite event required to verify a claim about the entire sequence
        or the consistency of results across those components, rather than merely
        providing the final aggregate result or evidence for only a subset of the
        components.
      score_1: The evidence explicitly states or demonstrates the outcome for every
        sub-component (e.g., score of every set) required to verify the claim about
        the sequence or consistency.
      score_half: The evidence provides the outcome for the final aggregate or some
        sub-components, but lacks explicit confirmation of the outcome for at least
        one required sub-component, leaving the claim about 'each' or the full sequence
        unverified.
      score_0: The evidence provides only the final result or evidence for a single
        sub-component, with no information about the outcomes of the other required
        sub-components, making it impossible to verify claims about the consistency
        or specific results of every part of the sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_content_grounding
      description: Evidence explicitly resolves the specific visual content, markings,
        text, or data displayed on an object, screen, or surface required to verify
        its function, status, or the specific information it conveys, rather than
        merely showing the object's presence, physical appearance, or the context
        of its use without revealing what is actually on it.
      score_1: The specific content (e.g., text, numbers, symbols, images) on the
        object is clearly visible or described, allowing the function or information
        conveyed to be verified.
      score_half: The object is shown and its context implies a function, but the
        specific content on the object is illegible, obscured, or not described, leaving
        the specific information or function ambiguous.
      score_0: The object is mentioned or shown, but there is no evidence of its specific
        content, making it impossible to verify claims about what the object displays
        or its specific role based on that content.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: entity_visual_grounding_explicitness
      description: Evidence explicitly links a named entity to a specific visual instance
        or descriptor (e.g., 'the man in the black shirt', 'the player with the shaved
        head') required to verify an attribute, rather than merely mentioning the
        name and the visual descriptor separately or in contexts where the identity
        link is ambiguous or unconfirmed.
      score_1: The evidence explicitly confirms that the named entity is the specific
        visual instance described (e.g., 'Shaw is the man in the black shirt'), allowing
        attributes of that visual instance to be attributed to the named entity.
      score_half: The named entity and the visual descriptor are both present, but
        the explicit link confirming they are the same entity is missing, ambiguous,
        or inferred from context without confirmation.
      score_0: The named entity and the visual descriptor are mentioned, but there
        is no evidence linking them, making it impossible to verify attributes of
        the named entity based on the visual instance.
      weight: 3.0
      failure_repair_action: refine_query
    - name: counterfactual_state_grounding
      description: Evidence explicitly establishes the specific state of the system
        (e.g., score, position, status) at the precise moment a hypothetical condition
        is triggered, allowing the consequence of that condition to be derived, rather
        than merely showing the actual outcome that occurred or the state after the
        condition was resolved.
      score_1: The evidence explicitly states the system's state (e.g., score, rank,
        status) at the exact moment the hypothetical condition would have been met,
        enabling the derivation of the specific consequence asserted in the option.
      score_half: The evidence shows the system's state near the critical moment or
        the actual outcome, but the precise state required to definitively derive
        the hypothetical consequence is ambiguous, missing, or only implied.
      score_0: The evidence only shows the actual outcome that occurred or the state
        after the event, with no information about the system's state at the moment
        the hypothetical condition could have been met, making it impossible to verify
        the counterfactual consequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sub_component_identification_explicitness
      description: Evidence explicitly identifies the specific sub-component (e.g.,
        set, round, stage, phase) of a composite event required to verify a claim,
        rather than merely providing evidence from the event generally or from other
        sub-components without confirming the specific segment queried.
      score_1: The specific sub-component (e.g., 'fourth set', 'second round') asserted
        or required by the query is explicitly identified in the evidence (e.g., via
        on-screen text, commentary, or explicit narration).
      score_half: The event is described, and sub-components are mentioned, but the
        specific sub-component required to verify the claim is not explicitly identified
        or is ambiguous.
      score_0: The evidence pertains to the event or other sub-components, but the
        specific sub-component required by the query is entirely absent or not identified,
        making it impossible to verify claims specific to that segment.
      weight: 3.0
      failure_repair_action: refine_query
    - name: artistic_genre_grounding_explicitness
      description: Evidence explicitly provides specific, distinguishing cues (e.g.,
        audio keywords, unique visual motifs, specific props, or explicit genre labels)
        required to classify the artistic genre, thematic nature, or specific identity
        of a performance or work, rather than merely describing generic actions, movements,
        or visual elements that could apply to multiple genres.
      score_1: The specific cues or labels required to definitively classify the genre
        or thematic nature asserted in the option are explicitly present in the evidence.
      score_half: The evidence describes the performance and some elements, but lacks
        the specific distinguishing cues or labels required to definitively classify
        the genre or thematic nature, leaving the classification ambiguous or generic.
      score_0: The evidence only provides generic descriptions of actions or visuals
        that do not distinguish the specific genre or thematic nature asserted in
        the option, making it impossible to verify the specific classification.
      weight: 3.0
      failure_repair_action: refine_query
    - name: character_perception_explicitness
      description: Evidence explicitly states the specific perception, reputation,
        or characterization of a named entity as held by others or the narrative,
        rather than merely describing the entity's actions, traits, or internal state
        without the explicit link to how they are viewed.
      score_1: The specific perception or characterization (e.g., 'seen as X', 'perceived
        as Y', 'known for Z') asserted in the option is explicitly stated or directly
        implied by the narrative or other characters in the evidence.
      score_half: The entity's actions or traits are described, and a perception is
        implied, but the explicit link stating how the entity is viewed or characterized
        is missing, ambiguous, or only inferred from context.
      score_0: The entity's actions or traits are mentioned, but there is no evidence
        explicitly stating or implying the specific perception or characterization
        asserted in the option, making it impossible to verify how the entity is perceived.
      weight: 3.0
      failure_repair_action: refine_query
    - name: mechanism_actualization_explicitness
      description: Evidence explicitly demonstrates or states that the specific mechanism,
        method, or tool asserted in the option is the one actually employed to achieve
        the result in the queried instance, rather than merely mentioning it as a
        known alternative, a general possibility, a component of a different instance,
        or a hypothetical scenario.
      score_1: The evidence explicitly shows or states that the specific mechanism
        asserted in the option is the active cause or method used in the specific
        event queried.
      score_half: The mechanism is mentioned as a possibility, an alternative used
        in other cases, or a general concept, but the evidence does not explicitly
        confirm it is the specific mechanism used in the queried instance.
      score_0: The mechanism is not mentioned, is explicitly denied for the queried
        instance, or the evidence only describes a different mechanism or outcome.
      weight: 3.0
      failure_repair_action: refine_query
    - name: audience_reaction_explicitness
      description: Evidence explicitly states or demonstrates the specific reaction
        (e.g., applause, silence, booing, cheering) of the audience or judges to a
        performance or event, rather than merely describing the performance itself,
        the participants, or the general atmosphere without the specific reaction.
      score_1: The specific audience reaction asserted in the option (e.g., 'multiple
        rounds of applause') is explicitly stated or clearly demonstrated (e.g., via
        ASR, visual cues of clapping) for the relevant instance(s).
      score_half: The performance and context are described, and a general reaction
        is implied, but the specific type or extent of the audience reaction (e.g.,
        distinguishing between a single clap and multiple rounds) is missing, ambiguous,
        or only partially captured.
      score_0: The performance is described, but there is no explicit evidence of
        the specific audience reaction asserted in the option, making it impossible
        to verify claims about how the audience responded.
      weight: 3.0
      failure_repair_action: refine_query
    - name: selection_event_explicitness
      description: Evidence explicitly states or demonstrates the specific act of
        selecting, targeting, or choosing a particular entity from a group or set
        to be the subject of an action, interaction, or status, rather than merely
        describing the entity's participation, the general context of the group, or
        the action occurring without the specific moment of selection.
      score_1: The specific act of selecting or targeting the entity (e.g., 'I choose
        you', pointing to a specific person, naming a specific individual from the
        crowd) is explicitly stated or demonstrated in the evidence.
      score_half: The entity is shown participating or the action occurs, but the
        specific moment or statement of selection/targeting from the group is missing,
        ambiguous, or only implied by the outcome.
      score_0: The entity and the action are mentioned, but there is no evidence of
        a specific selection or targeting event, making it impossible to verify claims
        about the entity being chosen or singled out.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_descriptor_participant_grounding
      description: Evidence explicitly links a specific visual descriptor (e.g., clothing,
        physical feature) to the specific entity participating in the interaction,
        selection, or relationship asserted in the option, rather than merely showing
        a group, describing the interaction generally, or showing the descriptor and
        the interaction in separate contexts without confirming they refer to the
        same individual.
      score_1: The evidence explicitly identifies the specific entity defined by the
        visual descriptor as the participant in the interaction/selection (e.g., 'the
        man in the striped shirt' is explicitly shown being chosen or interacting).
      score_half: The visual descriptor and the interaction are both present, but
        the explicit link confirming that the entity with that descriptor is the specific
        participant is missing, ambiguous, or inferred from context.
      score_0: The interaction or the visual descriptor is mentioned, but there is
        no evidence linking the specific visual descriptor to the participant, making
        it impossible to verify which individual in the group is the subject of the
        relationship.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: actual_vs_hypothetical_grounding
      description: Evidence explicitly establishes a specific relationship, state,
        or attribute as a factual reality for the entities involved, rather than merely
        presenting it as a hypothetical scenario, conditional statement, or 'what-if'
        situation discussed by the entities.
      score_1: The specific relationship, state, or attribute asserted in the option
        is explicitly stated or demonstrated as a factual reality in the evidence.
      score_half: The relationship, state, or attribute is mentioned, but the evidence
        frames it as a hypothetical, conditional, or 'what-if' scenario, leaving its
        factual status ambiguous or unconfirmed.
      score_0: The evidence only presents the relationship, state, or attribute as
        a hypothetical or conditional scenario, with no indication that it is a factual
        reality.
      weight: 3.0
      failure_repair_action: refine_query
    - name: shared_nature_explicitness
      description: Evidence explicitly states that two or more distinct entities share
        a specific nature, theme, genre, or structural dynamic (e.g., 'in the same
        vein', 'similar to', 'both are X'), rather than merely mentioning the entities
        separately, describing their individual attributes, or implying a connection
        without explicitly defining the shared characteristic.
      score_1: The specific shared nature, theme, or dynamic asserted in the option
        is explicitly stated as applying to all compared entities in the evidence.
      score_half: The entities are mentioned and their individual attributes are described,
        but the explicit statement linking them via a shared nature or theme is missing,
        ambiguous, or only implied by context.
      score_0: The entities are mentioned, but there is no evidence explicitly stating
        that they share the specific nature, theme, or dynamic asserted in the option,
        making it impossible to verify the similarity claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: set_boundary_explicitness
      description: Evidence explicitly delimits the set of instances to which a universal
        or commonality claim applies, ensuring that contradictory evidence from outside
        the queried set (e.g., instances that do not share the property) is either
        absent or explicitly excluded from the scope, rather than being present in
        a way that creates ambiguity about the set's boundaries.
      score_1: The evidence covers only the instances in the queried set, or explicitly
        distinguishes the queried set from other instances, allowing the universal
        claim to be verified without interference from out-of-scope contradictions.
      score_half: The evidence includes instances from outside the queried set that
        contradict the claim, but the boundary of the set is somewhat implied or the
        contradiction is weak, leaving the verification ambiguous.
      score_0: The evidence includes instances from outside the queried set that clearly
        contradict the claim, and there is no explicit distinction or exclusion of
        these instances, making it impossible to verify the universal claim for the
        specific set.
      weight: 3.0
      failure_repair_action: refine_query
    - name: universal_set_coverage_explicitness
      description: Evidence explicitly provides the relevant attribute or state for
        every single instance in the specific set queried (e.g., 'all five', 'the
        first three', 'every member') required to verify a claim of commonality or
        universal application, rather than merely providing evidence for a subset
        of the instances or the general category.
      score_1: The evidence explicitly establishes the relevant attribute for every
        instance in the queried set, allowing the claim that the property is common
        to all to be verified or excluded.
      score_half: The evidence establishes the attribute for some instances in the
        set, but at least one instance in the queried set is missing the relevant
        attribute, leaving the universal claim unverified.
      score_0: The evidence provides the attribute for only a subset of the set or
        fails to cover the specific instances queried, making it impossible to determine
        if the property applies to the entire group.
      weight: 3.0
      failure_repair_action: refine_query
    - name: object_interaction_explicitness
      description: Evidence explicitly states or demonstrates the specific action,
        manipulation, or interaction performed with a named object or prop (e.g.,
        jumping through, lifting, balancing on, holding), rather than merely showing
        the object's presence, describing its physical properties, or mentioning it
        in a context where the specific interaction is implied but not defined.
      score_1: The specific action or interaction with the object asserted in the
        option is explicitly stated or clearly demonstrated in the evidence.
      score_half: The object is shown or mentioned, and a general context is provided,
        but the specific action or interaction performed with it is missing, ambiguous,
        or only implied.
      score_0: The object is mentioned or shown, but there is no evidence of the specific
        action or interaction performed with it, making it impossible to verify claims
        about how the object was used.
      weight: 3.0
      failure_repair_action: refine_query
    - name: scope_quantification_explicitness
      description: Evidence explicitly defines the extent, frequency, or exclusivity
        of an attribute (e.g., 'only', 'primarily', 'always', 'never', 'mainly') required
        to verify options that hinge on these quantifiers, rather than merely mentioning
        the attribute's existence or occurrence without establishing its scope relative
        to the whole.
      score_1: The specific quantifier or scope (e.g., 'only', 'primary', 'always')
        asserted in the option is explicitly stated or directly demonstrated as the
        defining characteristic of the entity in the evidence.
      score_half: The attribute is mentioned and its occurrence is shown, but the
        explicit statement defining its scope (e.g., whether it is the *only* or *primary*
        attribute) is missing, ambiguous, or only implied by context.
      score_0: The attribute is mentioned or shown, but there is no evidence regarding
        its scope, frequency, or exclusivity, making it impossible to verify claims
        that depend on quantifiers like 'only', 'primarily', or 'always'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: assembly_configuration_explicitness
      description: Evidence explicitly demonstrates the final assembly, spatial arrangement,
        or structural integration of distinct sub-components into a complete object,
        rather than merely showing the creation or existence of the individual components
        in isolation.
      score_1: The evidence explicitly shows the specific arrangement, connection,
        or configuration of the components as asserted in the option (e.g., 'spoons
        in outer and inner circles', 'tassels attached to the base').
      score_half: The evidence shows the individual components being created or existing,
        but the specific final assembly or spatial configuration required to verify
        the option is missing, ambiguous, or only implied.
      score_0: The evidence only shows the individual components in isolation or the
        general process without any view of the final assembled structure, making
        it impossible to verify claims about the object's configuration or the relationship
        between its parts.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relative_temporal_ordering_explicitness
      description: Evidence explicitly establishes the chronological order between
        two specific events or states (e.g., Event A occurred before Event B, State
        X preceded State Y) required to verify claims about precedence, sequence,
        or 'before/after' relationships, rather than merely presenting both events/states
        without confirming their relative timing.
      score_1: The specific relative order (e.g., 'A before B') asserted in the option
        is explicitly stated or directly demonstrated by the narrative sequence in
        the evidence.
      score_half: Both events/states are present, but the explicit confirmation of
        their relative order (which came first) is missing, ambiguous, or only implied
        by context without clear sequencing.
      score_0: The events/states are mentioned, but there is no evidence establishing
        their relative chronological order, making it impossible to verify claims
        about what happened 'before' or 'after' the other.
      weight: 3.0
      failure_repair_action: refine_query
    - name: historical_event_identity_explicitness
      description: Evidence explicitly identifies the specific historical event, war,
        era, or time-bound phenomenon asserted in the option as the context or cause,
        rather than discussing a different event, a generic time period, or a different
        era entirely.
      score_1: The specific historical event, war, or era asserted in the option (e.g.,
        'World War I', 'the Great Depression') is explicitly named and linked to the
        entity or outcome in the evidence.
      score_half: The evidence discusses a historical context or event, but the specific
        event/era asserted in the option is not explicitly named, is ambiguous, or
        is conflated with a different event (e.g., discussing WWII when WWI is queried).
      score_0: The evidence discusses a completely different historical event, era,
        or time period, or provides no specific historical context, making it impossible
        to verify claims about the specific event asserted in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: category_definition_explicitness
      description: Evidence explicitly states the defining rule, criteria, or distinguishing
        characteristic of a specific category, tier, or group asserted in the option,
        rather than merely listing members of the category, describing the category's
        existence, or showing items being sorted without explaining the sorting logic.
      score_1: The specific rule, criteria, or distinguishing characteristic that
        defines the category asserted in the option is explicitly stated in the evidence.
      score_half: The category and its members are mentioned, but the explicit definition
        or rule distinguishing it from other categories is missing, ambiguous, or
        only implied by the examples.
      score_0: The category is mentioned or items are shown being sorted into it,
        but the specific defining rule or criteria for the category is entirely absent,
        making it impossible to verify what sets the category apart.
      weight: 3.0
      failure_repair_action: refine_query
    - name: category_member_attribute_enumeration
      description: Evidence explicitly enumerates the specific attributes, properties,
        or visual characteristics of multiple members within a category, rather than
        merely defining the category's abstract rule or providing a single example,
        to verify claims about the category's distinctive or common features.
      score_1: The evidence explicitly lists or describes the specific attributes
        of multiple members in the category, allowing the distinctive feature or commonality
        asserted in the option to be verified or excluded.
      score_half: The evidence defines the category or provides a single example with
        attributes, but lacks sufficient enumeration of multiple members' attributes
        to definitively establish the category's distinctive feature or commonality.
      score_0: The evidence only provides the category's abstract definition or a
        single example without describing the specific attributes of its members,
        making it impossible to verify claims about the category's distinctive visual
        or thematic features.
      weight: 3.0
      failure_repair_action: refine_query
    - name: distinguishing_feature_explicitness
      description: Evidence explicitly identifies the specific attribute, feature,
        or characteristic that makes an entity unique, special, or distinct from others,
        rather than merely describing the entity's general properties or listing multiple
        items without highlighting the specific differentiating factor.
      score_1: The specific feature or attribute that confers uniqueness or special
        status asserted in the option is explicitly stated or clearly demonstrated
        as the distinguishing factor in the evidence.
      score_half: The entity and its general properties are described, and a potential
        distinguishing feature is implied or mentioned, but the explicit link establishing
        it as the specific reason for the entity's uniqueness or special status is
        missing, ambiguous, or not clearly highlighted.
      score_0: The entity is described, but the specific feature or attribute that
        makes it unique or special is entirely absent, or the evidence only lists
        general properties without identifying any distinguishing factor.
      weight: 3.0
      failure_repair_action: refine_query
    - name: variant_enumeration_explicitness
      description: Evidence explicitly presents the distinct variants, instances,
        or options within a category of similar entities, allowing the specific target
        to be identified by its unique properties and others to be excluded, rather
        than showing a partial set or generic examples that leave the specific identity
        of the target ambiguous.
      score_1: The evidence explicitly displays or describes the full set of relevant
        variants, enabling the specific target to be distinguished from similar alternatives
        based on unique features.
      score_half: The evidence shows some variants or the target, but the set is incomplete
        or the distinguishing features of the alternatives are not clearly presented,
        leaving the specific identity of the target ambiguous.
      score_0: The evidence shows only a single instance, a generic example, or a
        partial set that does not allow the specific target to be distinguished from
        other similar possibilities.
      weight: 3.0
      failure_repair_action: refine_query
    - name: discussion_scope_completeness
      description: Evidence explicitly covers the full extent of a specific discussion,
        interaction, or exchange, allowing topics that are not mentioned to be excluded,
        rather than providing partial snippets that might include misleading mentions
        or fail to establish the boundaries of the conversation.
      score_1: The evidence provides a comprehensive account of the interaction, explicitly
        covering all topics discussed, thereby allowing unmentioned topics to be definitively
        excluded.
      score_half: The evidence covers some parts of the interaction but is incomplete
        or fragmented, leaving ambiguity about whether unmentioned topics were discussed
        or if the provided snippets are representative of the whole.
      score_0: The evidence provides only isolated snippets or mentions of topics
        without establishing the full scope of the interaction, making it impossible
        to verify claims about what was NOT discussed.
      weight: 3.0
      failure_repair_action: refine_query
    - name: role_function_explicitness
      description: Evidence explicitly attributes a specific functional role, status,
        or capacity (e.g., teacher, student, leader, participant, audience) to a named
        entity within the queried context, rather than merely describing the entity's
        actions, mentioning the role in relation to a different entity, or implying
        the role without explicit attribution.
      score_1: The specific functional role or status asserted in the option is explicitly
        attributed to the target entity in the evidence (e.g., 'she is the teacher',
        'he is the student').
      score_half: The entity and the context are present, and the role is mentioned
        (perhaps for another entity or generally), but the explicit link attributing
        that specific role to the target entity is missing, ambiguous, or inferred.
      score_0: The entity is mentioned, but the specific functional role or status
        asserted in the option is entirely absent, attributed to a different entity,
        or the evidence only describes actions without defining the role.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Attribute Perception:
    rubric_criteria:
    - name: quantitative_and_attribution_explicitness
      description: Evidence explicitly states the specific numerical values (dates,
        counts, measurements) or named agents/attributions required to verify or exclude
        options, rather than merely implying the event or providing generic context.
      score_1: The specific numbers, dates, or named agents asserted in the options
        are explicitly stated in the evidence.
      score_half: The event or entity is present, but the specific quantitative value
        or attribution is missing, vague, or requires inference.
      score_0: The evidence lacks the specific numbers, dates, or named agents entirely,
        making verification or exclusion impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_entity_co_location
      description: Evidence grounds the specific attributes (quantitative values,
        named agents, dates, or causal factors) asserted in the options to the specific
        target entity within a single, contiguous evidentiary scope, rather than presenting
        them in separate, unrelated contexts.
      score_1: The specific attributes and the target entity are explicitly linked
        in the same narrative segment or visual context, allowing verification of
        the combined claim.
      score_half: The attributes and the target entity are present in the evidence
        but appear in separate segments or contexts, requiring inference to link them.
      score_0: The attributes or the target entity are present, but they are not linked,
        or the attributes apply to a different entity/time period, making verification
        of the specific option impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_state_explicitness
      description: Evidence explicitly states the specific outcome, result, or state
        (e.g., success, failure, presence, absence, passion, indifference) required
        to verify or exclude the option, rather than merely describing the attempt,
        event, or entity without its resolution.
      score_1: The specific outcome or state asserted in the option is explicitly
        stated or clearly demonstrated in the evidence.
      score_half: The event or entity is present, but the specific outcome or state
        is ambiguous, implied, or requires inference.
      score_0: The evidence describes the attempt or entity but lacks any explicit
        information about the outcome or state, making verification or exclusion impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: stance_and_meta_claim_explicitness
      description: Evidence explicitly states the specific stance, opinion, claim,
        or position (e.g., 'believes', 'claims', 'disputes', 'supports') of a named
        entity or organization required to verify or exclude options, rather than
        merely describing the subject matter or event the entity is commenting on.
      score_1: The specific stance or meta-claim asserted in the option is explicitly
        stated or clearly demonstrated in the evidence.
      score_half: The entity or subject matter is present, but the specific stance
        or meta-claim is ambiguous, implied, or requires inference.
      score_0: The evidence describes the subject matter or event but lacks any explicit
        information about the entity's stance or meta-claim, making verification or
        exclusion impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: suggestion_content_explicitness
      description: Evidence explicitly states the specific content, instruction, or
        advice asserted in the option, rather than merely showing the entity speaking,
        gesturing, or giving generic feedback without the specific propositional content.
      score_1: The specific advice, instruction, or suggestion asserted in the option
        is explicitly stated in the evidence.
      score_half: The entity is shown giving feedback or speaking, but the specific
        content of the suggestion is vague, implied, or requires inference.
      score_0: The evidence shows the entity speaking or gesturing but lacks any explicit
        statement of the specific advice or instruction, making verification or exclusion
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negative_constraint_explicitness
      description: Evidence explicitly states a prohibition, restriction, or negative
        constraint (e.g., 'do not', 'cannot', 'must not', 'forbid') asserted in the
        option, rather than merely describing positive instructions, general advice,
        or the absence of an action without an explicit denial.
      score_1: The specific prohibition or negative constraint asserted in the option
        is explicitly stated in the evidence.
      score_half: The context implies a restriction or the action is not shown, but
        the explicit negative constraint (the 'do not' or 'cannot') is missing or
        vague.
      score_0: The evidence contains only positive instructions or generic context,
        lacking any explicit statement of the specific prohibition or negative constraint,
        making verification or exclusion impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: abstract_attribute_explicitness
      description: Evidence explicitly states the specific abstract attribute, quality,
        or psychological state (e.g., identity, pride, dignity, sense of belonging)
        asserted in the option as a property of the target entity, rather than merely
        describing related concrete features, functions, or generic emotional contexts.
      score_1: The specific abstract attribute asserted in the option is explicitly
        stated as a property of the target entity in the evidence.
      score_half: The target entity and related concrete features or generic emotional
        context are present, but the specific abstract attribute is implied, vague,
        or requires inference.
      score_0: The evidence describes the entity or context but lacks any explicit
        statement of the specific abstract attribute, making verification or exclusion
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_state_anchoring
      description: Evidence explicitly grounds the attribute (e.g., color, shape,
        condition) to the specific temporal phase, state, or moment (e.g., 'before',
        'after', 'during', 'initial', 'final') asserted in the option, rather than
        showing the entity in a different phase or implying the state change without
        explicit visual or textual confirmation of the attribute at that specific
        time.
      score_1: The attribute is explicitly observed or stated for the entity at the
        exact temporal phase or state required by the option.
      score_half: The entity and the attribute are present, but the specific temporal
        phase is ambiguous, implied, or the attribute is shown in a different phase
        (e.g., showing the 'after' state when the 'before' state is queried).
      score_0: The evidence shows the entity but lacks any explicit grounding of the
        attribute at the queried temporal phase, making verification or exclusion
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explanatory_scope_explicitness
      description: Evidence explicitly states the specific explanatory scope, capability,
        or limitation of a theory, model, or method (e.g., 'can explain X', 'fails
        to explain Y', 'works for A but not B') required to verify or exclude options,
        rather than merely describing the theory's mechanics, components, or general
        context without addressing its success or failure in explaining specific phenomena.
      score_1: The specific claim about what the theory can or cannot explain is explicitly
        stated in the evidence.
      score_half: The theory and the phenomena are present, but the explicit link
        regarding the theory's ability to explain them is ambiguous, implied, or requires
        inference.
      score_0: The evidence describes the theory or the phenomena but lacks any explicit
        statement about the theory's explanatory capability or limitations, making
        verification or exclusion impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_superlative_grounding
      description: Evidence explicitly grounds the comparative or superlative claim
        (e.g., 'highest', 'most', 'largest', 'fastest') asserted in the option by
        visually or textually establishing the relative ordering or magnitude difference
        between the compared items, rather than merely listing the items or their
        individual attributes without establishing the rank.
      score_1: The evidence explicitly demonstrates or states the relative ordering
        or magnitude difference that confirms the superlative or comparative claim
        (e.g., highlighting the highest peak, stating 'X is the largest').
      score_half: The evidence lists the items and their individual attributes but
        the relative ordering or the specific superlative status is ambiguous, implied,
        or requires inference to determine which is 'highest' or 'most'.
      score_0: The evidence lists the items or attributes but provides no information
        about their relative magnitudes or ordering, making verification of the superlative
        or comparative claim impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_precedence_explicitness
      description: Evidence explicitly establishes the chronological order or temporal
        precedence (e.g., 'first', 'earliest', 'before X', 'preceded by') of the attribute
        or event asserted in the option relative to other compared entities, rather
        than merely listing the entities and their attributes without establishing
        the sequence of their introduction.
      score_1: The evidence explicitly states or demonstrates the chronological sequence
        that confirms the option's claim of being the first, earliest, or preceding
        other options.
      score_half: The evidence lists the entities and their attributes but the chronological
        order is ambiguous, implied, or requires inference to determine which was
        first.
      score_0: The evidence lists the entities or attributes but provides no information
        about their temporal sequence or introduction dates, making verification of
        the 'first' or 'earliest' claim impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_trigger_explicitness
      description: Evidence explicitly states or demonstrates the specific causal
        trigger, event, or stimulus that leads to the emotional state, reaction, or
        behavioral change asserted in the option, rather than merely showing the state
        or the trigger in isolation without establishing the causal link.
      score_1: The specific cause (trigger/event) and the resulting state/reaction
        are explicitly linked in the evidence, allowing verification of the causal
        relationship.
      score_half: The cause and the state are present in the evidence but appear in
        separate segments or contexts, requiring inference to establish the causal
        link.
      score_0: The evidence shows the state or the trigger but lacks any explicit
        connection between them, making verification of the specific causal claim
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: visual_attribute_grounding
      description: Evidence visually demonstrates the specific attribute (e.g., profession,
        role, status) asserted in the option through distinct visual markers (uniforms,
        tools, equipment, setting, or actions) associated with that attribute, rather
        than relying solely on textual statements, dialogue, or generic context.
      score_1: The specific attribute is explicitly confirmed by visual markers (e.g.,
        a doctor's coat, a police badge, a specific tool) clearly associated with
        the target entity in the video.
      score_half: The attribute is mentioned in dialogue or text, but the visual evidence
        is ambiguous, generic, or lacks the specific markers required to confirm the
        attribute visually.
      score_0: The evidence contains no visual markers for the attribute; the attribute
        is only mentioned in dialogue or text, or the visual context is unrelated
        to the attribute.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: role_identity_explicitness
      description: Evidence explicitly states the specific concrete role, profession,
        or social identity (e.g., 'doctor', 'police officer', 'journalist', 'lawyer')
        of the target entity via dialogue, on-screen text, or direct narration, rather
        than merely implying the role through context, actions, or associated objects
        without an explicit label.
      score_1: The specific role or profession asserted in the option is explicitly
        stated in the evidence (e.g., a character says 'she is a journalist' or text
        labels the entity).
      score_half: The target entity and context suggesting the role are present, but
        the specific role label is implied, vague, or requires inference from actions/objects
        without an explicit statement.
      score_0: The evidence shows the entity and context but lacks any explicit statement
        or label of the specific role or profession, making verification or exclusion
        impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: activity_engagement_explicitness
      description: Evidence explicitly confirms the target entity is actively engaged
        in the specific activity, business, or work type asserted in the option, rather
        than merely describing preparatory actions, intentions, plans, or related
        but distinct activities that imply the role without confirming the active
        engagement.
      score_1: The evidence explicitly states or demonstrates the entity is currently
        performing the specific activity or business (e.g., 'the business is up and
        running', 'he is driving', 'she is cleaning').
      score_half: The evidence describes preparatory actions, intentions, or related
        activities (e.g., 'stocking up for', 'planning to', 'buying equipment for')
        that imply the role but do not explicitly confirm the active engagement in
        the specific work type.
      score_0: The evidence lacks any mention of the specific activity or business,
        or only provides generic context unrelated to the active engagement in the
        asserted work type.
      weight: 3.0
      failure_repair_action: refine_query
    - name: opportunity_benefit_explicitness
      description: Evidence explicitly states the specific opportunity, benefit, or
        professional advantage (e.g., 'learn how X works', 'gain access to Y', 'opportunity
        to do Z') asserted in the option as the reason for an action, rather than
        merely describing the action, the actor, or generic positive attributes without
        specifying the concrete benefit.
      score_1: The specific opportunity or benefit asserted in the option is explicitly
        stated in the evidence as the reason for the action.
      score_half: The action and the actor are present, and a generic benefit or positive
        attribute is mentioned, but the specific opportunity or benefit asserted in
        the option is vague, implied, or requires inference.
      score_0: The evidence describes the action or the actor but lacks any explicit
        statement of the specific opportunity or benefit, making verification or exclusion
        of the motivation impossible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instructional_availability_explicitness
      description: Evidence explicitly states the availability, existence, or promise
        of an instructional resource (e.g., tutorial, guide, lesson, explanation)
        for the specific entity or activity asserted in the option, rather than merely
        showing the entity performing the activity, describing the activity, or implying
        that it could be learned.
      score_1: The evidence explicitly states that a tutorial, guide, or explanation
        for the specific entity/activity is available, will be provided, or is being
        taught.
      score_half: The entity or activity is shown or described, and the context implies
        learning is possible, but there is no explicit statement confirming the existence
        or availability of a specific tutorial or instructional resource.
      score_0: The evidence shows the entity or activity but contains no mention of
        tutorials, guides, or instructional content, making verification of the 'has
        a tutorial' claim impossible.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Object Recognition:
    rubric_criteria:
    - name: explicit_causal_link
      description: Evidence explicitly asserts the causal or temporal link between
        an event and a state change/outcome, rather than merely presenting the event
        and the outcome as separate facts.
      score_1: The evidence explicitly states that the event caused, ended, or triggered
        the specific state change or outcome in the option.
      score_half: The evidence presents the event and the outcome but the causal/temporal
        link is only implied or requires inference.
      score_0: The evidence presents the event or the outcome, but the link between
        them is absent or contradicted.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_agent_specificity
      description: Evidence identifies the specific event, agent, or factor that caused
        the state change or outcome, rather than merely presenting a related event,
        general context, or a different cause.
      score_1: The evidence explicitly identifies the specific event or factor that
        triggered the change described in the option.
      score_half: The evidence presents an event related to the topic but does not
        clearly identify it as the specific cause of the change, or the specific cause
        is ambiguous.
      score_0: The evidence presents only general context, unrelated events, or a
        different cause that does not match the option's specific claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_causal_refutation
      description: Evidence explicitly denies, refutes, or rules out a specific causal
        link or factor proposed in an option, rather than merely failing to mention
        it or presenting it as a general context.
      score_1: The evidence explicitly states that the proposed factor did not cause
        the outcome, or directly contradicts the causal claim in the option.
      score_half: The evidence suggests the factor is unlikely or presents conflicting
        information, but does not explicitly deny the causal link.
      score_0: The evidence is silent on the causal link, or only presents the factor
        without addressing its causal role.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_set_enumeration
      description: Evidence explicitly lists or enumerates the complete set of items,
        conditions, or factors required to verify a multi-part option, rather than
        mentioning only a subset or implying the rest.
      score_1: The evidence explicitly lists all items in the option's set, allowing
        verification of the specific combination and exclusion of options with missing
        or extra items.
      score_half: The evidence lists some but not all items in the set, or lists items
        without clearly defining the boundaries of the set, making it impossible to
        distinguish between options with overlapping but different compositions.
      score_0: The evidence mentions only a single item or a vague category, providing
        no basis to verify the specific composition of the set in any option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_frequency_grounding
      description: Evidence explicitly grounds the relative frequency, count, or ranking
        of the target entity compared to other candidates, rather than merely showing
        isolated instances of the entity without a basis for comparison.
      score_1: The evidence explicitly states the count, frequency, or ranking (e.g.,
        'most frequent', 'appears X times') allowing direct verification of the comparative
        claim.
      score_half: The evidence shows multiple instances of the target entity but lacks
        explicit counts or comparative statements, requiring inference to determine
        frequency relative to other options.
      score_0: The evidence shows only isolated instances or mentions the entity without
        any information regarding its frequency or comparison to other entities.
      weight: 3.0
      failure_repair_action: refine_query
    - name: action_procedure_explicitness
      description: Evidence explicitly describes the specific action, method, or procedure
        asserted in an option, rather than merely discussing the general topic, context,
        or possibility of the action.
      score_1: The evidence explicitly details the steps, method, or nature of the
        specific action or procedure claimed in the option.
      score_half: The evidence discusses the topic or context related to the action
        but does not explicitly describe the action or procedure itself.
      score_0: The evidence is silent on the specific action or procedure, or only
        mentions the general subject matter without addressing the 'how' or the specific
        activity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: topic_discussion_explicitness
      description: Evidence explicitly discusses, mentions, or addresses the specific
        subject matter or topic asserted in an option, rather than merely showing
        related visuals or context without addressing the topic itself.
      score_1: The evidence explicitly discusses the specific topic or subject matter
        claimed in the option, allowing verification of its presence or exclusion
        based on its absence.
      score_half: The evidence shows visuals or context related to the topic but does
        not explicitly discuss or mention the specific subject matter, making it unclear
        if the topic was covered.
      score_0: The evidence is silent on the specific topic or subject matter of the
        option, providing no basis to determine if it was discussed or not.
      weight: 3.0
      failure_repair_action: refine_query
    - name: target_state_completeness
      description: Evidence presents the complete configuration or state of the target
        entity required to verify a status that depends on the whole (e.g., absence
        of specific items, specific arrangement, or total composition), rather than
        partial views, isolated components, or general rules.
      score_1: The evidence displays the full state of the target entity, allowing
        verification of properties that depend on the entire configuration (e.g.,
        confirming no forbidden items exist, or a specific pattern is complete).
      score_half: The evidence shows parts of the target entity or discusses the rules
        governing the state, but the complete configuration is not visible, making
        it impossible to verify properties dependent on the whole.
      score_0: The evidence only shows isolated components, general definitions, or
        unrelated states, providing no basis to determine the status of the target
        entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: rule_application_explicitness
      description: Evidence explicitly demonstrates the application of a specific
        rule, constraint, or condition to the target instance to verify a status,
        rather than merely stating the rule and showing the instance separately without
        the logical check.
      score_1: The evidence explicitly shows the process of checking the target instance
        against the rule's constraints (e.g., confirming the absence of forbidden
        items, verifying a count matches a threshold) to determine the status.
      score_half: The evidence states the rule and shows the instance, but the explicit
        verification step (the logical check) is implied or missing, leaving the status
        unconfirmed.
      score_0: The evidence mentions the rule or shows the instance, but provides
        no basis to determine if the instance satisfies the rule's conditions.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instance_specificity
      description: Evidence presents the specific instance, object, or event instance
        required to verify the option, rather than merely presenting general rules,
        definitions, or hypothetical examples unrelated to the target instance.
      score_1: The evidence explicitly shows or describes the specific target instance
        (e.g., the actual hand in the specific round, the specific object in the scene)
        allowing direct verification of its properties.
      score_half: The evidence presents the general rules or definitions governing
        the target, or shows a different/hypothetical instance, but the specific target
        instance itself is not shown or described.
      score_0: The evidence is limited to general context, definitions, or unrelated
        examples, providing no information about the specific instance in question.
      weight: 3.0
      failure_repair_action: refine_query
    - name: relational_predicate_grounding
      description: Evidence explicitly depicts the specific interaction, relationship,
        or relational predicate asserted in the option between the target entities,
        rather than merely showing the entities present in the same scene or video
        without the specific interaction.
      score_1: The evidence explicitly shows the specific interaction or relationship
        (e.g., protecting, attacking, helping) claimed in the option occurring between
        the relevant entities.
      score_half: The evidence shows the relevant entities in the same scene or context,
        but the specific interaction or relationship claimed in the option is not
        explicitly depicted or is ambiguous.
      score_0: The evidence shows the entities in isolation or in unrelated contexts,
        providing no basis to verify the specific relationship claimed in the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negative_state_grounding
      description: Evidence explicitly grounds the negative state or non-occurrence
        of an action for a specific entity (e.g., 'did not quit', 'was not present')
        by showing the entity's continued presence in the relevant role, the absence
        of the negating event for that entity, or an explicit statement of their non-participation
        in the negating action, rather than merely showing the event occurred for
        other entities.
      score_1: The evidence explicitly demonstrates the entity's continued status
        or the absence of the negating action for that specific entity, allowing verification
        of the negative claim.
      score_half: The evidence shows the entity in a related context or implies they
        did not perform the action, but lacks explicit confirmation of their continued
        status or the absence of the negating event.
      score_0: The evidence only shows the negating action occurring for other entities
        or is silent on the specific entity's status, making it impossible to verify
        the negative claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_ranking_grounding
      description: Evidence explicitly provides a ranked list, ordinal position, or
        superlative attribution (e.g., 'best', 'greatest', 'number one') for the target
        entity relative to others, rather than merely showing isolated instances of
        the entity's performance or capability without a comparative hierarchy.
      score_1: The evidence explicitly states the rank, order, or superlative status
        of the target entity, allowing direct verification of the comparative claim.
      score_half: The evidence shows the entity performing well or mentions a comparison
        but lacks an explicit rank, order, or definitive superlative statement, requiring
        inference to determine the hierarchy.
      score_0: The evidence shows isolated instances of the entity's actions or capabilities
        without any information regarding its rank, order, or status relative to other
        candidates.
      weight: 3.0
      failure_repair_action: refine_query
    - name: entity_origin_attribution
      description: Evidence explicitly attributes the target event, action, or state
        to the specific origin, nationality, group identity, or source asserted in
        the option, rather than merely mentioning the general category of the agent
        or a different origin.
      score_1: The evidence explicitly links the event to the specific origin, nationality,
        or group identity claimed in the option (e.g., 'cartels in [Country X]', 'group
        from [Region Y]').
      score_half: The evidence identifies the general category of the agent (e.g.,
        'drug traffickers', 'a cartel') but does not explicitly specify the origin,
        nationality, or specific group identity required to distinguish between options.
      score_0: The evidence mentions the event or a different origin/group, or is
        silent on the specific origin/identity of the agent responsible.
      weight: 3.0
      failure_repair_action: refine_query
    - name: set_boundary_completeness
      description: Evidence explicitly defines the complete scope or boundaries of
        the specific instance, set, or procedure in question, allowing verification
        of items that are NOT included (exclusion) rather than merely listing items
        that are present or showing items in unrelated contexts.
      score_1: The evidence fully delineates the specific instance or procedure, enabling
        the verifier to confirm that items not mentioned or shown are definitively
        absent from that specific set.
      score_half: The evidence lists some items in the set or shows the instance but
        fails to clearly define the boundaries, leaving ambiguity about whether unmentioned
        items were simply omitted or not used.
      score_0: The evidence only shows isolated items, mentions items from different
        contexts, or fails to define the specific set, making it impossible to verify
        the absence of any option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: instance_isolation
      description: Evidence is restricted to the specific instance, procedure, or
        event asserted in the option, excluding evidence from other distinct instances,
        alternative methods, or general context that could introduce irrelevant items
        or actions.
      score_1: The evidence pertains strictly to the specific target instance or procedure,
        allowing verification of its properties without contamination from other instances
        or general discussions.
      score_half: The evidence includes the target instance but is mixed with evidence
        from other distinct instances, alternative methods, or general context, creating
        ambiguity about which items or actions belong to the specific target.
      score_0: The evidence is dominated by other instances, alternative methods,
        or general context, with no clear isolation of the specific target instance
        required to verify the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_scope_alignment
      description: Evidence is temporally located within the specific time window,
        phase, or interval queried (e.g., 'beginning', 'end', 'during the fight'),
        rather than occurring before, after, or in a different phase of the event.
      score_1: The evidence explicitly covers the specific time window or phase required
        by the question, allowing verification of the state at that moment.
      score_half: The evidence covers a related time period but does not fully align
        with the queried window (e.g., shows the phase immediately before or after),
        requiring inference about the state at the exact queried moment.
      score_0: The evidence is entirely from a different time period or phase, providing
        no basis to determine the state at the queried moment.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: final_outcome_explicitness
      description: Evidence explicitly states or depicts the final terminal outcome
        (e.g., winner, loser, final score, series result) of the entire sequence or
        competition, rather than only showing intermediate states, partial results,
        or the process without the conclusion.
      score_1: The evidence explicitly identifies the final winner, loser, or terminal
        result of the entire event/series, allowing direct verification of the 'final
        victory' claim.
      score_half: The evidence shows the process, intermediate scores, or partial
        results, but the final terminal outcome is not explicitly stated or depicted,
        requiring inference or leaving the result ambiguous.
      score_0: The evidence only shows the process, early stages, or unrelated events,
        with no information regarding the final outcome or winner of the entire sequence.
      weight: 3.0
      failure_repair_action: refine_query
    - name: role_class_attribution
      description: Evidence explicitly identifies the specific role, class, occupation,
        or categorical label of the target entity asserted in the option, rather than
        merely showing the entity performing actions consistent with that role or
        discussing related mechanics without naming the category.
      score_1: The evidence explicitly states the specific role, class, or occupation
        of the target entity (e.g., 'playing as a Warlock', 'is a doctor'), allowing
        direct verification of the option.
      score_half: The evidence shows the entity performing actions or using items
        associated with the role, or discusses the role in general, but does not explicitly
        attribute that specific label to the target entity.
      score_0: The evidence shows the entity or related context but provides no information
        regarding their specific role, class, or occupation, making it impossible
        to verify the categorical claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribute_value_grounding
      description: Evidence explicitly states or visually resolves the specific numerical
        value, label, or scalar attribute (e.g., cost, count, score, time) for the
        target entities required to categorize them, rather than merely showing the
        entities or discussing the attribute in general terms.
      score_1: The evidence explicitly provides the specific value (e.g., 'costs 5',
        'score is 10') for the relevant entities, allowing them to be correctly categorized
        and counted.
      score_half: The evidence shows the entities or mentions the attribute type (e.g.,
        'cost') but does not explicitly state the specific value for the entities,
        requiring inference or leaving the categorization ambiguous.
      score_0: The evidence shows the entities or discusses the topic but provides
        no information about the specific numerical value or label required to categorize
        them.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_sequence_enumeration
      description: Evidence explicitly enumerates the outcome (success, failure, or
        specific result) of each step in a temporal sequence of attempts or events
        for the target entity, rather than merely stating a summary count, a single
        instance, or a general pattern without listing the specific steps.
      score_1: The evidence explicitly lists the result of each individual attempt
        or step in the sequence (e.g., 'fouled on rounds 2, 3, and 4; succeeded on
        round 1'), allowing direct verification of patterns like 'all except the first'
        or 'consecutive failures'.
      score_half: The evidence mentions the total count of successes/failures or describes
        the general pattern (e.g., 'he fouled multiple times') but does not explicitly
        list the outcome of each specific step in the sequence, requiring inference
        to verify the exact pattern.
      score_0: The evidence mentions only a single instance, a general summary, or
        is silent on the sequence of outcomes, providing no basis to verify the specific
        pattern of successes and failures across the attempts.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_posture_visualization
      description: Evidence explicitly depicts the specific physical state, posture,
        or condition of the target entity asserted in the option (e.g., lying, standing,
        injured, receiving treatment), rather than showing the entity in a different
        state or merely mentioning the state without visual confirmation.
      score_1: The evidence visually shows the target entity in the exact state, posture,
        or condition claimed in the option, allowing direct verification.
      score_half: The evidence shows the entity in a related but different state (e.g.,
        standing instead of lying, or bent over instead of receiving treatment), or
        mentions the state without clear visual confirmation of the entity in that
        state.
      score_0: The evidence shows the entity in a completely different state or is
        silent on the entity's physical condition, providing no basis to verify the
        specific state claim.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: entity_identity_resolution
      description: Evidence explicitly resolves the specific identity of the target
        entity (e.g., via on-screen text, name overlay, bib number, or explicit verbal
        identification) to distinguish it from other similar entities, rather than
        merely showing the entity's actions, state, or general appearance without
        a unique identifier.
      score_1: The evidence explicitly provides the unique identifier (name, number,
        label) that matches the option, allowing the specific entity to be distinguished
        from others in the scene.
      score_half: The evidence shows the entity performing the action or in the state,
        but the unique identifier is missing, obscured, or ambiguous, making it impossible
        to confirm which specific option the entity corresponds to.
      score_0: The evidence shows only generic visuals of an entity in the relevant
        state or action without any information to identify its specific identity,
        or the identifier shown contradicts the option.
      weight: 3.0
      failure_repair_action: dense_sample
    - name: comparative_set_completeness
      description: Evidence presents the complete set of candidates and their relative
        values (ranks, scores, times) simultaneously in a single view or consolidated
        statement, rather than presenting isolated results for individual candidates
        or subsets that do not allow a direct global comparison.
      score_1: The evidence explicitly displays or states the full list of all relevant
        candidates with their comparative metrics (e.g., a final leaderboard, a summary
        table), allowing direct verification of the superlative or relative claim
        across the entire set.
      score_half: The evidence provides comparative metrics for some candidates or
        shows isolated results for different candidates in separate contexts, but
        lacks a consolidated view of the full set, requiring inference to determine
        the global hierarchy.
      score_0: The evidence only shows results for a single candidate or disjoint
        subsets without any information linking them into a unified ranking or comparison,
        making it impossible to verify a superlative claim.
      weight: 3.0
      failure_repair_action: refine_query
    - name: global_scope_completeness
      description: Evidence explicitly covers the entire relevant scope (e.g., all
        rounds, all heats, the full duration) required to verify a superlative or
        global claim, rather than presenting results limited to a specific subset,
        single instance, or partial phase.
      score_1: The evidence explicitly aggregates or summarizes the results across
        the entire relevant scope (e.g., a final leaderboard, a summary of all heats),
        allowing verification of the global superlative.
      score_half: The evidence covers a significant portion of the scope or multiple
        instances but lacks explicit confirmation that it represents the complete
        set, leaving ambiguity about whether a better result exists outside the shown
        data.
      score_0: The evidence is restricted to a single instance, a specific subset
        (e.g., one heat), or a partial phase, providing no basis to determine the
        global maximum or minimum across the entire event.
      weight: 3.0
      failure_repair_action: refine_query
    - name: event_category_disambiguation
      description: Evidence explicitly identifies the specific sub-event, category,
        or phase (e.g., 'A final', 'B final', 'Heat 1', 'Semifinal') of the target
        instance, rather than merely showing a generic instance of the event type
        or a different sub-event that shares similar characteristics.
      score_1: The evidence explicitly states or displays the specific sub-event label
        (e.g., 'A final') for the instance in question, allowing the verifier to distinguish
        it from other sub-events (e.g., 'B final') and correctly verify or exclude
        options based on that specific category.
      score_half: The evidence shows an instance of the event type but the specific
        sub-event label is ambiguous, missing, or refers to a different category,
        making it impossible to definitively distinguish the target instance from
        other similar instances.
      score_0: The evidence shows only generic event visuals or a different sub-event
        without any information to identify the specific category required by the
        question, leading to potential confusion between distinct instances.
      weight: 3.0
      failure_repair_action: refine_query
    - name: ordinal_instance_verification
      description: Evidence explicitly covers the sequence of distinct event instances
        or provides a global temporal context allowing the specific ordinal position
        (e.g., 'first', 'last', 'third') of the target event to be verified, rather
        than presenting isolated instances without a basis for ordering them relative
        to others.
      score_1: The evidence presents the full sequence of relevant events or a consolidated
        timeline, allowing the verifier to definitively identify the specific ordinal
        instance (e.g., confirming the target is the first occurrence).
      score_half: The evidence shows the target event and some other instances, but
        the temporal relationship or complete sequence is ambiguous, making it difficult
        to confirm the exact ordinal position without inference.
      score_0: The evidence presents only isolated instances of the event type without
        any information regarding their order or relation to other instances, making
        it impossible to verify claims about specific ordinal positions.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: negative_option_exclusion_grounding
      description: Evidence explicitly grounds the presence of all alternative candidates
        or the complete scope of the event to definitively exclude an option claiming
        non-occurrence or absence, rather than merely listing some present items without
        confirming the absence of the target.
      score_1: The evidence explicitly shows or states the presence of all other candidates
        or covers the full scope of the event, allowing the verifier to confirm that
        the target option's claimed item/action is definitively absent.
      score_half: The evidence shows some candidates or parts of the event but lacks
        confirmation of the full scope or the presence of all alternatives, leaving
        ambiguity about whether the target item might have appeared in unshown segments.
      score_0: The evidence only lists a subset of present items or shows isolated
        instances without establishing the boundaries of the event, providing no basis
        to verify the absence of the target option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: paired_attribute_grounding
      description: Evidence explicitly provides both the predicted/claimed value and
        the ground truth value for each candidate entity, allowing the calculation
        of the difference, deviation, or error required to verify the option, rather
        than providing only one of the values or providing values for only a subset
        of candidates.
      score_1: The evidence explicitly states both the guess/claim and the actual/ground
        truth value for every candidate entity, enabling direct calculation of the
        deviation or error for each.
      score_half: The evidence provides both values for some candidates but not all,
        or provides only one of the two required values (e.g., only the guess or only
        the actual) for the candidates, making the calculation of deviation impossible
        for some or all options.
      score_0: The evidence provides neither the guess nor the actual value, or provides
        values for only a single candidate without the necessary pair, providing no
        basis to calculate or compare deviations.
      weight: 3.0
      failure_repair_action: refine_query
    - name: agent_action_attribution
      description: Evidence explicitly attributes the specific action, event, or state
        change asserted in the option to the specific target agent or entity, rather
        than merely describing the action as a general occurrence, a group behavior,
        or an event performed by an unspecified or different agent.
      score_1: The evidence explicitly links the specific action or event to the target
        agent (e.g., via first-person narration, direct observation of the named agent,
        or explicit statement 'X did Y'), allowing verification that the target performed
        the action.
      score_half: The evidence describes the action or event occurring in the relevant
        context but attributes it to a generic group, an unspecified agent, or implies
        the target's involvement without explicit confirmation.
      score_0: The evidence describes the action or event but attributes it to a different
        agent, or the agent performing the action is entirely unspecified, making
        it impossible to verify if the target agent performed it.
      weight: 3.0
      failure_repair_action: refine_query
    - name: contextual_instance_alignment
      description: Evidence explicitly depicts the target entity (object, action,
        or state) occurring within the specific relational, situational, or contextual
        frame asserted in the query (e.g., 'during the meeting', 'while fighting',
        'at the start'), rather than showing the entity in a different context, time,
        or situation.
      score_1: The evidence shows the target entity explicitly occurring within the
        specific context or situation defined by the question, allowing direct verification
        of the claim.
      score_half: The evidence shows the target entity and the context separately,
        or shows the entity in a related but distinct context, requiring inference
        to link the entity to the specific situation.
      score_0: The evidence shows the target entity only in a different context, time,
        or situation, or fails to show the entity within the specific frame required
        by the query.
      weight: 3.0
      failure_repair_action: refine_query
    - name: conditional_set_membership_grounding
      description: Evidence explicitly grounds the identity of the specific subset
        of entities defined by a condition (e.g., 'the team that chose X') and verifies
        that this same subset satisfies the target condition, rather than merely showing
        the condition and the target occurring in the same video or by different/unidentified
        groups.
      score_1: The evidence explicitly identifies the specific entities comprising
        the conditional subset and shows them performing the target action or possessing
        the target attribute, allowing direct verification of the intersection.
      score_half: The evidence shows the conditional event and the target event, but
        the specific entities linking the two are ambiguous, generic, or not explicitly
        shown to be the same group, requiring inference to establish the subset membership.
      score_0: The evidence shows the conditional event and the target event separately
        or by different/unidentified groups, providing no basis to verify that the
        specific subset defined by the condition is the one that satisfies the target.
      weight: 3.0
      failure_repair_action: refine_query
    - name: distinct_event_enumeration
      description: Evidence explicitly enumerates the complete set of distinct event
        types or activities performed by the target entity across the entire scope,
        allowing verification of frequency claims (e.g., 'only once', 'multiple times')
        by counting occurrences of each distinct type, rather than showing isolated
        instances or a partial list that leaves the total count ambiguous.
      score_1: The evidence explicitly lists or displays all distinct types of events/activities
        performed, enabling a definitive count for each type to verify frequency claims.
      score_half: The evidence shows multiple instances of some events but fails to
        explicitly enumerate the complete set of distinct types, leaving ambiguity
        about whether unshown types occurred or if the count for a specific type is
        accurate.
      score_0: The evidence shows only isolated instances or a partial list of events
        without establishing the complete set of distinct activities, making it impossible
        to verify frequency claims like 'only once'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: exhaustive_event_type_enumeration
      description: Evidence explicitly enumerates the complete set of distinct event
        types or activities performed by the target entity across the entire relevant
        scope, allowing verification of frequency claims (e.g., 'only once', 'multiple
        times') by confirming the total count of each type, rather than showing isolated
        instances or a partial list that leaves the total count ambiguous.
      score_1: The evidence explicitly lists or displays all distinct types of events/activities
        performed across the full scope, enabling a definitive count for each type
        to verify frequency claims.
      score_half: The evidence shows multiple instances of some events but fails to
        explicitly confirm the completeness of the set of distinct types, leaving
        ambiguity about whether unshown types occurred or if the count for a specific
        type is accurate.
      score_0: The evidence shows only isolated instances or a partial list of events
        without establishing the complete set of distinct activities, making it impossible
        to verify frequency claims like 'only once'.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_lifecycle_enumeration
      description: Evidence explicitly enumerates the complete set of possible states,
        values, or lifecycle stages for a dynamic entity (e.g., all possible scores,
        all evolution steps, all valid configurations) required to verify or exclude
        options based on the system's rules, rather than merely showing the entity
        in a single current state or a subset of its possible values.
      score_1: The evidence explicitly lists or demonstrates the full range of possible
        states or values the entity can take (e.g., 'values 1 through 5', 'evolves
        from 4 to 3 to 2 to 1'), allowing verification of which options are valid
        within the system and which are excluded.
      score_half: The evidence shows the entity in multiple states or mentions some
        possible values, but fails to explicitly confirm the complete range or the
        rules governing the full lifecycle, leaving ambiguity about whether unshown
        values are possible or excluded.
      score_0: The evidence only shows the entity in a single state or a limited subset
        of values without any information regarding the full range of possibilities
        or the rules defining the entity's lifecycle, making it impossible to determine
        if an option is excluded based on the system's constraints.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Temporal Perception:
    rubric_criteria:
    - name: temporal_boundary_alignment
      description: Evidence timestamps explicitly fall within or bracket the specific
        time interval queried (e.g., 'first minute', 'end of video', 'between X and
        Y'), rather than covering the topic at unrelated times.
      score_1: All evidence used to verify or exclude options is temporally located
        within the queried interval.
      score_half: Some evidence is within the interval, but key verification relies
        on evidence outside the interval or the interval boundaries are ambiguous.
      score_0: Evidence is entirely from outside the queried time interval, making
        it impossible to determine the content of the specific moment requested.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: thematic_stance_alignment
      description: Evidence explicitly captures the specific qualitative stance, perspective,
        or thematic focus (e.g., praise vs. criticism, summary vs. detail, cause vs.
        effect) asserted by the option, rather than merely mentioning the topic with
        a conflicting or neutral stance.
      score_1: Evidence explicitly demonstrates the specific stance or thematic focus
        required to verify or exclude the option.
      score_half: Evidence mentions the topic but the specific stance is ambiguous,
        implied, or partially conflicting with the option's claim.
      score_0: Evidence presents a stance or theme that directly contradicts the option's
        claim (e.g., criticism when the option claims praise) or is entirely neutral
        where a specific stance is required.
      weight: 3.0
      failure_repair_action: refine_query
    - name: sequential_origin_grounding
      description: Evidence explicitly captures the immediate temporal sequence or
        transition required to verify an origin claim (e.g., 'from X', 'after Y',
        'leading to Z'), rather than merely showing the entity or state in isolation
        at unrelated times.
      score_1: Evidence explicitly shows the specific preceding state or action immediately
        before the queried event, establishing the direct sequence.
      score_half: Evidence shows the entity or state but the immediate preceding moment
        is missing, ambiguous, or separated by a significant gap, making the origin
        unclear.
      score_0: Evidence shows the entity or state only after the event or in isolation,
        with no information about the preceding sequence.
      weight: 3.0
      failure_repair_action: time_sorted
    - name: comparative_magnitude_grounding
      description: Evidence explicitly provides the comparative data (e.g., duration,
        frequency, relative emphasis, or explicit ranking) required to verify or exclude
        superlative or comparative claims (e.g., 'most', 'least', 'more than'), rather
        than merely showing the entities involved in isolation.
      score_1: Evidence explicitly demonstrates the relative magnitude or ranking
        required to verify the superlative/comparative claim (e.g., showing the longest
        duration for the target, or explicitly stating it is the most featured).
      score_half: Evidence shows the target entity with significant detail but lacks
        explicit comparison to other options or quantitative data (e.g., duration
        counts) to definitively establish the superlative.
      score_0: Evidence shows the entities involved but provides no comparative data,
        duration, or ranking information, making it impossible to determine which
        option satisfies the superlative/comparative condition.
      weight: 3.0
      failure_repair_action: refine_query
    - name: state_transition_grounding
      description: Evidence explicitly captures the dynamic change in state, status,
        or relative standing (e.g., overtaking, switching leads, changing direction)
        required to verify the event, rather than merely showing static states before
        or after the change.
      score_1: Evidence explicitly shows the moment of transition or provides data
        points immediately before and after the change that definitively bracket the
        event.
      score_half: Evidence shows the state before or after the change, but the specific
        moment of transition is missing, ambiguous, or separated by a significant
        gap.
      score_0: Evidence only shows static states that do not demonstrate the change
        (e.g., only showing the winner, or only showing the loser, without the crossover
        point).
      weight: 3.0
      failure_repair_action: time_sorted
    - name: narrative_scope_alignment
      description: Evidence explicitly covers the specific narrative segment, phase,
        or story arc (e.g., 'the first half', 'the opening minutes', 'the climax')
        required to verify or exclude options about a specific part of an event, rather
        than covering the general topic, history, or unrelated phases of the event.
      score_1: Evidence explicitly addresses the specific narrative phase or segment
        queried (e.g., describing the state of play in the first half when asked about
        the beginning).
      score_half: Evidence mentions the event or topic but the specific narrative
        phase is ambiguous, implied, or mixed with other phases, making it unclear
        if the specific claim holds for the queried segment.
      score_0: Evidence covers the general topic, history, or other phases of the
        event but entirely misses the specific narrative segment required to verify
        or exclude the option.
      weight: 3.0
      failure_repair_action: refine_query
    - name: outcome_finality_grounding
      description: Evidence explicitly captures the final outcome, terminal state,
        or ultimate result of the event or process described in the options, rather
        than only showing intermediate states or the beginning of the sequence.
      score_1: Evidence explicitly states or shows the final result (e.g., final score,
        winner, ultimate fate) required to verify or exclude options that depend on
        the event's conclusion.
      score_half: Evidence shows the progression or intermediate states but the final
        outcome is ambiguous, implied, or missing, making it impossible to confirm
        options about the ultimate result.
      score_0: Evidence only covers the beginning or middle of the event with no information
        about the final outcome, rendering options about the result unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_label_co_location
      description: Evidence explicitly links the specific temporal label (e.g., day
        of week, date, time of day) to the specific event instance queried, rather
        than presenting the label and the event in disjoint segments or relying on
        inference across separate clips.
      score_1: The evidence segment containing the event explicitly states or displays
        the specific temporal label required to verify or exclude the option.
      score_half: The event and the temporal label are present in the evidence but
        in separate segments, requiring inference to link them, or the label is ambiguous.
      score_0: The evidence shows the event without any temporal label, or shows a
        temporal label for a different event, making it impossible to assign the correct
        time to the specific event.
      weight: 3.0
      failure_repair_action: refine_query
    scoring_rule: average
    sufficient_threshold: 0.8
  Information Synopsis:
    rubric_criteria:
    - name: narrative_scope_completeness
      description: Evidence explicitly covers the full temporal span, thematic range,
        or lifecycle stages (e.g., origin to outcome, rise and fall) asserted by the
        synopsis option, rather than only a partial segment.
      score_1: Evidence explicitly addresses all phases or the complete scope required
        by the option (e.g., both the beginning and end of a process).
      score_half: Evidence covers a significant portion of the scope but misses a
        key phase (e.g., covers the decline but not the rise).
      score_0: Evidence is limited to a single phase or fragment, insufficient to
        verify a full-scope synopsis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_scope_declaration
      description: Evidence contains an explicit statement (narration or text) that
        defines the video's intended scope, thesis, or lifecycle coverage (e.g., 'this
        video covers the rise and fall'), rather than requiring the verifier to infer
        the scope solely from the sequence of events shown.
      score_1: Evidence includes a clear, explicit declaration of the video's full
        scope or thesis that matches the option's claim.
      score_half: Evidence implies the scope through a sequence of events but lacks
        an explicit statement defining the intended coverage.
      score_0: Evidence contains no statement defining the video's scope or thesis,
        making it impossible to verify a 'main idea' claim about the full narrative
        arc.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thematic_contextual_grounding
      description: Evidence explicitly links the specific visual or auditory elements
        to the broader theme, historical period, or causal process asserted by the
        option, rather than presenting them as isolated facts or generic scenes.
      score_1: Evidence explicitly connects the observed elements to the option's
        theme (e.g., stating a specific object represents a specific era or process).
      score_half: Evidence shows the elements and the theme separately, but the explicit
        link between them is implied or weak.
      score_0: Evidence presents the elements in isolation without any explicit connection
        to the option's theme, making the thematic claim unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: thesis_vs_detail_distinction
      description: Evidence explicitly distinguishes the video's central thesis or
        primary theme from supporting details, examples, or sub-topics, rather than
        presenting all elements as equally weighted facts.
      score_1: Evidence contains explicit framing (narration, text, or structural
        cues) that identifies a specific claim as the main theme while positioning
        other elements as supporting evidence or examples.
      score_half: Evidence presents the theme and details but lacks explicit framing
        to distinguish the primary focus from secondary elements, requiring inference
        to determine the main idea.
      score_0: Evidence consists only of isolated facts, examples, or sub-topics without
        any indication of a unifying central thesis or primary theme.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_scope_verification
      description: Evidence explicitly establishes the relative breadth, hierarchy,
        or comparative limits of the video's content (e.g., 'global vs. local', 'entire
        history vs. single era') to distinguish the correct synopsis from narrower
        or broader distractors.
      score_1: Evidence explicitly states or demonstrates the comparative scope (e.g.,
        'covers X, Y, and Z' vs. 'only X'), allowing the verifier to rule out options
        that are too narrow or too broad.
      score_half: Evidence suggests a broad scope through examples but lacks explicit
        comparative framing or limits to definitively exclude narrower/broader options.
      score_0: Evidence presents isolated topics without any indication of their relative
        weight or the total scope, making it impossible to distinguish the main idea
        from a sub-topic.
      weight: 3.0
      failure_repair_action: refine_query
    - name: explicit_conflict_framing
      description: Evidence explicitly establishes the opposing forces, tensions,
        or relational dynamic (e.g., 'X vs. Y', 'struggle between A and B') that constitutes
        the central conflict or theme, either through explicit narration/text OR through
        visual/auditory enactment of the interaction (e.g., physical struggle, direct
        confrontation), rather than merely listing the entities or topics involved
        in isolation.
      score_1: Evidence contains explicit narration, text, or clear visual/auditory
        enactment defining the specific conflict, opposition, or tension between the
        elements mentioned in the option.
      score_half: Evidence presents the elements involved in the conflict but lacks
        an explicit statement or clear visual enactment defining the nature of their
        opposition or the central tension.
      score_0: Evidence lists the entities or topics without any indication of a conflict,
        opposition, or relational dynamic between them (e.g., entities appear in separate
        scenes or without interaction).
      weight: 3.0
      failure_repair_action: refine_query
    - name: attribution_grounding
      description: Evidence explicitly links the specific claim, argument, or viewpoint
        asserted in the option to the named entity (person, group, or source) mentioned
        in the question or option, rather than presenting the claim as a general fact
        or attributing it to an unspecified source.
      score_1: Evidence explicitly states or visually identifies that the specific
        named entity holds the view or made the claim in the option.
      score_half: Evidence presents the claim and the entity in the same context but
        lacks an explicit link (e.g., the entity is present but the claim is narrated
        without attribution, or the claim is attributed to 'experts' generally).
      score_0: Evidence presents the claim without any link to the specific named
        entity, or attributes the claim to a different entity.
      weight: 3.0
      failure_repair_action: refine_query
    - name: comparative_attribute_grounding
      description: Evidence explicitly links the specific attributes, properties,
        or characteristics asserted in the option (e.g., 'stability', 'volatility',
        'innovation') to the specific entities or viewpoints involved in the contrast,
        rather than merely listing the attributes or the entities in isolation.
      score_1: Evidence explicitly states that Viewpoint A holds Attribute X and Viewpoint
        B holds Attribute Y (or explicitly contrasts X vs Y between the parties).
      score_half: Evidence mentions the attributes and the viewpoints but does not
        explicitly link specific attributes to specific viewpoints, requiring inference
        to determine the nature of the contrast.
      score_0: Evidence lists attributes or viewpoints without establishing which
        attribute belongs to which viewpoint, making the specific difference unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: strategic_intent_articulation
      description: Evidence explicitly states the specific strategic model, business
        approach, or target demographic of the entity in question, distinguishing
        it from generic industry facts, competitor actions, or general operational
        details that do not define the entity's unique direction.
      score_1: Evidence contains an explicit statement defining the entity's specific
        strategy, model, or target focus, clearly distinguishing it from general industry
        norms or competitor behaviors.
      score_half: Evidence implies a strategy through a sequence of actions or mentions
        the entity's goals vaguely, but lacks a clear, explicit definition that distinguishes
        the entity's specific model from general industry practices.
      score_0: Evidence consists only of general industry facts, competitor data,
        or isolated operational details without any explicit statement of the entity's
        specific strategic direction or business model.
      weight: 3.0
      failure_repair_action: refine_query
    - name: target_perspective_isolation
      description: Evidence explicitly isolates the specific viewpoint, concern, or
        argument of the target group or entity mentioned in the question, clearly
        distinguishing it from opposing, neutral, or alternative perspectives presented
        in the video, rather than presenting a mixed set of conflicting views without
        attribution to the specific target.
      score_1: Evidence clearly attributes the specific claim to the target group
        and excludes or explicitly contrasts it with opposing views, allowing the
        target's 'main concern' to be verified without ambiguity.
      score_half: Evidence presents the target group's view but also includes significant
        opposing or alternative views without clear distinction, making it difficult
        to determine if the target's view is the 'main' one or just one of many.
      score_0: Evidence presents a mix of conflicting viewpoints without attributing
        them to specific groups, or attributes the claim to a group other than the
        target, making the target's specific concern unverifiable.
      weight: 3.0
      failure_repair_action: refine_query
    - name: causal_rationale_articulation
      description: Evidence explicitly states the causal mechanism, logical reasoning,
        or specific rationale that justifies the viewpoint, concern, or argument attributed
        to the target entity, rather than merely stating the conclusion or the context
        in which it arises.
      score_1: Evidence explicitly describes the 'why' or 'how' (the causal chain
        or logical steps) that leads the target entity to hold the specific view or
        concern.
      score_half: Evidence states the view and the context but implies the reasoning
        or provides only a partial explanation of the causal mechanism.
      score_0: Evidence states the view or concern but provides no explicit reasoning,
        mechanism, or logical justification for why the target entity holds that position.
      weight: 3.0
      failure_repair_action: refine_query
    - name: superlative_scope_grounding
      description: Evidence explicitly contains superlative, absolute, or unique scope
        markers (e.g., 'most', 'best', 'only', 'in the history of', 'any') required
        to verify or exclude options that claim a unique, top-tier, or absolute status
        for the subject, rather than merely presenting comparative or partial evidence.
      score_1: Evidence explicitly states the superlative or absolute claim (e.g.,
        'the most X in history') that matches the option's scope.
      score_half: Evidence suggests a high degree or strong comparison but lacks the
        explicit superlative or absolute language required to verify the 'main' or
        'unique' status.
      score_0: Evidence presents only specific examples, partial comparisons, or generic
        facts without any superlative or absolute markers, making it impossible to
        verify a claim of unique or top-tier status.
      weight: 3.0
      failure_repair_action: refine_query
    - name: temporal_trajectory_continuity
      description: Evidence explicitly connects the distinct phases of a process,
        history, or lifecycle (e.g., origin, development, crisis, resolution) into
        a coherent narrative arc, rather than presenting only isolated snapshots of
        the beginning and end or disjointed events.
      score_1: Evidence explicitly links the start, middle, and end phases, demonstrating
        the causal or chronological progression required to verify a 'history' or
        'evolution' synopsis.
      score_half: Evidence covers the start and end phases but lacks explicit connection
        or coverage of the critical intermediate stages, making the full trajectory
        unverifiable.
      score_0: Evidence presents only isolated time points (e.g., just the origin
        or just the current state) with no indication of the intervening process or
        evolution.
      weight: 3.0
      failure_repair_action: refine_query
    - name: opening_framing_inclusion
      description: Evidence includes the video's opening segment (title card, intro
        narration, or initial hook) that explicitly establishes the primary topic,
        thesis, or scope, rather than relying solely on mid-video or concluding content
        where the main idea may be obscured by details or sub-topics.
      score_1: Evidence contains the opening segment with explicit framing (title,
        intro statement) that defines the video's main focus.
      score_half: Evidence includes the opening segment but the framing is implicit,
        or evidence starts slightly after the opening but captures the immediate context.
      score_0: Evidence begins mid-video or later, lacking the initial framing necessary
        to verify the 'main focus' or primary thesis.
      weight: 3.0
      failure_repair_action: refine_query
    - name: central_inquiry_framing
      description: Evidence explicitly contains the central question, problem statement,
        or investigative hook that the video seeks to address (e.g., 'Can X do Y?',
        'Why is Z happening?'), rather than only presenting the subject matter, background
        facts, or the final conclusion without the framing inquiry.
      score_1: Evidence explicitly states the core question or problem that defines
        the video's scope and purpose, allowing the verifier to confirm the 'main
        focus' is an investigation of that specific issue.
      score_half: Evidence implies the topic or presents the conclusion but lacks
        the explicit framing question or problem statement that defines the video's
        investigative intent.
      score_0: Evidence presents only background facts, definitions, or isolated details
        without any indication of the central question or problem the video is designed
        to answer.
      weight: 3.0
      failure_repair_action: refine_query
    - name: negative_scope_verification
      description: Evidence explicitly establishes the boundaries of the discussed
        content (e.g., a complete list of items, a defined set of criticisms, or a
        stated scope) sufficient to verify that a specific claim is absent or not
