    description: Whether evidence explicitly articulates the specific internal emotional, psychological, or mental states (e.g., anxiety, stress, confidence, joy, fear) of the target entity at different points in the narrative, rather than relying solely on external visual cues, actions, or generic descriptions of change.
    score_1: Evidence explicitly states or quotes the specific internal states (e.g., 'feeling burdened,' 'afraid of the present,' 'no longer stressing') that define the transformation, allowing the specific emotional arc to be verified.
    score_half: Evidence implies an internal change through context or generic statements (e.g., 'feeling whole,' 'happy') but lacks the specific terminology or explicit articulation of the distinct emotional states required to distinguish between similar options.
