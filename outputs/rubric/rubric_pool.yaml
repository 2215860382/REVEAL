  - name: evidence_mechanism_specificity
    description: Whether evidence explicitly depicts the specific physical mechanism, tool, or mode of interaction (e.g., thrown by hand, hit with a bat, slid on a rope) required to verify or exclude options that differ by method rather than just outcome.
    score_1: Evidence explicitly shows the target entity undergoing the specific physical mechanism or tool interaction described in the option (e.g., clearly showing a hand releasing the object vs. a bat striking it).
