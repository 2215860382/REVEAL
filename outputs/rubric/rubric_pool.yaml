  - name: specific_action_grounding
    description: Whether evidence explicitly depicts or states the specific action, event, or activity asserted in the option, rather than showing only related but different activities or generic context.
    score_1: Evidence explicitly shows or states the exact action/event described in the option (e.g., browsing a specific category of items, performing a specific gesture), allowing direct verification.
