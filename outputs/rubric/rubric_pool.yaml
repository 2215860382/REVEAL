  - name: explicit_activity_definition
    description: Whether evidence contains an explicit verbal or textual statement that directly names or defines the specific activity, sport, or event type being depicted, rather than relying solely on visual cues that could apply to multiple similar options.
    score_1: Evidence includes a clear statement (spoken or text) explicitly naming the specific activity or event type (e.g., 'street hockey game', 'football match'), allowing direct verification of the correct option and exclusion of visually similar distractors.
    score_half: Evidence contains strong visual cues or partial mentions of the activity but lacks a definitive explicit statement naming the specific type, leaving ambiguity between similar options.
