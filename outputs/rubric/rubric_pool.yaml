    failure_repair_action: refine_query
  - name: narrative_arc_synthesis
    description: Whether evidence explicitly links the narrative's starting context or origin to its final resolution or outcome, synthesizing a coherent trajectory (e.g., a journey, evolution, or life story) rather than merely presenting isolated segments from different time periods.
    score_1: Evidence explicitly connects the initial state/origin to the final outcome, allowing the model to verify a 'journey' or 'evolution' synopsis by seeing the causal or temporal link between start and finish.
    score_half: Evidence contains elements of both the beginning and the end but fails to explicitly link them as a continuous narrative arc, presenting them as disjointed facts.
