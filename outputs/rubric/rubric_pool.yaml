    score_1: The evidence explicitly confirms the action occurs within the specific time window claimed (e.g., visual cues of morning, explicit time stamps, or dialogue confirming the time).
    score_half: The evidence shows the action occurring but the specific time of day is ambiguous, generic, or not explicitly linked to the claimed window (e.g., shows the action but time is unknown or could be any time).
    score_0: The evidence shows the action occurring at a time that contradicts the option's claim, or provides no temporal information to verify the specific time window.
    weight: 3.0
    failure_repair_action: refine_query
  - name: temporal_ordering_explicitness
    description: Whether the evidence explicitly establishes the relative temporal order (e.g., 'first', 'last', 'most recent', 'before X', 'after Y') of the target event among multiple occurrences, rather than merely showing the event occurring at an unspecified point in time.
    score_1: The evidence explicitly confirms the event is the specific instance claimed (e.g., the last time, the first time) by showing it occurs after all other instances or by explicitly stating its rank in the sequence.
    score_half: The evidence shows the event occurring but does not establish its relative order (e.g., shows one instance but it is unclear if it is the last, or shows multiple instances without clarifying which is the target).
    score_0: The evidence shows the event occurring at a time that contradicts the claimed order (e.g., shows an earlier instance when 'last' is claimed) or provides no temporal context to distinguish between multiple occurrences.
    weight: 3.0
    failure_repair_action: refine_query
  - name: decision_criteria_explicitness
    description: Whether the evidence explicitly states the specific criteria, rule, or mechanism the agent uses to make a selection or decision (e.g., 'I follow others', 'I choose based on price', 'I decide alone'), rather than merely showing the agent making a choice, discussing options, or stating a preference for the outcome.
    score_1: The evidence explicitly contains a statement or clear visual cue identifying the specific decision rule or criteria the agent uses (e.g., 'I usually ask others', 'I pick the cheapest').
    score_half: The evidence shows the agent making a choice or discussing options, but the specific rule or criteria guiding the decision is implied, ambiguous, or not explicitly stated.
    score_0: The evidence shows the agent making a choice or the outcome of a choice, but provides no information about the criteria, rule, or mechanism used to arrive at that decision.
    weight: 3.0
    failure_repair_action: refine_query
  - name: variant_subtype_explicitness
    description: Whether the evidence explicitly identifies the specific sub-type, variant, or preparation method of the object/action asserted in the option (e.g., 'Laba garlic' vs. 'sweet garlic', 'durian pizza' vs. 'Hawaiian pizza'), rather than merely mentioning the general category or a different variant.
    score_1: The evidence explicitly names or visually resolves the specific sub-type/variant required to verify or exclude the option.
    score_half: The evidence mentions the general category or a different variant, but the specific sub-type/variant asserted in the option is not explicitly identified or linked to the agent's stance.
    score_0: The evidence mentions only the general category, a different variant, or fails to identify the specific sub-type/variant, making it impossible to distinguish between options differing by that granularity.
    weight: 3.0
    failure_repair_action: refine_query
  - name: specific_companion_identification
    description: Whether the evidence explicitly identifies the specific companion or partner associated with the habitual action, distinguishing them from other present agents, rather than merely showing a generic group activity where the specific habitual partner is ambiguous.
    score_1: The evidence explicitly links the specific agent to the habitual action (e.g., showing them leading the activity, explicitly stating 'I usually go with X', or a pattern of interaction that uniquely identifies them as the partner).
    score_half: The evidence shows the agent participating in the activity with the group, but does not explicitly distinguish them as the specific habitual partner (e.g., shows a group shopping but no specific role or statement linking the habit to one person).
    score_0: The evidence shows a group activity or mentions the action but fails to identify any specific companion, or the agent is not shown participating in the activity at all.
    weight: 3.0
    failure_repair_action: refine_query
  - name: item_habitual_status_explicitness
    description: Whether the evidence explicitly asserts that the specific object or category in the option is a recurring, staple, or habitual purchase for the agent (e.g., 'I always buy X', 'I eat X often', 'X is a staple'), rather than merely listing it as an item for a single, specific trip or discussing it in a one-off context.
    score_1: The evidence explicitly states or demonstrates that the specific option is a habitual or staple purchase for the agent (e.g., 'I always buy this', 'I eat this often', 'This is what I usually get').
    score_half: The evidence shows the agent purchasing or discussing the item, but the context is ambiguous regarding whether it is a habit or a one-time purchase (e.g., listed on a shopping list without frequency qualifiers, or discussed as a current need without 'always/often' markers).
    score_0: The evidence shows the item being discussed or purchased only as a one-time instance, or the agent explicitly states it is not a regular purchase, failing to verify the 'every time' or habitual claim.
    weight: 3.0
    failure_repair_action: refine_query
  - name: outcome_realization_explicitness
    description: Whether the evidence explicitly shows the completion of the target action or the resulting state change (e.g., the agent is inside the vehicle, the item is purchased, the destination is reached) rather than merely showing the intent, discussion, planning, or partial steps leading up to it.
    score_1: The evidence explicitly depicts the agent having completed the action or being in the resulting state asserted by the option (e.g., riding in the car, holding the purchased item, standing at the destination).
    score_half: The evidence shows the agent discussing, planning, or performing intermediate steps toward the action, but the final completion or resulting state is not explicitly shown (e.g., hailing a taxi but not getting in, or discussing a purchase but not showing the transaction).
    score_0: The evidence only shows the intent, discussion, or planning of the action, or shows a different outcome entirely, making it impossible to verify that the specific action was actually completed.
    weight: 3.0
    failure_repair_action: refine_query
  - name: acquisition_intent_explicitness
    description: Whether the evidence explicitly confirms the intent to acquire (buy, order, obtain) the specific item in the option, rather than merely mentioning the item in a context of existing inventory, recipe requirements, or general discussion.
    score_1: The evidence explicitly states or shows the decision/action to acquire the item (e.g., 'let's buy', 'add to list', 'order this').
    score_half: The evidence mentions the item in a planning context but the specific intent to acquire (vs. use existing) is ambiguous or implied.
    score_0: The evidence only mentions the item in a context of existing inventory, hypothetical use, or general discussion without confirming an acquisition plan.
    weight: 3.0
    failure_repair_action: refine_query
  - name: plan_artifact_grounding
    description: Whether the evidence explicitly shows a recorded plan artifact (e.g., written list, digital note, order confirmation, whiteboard entry) that enumerates the specific items to be acquired, rather than relying solely on conversational mentions or hypothetical discussions.
    score_1: The evidence explicitly displays a recorded list or artifact containing the specific items in the options, allowing for direct verification or exclusion based on presence/absence.
    score_half: The evidence shows a planning context (e.g., discussing a list) but the specific artifact or the full list of items is not clearly visible or legible.
    score_0: The evidence only contains conversational mentions of items without any visible recorded plan, list, or confirmation artifact.
    weight: 4.0
    failure_repair_action: dense_sample
  - name: plan_enumeration_completeness
    description: Whether the evidence presents a complete or sufficiently exhaustive enumeration of the planned items (e.g., a full list, a finalized set of written items) that allows for the exclusion of options not explicitly included, rather than merely mentioning a subset or discussing items in isolation.
    score_1: The evidence displays a definitive list or set of planned items that is presented as complete or exhaustive for the context, allowing unlisted options to be excluded.
    score_half: The evidence shows a list or plan being discussed or partially written, but it is unclear if the list is complete or if other items might be added later.
    score_0: The evidence only mentions individual items in conversation or shows a plan artifact that is empty, illegible, or clearly incomplete, preventing the exclusion of unmentioned options.
    weight: 4.0
    failure_repair_action: dense_sample
  - name: plan_action_explicitness
    description: Whether the evidence explicitly states the specific nature of the planned activity (the core action or task) rather than merely mentioning a generic category, related objects, or hypothetical scenarios.
    score_1: The evidence explicitly asserts the specific action or task to be performed (e.g., 'distinguish water', 'play a game', 'cook dinner').
    score_half: The evidence mentions a generic category of activity or related objects but the specific core action remains ambiguous or implied.
    score_0: The evidence only discusses generic concepts, unrelated objects, or hypothetical ideas without confirming a specific planned action.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_temporal_grounding
    description: Whether the evidence explicitly grounds the planned activity to the specific queried time window (e.g., 'tomorrow', 'next week', 'later today') rather than describing a current activity, a generic future possibility, or an activity with an unspecified time.
    score_1: The evidence explicitly states or implies the specific time window for the planned activity matches the query (e.g., 'we will do X tomorrow').
    score_half: The evidence mentions a future plan but the specific time window is ambiguous, generic (e.g., 'someday', 'later'), or not clearly linked to the queried moment.
    score_0: The evidence only describes current activities, past events, or generic future ideas without anchoring the plan to the specific queried time window.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_parameter_confirmation
    description: Whether the evidence explicitly confirms the specific numerical value, quantity, or parameter of the plan as a finalized fact or executed outcome, rather than merely presenting it as a proposal, estimate, subject of debate, hypothetical scenario, or anecdote.
    score_1: The evidence explicitly confirms the specific value/quantity as the final, agreed-upon, or executed fact (e.g., 'we will get X', 'it is X', 'confirmed X'), resolving any ambiguity from hypothetical or anecdotal mentions.
    score_half: The evidence mentions a specific value in a planning context, but it is presented as a proposal, estimate, subject of debate, or part of a hypothetical scenario/anecdote without explicit confirmation of the final outcome.
    score_0: The evidence discusses the plan without mentioning specific values, or the values mentioned are clearly hypothetical, rejected, ambiguous, or part of a story without confirmation of reality.
    weight: 4.0
    failure_repair_action: refine_query
  - name: target_status_confirmation
    description: Whether the evidence explicitly confirms the current status of the target item (e.g., depleted, missing, consumed, or unavailable) that necessitates the planned acquisition, rather than merely showing the item in a generic context or assuming its absence.
    score_1: The evidence explicitly states or shows the item is currently missing, depleted, or unavailable, directly justifying the plan to acquire it.
    score_half: The evidence implies the item might be needed or discusses it in a planning context, but the specific status (missing vs. present) is not explicitly confirmed.
    score_0: The evidence shows the item in a generic context, as already present, or fails to establish whether the item is missing or available, leaving the necessity of the plan ambiguous.
    weight: 3.0
    failure_repair_action: refine_query
  - name: plan_object_identity_explicitness
    description: Whether the evidence explicitly states the specific identity of the object or item involved in the plan, rather than mentioning a related category, a similar item, or a generic placeholder.
    score_1: The evidence explicitly names the specific object/item that is the subject of the plan (e.g., 'daffodil bulb' vs. just 'flower' or 'seeds').
    score_half: The evidence mentions a related category, a similar item, or a generic term for the object, but the specific identity required to distinguish between options is not explicitly stated.
    score_0: The evidence discusses the plan without mentioning the specific object identity, or only mentions unrelated objects.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_object_action_binding
    description: Whether the evidence explicitly links the specific object or item to the specific planned action, role, or purpose (e.g., 'auctioning X', 'giving X as a prize', 'buying X for Y'), rather than mentioning the object and the action in separate or unconnected contexts.
    score_1: The evidence explicitly states that the specific object is the target of the specific planned action or role (e.g., 'we will auction the daffodils', 'the prize is a bulb').
    score_half: The evidence mentions the specific object and the planned action separately, or implies a connection, but does not explicitly bind them together.
    score_0: The evidence mentions the object and the action in unrelated contexts, or fails to mention one of them, leaving the specific target of the plan ambiguous.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_purpose_explicitness
    description: Whether the evidence explicitly states the specific purpose, goal, or intended outcome of the planned activity (the 'why'), rather than merely describing the activity itself, mentioning related objects, or discussing hypothetical uses.
    score_1: The evidence explicitly asserts the specific reason or goal for the plan (e.g., 'to entertain', 'as a prize', 'to teach X').
    score_half: The evidence describes the activity or mentions a potential use, but the definitive purpose or intent is ambiguous, implied, or presented as a suggestion rather than a confirmed plan.
    score_0: The evidence only describes the activity or objects without any mention of the underlying purpose, goal, or intended outcome.
    weight: 4.0
    failure_repair_action: refine_query
  - name: acquisition_negation_explicitness
    description: Whether the evidence explicitly confirms the failure to acquire a specific item (e.g., 'not found', 'out of stock', 'did not buy', 'bought online instead') rather than merely mentioning the item in a planning context or showing its presence without a purchase decision.
    score_1: The evidence explicitly states or shows that the specific item was not acquired (e.g., confirmed unavailability, explicit decision to skip, or alternative acquisition method stated).
    score_half: The evidence mentions the item in a shopping context but the outcome (bought vs. not bought) is ambiguous, implied, or not explicitly resolved.
    score_0: The evidence only mentions the item as a plan or shows it in the environment without confirming whether it was acquired or explicitly excluded.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_commitment_explicitness
    description: Whether the evidence explicitly confirms the planned activity as a finalized decision or committed plan, rather than presenting it as a proposal, suggestion, hypothetical option, or subject of debate.
    score_1: The evidence explicitly states the activity as a confirmed plan or decision (e.g., 'we will do X', 'let's do X', 'the plan is X').
    score_half: The evidence mentions the activity in a planning context but the status is ambiguous, presented as a suggestion, or part of a debate without a clear final decision.
    score_0: The evidence only presents the activity as a hypothetical, a rejected option, a question, or a mere possibility without confirming it as the actual plan.
    weight: 4.0
    failure_repair_action: refine_query
  - name: resource_activity_feasibility_binding
    description: Whether the evidence explicitly links the physical presence or availability of a specific resource (object, space, equipment) to the feasibility or permission of a specific activity, rather than merely mentioning the activity or the resource in isolation.
    score_1: The evidence explicitly states that the presence/availability of a specific resource enables, allows, or makes possible the specific activity (e.g., 'there are pillows, so a pillow fight is possible').
    score_half: The evidence mentions both the resource and the activity in the same context, but the explicit causal or enabling link (that the resource makes the activity possible) is implied rather than stated.
    score_0: The evidence mentions the activity without referencing the necessary resources, or mentions resources without linking them to the specific activity's feasibility.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_sequence_explicitness
    description: Whether the evidence explicitly confirms the sequential order of events, specifically stating that the target activity occurs after (or before) the reference event mentioned in the query, rather than merely mentioning both events in the same context without establishing their temporal relationship.
    score_1: The evidence explicitly states or implies the specific order (e.g., 'after X, we do Y', 'next is Y', 'once X is done, then Y'), allowing the target activity to be verified as the immediate successor or predecessor.
    score_half: The evidence mentions both the reference event and the target activity in the same planning context, but the specific order is ambiguous, implied, or not explicitly linked.
    score_0: The evidence mentions the reference event or the target activity in isolation, or mentions both without any indication of their temporal sequence, making it impossible to determine what happens after the reference event.
    weight: 4.0
    failure_repair_action: refine_query
  - name: inventory_status_verification
    description: Whether the evidence explicitly confirms the current inventory status (present/available vs. missing/unavailable) of the specific items in the options, allowing for the exclusion of items already possessed and the verification of items that need to be acquired.
    score_1: The evidence explicitly states whether each option item is currently available in the group's possession or missing, enabling the exclusion of present items and confirmation of needed ones.
    score_half: The evidence implies the status of some items (e.g., through context of shopping) but does not explicitly confirm the presence or absence of specific options, leaving ambiguity about whether they are already owned.
    score_0: The evidence discusses items only in the context of hypothetical use, general shopping, or mixing recipes without establishing whether the items are currently available or need to be acquired.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_deadline_date_explicitness
    description: Whether the evidence explicitly states the specific calendar date, day number, or numerical deadline for the planned activity, rather than merely mentioning a relative time frame (e.g., 'tomorrow', 'soon'), a generic future period, or the activity without any temporal anchor.
    score_1: The evidence explicitly states the specific date or numerical deadline (e.g., 'on the 24th', 'by Friday', 'at 5 PM') required to verify or exclude the option.
    score_half: The evidence mentions a relative time frame (e.g., 'tomorrow', 'later') or a general future period, but the specific date or numerical deadline is not explicitly stated, making it impossible to verify options dependent on a specific date.
    score_0: The evidence mentions the planned activity but provides no temporal anchor, or the time mentioned is clearly unrelated to the specific deadline in the query.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_task_identity_explicitness
    description: Whether the evidence explicitly states the specific identity of the planned task, assignment, or deliverable (e.g., 'graduation design', 'research paper', 'group project') rather than merely mentioning a generic action, a related category, or an inferred object.
    score_1: The evidence explicitly names the specific task or deliverable that is the subject of the plan, allowing for direct verification or exclusion of options with different task identities.
    score_half: The evidence mentions the planned action or a generic category (e.g., 'submit something', 'write a paper') but the specific identity required to distinguish between options is ambiguous, implied, or stated only as a guess by another speaker.
    score_0: The evidence mentions the plan or action without any specific identification of the task or deliverable, or the identity is entirely absent.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_selection_confirmation
    description: Whether the evidence explicitly confirms the selection of a specific planned activity or artifact from a set of mentioned possibilities, rather than merely listing multiple valid options as hypothetical examples or general capabilities without indicating which one is the actual plan.
    score_1: The evidence explicitly identifies one specific option as the confirmed plan (e.g., via physical execution, explicit selection statement, or exclusion of other mentioned possibilities), distinguishing it from other valid but unchosen alternatives.
    score_half: The evidence mentions multiple options as possibilities or examples, and one is implied to be the plan, but the explicit selection or execution of that specific option over the others is not clearly confirmed.
    score_0: The evidence lists multiple options as valid possibilities or examples (e.g., 'we can do A, B, or C') without any indication of which specific one is the actual plan, making it impossible to distinguish the correct option from the distractors.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_output_artifact_identity
    description: Whether the evidence explicitly identifies the specific identity of the final product, artifact, or output resulting from the planned activity, rather than merely describing the process, mentioning generic categories, or listing unrelated items.
    score_1: The evidence explicitly names or shows the specific final artifact or product that the plan aims to create (e.g., 'postcards', 'a framed picture', 'a cake'), allowing for direct verification or exclusion of options with different output identities.
    score_half: The evidence describes the process or mentions a generic category of output (e.g., 'something to keep', 'a decoration') but the specific identity required to distinguish between options is ambiguous, implied, or not explicitly stated.
    score_0: The evidence discusses the planning process or input materials without identifying the specific final product or artifact, or only mentions unrelated items, making it impossible to determine the specific output.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_theme_identity_explicitness
    description: Whether the evidence explicitly states the specific theme, style, or conceptual category (e.g., 'forest', 'space', 'animal', 'dopamine') defining the planned activity, rather than merely mentioning related objects, generic descriptions, or themes in a different context.
    score_1: The evidence explicitly names or confirms the specific theme or style category that defines the plan (e.g., 'it's an animal theme', 'forest style').
    score_half: The evidence mentions objects or descriptions consistent with a theme, or mentions a theme in a different context, but does not explicitly confirm that specific theme as the defining identity of the current plan.
    score_0: The evidence discusses the plan without mentioning any specific theme, style, or conceptual category, or only mentions unrelated themes.
    weight: 4.0
    failure_repair_action: refine_query
  - name: comparative_priority_explicitness
    description: Whether the evidence explicitly states a comparative priority, relative weighting, or trade-off between the competing domains or options presented, rather than merely mentioning each domain in isolation or discussing them as general topics without establishing a hierarchy.
    score_1: The evidence explicitly asserts a relative ranking, preference, or trade-off (e.g., 'focus more on X than Y', 'X is priority, Y is secondary', 'balance X and Y equally'), allowing the specific comparative claim in the option to be verified or excluded.
    score_half: The evidence mentions multiple domains or options and implies a preference through tone or context, but the explicit comparative relationship or relative weighting is not clearly stated.
    score_0: The evidence mentions the domains or options in isolation or as general topics without any explicit statement of relative priority, preference, or trade-off between them.
    weight: 4.0
    failure_repair_action: refine_query
  - name: acquisition_execution_grounding
    description: Whether the evidence explicitly shows the actual execution of the acquisition (e.g., selecting the item on a shelf, placing it in a cart, scanning at checkout, or receiving delivery) in the correct venue, rather than merely showing a plan, a list, a discussion of intent, or a shopping trip where the specific item is not confirmed as obtained.
    score_1: The evidence explicitly shows the specific item being selected, purchased, or received in the correct venue, confirming the acquisition actually occurred.
    score_half: The evidence shows a shopping trip or acquisition context but the specific item is not clearly shown being selected or obtained, or the venue is ambiguous.
    score_0: The evidence only shows planning, lists, discussions, or a shopping trip where the specific item is not confirmed as acquired (e.g., the item is not seen, or the trip is to a different venue where the item is unavailable).
    weight: 4.0
    failure_repair_action: dense_sample
  - name: plan_substitution_explicitness
    description: Whether the evidence explicitly confirms a modification to the plan where a specific item or action is substituted for another, rather than merely mentioning the new item as a suggestion, a retrospective critique, or a hypothetical alternative without a confirmed decision to replace the original.
    score_1: The evidence explicitly states or shows the decision to replace the original planned item/action with the new one (e.g., 'replace X with Y', 'switch to Y', 'change the plan to Y'), confirming the substitution as the final plan.
    score_half: The evidence mentions the new item as a suggestion, a 'should have' comment, or a possibility, but the explicit decision to replace the original item is ambiguous or not clearly confirmed.
    score_0: The evidence only mentions the new item in a hypothetical, retrospective, or comparative context without any indication that the original plan has been modified or replaced.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_artifact_item_enumeration
    description: Whether the recorded plan artifact (e.g., list, note, board) explicitly enumerates the specific items or objects mentioned in the options, rather than containing only generic labels, placeholders, unrelated text, or requiring inference from the surrounding conversation.
    score_1: The artifact explicitly lists the specific items in the options (e.g., 'ice cube mold', 'hole punch'), allowing direct verification or exclusion based on their presence or absence on the list.
    score_half: The artifact is present and related to the plan, but the specific items are not explicitly written on it (e.g., only generic headers, question marks, or unrelated text are visible), requiring reliance on conversation to identify the items.
    score_0: The artifact is absent, illegible, or contains no text related to the specific items in the options, making it impossible to verify the plan's contents via the artifact.
    weight: 4.0
    failure_repair_action: dense_sample
  - name: plan_material_identity_explicitness
    description: Whether the evidence explicitly states the specific material, component, or input item intended to be used to construct or create the planned artifact, rather than merely mentioning the final artifact, a generic category of materials, or unrelated items.
    score_1: The evidence explicitly names the specific material or component (e.g., 'cup lid', 'cardboard', 'recycled plastic') that will be used to make the planned artifact.
    score_half: The evidence mentions the planned artifact and implies a material type (e.g., 'something recyclable', 'a container') but does not explicitly name the specific material or component required to distinguish between options.
    score_0: The evidence discusses the planned artifact or generic materials without identifying the specific input material or component, or mentions unrelated materials.
    weight: 4.0
    failure_repair_action: refine_query
  - name: plan_gap_filling_explicitness
    description: Whether the evidence explicitly identifies a specific temporal gap, free interval, or unallocated slot in the schedule and binds a specific planned activity to fill that exact gap, rather than merely mentioning the activity or the gap in isolation.
    score_1: The evidence explicitly states that a specific activity is planned to occur during a defined gap or free time slot (e.g., 'during the one-hour break, we will watch a film').
    score_half: The evidence mentions a gap or free time and mentions an activity, but the explicit link that the activity is intended to fill that specific gap is ambiguous or implied.
    score_0: The evidence mentions the activity or the gap separately, or discusses general scheduling without identifying a specific gap to be filled by the activity.
    weight: 4.0
    failure_repair_action: refine_query
  - name: preparation_status_confirmation
    description: Whether the evidence explicitly confirms that the specific item or activity mentioned in the option has already been prepared, acquired, or created for the event, rather than merely being suggested, discussed as a possibility, or listed as a generic idea.
    score_1: The evidence explicitly states or shows the item/activity is already prepared, bought, or ready (e.g., 'I bought X', 'I made X', 'here is the X I prepared').
    score_half: The evidence mentions the item/activity in a planning context or as a suggestion, but the specific status of it being already prepared is ambiguous or implied.
    score_0: The evidence only mentions the item/activity as a hypothetical, a suggestion, a general topic, or a future plan without confirming it has been prepared.
    weight: 4.0
    failure_repair_action: refine_query
  - name: prepared_item_identity_explicitness
    description: Whether the evidence explicitly identifies the specific identity of the item that has already been prepared, acquired, or created for the event, rather than merely mentioning a generic category, a different prepared item, or a theme without a specific prepared object.
    score_1: The evidence explicitly names or describes the specific item that is confirmed to be prepared/acquired (e.g., 'I bought a wildlife puzzle', 'here is the dinosaur puzzle I made'), allowing direct verification of the option's identity.
    score_half: The evidence mentions a prepared item or a theme, but the specific identity of the prepared item is ambiguous, generic, or refers to a different item than the one in the option.
    score_0: The evidence mentions preparation or themes but fails to identify any specific prepared item, or the item mentioned is clearly not the one in the option (e.g., mentions a different prepared item or only a theme).
    weight: 4.0
    failure_repair_action: refine_query
  - name: acquisition_method_explicitness
    description: Whether the evidence explicitly confirms the specific method or mode of acquisition (e.g., 'buy via delivery', 'take from existing stock', 'ask a person', 'use a specific machine') as the finalized plan, rather than merely mentioning the item's need, discussing generic possibilities, or showing the item in a context where the acquisition method is ambiguous.
    score_1: The evidence explicitly states or shows the specific method of acquisition (e.g., 'order via takeout', 'take from the freezer', 'ask the neighbor') as the confirmed plan.
    score_half: The evidence mentions the item and implies a method or discusses multiple possibilities, but the specific method chosen as the final plan is ambiguous or not explicitly confirmed.
    score_0: The evidence only mentions the need for the item or discusses it in a generic context without confirming any specific method of acquisition, making it impossible to distinguish between different acquisition options.
    weight: 4.0
    failure_repair_action: refine_query
  scoring_rule: average
  sufficient_threshold: 0.7
