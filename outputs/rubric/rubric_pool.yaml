types: []
general:
  rubric_criteria:
  - name: evidence_coverage
    description: Whether evidence covers the key event, time window, state change, comparison target, or causal link needed to verify or exclude each option.
    score_1: All aspects the options hinge on are present in the evidence.
    score_half: Some required aspect present but at least one is missing.
    score_0: A key aspect the options depend on is entirely absent.
    weight: 2
    failure_repair_action: refine_query
  - name: evidence_specificity
    description: Whether evidence explicitly grounds the relevant person, object, action, scene, speaker, on-screen text, or spatial relation rather than a generic scene.
    score_1: The specific entity/relation an option asserts is explicitly grounded.
    score_half: Related but generic evidence; the exact entity/relation is implicit.
    score_0: Only unrelated or generic scene evidence; nothing specific to the options.
    weight: 3
    failure_repair_action: dense_sample
  - name: evidence_consistency
    description: Whether evidence is internally consistent and contains enough contrary evidence to exclude options that conflict with the video.
    score_1: Evidence is consistent and lets conflicting options be ruled out.
    score_half: Partly consistent; some conflicting options cannot be ruled out yet.
    score_0: Evidence is contradictory or cannot exclude any wrong option.
    weight: 4
    failure_repair_action: broadcast
  - name: claim_attribution_explicitness
    description: Whether the evidence explicitly attributes the specific belief, claim, or stance in the option to the specific person or institution named in that option, rather than merely mentioning the entity or the claim in isolation.
    score_1: The evidence explicitly links the specific entity to the specific belief/claim (e.g., 'X believes Y' or 'X states Y').
    score_half: The entity and the claim are both present but the link between them is implicit, ambiguous, or requires inference.
    score_0: The entity is mentioned without the specific claim, the claim is mentioned without the specific entity, or the link is to a different entity.
    weight: 4
    failure_repair_action: refine_query
  - name: proposition_content_explicitness
    description: Whether the evidence explicitly states the specific content, rule, outcome, historical origin, cultural synthesis, or detail asserted in the option, rather than merely mentioning the existence of the source or the entity associated with it.
    score_1: The evidence explicitly details the specific rule, outcome, fact, historical origin, or cultural synthesis asserted in the option (e.g., 'the dish originated from X', 'the law states Y', 'the outcome was Z').
    score_half: The evidence mentions the source or general topic but the specific detail (including historical context or cultural essence) required to verify the option is vague, implied, or missing.
    score_0: The evidence mentions the entity or the existence of a source but provides no specific content, rule, outcome, historical origin, or cultural detail to verify the option's specific claim.
    weight: 3
    failure_repair_action: refine_query
  - name: quantitative_grounding
    description: Whether the evidence provides explicit numerical values, counts, measurements, durations, or specific quantitative proportions (e.g., 'most', 'half', 'three days') required to verify or exclude options containing specific quantities, rather than relying on qualitative descriptors (e.g., 'long', 'many', 'tall').
    score_1: The evidence explicitly states the specific numbers, measurements, counts, durations, or proportions needed to verify or exclude the quantitative claim in the option (e.g., 'most of the three days', '14,000 feet', '50%').
    score_half: The evidence provides some quantitative context (e.g., mentions a duration but not the proportion, or a number but not the unit) but lacks the specific precision or proportion required to definitively verify or exclude the option's specific claim.
    score_0: The evidence relies solely on qualitative descriptors (e.g., 'long', 'tall', 'many') or mentions the topic without providing the specific numerical data, duration, or proportion needed to resolve the quantitative claim.
    weight: 2
    failure_repair_action: refine_query
  - name: purpose_goal_explicitness
    description: Whether the evidence explicitly states the specific purpose, goal, intent, or objective of an event, action, or gathering asserted in the option, rather than merely establishing the event's occurrence, participants, location, or time.
    score_1: The evidence explicitly details the specific purpose or goal (e.g., 'to reduce risk', 'to merge', 'to discuss X') that the option claims.
    score_half: The evidence implies a purpose or mentions related activities but does not explicitly state the specific goal asserted in the option.
    score_0: The evidence establishes the event, participants, or context but provides no information about the specific purpose, goal, or intent of the gathering/action.
    weight: 3.0
    failure_repair_action: refine_query
  - name: stance_assertion_explicitness
    description: Whether the evidence explicitly contains the specific belief, opinion, or stance asserted in the option as a direct assertion by the relevant entity, rather than merely discussing the topic, posing questions, or describing hypothetical scenarios involving the entity.
    score_1: The evidence contains a direct assertion of the specific stance/belief (e.g., 'X believes Y', 'X states that Y is true') by the relevant entity.
    score_half: The evidence implies the stance or discusses the topic in a way that strongly suggests the stance, but lacks a direct, explicit assertion of the belief itself.
    score_0: The evidence only discusses the topic, poses questions about it, or describes hypothetical scenarios (e.g., 'if Y happens...') without the entity explicitly asserting the specific stance/belief required to verify the option.
    weight: 3.0
    failure_repair_action: refine_query
  - name: ordinal_position_explicitness
    description: Whether the evidence explicitly states the specific ordinal position (e.g., 'first', 'second', 'last', 'next') or sequence rank of the event, item, or claim asserted in the option, rather than merely listing the item or describing it without its specific place in a sequence.
    score_1: The evidence explicitly states the specific ordinal rank (e.g., 'the second line of evidence', 'the first step') required to verify the option's claim about sequence or order.
    score_half: The evidence implies a sequence or lists multiple items but does not explicitly assign the specific ordinal rank (e.g., 'first', 'second') to the target item.
    score_0: The evidence mentions the item or describes the sequence generally but provides no explicit ordinal marker to verify the specific position claimed in the option.
    weight: 3
    failure_repair_action: refine_query
  - name: causal_explanation_explicitness
    description: Whether the evidence explicitly states the specific reason, cause, or justification for a stated rule, warning, prohibition, action, decision, refusal, omission, or a specific qualitative state/attribute, rather than merely stating the rule, action, outcome, or state itself.
    score_1: Evidence explicitly contains the causal link (e.g., 'because X', 'due to Y', 'since Z', 'mainly because', 'it's not worth it') that explains the rule, action, decision, refusal, or the specific qualitative state/attribute, allowing verification of the specific reason.
    score_half: Evidence states the rule, action, decision, or state and implies a reason through context or related statements (e.g., mentioning the cause and the effect separately), but the specific causal mechanism is not explicitly articulated as a direct explanation.
    score_0: Evidence only states the rule, warning, action, decision, refusal, or state without providing the specific reason or justification required to verify or exclude options.
    weight: 3.0
    failure_repair_action: refine_query
  - name: direct_speech_presence
    description: Whether the evidence contains the direct, verbatim utterance of the specific speaker whose message, claim, or statement is the subject of the query, rather than a third-party summary, report, or description of what that speaker said.
    score_1: The evidence includes the actual audio or transcript of the target speaker directly stating the content in question.
    score_half: The evidence contains a partial quote or a mix of direct speech and summary, but the full specific message is not fully captured in the speaker's own words.
    score_0: The evidence only contains a third-party report, summary, or description of the speaker's message (e.g., 'The caller said X' or 'Witnesses reported Y') without the speaker's direct utterance.
    weight: 3.0
    failure_repair_action: refine_query
  - name: event_actualization_explicitness
    description: Whether the evidence explicitly confirms the specific event, action, or state change asserted in the option is actually occurring or has occurred in the queried context, rather than merely describing a plan, intention, prediction, or hypothetical scenario for that event.
    score_1: The evidence explicitly states or shows the event/action is happening or has happened (e.g., 'X is doing Y now', 'Y occurred', 'the result is Z'), directly verifying the option's claim about the actual state.
    score_half: The evidence implies the event is likely to happen or describes the preparation for it, but does not explicitly confirm the event is currently occurring or has been completed.
    score_0: The evidence only describes a plan, intention, prediction, or hypothetical scenario (e.g., 'X will do Y', 'we plan to Z', 'if Y happens') without confirming the event is actually taking place or has occurred.
    weight: 3
    failure_repair_action: refine_query
  - name: factual_contradiction_explicitness
    description: Whether the evidence explicitly presents a specific fact, admission, or revelation that directly contradicts a key premise, piece of evidence, or claim asserted in the option, rather than merely discussing the topic, procedure, or possibility of such a contradiction.
    score_1: The evidence explicitly states a specific fact or admission (e.g., 'the witness admitted X', 'the record shows Y') that directly invalidates or contradicts the core claim or evidence in the option.
    score_half: The evidence implies a contradiction or discusses the possibility of conflicting facts but does not explicitly state the specific contradictory fact required to verify or exclude the option.
    score_0: The evidence discusses the topic, legal procedures, or hypothetical scenarios without presenting any specific factual contradiction that resolves the option's claim.
    weight: 3.0
    failure_repair_action: refine_query
  - name: discussion_topic_explicitness
    description: Whether the evidence explicitly states the specific subject matter, content, or issue being discussed in a conversation, meeting, or interaction asserted in the option, rather than merely establishing the occurrence of the interaction, the participants, or the general context.
    score_1: The evidence explicitly identifies the specific topic or content of the discussion (e.g., 'they discussed the settlement amount', 'the meeting was about X').
    score_half: The evidence implies the topic or mentions related concepts generally but does not explicitly state the specific subject matter of the interaction.
    score_0: The evidence establishes the interaction, participants, or general context but provides no information about the specific topic or content being discussed.
    weight: 3.0
    failure_repair_action: refine_query
  - name: referenced_content_explicitness
    description: Whether the evidence explicitly reveals the specific content, reason, or detail of a referenced communication, document, or internal state (e.g., the content of a note, the reason in a plea, the terms of a deal) rather than merely establishing the existence of that communication or document.
    score_1: The evidence explicitly states the specific content, reason, or detail of the referenced item (e.g., 'the note said X', 'the plea was for Y reason').
    score_half: The evidence implies the content or mentions the existence of the communication but the specific detail required to verify the option is vague or inferred.
    score_0: The evidence only establishes the existence of the communication, document, or state (e.g., 'a note was sent', 'a plea was made') without revealing the specific content or reason inside it.
    weight: 3.0
    failure_repair_action: refine_query
  - name: comparative_grounding
    description: Whether the evidence explicitly articulates the specific difference, similarity, or relationship between the compared items asserted in the option, rather than merely describing the items in isolation or mentioning them without a direct comparison.
    score_1: The evidence explicitly states the specific relationship or difference between the compared items (e.g., 'A differs from B because...', 'A is X while B is Y').
    score_half: The evidence describes the items separately or implies a relationship but does not explicitly state the specific difference or similarity required to verify the option.
    score_0: The evidence mentions the items or describes them in isolation without any explicit comparative statement linking them to establish the difference or similarity claimed in the option.
    weight: 4
    failure_repair_action: refine_query
  - name: comparative_count_explicitness
    description: Whether the evidence explicitly states the specific counts or quantities for all items being compared in a superlative query (e.g., 'most', 'fewest', 'largest'), rather than merely describing the items or providing counts for only a subset.
    score_1: The evidence explicitly states the total count or quantity for every item involved in the comparison, allowing the superlative claim to be verified or excluded directly.
    score_half: The evidence provides counts for some but not all compared items, or implies the counts without explicit enumeration.
    score_0: The evidence describes the items or provides partial counts (e.g., 'Scenario 1 of 6' without stating the total for other steps) but lacks the explicit counts for all compared items required to determine the superlative.
    weight: 3.0
    failure_repair_action: refine_query
  - name: relationship_status_explicitness
    description: Whether the evidence explicitly states the specific relationship status, history, or connection (e.g., 'ex-couple', 'siblings', 'married', 'estranged') between the entities in the option, rather than merely showing them interacting, being in the same scene, or discussing unrelated topics.
    score_1: The evidence explicitly states the specific relationship status or history (e.g., 'they broke up', 'they are siblings', 'they are exes') required to verify or exclude the option.
    score_half: The evidence implies a relationship through context or interaction (e.g., they are arguing, they are together) but does not explicitly state the specific status or history claimed in the option.
    score_0: The evidence shows the entities interacting or in the same scene but provides no explicit information about their specific relationship status or history.
    weight: 3
    failure_repair_action: refine_query
  - name: role_affiliation_explicitness
    description: Whether the evidence explicitly states the specific role, title, or institutional affiliation of the speaker that defines or validates the stance asserted in the option, rather than merely mentioning the speaker or the topic of discussion.
    score_1: The evidence explicitly links the speaker to a specific role, title, or organization (e.g., 'President of X', 'Director of Y') that directly supports or defines the stance in the option.
    score_half: The evidence mentions the speaker's general context or implies a role but does not explicitly state the specific title or affiliation required to verify the stance.
    score_0: The evidence mentions the speaker or discusses the topic but provides no explicit information about the speaker's specific role, title, or institutional affiliation that would define the stance.
    weight: 3.0
    failure_repair_action: refine_query
  - name: relationship_impact_explicitness
    description: Whether the evidence explicitly states the specific change, impact, or resulting state of the relationship between the entities asserted in the option (e.g., 'strengthened', 'caused a rift', 'reconciled') as a direct consequence of the event, rather than merely describing the event, the entities' prior status, or their general interaction.
    score_1: The evidence explicitly details the specific impact or change in the relationship (e.g., 'it led to a rift', 'they reconciled', 'it strengthened their bond') resulting from the event.
    score_half: The evidence implies a change in the relationship or describes the event and the entities' reactions but does not explicitly state the specific impact or resulting state claimed in the option.
    score_0: The evidence describes the event, the entities, or their prior relationship status but provides no explicit information about the specific impact or change in the relationship caused by the event.
    weight: 3.0
    failure_repair_action: refine_query
  - name: success_condition_explicitness
    description: Whether the evidence explicitly states the specific condition, requirement, or action necessary to achieve the successful outcome asserted in the option, rather than merely describing a failure scenario, the absence of the outcome, or attributes that are insufficient on their own.
    score_1: The evidence explicitly identifies the specific requirement or action needed to achieve the success (e.g., 'X is required to succeed', 'without Y, they cannot succeed').
    score_half: The evidence implies a requirement or describes a situation where success is difficult but does not explicitly state the specific condition needed to achieve it.
    score_0: The evidence only describes a failure scenario, the lack of success, or attributes that are present but insufficient (e.g., 'they have X but still fail') without stating what is actually required to succeed.
    weight: 3.0
    failure_repair_action: refine_query
  - name: success_factor_enumeration_explicitness
    description: Whether the evidence explicitly enumerates the specific set of factors, attributes, or actions identified as the causes of the successful outcome asserted in the option, rather than merely describing the entity, its isolated traits, its failures, or the general context of the event.
    score_1: The evidence explicitly lists the specific combination of factors (e.g., 'X, Y, and Z led to success') that the option claims are the critical contributors to the success.
    score_half: The evidence mentions some of the factors or implies a cause for success but does not explicitly enumerate the specific set of factors required to verify the option's claim.
    score_0: The evidence describes the entity, its isolated traits, its struggles, or the general context but fails to explicitly state the specific combination of factors that caused the success.
    weight: 3.0
    failure_repair_action: refine_query
  - name: event_classification_explicitness
    description: Whether the evidence explicitly states the specific name, category, or formal classification of the event, sport, or activity asserted in the option, rather than merely describing the visual actions, participants, or general context which could apply to multiple event types.
    score_1: The evidence explicitly names the specific event type, sport discipline, or formal category (e.g., 'race walk', 'marathon', 'debate') required to verify or exclude the option's claim about the event nature.
    score_half: The evidence describes the actions or context strongly suggesting the event type but does not explicitly state the formal name or classification.
    score_0: The evidence only describes the visual actions, participants, or general setting without explicitly naming the specific event type or sport discipline, leaving the classification ambiguous or inferred.
    weight: 3.0
    failure_repair_action: refine_query
  - name: governing_rule_explicitness
    description: Whether the evidence explicitly states the specific rule, constraint, or condition (e.g., scoring limit, win-by-margin, tie-breaker procedure) that governs the outcome or state change asserted in the option, rather than merely describing the event, the current score, or the participants' actions without the underlying rule.
    score_1: The evidence explicitly states the specific rule or constraint (e.g., 'play to 15', 'must win by two', 'first to X wins') required to verify or exclude the option's claim about the outcome.
    score_half: The evidence implies the rule through context or describes a similar scenario but does not explicitly state the specific constraint required to resolve the option.
    score_0: The evidence describes the event, current state, or actions but provides no explicit information about the specific governing rule or constraint needed to determine the outcome.
    weight: 3.0
    failure_repair_action: refine_query
  - name: mechanism_of_action_explicitness
    description: Whether the evidence explicitly details the specific physical or logical process by which an object, tool, or action achieves the effect or purpose asserted in the option, rather than merely mentioning the object's existence, a generic association, or the outcome without the 'how'.
    score_1: The evidence explicitly describes the operational mechanism (e.g., 'the mirror reflects X to hide Y', 'the spring releases Z') that explains how the object/action produces the specific effect claimed in the option.
    score_half: The evidence implies a mechanism or describes the outcome but lacks the specific step-by-step process or physical principle required to verify exactly how the effect is achieved.
    score_0: The evidence mentions the object or the outcome but provides no information about the specific mechanism or process by which the object/action produces the effect (e.g., only stating 'a mirror is used' without explaining how it works).
    weight: 3.0
    failure_repair_action: refine_query
  - name: sequence_item_attribute_grounding
    description: Whether the evidence explicitly grounds the specific attribute, state, or action asserted in the option for each of the identified items in the sequence (e.g., the first, second, or last item), rather than merely showing the attribute in isolation, for a generic item, or for an unverified set of items.
    score_1: The evidence explicitly links the specific attribute to each of the identified sequence items (e.g., 'the first item has X' and 'the second item has X'), allowing the commonality or difference to be verified.
    score_half: The evidence identifies the sequence items but only explicitly grounds the attribute for some of them, or the attribute is shown but not clearly linked to the specific ordinal items.
    score_0: The evidence shows the attribute in isolation, for generic items, or for items whose position in the sequence is not established, making it impossible to verify the attribute for the specific 'first two' (or other ordinal) items required by the option.
    weight: 3.0
    failure_repair_action: refine_query
  - name: action_attribution_explicitness
    description: Whether the evidence explicitly attributes the specific physical action, event, or behavior asserted in the option to the specific agent named in that option, rather than merely showing the action performed by an unidentified person, showing the agent performing a different action, or mentioning the agent and action in separate, unlinked contexts.
    score_1: The evidence explicitly links the specific agent to the specific action (e.g., 'X cuts the watermelon', 'Y uses the tool'), allowing the option to be verified or excluded directly.
    score_half: The evidence shows the action and the agent but the link is ambiguous, implied, or the action is performed by an unidentified person while the agent is mentioned elsewhere.
    score_0: The evidence shows the action without identifying the agent, shows the agent performing a different action, or mentions the agent and action in isolation without establishing that the agent performed that specific action.
    weight: 3
    failure_repair_action: refine_query
  - name: commonality_grounding
    description: Whether the evidence explicitly asserts that the specific shared attribute, state, or relationship claimed in the option applies to ALL items in the set (e.g., 'Both A and B are X'), rather than merely describing the attribute for one item, describing the items separately without linking them, or discussing a different set of items.
    score_1: The evidence explicitly states that the specific attribute or relationship applies to every item in the set required by the option (e.g., 'Both A and B are X' or 'A and B share Y').
    score_half: The evidence describes the attribute for some but not all items in the set, or implies a shared nature without explicitly linking all items to the specific attribute.
    score_0: The evidence describes the attribute for only one item, discusses the items in isolation without a shared link, or discusses a different set of items entirely, failing to verify the 'both/all' claim.
    weight: 5
    failure_repair_action: refine_query
  - name: visual_attribute_grounding
    description: Whether the evidence explicitly grounds the specific visual attributes (e.g., clothing color, accessories, physical features) asserted in the option to the specific entity required for identification, rather than describing the entity with generic attributes or omitting the distinguishing features entirely.
    score_1: The evidence explicitly describes the target entity possessing the exact visual attributes (e.g., 'wearing glasses', 'in a blue suit') claimed in the option, allowing the entity to be identified or excluded.
    score_half: The evidence describes the target entity but the specific visual attributes are vague, implied, or described differently (e.g., 'wearing a uniform' without specifying color or accessories), making identification ambiguous.
    score_0: The evidence describes the target entity with generic attributes (e.g., 'wearing a coat') or omits the specific distinguishing features required to verify the option's claim about the entity's appearance.
    weight: 1
    failure_repair_action: dense_sample
  - name: operational_mode_explicitness
    description: Whether the evidence explicitly states the specific mode of operation (e.g., traveling, fixed, seasonal, mobile, stationary) asserted in the option, rather than merely showing the entity performing its function, describing its history, or showing a generic instance of the activity.
    score_1: The evidence explicitly identifies the specific operational mode (e.g., 'traveling circus', 'sets up in parking lots', 'moves from town to town') required to verify or exclude the option's claim about how the entity operates.
    score_half: The evidence implies a mode of operation through context (e.g., showing a tent in a lot) but does not explicitly state the mode as a defining characteristic or link the temporary nature to the entity's identity.
    score_0: The evidence shows the entity performing its function, describes its history, or shows a generic scene without explicitly stating the specific operational mode (traveling vs. fixed vs. seasonal) required to resolve the option.
    weight: 3.0
    failure_repair_action: refine_query
  - name: visual_prop_presence
    description: Whether the evidence explicitly grounds the presence or absence of specific physical objects, tools, or props used by the target entities, rather than merely describing the entities, their actions, or the setting without reference to such objects.
    score_1: The evidence explicitly shows or states the specific prop/object being used (or explicitly confirms its absence) by the target entities, allowing the option's claim about props to be verified or excluded.
    score_half: The evidence implies the use of an object or shows a generic setting where props might exist, but does not explicitly ground a specific prop to the target entities' actions.
    score_0: The evidence describes the entities, their actions, or the setting but provides no explicit information about the presence or absence of specific props/objects used by the entities, making it impossible to verify or exclude claims about prop usage.
    weight: 3.0
    failure_repair_action: dense_sample
  - name: narrative_scope_completeness
    description: Whether evidence spans the full temporal or logical arc of the video's narrative (including introduction/setup, main events, and resolution/conclusion) required to synthesize a holistic title or summary.
    score_1: Evidence includes the beginning (context/setup), middle (main events), and end (resolution/outcome) of the narrative, allowing for a comprehensive synopsis.
    score_half: Evidence covers the main events but lacks either the introductory context or the concluding resolution.
    score_0: Evidence is restricted to a single segment or phase (e.g., only the conflict) and lacks the broader narrative arc needed to distinguish the best title.
    weight: 2
    failure_repair_action: refine_query
  - name: contrast_axis_explicitness
    description: Whether evidence explicitly identifies the distinct parties or viewpoints involved in a contrast and the specific axis (e.g., stability vs. returns, innovation vs. regulation) on which they disagree, rather than merely presenting isolated facts from each side.
    score_1: Evidence clearly names or describes the opposing sides and explicitly states the specific point of contention or difference between them.
    score_half: Evidence presents arguments from different sides but fails to explicitly link them as a direct contrast or define the specific axis of disagreement.
    score_0: Evidence presents isolated facts or quotes without identifying the opposing parties or the nature of their disagreement, making it impossible to synthesize a 'core difference'.
    weight: 3.0
    failure_repair_action: refine_query
  - name: attribution_explicitness
    description: Whether evidence explicitly links the specific agent, researcher, or source named in the query to the specific claim, finding, or viewpoint being evaluated, rather than merely discussing the topic in general.
    score_1: The evidence explicitly states that the named agent/researcher made the specific claim or holds the specific view (e.g., 'X says Y' or 'X notices Y').
    score_half: The evidence mentions the agent and the topic separately but does not explicitly connect them, or the connection is implied but not stated.
    score_0: The evidence discusses the topic or claim but fails to mention the specific agent/researcher, or mentions the agent without linking them to the specific claim.
    weight: 3.0
    failure_repair_action: refine_query
  - name: scenario_completeness
    description: Whether evidence captures the full logical or narrative arc of the specific scenario (including the setup/context, the specific action taken, and the resulting outcome or conclusion) required to verify or exclude a detailed option, rather than presenting only a fragment of the event.
    score_1: Evidence includes the complete sequence of the specific scenario (context, action, and outcome) allowing the detailed claim to be fully verified or excluded.
    score_half: Evidence covers the action or context but misses the outcome or a critical detail needed to confirm the specific claim.
    score_0: Evidence is a fragment of the scenario (e.g., only the setup, only a mention of an entity, or only a generic statement) lacking the necessary components to verify the specific details of the option.
    weight: 3.0
    failure_repair_action: refine_query
  - name: explicit_thematic_declaration
    description: Whether evidence contains an explicit on-screen text label, title card, or spoken statement that directly declares the video's overarching theme, topic, or synopsis, rather than requiring the model to infer the theme solely from visual actions or fragmented dialogue.
    score_1: Evidence includes a clear textual or verbal statement explicitly defining the video's topic or title (e.g., 'Top 7 Fighters', 'How to...'), allowing direct verification of the synopsis option.
    score_half: Evidence contains strong thematic hints or repeated keywords but lacks a definitive explicit statement of the video's overall topic or title.
    score_0: Evidence consists only of visual descriptions of events or fragmented dialogue without any explicit text or speech stating the video's theme, title, or synopsis.
    weight: 5
    failure_repair_action: refine_query
  - name: multi_topic_enumeration
    description: Whether evidence spans all distinct news items, segments, or narrative units presented in the video, rather than covering only a subset of the topics discussed.
    score_1: Evidence includes distinct segments or explicit mentions for every separate topic or event covered in the video, allowing the model to verify the presence of reported items and exclude unreported ones by elimination.
    score_half: Evidence covers the majority of distinct topics but misses at least one minor segment or fails to clearly distinguish between two closely related items.
    score_0: Evidence is restricted to only one or a few of the distinct topics presented in the video, leaving other reported events unverified and making it impossible to determine which option was not reported.
    weight: 3.0
    failure_repair_action: refine_query
  - name: thematic_argument_coverage
    description: Whether evidence captures the video's central argument, thesis, or thematic tension (e.g., a debate between two values, a cause-effect relationship defining the era, or a specific evaluation of success/failure) required to synthesize the main focus, rather than merely listing isolated events or facts.
    score_1: Evidence explicitly presents or allows the synthesis of the video's core argument or thematic tension (e.g., 'business vs. sport', 'success vs. failure'), enabling verification of the main focus option.
    score_half: Evidence contains elements of the theme (e.g., mentions of business or sport separately) but fails to explicitly link them into the central argument or tension.
    score_0: Evidence consists only of isolated events, facts, or match descriptions without any indication of the video's overarching argument, thesis, or thematic evaluation.
    weight: 4
    failure_repair_action: refine_query
  - name: thematic_tension_explicitness
    description: Whether evidence explicitly articulates the central conflict, trade-off, or dual-axis evaluation (e.g., 'X vs. Y', 'success vs. failure', 'business vs. sport') that defines the video's main argument, rather than merely listing isolated events, facts, or single-sided descriptions.
    score_1: Evidence explicitly states or clearly implies the opposing forces or the specific tension (e.g., 'ambitions exceeded goals', 'balance between...') that constitutes the video's core thesis.
    score_half: Evidence mentions elements of the tension (e.g., mentions both business and sport) but fails to explicitly link them as a conflict or trade-off defining the narrative.
    score_0: Evidence consists only of isolated events, facts, or single-sided descriptions without any indication of a central conflict, trade-off, or dual-axis evaluation.
    weight: 3.0
    failure_repair_action: refine_query
  - name: quantitative_scope_explicitness
    description: Whether evidence explicitly states the quantitative boundaries, counts, or set definitions (e.g., 'all', 'first N', 'total', 'subset') required to verify or exclude options that differ by scope or quantity, rather than merely showing instances without defining the total set.
    score_1: Evidence explicitly defines the scope or quantity (e.g., mentions a specific count, a 'first N' milestone, or an 'all' claim) allowing the model to verify the correct scope and exclude options with different quantitative claims.
    score_half: Evidence implies a large quantity or multiple instances but lacks explicit numerical boundaries or set definitions (e.g., 'many goals' without a count or specific milestone).
    score_0: Evidence shows only isolated instances or a single event without any explicit statement of the total count, range, or set definition, making it impossible to distinguish between options differing by quantity or scope.
